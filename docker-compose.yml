services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - app-data:/app/data/db
      - content-cache:/srv/content
    environment:
      - REFUGIO_DB_PATH=/app/data/db/refugio.db
      - REFUGIO_JWT_SECRET=${REFUGIO_JWT_SECRET}
      - REFUGIO_BASE_URL=${REFUGIO_BASE_URL:-http://localhost/ludoteca}
      - REFUGIO_SECURE_AUTH_COOKIE=${REFUGIO_SECURE_AUTH_COOKIE:-false}
      - REFUGIO_CONTENT_MIRROR_DIR=/srv/content
      - REFUGIO_CONTENT_SOURCE_ORIGIN=${REFUGIO_CONTENT_SOURCE_ORIGIN:-https://sites.google.com/view/refugiodelsatiro}
      - REFUGIO_CANONICAL_ORIGIN=${REFUGIO_CANONICAL_ORIGIN:-https://${DOMAIN:-localhost}}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - BGG_BEARER_TOKEN=${BGG_BEARER_TOKEN:-}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - content-cache:/srv/content:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - REDIRECT_DOMAIN=${REDIRECT_DOMAIN:-${DOMAIN:-localhost}}
      - ROLLBACK_DOMAIN=${ROLLBACK_DOMAIN:-${DOMAIN:-localhost}}
    depends_on:
      - app

volumes:
  app-data:
    name: refugio_app_data
  caddy-data:
    name: refugio_caddy_data
  caddy-config:
    name: refugio_caddy_config
  content-cache:
    name: refugio_content_cache
