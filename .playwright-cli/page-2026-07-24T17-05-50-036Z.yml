        - article [ref=e9948]:
          - link "¡Sí, Señor Oscuro! — Disponible" [ref=e9949] [cursor=pointer]:
            - /url: /ludoteca/juegos/si-senor-oscuro
            - generic [ref=e9951]:
              - generic [ref=e9952]: "5.8"
              - heading "¡Sí, Señor Oscuro!" [level=3] [ref=e9953]
              - paragraph [ref=e9954]: "«¡Sí, Señor Oscuro!» es un juego de mesa de fantasía lleno de humor, rápido de jugar y fácil de aprender. Cada jugador es un duende malvado al servicio del malvado Señor Oscuro —Rigor Mortis, el Amo de todos los Males— y todos ellos se han reunido a los pies del Señor Oscuro para explicarle por qué han vuelto a fracasar en esa última misión importante, ordenada por el propio «Su Excelencia Malvada». El pánico te envuelve con su gélido abrazo; ¿qué puedes hacer para salvar tu pobre pellejo? ¿Podrías decir que el culpable no eres tú, sino tus ineptos compañeros? Sí, claro, ¡esa es la solución! Solo hay un pequeño problema: probablemente ellos hayan tenido exactamente la misma idea… y el Señor Oscuro no destaca precisamente por su misericordia… Este juego de rol consiste en decir mentiras y echarle la culpa a tus pobres compañeros, ¡para que la justa ira de tu Amo les dé lo que se merecen! ¡Sí, Señor Oscuro! «The Red Box» es el nombre más reciente de este juego, para distinguirlo de «The Green Box», que es tanto un juego independiente como una expansión de este."
              - list [ref=e9955]:
                - listitem [ref=e9956]: 13+
                - listitem [ref=e9960]: 30min
                - listitem [ref=e9964]: 4-16
              - generic [ref=e9970]: Fiesta
        - article [ref=e9971]:
          - 'link "¡Sí, Señor Oscuro! 2: El Alba de los héroes — Disponible" [ref=e9972] [cursor=pointer]':
            - /url: /ludoteca/juegos/si-senor-oscuro-2-el-alba-de-los-heroes
            - generic [ref=e9974]:
              - generic [ref=e9975]: "6.4"
              - 'heading "¡Sí, Señor Oscuro! 2: El Alba de los héroes" [level=3] [ref=e9976]'
              - paragraph [ref=e9977]: Te has adentrado mucho más allá del lugar más antiguo para servir al Señor Oscuro. Te has enfrentado a los peores peligros para hacerte con el sombrero del mago. Ahora, el Genio del Mal tiene nuevas misiones para ti, y tendrás que ir aún más allá, atravesando dimensiones, consiguiendo nuevos tesoros y enfrentándote a nuevos peligros. Quizá incluso a la propia Muerte. Pero el verdadero peligro será enfrentarte al Rigor Mortis, si vuelves a fracasar. «Sì, Oscuro Signore! 2 - L'alba degli eroi» es la primera expansión de «Aye, Dark Overlord!». La Caja Roja, también conocida como «Aye, Dark Overlord», te traerá nuevas cartas con lugares que explorar, personas con las que encontrarte y tesoros que recuperar. Y eso no es todo... Vosotros, los goblins, dispondréis de nuevas acciones para dificultar aún más que vuestros compañeros de grupo escapen de la ira del Señor Oscuro. Hasta ahora, solo era una broma.
