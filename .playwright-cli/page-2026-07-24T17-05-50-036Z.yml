              - heading "Mind Up!" [level=3] [ref=e8715]
              - paragraph [ref=e8716]: En Mind Up!, se empieza con una fila de cartas sobre la mesa, con tantas cartas como jugadores haya. En cada turno, los jugadores eligen una carta de su mano y la revelan simultáneamente para formar una nueva fila, ordenada de menor a mayor. A continuación, cada jugador coge la carta de la fila anterior que ocupe la misma posición que la que acaba de jugar y la añade a su mesa de juego. Estas cartas sumarán puntos al final de la ronda, dependiendo de su color y del orden en que se hayan elegido. Una vez puntuadas, pasan a formar parte de la mano del jugador para la siguiente ronda.
