            - generic [ref=e8322]:
              - generic [ref=e8323]: "6.5"
              - heading "Level 10" [level=3] [ref=e8324]
              - paragraph [ref=e8325]: En el juego de cartas cooperativo «Level 10» —que se lanzó inicialmente con el nombre de «Okey Dokey»—, los jugadores colaboran para intentar superar el reto. En «Okey Dokey», organizas un festival de música con diferentes artistas y debes jugar las cincuenta cartas para completar la actuación. En Level 10, intentas ayudar a Izzy a superar los diez niveles de cada uno de los cinco mundos de videojuegos diferentes; cada mundo está representado por una fila de cartas sobre la mesa. Los jugadores irán jugando cartas una a una en esta cuadrícula de 5x10 —40 cartas de nivel y 10 cartas de reinicio— para (con suerte) completar el juego. Las manos de los jugadores se mantienen en secreto entre ellos y solo se pueden hacer ligeras sugerencias. Si un jugador no puede jugar una carta en su turno, los jugadores (e Izzy) pierden.
