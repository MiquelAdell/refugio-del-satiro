        - article [ref=e6437]:
          - 'link "Clank!: Catacumbas — Disponible" [ref=e6438] [cursor=pointer]':
            - /url: /ludoteca/juegos/clank-catacumbas
            - generic [ref=e6440]:
              - generic [ref=e6441]: "8.2"
              - 'heading "Clank!: Catacumbas" [level=3] [ref=e6442]'
              - paragraph [ref=e6443]: Las catacumbas del dragón esquelético Umbrok Vessna son misteriosas y peligrosas. Los portales te transportan por todas las profundidades de la mazmorra. Los santuarios ofrecen grandes riquezas a los exploradores intrépidos. Los prisioneros cuentan contigo para que los liberes. Los fantasmas, una vez perturbados, pueden perseguirte hasta la muerte. A pesar de todo ello, es hora de dejar atrás el tablero con Clank! Catacombs, una aventura independiente de construcción de mazo. Cada viaje a las catacumbas es único, ya que eres tú quien coloca las fichas para crear la mazmorra. Puedes jugar utilizando únicamente el nuevo mazo de mazmorra, o puedes incluir cartas de expansiones anteriores de Clank! Encuentra tu fortuna (¡y escapa del dragón!) en Clank! Catacombs. —Descripción del editor
              - list [ref=e6444]:
