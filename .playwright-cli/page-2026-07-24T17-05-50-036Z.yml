        - article [ref=e10822]:
          - link "Twilight Struggle — Disponible" [ref=e10823] [cursor=pointer]:
            - /url: /ludoteca/juegos/twilight-struggle
            - generic [ref=e10825]:
              - generic [ref=e10826]: "8.2"
              - heading "Twilight Struggle" [level=3] [ref=e10827]
              - paragraph [ref=e10828]: "Ahora la trompeta nos convoca de nuevo, no como una llamada a las armas, aunque las necesitemos; no como una llamada a la batalla, aunque nos encontremos en plena contienda, sino como una llamada a soportar la carga de una larga lucha en la penumbra. – John F. Kennedy En 1945, unos aliados insospechados derrocaron la maquinaria bélica de Hitler, mientras que las armas más devastadoras de la humanidad doblegaron al Imperio japonés en una tormenta de fuego. Donde antes había muchas grandes potencias, entonces solo quedaban dos. El mundo apenas tuvo unos meses para dar un suspiro de alivio colectivo antes de que se cerniera la amenaza de un nuevo conflicto. A diferencia de las luchas titánicas de las décadas anteriores, este conflicto no lo librarían principalmente soldados y tanques, sino espías y políticos, científicos e intelectuales, artistas y traidores. Twilight Struggle es un juego para dos jugadores que simula los cuarenta y cinco años de intrigas, prestigio y ocasionales brotes de guerra entre la Unión Soviética y Estados Unidos. El mundo entero es el escenario en el que estos dos titanes luchan por hacer del mundo un lugar seguro para sus propias ideologías y formas de vida. El juego comienza en medio de las ruinas de Europa, mientras las dos nuevas «superpotencias» se disputan los restos de la Segunda Guerra Mundial, y termina en 1989, cuando solo Estados Unidos seguía en pie. Twilight Struggle hereda sus sistemas fundamentales de los clásicos basados en cartas We the People y Hannibal: Rome vs. Carthage. Se trata de un juego de partida rápida y baja complejidad que sigue esa tradición. El mapa del juego es un mapa mundial de la época, sobre el que los jugadores mueven unidades y ejercen influencia en un intento por ganar aliados y control para su superpotencia. Al igual que en otros juegos basados en cartas de GMT, la toma de decisiones supone un reto: ¿cómo utilizar mejor las cartas y las unidades de cada uno, dados unos recursos siempre limitados? Las cartas de evento añaden detalle y sabor al juego. Abarcan una amplia gama de acontecimientos históricos, desde los conflictos árabe-israelíes de 1948 y 1967, pasando por Vietnam y el movimiento pacifista estadounidense, hasta la crisis de los misiles en Cuba y otros incidentes similares que llevaron al mundo al borde de la aniquilación nuclear. Los subsistemas recogen la prestigiosa carrera espacial, así como las tensiones nucleares, con la posibilidad de que se desate una guerra nuclear que ponga fin a la partida. ESCALA TEMPORAL: aprox. 3-5 años por turno ESCALA DEL MAPA: sistema punto a punto ESCALA DE LAS UNIDADES: marcadores de influencia"
