        - article [ref=e9925]:
          - link "Serengeti — Disponible" [ref=e9926] [cursor=pointer]:
            - /url: /ludoteca/juegos/serengeti
            - generic [ref=e9928]:
              - generic [ref=e9929]: "6.2"
              - heading "Serengeti" [level=3] [ref=e9930]
              - paragraph [ref=e9931]: Los jugadores compiten en subastas para adquirir obras de arte africano con la moneda local, el «Hongo». La novedad de este mecanismo de puja radica en que los jugadores no pueden pujar por una cifra cuyo dígito de las «unidades» coincida con el número de cualquier carta que hayan ganado anteriormente. La innovadora mecánica de pago consiste en que los jugadores que posean una carta cuyo número coincida con el dígito de las «unidades» de una puja pueden obtener una parte de dicha puja. La versión «Don» del juego tiene una temática de gánsteres, en la que los jugadores pujan por el control de los distritos de Chicago.
