        - article [ref=e10454]:
          - link "Team Party — Disponible" [ref=e10455] [cursor=pointer]:
            - /url: /ludoteca/juegos/team-party
            - generic [ref=e10457]:
              - generic [ref=e10458]: "6.6"
              - heading "Team Party" [level=3] [ref=e10459]
              - paragraph [ref=e10460]: "En «Task Team», dos equipos compiten cara a cara en una prueba, mientras que el tercero actúa como árbitro. ¡Juega con tres personas o tres equipos para divertirte aún más! Objetivo del juego Ser el primer equipo en ganar siete pruebas alocadas. Preparación Divídete en tres equipos. Debe haber al menos un jugador en cada equipo. No es necesario que haya el mismo número de jugadores en cada equipo. Baraja las cartas y forma un montón: este será el mazo. Ten el material a mano. Cómo jugar Durante cada ronda, dos equipos compiten entre sí en la misma prueba, mientras que el tercer equipo actúa como árbitro. La primera prueba consistirá en decidir qué dos equipos jugarán primero: piedra, papel o tijera, pulsos, lanzar la pelota… ¡tú decides! ¡No queremos saberlo! El equipo árbitro saca una carta y la lee en voz alta. En ella se indica a los jugadores: Cuánto tiempo tienen para realizar la prueba: 1 reloj de arena, 2 relojes de arena o sin límite de tiempo. El número de jugadores necesarios por equipo: 1 jugador, 2 jugadores o todo el equipo. El material necesario. La prueba en sí. Cuando todos estén listos, el equipo de árbitros inicia la cuenta atrás diciendo: «¿Listos? ¡Equipo de prueba!». A continuación, los dos equipos participantes se lanzan a por la prueba con todas sus fuerzas. El equipo que gane la prueba se queda con la tarjeta y la coloca delante de sí. Tras cada prueba, los equipos intercambian los papeles para la siguiente ronda: El equipo que ganó la prueba anterior permanece en la competición. El equipo que arbitró la última prueba juega contra el equipo ganador. El equipo perdedor pasa a ser el equipo árbitro. Fin del juego El primer equipo que gane siete cartas de prueba es declarado ganador. Notas Las decisiones del equipo árbitro son definitivas. Si una prueba termina en empate, se saca otra carta para decidir el ganador. Antes de cada prueba, los miembros del equipo deciden juntos quién participa en ella. Aseguraos de que todos tengan las mismas oportunidades de participar. —Descripción del editor"
