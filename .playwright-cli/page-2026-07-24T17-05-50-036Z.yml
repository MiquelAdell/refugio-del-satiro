        - article [ref=e9032]:
          - link "Noviembre Rojo — Disponible" [ref=e9033] [cursor=pointer]:
            - /url: /ludoteca/juegos/noviembre-rojo
            - generic [ref=e9035]:
              - generic [ref=e9036]: "6.3"
              - heading "Noviembre Rojo" [level=3] [ref=e9037]
              - paragraph [ref=e9038]: "«Red November» es un juego cooperativo ambientado en un submarino de ataque de los gnomos en el que todo va de mal en peor. El submarino está descendiendo y la presión del agua aumenta, el reactor nuclear se está sobrecalentando, los lanzamisiles nucleares se están activando prematuramente, hay incendios y fugas de agua por todas partes, un kraken gigante acecha en las cercanías y queda muy poco oxígeno y vodka. Mientras la trama se parece cada vez más a una película de catástrofes, los jugadores deben organizarse para resolver los problemas, repartirse las tareas entre ellos para minimizar los riesgos y, en ocasiones, aceptar sacrificarse por el bien común. La partida se desarrolla en el mapa del submarino. Las condiciones en el submarino se representan mediante tres indicadores de desastre: asfixia, calor y presión. Durante la partida, estas condiciones empeoran y, si cualquiera de ellas alcanza su valor máximo, el submarino se pierde. Además, pueden producirse diversas emergencias que deben abordarse con rapidez; de lo contrario, también provocarán la pérdida del submarino. En cada turno, un jugador puede desplazarse a una nueva ubicación y realizar allí alguna acción. Dicha acción puede consistir en reparaciones (que mejorarán las condiciones del submarino y/o resolverán emergencias), eliminar obstáculos (desbloquear escotillas, achicar agua o extinguir incendios) o abastecerse de equipo (lo que ayudará en acciones posteriores). Cada acción tiene un coste de tiempo. Cuanto más tiempo dedique un jugador a una acción, mayores serán las posibilidades de éxito. Tras el turno de cada jugador, se producirán una serie de eventos; cuanto más tiempo se haya dedicado, más eventos tendrán lugar. Estos eventos consistirán en el empeoramiento de las condiciones en el submarino o en la activación de emergencias. Si los gnomos logran mantenerse con vida el tiempo suficiente, llegará el rescate y se ganará la partida."
              - list [ref=e9039]:
                - listitem [ref=e9040]: 13+
                - listitem [ref=e9044]: 120min
                - listitem [ref=e9048]: 1-8
              - generic [ref=e9054]: Estrategia
        - article [ref=e9055]:
          - 'link "Nunatak: Temple of Ice — Disponible" [ref=e9056] [cursor=pointer]':
            - /url: /ludoteca/juegos/nunatak-temple-of-ice
            - generic [ref=e9058]:
              - generic [ref=e9059]: "7.3"
              - 'heading "Nunatak: Temple of Ice" [level=3] [ref=e9060]'
              - paragraph [ref=e9061]: "En el juego de construcción tridimensional «Nunatak: Temple of Ice», construís juntos una pirámide escalonada en una montaña de hielo, pero este juego no es cooperativo, ¡así que tened cuidado con dónde pisáis! (Por cierto, un «nunatak» es una colina o montaña completamente rodeada de hielo glacial). Por cada piedra de pilar que coloques, recibirás cartas con diferentes valores que influirán en tu puntuación final. Por cada cuatro pilares construidos en un cuadrado, se abre un nuevo nivel del monumento, y el templo de hielo crece paso a paso. ¿Quién sabrá colocar sus piedras con más acierto y estará a la altura de este gélido desafío?"
              - list [ref=e9062]:
                - listitem [ref=e9063]: 10+
                - listitem [ref=e9067]: 45min
