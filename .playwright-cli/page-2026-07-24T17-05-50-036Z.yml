            - generic [ref=e8690]:
              - generic [ref=e8691]: "7.2"
              - heading "Mezo" [level=3] [ref=e8692]
              - paragraph [ref=e8693]: Es una época de sangre, de rituales y de guerra. Los dioses deambulan entre las tribus, cada uno ávido de la devoción que les da forma. Aunque los dioses son muchos, solo uno perdurará a lo largo de los siglos por encima de todos los demás. Mezo es un innovador juego de control de territorio para 2-4 jugadores inspirado en la mitología maya. Controlarás a un poderoso dios y a su tribu de seguidores. Estas tribus se enfrentarán por el dominio, construirán pirámides escalonadas y realizarán sacrificios, todo en nombre de su dios. Con enormes miniaturas de dioses, cada una con estrategias muy asimétricas, así como numerosas formas de alcanzar la victoria, Mezo es una visión única del género de control de área. Puntos clave - Control de área innovador e intuitivo con múltiples formas de ganar. - Imponentes figuras de dioses mayas, cada una con sus propias estrategias y acciones únicas. - Una rica temática maya, un diseño artístico precioso y una mecánica de juego cautivadora.
