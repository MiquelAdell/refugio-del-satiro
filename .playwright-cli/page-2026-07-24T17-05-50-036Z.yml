            - generic [ref=e9675]:
              - generic [ref=e9676]: "7.9"
              - heading "Rebel Princess 2" [level=3] [ref=e9677]
              - paragraph [ref=e9678]: "Comienza la segunda gran celebración en el palacio, y se ha invitado a nuevas princesas. Todas quieren disfrutar de las fiestas sin la presencia de los persistentes príncipes encantadores, así que tendrán que evitarlos durante cinco días más. Además, se ha introducido un nuevo tipo de celebración en el palacio: ¡el baile solo para chicas! Y algunas invitadas maliciosas también se han sumado a la diversión. Esta expansión incluye: Modo por equipos: nuevas reglas que permiten utilizar todas las cartas originales de princesas y de ronda. 13 nuevas cartas de ronda (6 para jugar específicamente en el modo por equipos). 8 nuevas cartas de princesa (6 para jugar específicamente en el modo por equipos). En algunos idiomas, esta expansión también añade las 8 cartas adicionales de la versión Deluxe del juego básico de Bezier Games."
