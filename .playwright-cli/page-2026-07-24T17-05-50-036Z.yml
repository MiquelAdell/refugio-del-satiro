            - generic [ref=e10273]:
              - generic [ref=e10274]: "6.8"
              - heading "Sonar Family" [level=3] [ref=e10275]
              - paragraph [ref=e10276]: "En las profundidades del océano, dos tripulaciones de submarinos se enzarzan en una guerra silenciosa, enemigos para siempre. «SONAR Family» es un juego de batalla submarina en el que dos equipos manejan un submarino diferente. Cada jugador interpreta a un miembro de la tripulación: el capitán o el operador de radio. El juego incluye 4 hojas de capitán de doble cara y 4 hojas de operador de radio de doble cara. Se trata de mapas borrables en seco que se utilizan para seguir los movimientos y localizar al equipo contrario con el fin de hundir su submarino. Los dos equipos están separados por una mampara que impide ver los mapas del equipo contrario. Si uno de los dos submarinos pierde su segundo punto de estructura, su equipo pierde inmediatamente. ¡El equipo que hunda el submarino gana la partida!"
              - list [ref=e10277]:
                - listitem [ref=e10278]: 8+
                - listitem [ref=e10282]: 30min
