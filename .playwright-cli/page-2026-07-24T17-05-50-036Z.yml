              - heading "Zombie Kidz" [level=3] [ref=e11057]
              - paragraph [ref=e11058]: Los zombis se están adentrando en el cementerio que hay cerca de tu casa. Por desgracia, ninguno de los padres os cree ni a ti ni a tus amigos, así que decides tomar cartas en el asunto... En el juego infantil cooperativo «Zombie Kidz», los jugadores deben impedir que los zombis se apoderen del cementerio, ya sea cerrando las puertas con llave o eliminando a los zombis. Las reglas del juego se pueden adaptar para aumentar el nivel de dificultad.
