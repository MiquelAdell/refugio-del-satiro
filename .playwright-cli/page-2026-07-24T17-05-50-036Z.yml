        - article [ref=e6736]:
          - 'link "Decktective: Rosas de Sangre — Disponible" [ref=e6737] [cursor=pointer]':
            - /url: /ludoteca/juegos/decktective-rosas-de-sangre
            - generic [ref=e6739]:
              - generic [ref=e6740]: "6.5"
              - 'heading "Decktective: Rosas de Sangre" [level=3] [ref=e6741]'
              - paragraph [ref=e6742]: "El ruido de un carruaje rompe el silencio que envuelve la mansión de los Tudor. El duque Eduardo York, recién llegado, hace un espantoso descubrimiento: el conde Fernando Tudor yace sin vida junto a un arbusto de rosas ensangrentadas. ¿Qué ha ocurrido? ¿Se trata de un trágico accidente o de un crimen brutal? Recoge las pistas: un reloj de bolsillo roto, un manual de astrología, el boleto ganador de una carrera de caballos. ¿Podrás reunir todas las pruebas para resolver el misterio? Decktective: Rosas rojas como la sangre es un juego de investigación cooperativo, con una escena del crimen en 3D. Los jugadores deben resolver un caso misterioso. Juegan sus cartas para compartir información, descartan las que creen que les llevarán por mal camino, debaten las pistas que encuentran con los demás jugadores, formulan hipótesis y deducciones para dar con la solución. Al final de la partida, los jugadores deben responder a varias preguntas: cada respuesta correcta vale puntos. Cuantos más puntos consigan, mejor será su resultado. En su turno, los jugadores pueden jugar una carta de su mano y colocarla boca arriba sobre la mesa, compartiendo la información que contiene, o bien descartar una carta de su mano boca abajo en el archivo, sin poder hablar de la información que contiene hasta el final de la investigación. Cada carta tiene un valor del 1 al 10 en la esquina superior izquierda. Una carta solo puede jugarse boca arriba sobre la mesa si su valor es igual o inferior al número actual de cartas del archivo. —Descripción del editor"
