              - generic [ref=e5843]: "7.5"
              - heading "¡Aventureros al Tren! Europa" [level=3] [ref=e5844]
              - paragraph [ref=e5845]: "«Ticket to Ride: Europa» te lleva a vivir una nueva aventura en tren por toda Europa. Desde Edimburgo hasta Constantinopla y desde Lisboa hasta Moscú, visitarás las grandes ciudades de la Europa de principios de siglo. Al igual que el «Ticket to Ride» original, el juego sigue siendo elegantemente sencillo, se aprende en 5 minutos y resulta atractivo tanto para familias como para jugadores experimentados. Ticket to Ride: Europa es un juego completamente nuevo y no requiere la versión original. Más allá de un simple mapa nuevo, Ticket to Ride: Europa incorpora elementos de juego totalmente novedosos. Los túneles pueden obligarte a pagar cartas adicionales para construirlos, los transbordadores requieren cartas de locomotora para poder reclamarlos y las estaciones te permiten sacrificar algunos puntos para utilizar la ruta de un rival y conectarla con la tuya. El juego también incluye cartas de mayor tamaño y fichas de estación de tren. El objetivo general sigue siendo el mismo: recoger y jugar cartas de tren para colocar tus fichas en el tablero, intentando conectar las ciudades de tus cartas de billete. Se ganan puntos tanto por colocar trenes como por completar billetes, pero los billetes incompletos te hacen perder puntos. Gana el jugador que tenga más puntos al final de la partida. Copyright 2002-2014 Days of Wonder, inc. Parte de la serie «Ticket to Ride»."
