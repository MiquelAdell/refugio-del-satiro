        - article [ref=e8917]:
          - link "Mysterium Park — Disponible" [ref=e8918] [cursor=pointer]:
            - /url: /ludoteca/juegos/mysterium-park
            - generic [ref=e8920]:
              - generic [ref=e8921]: "7.0"
              - heading "Mysterium Park" [level=3] [ref=e8922]
              - paragraph [ref=e8923]: "¡Bienvenidos a Mysterium Park! Sus algodones de azúcar, su circo, sus oscuros secretos... El antiguo director del parque ha desaparecido, pero la investigación no ha dado ningún resultado. Desde aquella noche, están ocurriendo cosas extrañas en el recinto ferial. Como médiums, estáis convencidos de que un fantasma acecha esta feria... Ahora estáis decididos a darle la oportunidad de revelar la verdad. En este juego cooperativo independiente, el fantasma envía visiones mediante cartas ilustradas. Los médiums intentan interpretarlas para descartar a ciertos sospechosos y lugares. A continuación, aprovecharán su única oportunidad para reconstruir lo que le ocurrió al director. Solo tenéis seis noches antes de que la feria se marche de la ciudad... ¡Abrid vuestras mentes y descubrid la verdad! Ambientado bajo las luces de un parque de atracciones estadounidense de los años 50, «Mysterium Park» comparte la mecánica básica del famoso y galardonado juego del que es una nueva versión, aunque con un enfoque diferente: es más pequeño y más rápido, gracias a una preparación muy rápida y a unas reglas simplificadas. Mysterium es un hito en experiencias inmersivas y llamativas cercanas a los juegos de rol; con Mysterium Park, podrás disfrutar de lo esencial de este juego de una forma más condensada. — Descripción del editor"
              - list [ref=e8924]:
                - listitem [ref=e8925]: 10+
