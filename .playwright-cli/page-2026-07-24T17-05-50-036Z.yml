        - article [ref=e6805]:
          - 'link "Disney Villainous: The Worst Takes it All — Disponible" [ref=e6806] [cursor=pointer]':
            - /url: /ludoteca/juegos/disney-villainous-the-worst-takes-it-all
            - generic [ref=e6808]:
              - generic [ref=e6809]: "6.9"
              - 'heading "Disney Villainous: The Worst Takes it All" [level=3] [ref=e6810]'
              - paragraph [ref=e6811]: En «Villainous», cada jugador controla a uno de los seis personajes de Disney, cada uno de ellos un villano de una película diferente de Disney. Cada jugador tiene su propio mazo de villano, mazo del destino, tablero de jugador y figura en 3D. En su turno, el jugador activo mueve a su personaje a una ubicación diferente de su tablero de jugador, realiza una o varias de las acciones visibles en esa casilla (a menudo jugando cartas de su mano) y, a continuación, repone su mano hasta tener cuatro cartas. Las cartas son aliados, objetos, efectos, condiciones y (para algunos personajes) maldiciones. Debes utilizar tus cartas para cumplir tu condición de victoria única. Una de las acciones te permite elegir a otro jugador, robar dos cartas del mazo del destino de ese jugador y, a continuación, jugar una de ellas en el tablero de ese jugador, cubriendo dos de las cuatro casillas de acción de una de las ubicaciones de ese jugador. El mazo del destino contiene héroes, objetos y efectos de la película de ese villano, y estas cartas permiten a los demás jugadores fastidiar a ese villano en concreto.
              - list [ref=e6812]:
