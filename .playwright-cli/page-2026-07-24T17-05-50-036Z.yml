        - article [ref=e7951]:
          - link "Juntaraules — Disponible" [ref=e7952] [cursor=pointer]:
            - /url: /ludoteca/juegos/juntaraules
            - generic [ref=e7954]:
              - generic [ref=e7955]: "5.7"
              - heading "Juntaraules" [level=3] [ref=e7956]
              - paragraph [ref=e7957]: "Elige tus palabras, elimina letras según el nivel y júntalas para que el resto de participantes puedan adivinar tu tablero. Consigue pistas y ayuda al completar cada nivel; intenta llegar hasta el final conservando algunas pistas, pero no falles o tendrás que volver a empezar. Cómo se juega: Coge la pizarra y entrega un rotulador a cada participante. El «mezclador de palabras» roba dos cartas y une dos palabras, eliminando tantas letras como corresponda al nivel en el que se encuentre el grupo, y las escribe en su pizarra; a continuación, deja que el resto adivine de qué palabras provienen sin dar más pistas. Cuantas más palabras acierten, más niveles avanzará el grupo y más ventajas obtendrá. —Descripción del editor"
              - list [ref=e7958]:
                - listitem [ref=e7959]: 10+
