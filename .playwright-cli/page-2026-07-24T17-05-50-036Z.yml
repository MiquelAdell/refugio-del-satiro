        - article [ref=e10431]:
          - link "Te Toka Tiki Tiki — Disponible" [ref=e10432] [cursor=pointer]:
            - /url: /ludoteca/juegos/te-toka-tiki-tiki
            - generic [ref=e10434]:
              - generic [ref=e10435]: "8.2"
              - heading "Te Toka Tiki Tiki" [level=3] [ref=e10436]
              - paragraph [ref=e10437]: "¡Velocidad, concentración y una pizca de locura! Prepárate para un juego de fiesta trepidante en el que los reflejos rápidos y una mente ágil son la clave para la victoria. ¿Quién iba a imaginar que cinco vocales pudieran ser tan divertidas? En tu turno, da la vuelta a una carta, realiza la acción y pasa el turno, ¡pero no la fastidies! Si una carta muestra una mano, grita «¡Te Toka!». Si muestra una máscara, grita «¡Tiki Tiki!». ¿Es fácil? ¡No tan rápido! Algunas cartas incluyen una vocal junto a los símbolos, y esa vocal se convierte en la única que todos pueden usar hasta que aparezca otra vocal. Así que, si aparece una máscara con una A, tendrás que decir «¡Taka Taka!». ¡Y la cosa se complica aún más! Pueden aparecer hasta tres símbolos a la vez; por ejemplo, «Máscara, Mano, Máscara». Con la vocal «A», eso se convierte en: «¡Taka Taka, Ta Taka, Taka Tata!». ¡El jugador activo no puede dudar ni cometer ningún error! El juego continúa hasta la última carta. Cada error te cuesta una ficha Tiki, y gana el jugador que tenga menos fichas al final. ¿Crees que tienes lo que hay que tener? Pues prepárate, porque ahora «¡te toca a ti!». … ¿o deberíamos decir: «ta tata», «te teke», «ti tiki» o quizá «tu tuku»? —Descripción del diseñador"
              - list [ref=e10438]:
                - listitem [ref=e10439]: 6+
