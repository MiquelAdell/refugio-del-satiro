              - generic [ref=e9998]: "6.3"
              - heading "Silk" [level=3] [ref=e9999]
              - paragraph [ref=e10000]: "Los gusanos de seda Imomushi solo pueden vivir en las frías cumbres de la cordillera de Akaishi, y producen la seda más delicada y cara del mundo. Muy pocas personas pueden soportar las penurias de la solitaria vida que lleva un pastor de gusanos de seda gigantes. Se trata de una existencia solitaria que exige una gran dedicación y fortaleza de carácter para soportar las presiones derivadas de la competencia con los pocos pastores que se disputan los escasos pero codiciados pastos, al tiempo que hay que mantener a raya al temible ookamy. «Silk» es un juego de iniciación a los sistemas de control de área y de colocación de trabajadores. Los jugadores deben mover sus gusanos de seda a los espacios óptimos para que puedan alimentarse de la mejor hierba disponible, al tiempo que empujan las fichas de los demás jugadores hacia zonas de alimentación menos deseables. En este juego, los jugadores lanzan los dados para determinar qué acciones pueden realizar durante su turno. Hay seis tipos de acciones disponibles: criar más gusanos de seda, mover al pastor o a su mastín, construir vallas o granjas, mover al monstruo ookami por el tablero y —lo más importante— hacer que tus gusanos de seda se alimenten. Cuando los gusanos de seda se alimentan, generan una cantidad de puntos de seda que depende del tipo de terreno en el que se encuentren en ese momento. Estos puntos se pueden utilizar para modificar el resultado de una tirada de dados, ¡sin olvidar que el jugador con más puntos de seda al final de la partida gana! —Descripción del editor"
