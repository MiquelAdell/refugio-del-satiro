        - article [ref=e6000]:
          - link "Bitoku — Disponible" [ref=e6001] [cursor=pointer]:
            - /url: /ludoteca/juegos/bitoku
            - generic [ref=e6003]:
              - generic [ref=e6004]: "7.8"
              - heading "Bitoku" [level=3] [ref=e6005]
              - paragraph [ref=e6006]: En Bitoku, los jugadores asumen el papel de espíritus Bitoku del bosque en su camino hacia la trascendencia, con el objetivo de elevarse y convertirse en el próximo gran espíritu del bosque. Para ello, contarán con la ayuda de los yōkai, los kodamas y los distintos peregrinos que les acompañan en su camino. Se trata de un juego de gestión de mano y construcción de motor con múltiples caminos hacia la victoria. Los jugadores dispondrán de yōkai representados por las cartas que componen su mano, que deberán colocarse en los lugares adecuados y en el momento oportuno para obtener el máximo beneficio de las habilidades que ofrecen. Además, durante la partida, los jugadores pueden conseguir más cartas de yōkai para su mazo, lo que les permite ampliar sus opciones de juego y alcanzar una puntuación más alta. Cada jugador cuenta además con tres guardianes yōkai (en forma de dados) que puede enviar a las grandes regiones del bosque del tablero principal para obtener todo tipo de nuevas opciones que podrá utilizar durante la partida. Estas opciones pueden ser estructuras que construyen en determinadas zonas del bosque, cristales de alma que generan recursos al realizar ciertas acciones y muchas otras más. Los jugadores también tienen la oportunidad de ayudar a los mitamas, almas perdidas en busca de redención, utilizando las luciérnagas chinkon. Hay realmente una amplia gama de acciones que llevar a cabo, y esto sin tener en cuenta el dominio personal, donde los jugadores pueden desarrollar otra capa de estrategia adicional mientras gestionan a los peregrinos. Los peregrinos son seguidores del jugador que se embarcan en viajes de contemplación y reflexión y que luego comparten con el Bitoku las experiencias y los aprendizajes que obtienen a lo largo del camino espiritual. —Descripción del editor
              - list [ref=e6007]:
