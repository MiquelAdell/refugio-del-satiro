        - article [ref=e7491]:
          - link "Fantasma Blitz — Disponible" [ref=e7492] [cursor=pointer]:
            - /url: /ludoteca/juegos/fantasma-blitz
            - generic [ref=e7494]:
              - generic [ref=e7495]: "6.7"
              - heading "Fantasma Blitz" [level=3] [ref=e7496]
              - paragraph [ref=e7497]: "Balduin, el fantasma de la casa, encontró una vieja cámara en la bodega del castillo. Enseguida empezó a fotografiar todo aquello que le encanta hacer desaparecer cuando anda por ahí dando sustos, incluyéndose a sí mismo, por supuesto. Por desgracia, la cámara encantada saca muchas fotos con colores equivocados. A veces, la botella verde sale blanca; otras veces, azul. Al mirar las fotos, Balduin ya no recuerda muy bien qué era lo siguiente que quería hacer desaparecer. ¿Puedes ayudarle con sus travesuras y nombrar rápidamente el objeto correcto, o incluso hacerlo desaparecer tú mismo? Si coges los objetos correctos con rapidez, tendrás muchas posibilidades de ganar... El juego ultrarrápido de reconocimiento de formas y colores que sin duda pondrá a prueba los reflejos de niños, familias y jugadores por igual. En Ghost Blitz, cinco objetos de madera descansan sobre la mesa a la espera de ser cogidos: un fantasma blanco, una botella verde, un simpático ratón gris, un libro azul y una cómoda silla roja. Cada carta del mazo muestra imágenes de dos objetos, de los cuales uno o ambos están coloreados de forma incorrecta. Con todos los jugadores participando al mismo tiempo, alguien descubre una carta y, a continuación, los jugadores intentan coger el objeto «correcto», pero ¿cuál es el correcto? Si un objeto está coloreado correctamente —por ejemplo, una botella verde y un ratón rojo—, los jugadores deben coger ese objeto con el color correcto. Si ambos objetos están coloreados incorrectamente —por ejemplo, un fantasma verde y un ratón rojo—, hay que buscar el objeto y el color que no aparecen entre los cuatro detalles mostrados. En este caso se ven el verde, el rojo, el fantasma y el ratón, por lo que los jugadores deben coger el libro azul. El primer jugador en coger el objeto correcto se queda con la carta y, a continuación, descubre la siguiente carta del mazo. Si un jugador coge el objeto equivocado, debe descartar una de las cartas que haya recogido anteriormente. Una vez que se agota el mazo, el juego termina y gana quien haya reunido más cartas. Reedición de: «Knapp daneben», publicado en 2004 por HABA."
              - list [ref=e7498]:
                - listitem [ref=e7499]: 8+
