        - article [ref=e8940]:
          - link "Nemesis — Disponible" [ref=e8941] [cursor=pointer]:
            - /url: /ludoteca/juegos/nemesis
            - generic [ref=e8943]:
              - generic [ref=e8944]: "8.3"
              - heading "Nemesis" [level=3] [ref=e8945]
              - paragraph [ref=e8946]: "Jugar a Nemesis te sumergirá en el corazón del terror de supervivencia de ciencia ficción en todo su esplendor. Un soldado dispara a ciegas por un pasillo, intentando detener el avance de los alienígenas. Un científico se apresura a encontrar una solución en su laboratorio improvisado. Un traidor se lleva la última cápsula de escape en el último momento. Los intrusos con los que te encuentras en la nave no solo reaccionan al ruido que haces, sino que también evolucionan a medida que pasa el tiempo. Cuanto más se alarga la partida, más fuertes se vuelven. Durante la partida, controlas a uno de los miembros de la tripulación, que cuenta con un conjunto único de habilidades, su propio mazo de cartas y un equipamiento inicial individual. Estos héroes cubren todas tus necesidades básicas de terror de ciencia ficción. Por ejemplo, el científico es un as con los ordenadores y la investigación, pero le costará mucho desenvolverse en combate. El soldado, por otro lado... Nemesis es un juego semicooperativo en el que tú y tus compañeros de tripulación debéis sobrevivir en una nave infestada de organismos hostiles. Para ganar la partida, tienes que completar uno de los dos objetivos que se te asignan al inicio del juego y regresar a la Tierra sano y salvo. Encontrarás muchos obstáculos en tu camino: enjambres de «Intrusos» (el nombre que la IA de la nave da a los organismos alienígenas), el mal estado de la nave, los intereses de tus compañeros de juego y, a veces, simplemente el cruel destino. La mecánica de juego de Nemesis está diseñada para estar llena de momentos culminantes que, con suerte, te resultarán gratificantes incluso cuando tus mejores planes se vean frustrados y tu personaje corra un terrible destino."
              - list [ref=e8947]:
                - listitem [ref=e8948]: 12+
                - listitem [ref=e8952]: 180min
