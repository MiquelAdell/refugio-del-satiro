        - article [ref=e10385]:
          - link "Tabriz — Disponible" [ref=e10386] [cursor=pointer]:
            - /url: /ludoteca/juegos/tabriz
            - generic [ref=e10388]:
              - generic [ref=e10389]: "7.2"
              - heading "Tabriz" [level=3] [ref=e10390]
              - paragraph [ref=e10391]: ¡Adéntrate en el Gran Bazar de Tabriz y conviértete en un legendario maestro tejedor! De la mano de Randy Flynn, el diseñador de Cascadia, Tabriz combina un elegante sistema de desarrollo de mecánicas con una estrategia accesible y un rico entorno cultural que cobra vida en tu mesa. Reúne materiales raros como seda, pelo de camello y tintes vegetales mientras tejes exquisitas alfombras persas para cumplir con los encargos y ganar prestigio. Utiliza a tus tres ayudantes para moverte por un bullicioso bazar, calcula bien tus jugadas en función de los precios cambiantes del mercado y construye un potente sistema de acciones que crece con cada alfombra que completas. «Tabriz» ofrece mecánicas intuitivas, una progresión satisfactoria y múltiples IA para jugar en solitario, lo que garantiza una gran rejugabilidad. ¡«Tabriz» será tu próximo juego de estrategia favorito, relajante a la par que ingenioso!
