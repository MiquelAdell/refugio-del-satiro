        - article [ref=e9377]:
          - link "Pelusas — Disponible" [ref=e9378] [cursor=pointer]:
            - /url: /ludoteca/juegos/pelusas
            - generic [ref=e9380]:
              - generic [ref=e9381]: "7.1"
              - heading "Pelusas" [level=3] [ref=e9382]
              - paragraph [ref=e9383]: Fruit Fight (que también se ha publicado con los títulos No Mercy y HIT!) es un juego de «tentar a la suerte» en el que se roban cartas para conseguir puntos, ¡pero no conviene robar con demasiada frecuencia porque, de lo contrario, podrías perder todas tus ganancias! Más concretamente, el mazo de 90 cartas contiene once cartas numeradas del 1 al 5 y siete cartas numeradas del 6 al 10. En tu turno, das la vuelta a una carta del mazo y la colocas delante de ti, quedándote (si lo deseas) con todas las cartas del mismo número que tengan los demás jugadores delante de ellos. Puedes detenerte después de cada robo o puedes robar otra carta. Si robas un número que ya tienes delante —y tienes al menos tres cartas delante—, entonces descartas del juego todas las cartas que tienes delante. Al comienzo de tu turno, si tienes cartas delante de ti, colócalas boca abajo en tu pila de puntuación personal y, a continuación, comienza tu turno. Cuando se agote la pila de robo, todos los jugadores colocan todas las cartas que tienen delante de sí en sus pilas de puntuación y, a continuación, suman los números de todas sus cartas puntuadas. Gana quien tenga la suma más alta.
              - list [ref=e9384]:
                - listitem [ref=e9385]: 8+
                - listitem [ref=e9389]: 20min
