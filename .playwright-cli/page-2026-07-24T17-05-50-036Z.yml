        - article [ref=e7422]:
          - link "Everest Go! — Disponible" [ref=e7423] [cursor=pointer]:
            - /url: /ludoteca/juegos/everest-go
            - generic [ref=e7425]:
              - generic [ref=e7426]: "6.7"
              - heading "Everest Go!" [level=3] [ref=e7427]
              - paragraph [ref=e7428]: "En «Everest Go!» nos convertiremos en alpinistas que compiten por conquistar la cima más alta del mundo: ¡el Everest! Equipa a tu alpinista con ropa y objetos especiales, y juega cartas de acción contra tus rivales. Quien tenga más puntos de equipamiento al final gana la partida. Cada participante crea a su alpinista con las 6 cartas de personaje y lo coloca en su zona de juego. Estas cartas conforman a tu alpinista. En tu turno, debes elegir una de estas tres opciones: jugar una carta de ropa, jugar una carta de acción o mejorar tu mano. Cuando tengas al menos una carta de ropa en cada una de tus 6 cartas de personaje, y tu escalador no se vea afectado por la carta de acción «Hipotermia», tendrás la opción de decir en tu turno ¡EVEREST! Esto terminará inmediatamente la partida y te dará una bonificación de 3 puntos. A continuación, cada jugador calcula su puntuación total sumando los puntos de todas sus prendas (visibles y ocultas) y los objetos especiales de su alpinista. El ganador es aquel que obtenga la puntuación más alta. —Descripción del editor"
              - list [ref=e7429]:
