        - article [ref=e6414]:
          - link "Ciudadelas — Disponible" [ref=e6415] [cursor=pointer]:
            - /url: /ludoteca/juegos/ciudadelas
            - generic [ref=e6417]:
              - generic [ref=e6418]: "7.0"
              - heading "Ciudadelas" [level=3] [ref=e6419]
              - paragraph [ref=e6420]: "En «Citadels», los jugadores asumen nuevos roles en cada ronda para representar a los personajes que contratan con el fin de que les ayuden a conseguir oro y construir edificios. El juego termina al finalizar la ronda en la que un jugador construye su octavo edificio. A continuación, los jugadores suman sus puntos y gana el jugador con la puntuación más alta. Los jugadores comienzan con varias cartas de edificio en la mano; los edificios son de cinco colores diferentes, y los morados suelen tener una habilidad especial, mientras que los de otros colores proporcionan una ventaja al jugar determinados personajes. Al comienzo de cada ronda, el jugador que fue rey en la ronda anterior descarta una de las ocho cartas de personaje al azar, elige una y, a continuación, pasa las cartas al siguiente jugador, y así sucesivamente hasta que cada jugador haya elegido en secreto un personaje. Cada personaje tiene una habilidad especial, y la utilidad de cualquier personaje depende de tu situación y de la de tus oponentes. A continuación, los personajes llevan a cabo sus acciones en orden numérico: el asesino elimina a otro personaje durante la ronda, el ladrón roba todo el oro de otro personaje, el mago intercambia cartas de edificio con otro jugador, el señor de la guerra destruye opcionalmente un edificio en juego, y así sucesivamente. En un turno, un jugador gana dos o más monedas de oro (o roba dos cartas de edificio y luego descarta una) y, a continuación, opcionalmente construye un edificio (o hasta tres si juega como arquitecto en esa ronda). Los edificios cuestan una cantidad de oro igual al número de símbolos que tienen, y cada edificio vale un determinado número de puntos. Además de los puntos de los edificios, al final de la partida un jugador obtiene puntos de bonificación por tener ocho edificios o edificios de los cinco colores. La expansión «Citadels: The Dark City» se lanzó inicialmente como un producto independiente, pero la segunda edición del juego de Hans im Glück (presentada en una caja metálica) y la tercera edición de Fantasy Flight Games incluían esta expansión y se reconocen por su caja rectangular (no cuadrada). Con «Dark City», «Citadels» admite un máximo de ocho jugadores."
