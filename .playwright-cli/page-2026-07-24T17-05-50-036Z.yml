        - article [ref=e6460]:
          - link "Clic, el momento perfecto — Disponible" [ref=e6461] [cursor=pointer]:
            - /url: /ludoteca/juegos/clic-el-momento-perfecto
            - generic [ref=e6463]:
              - generic [ref=e6464]: "7.0"
              - heading "Clic, el momento perfecto" [level=3] [ref=e6465]
              - paragraph [ref=e6466]: ¿Cómo se hace la foto perfecta de un grupo de personas si solo tienes un intento? Cada personaje tiene deseos diferentes. Algunos quieren salir en primer plano; otros, estar junto a otra persona; y hay quienes, bajo ningún concepto, quieren estar al lado de una persona en concreto. Haz todo lo posible por contentar a todo el mundo, aunque no conozcas realmente las preferencias de todos los personajes… En Picture Perfect, publicado originalmente como Der Perfekte Moment, tienes que colocar a catorce personajes para sacar la foto perfecta. Cada uno de ellos tiene tres deseos concretos que debes cumplir. Por desgracia, estos deseos están ocultos en sobres. Durante la partida, los jugadores intentan echar un vistazo al interior de estos sobres para averiguar cómo colocar correctamente a los personajes. Para ello, intercambian su información con los demás… o quizá intentan ocultarla... Quien consiga más puntos al final de la partida será quien haya cumplido más deseos y se convertirá en el maestro fotógrafo.
