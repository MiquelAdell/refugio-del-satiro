        - article [ref=e9124]:
          - link "Optimus — Disponible" [ref=e9125] [cursor=pointer]:
            - /url: /ludoteca/juegos/optimus
            - generic [ref=e9127]:
              - generic [ref=e9128]: "7.5"
              - heading "Optimus" [level=3] [ref=e9129]
              - paragraph [ref=e9130]: Elige tus dados con astucia en «Ganz schön clever» (que en alemán significa «Eso es muy ingenioso») para colocarlos en las casillas del mismo color de tu hoja de puntuación, creando oportunidades de puntuación en cadena y sumando puntos. Los dados que no utilices son tan importantes como los que sí utilizas, ya que cualquier dado con un valor inferior al del elegido puede ser utilizado por los demás jugadores, lo que mantiene a todos en el juego en todo momento.
