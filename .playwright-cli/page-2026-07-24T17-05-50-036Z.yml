        - article [ref=e7334]:
          - 'link "Epic Spell Wars of the Battle Wizards: Rumble at Castle Tentakill — Disponible" [ref=e7335] [cursor=pointer]':
            - /url: /ludoteca/juegos/epic-spell-wars-of-the-battle-wizards-rumble-at-castle-tentakill
            - generic [ref=e7337]:
              - generic [ref=e7338]: "6.5"
              - 'heading "Epic Spell Wars of the Battle Wizards: Rumble at Castle Tentakill" [level=3] [ref=e7339]'
              - paragraph [ref=e7340]: "¡El éxito inesperado ha despertado! «Epic Spell Wars of the Battle Wizards: Rumble at Castle Tentakill» por fin está aquí y viene repleto de nuevas formas de acabar de una vez por todas con todos aquellos que se te opongan. Este juego independiente es además 100 % compatible con el juego original, lo que permite a los jugadores convertir un juego ya de por sí épico en un juego ÉPICO. ¡Epic Spell Wars continúa su épica aventura tras su aparición en el programa TableTop de Geek and Sundry! Con un diseño de juego y un arte totalmente nuevo a cargo del equipo creativo original formado por Cory Jones, Rob Heinsoo y Nick Edwards. Nueva incorporación: ¡criaturas! Las cartas de entrega de esta expansión también pueden convertirse en tus mascotas si obtienes una buena tirada. Con un familiar a tu lado durante unas cuantas rondas, serás imparable. Pero si se te viene encima una gran ráfaga de daño, ¿por qué no hacer que tu pequeño amigo se interponga y reciba ese golpe en tu lugar? Nueva incorporación: ¡Sangre! Acumula Sangre mientras acabas con tus oponentes y desafías al destino con poderosos hechizos y tesoros. Usa tus puntos de Sangre para hacer que algunos hechizos sean aún más poderosos que antes. ¡Nueva incorporación: Reacciones! Algunos hechizos se resolverán parcialmente incluso si mueres demasiado pronto. Ahora puedes lanzar un hechizo a plena potencia sin preocuparte por morir antes de que se resuelva. Con una reacción en el juego, conseguirás tu venganza… Novedad: ¡La figura de cartón importa! Esa loca figura de cartón es ahora una codiciada reliquia en el juego. Si la controlas, varios de tus hechizos aumentarán su potencia. También puede proporcionarte algo de Sangre extra. Tanto si has jugado al original como si no, esta nueva expansión te proporcionará todo lo que necesitas para empezar a hacer pedazos a tus oponentes. Los jugadores experimentados encontrarán nuevos retos y se sorprenderán con las nuevas cartas de «Tesoros» y «Mago muerto». ¡Mezcla las dos expansiones para disfrutar de la fiesta de la carnicería definitiva!"
