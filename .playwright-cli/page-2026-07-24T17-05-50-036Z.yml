        - article [ref=e5954]:
          - link "Bienvenido a la Mazmorra — Disponible" [ref=e5955] [cursor=pointer]:
            - /url: /ludoteca/juegos/bienvenido-a-la-mazmorra
            - generic [ref=e5957]:
              - generic [ref=e5958]: "6.5"
              - heading "Bienvenido a la Mazmorra" [level=3] [ref=e5959]
              - paragraph [ref=e5960]: "«Welcome to the Dungeon» —publicado inicialmente como «Dungeon of Mandom»— es un juego de exploración de mazmorras en el que los jugadores ponen a prueba su suerte: de 2 a 4 jugadores se turnan para, en esencia, retarse mutuamente a adentrarse en una mazmorra con menos equipamiento del que tienen al principio, mientras llenan la mazmorra de monstruos. Los jugadores pueden ganar la partida al ganar dos rondas o quedar eliminados al perder dos rondas. Cada jugador tiene una carta de jugador de dos caras: una blanca y otra roja. La primera victoria se marca en la carta de jugador, y la primera derrota hace que la carta se dé la vuelta a la cara roja. Una segunda derrota hará que el jugador devuelva la carta a la caja. El juego se desarrolla en rondas. El jugador prepara el personaje base y todo el equipamiento que lleva puesto. Esto representa a cada jugador como un explorador de mazmorras totalmente equipado. En cada ronda, el jugador inicial (la persona que desafió la mazmorra en último lugar o el último jugador en estar en una mazmorra) puede elegir entre robar una carta del mazo de monstruos o pasar su turno. Si decide robar, puede hacer una de estas dos cosas: (1) quedársela y quitarse un objeto de equipamiento o (2) colocarla boca abajo en la mazmorra. Al colocarla boca abajo en la mazmorra se crea el mazo de la mazmorra y se llena esta de monstruos a los que el retador tendrá que enfrentarse más tarde. Si decide pasar su turno, no podrá participar en el resto de la ronda. Cuando solo quede una persona después de que todos los demás jugadores hayan pasado su turno, ese jugador se convierte en el retador y debe adentrarse en la mazmorra únicamente con el equipo que lleva equipado. A continuación, el jugador va dando la vuelta a las cartas del mazo de la mazmorra y lucha contra los monstruos que hay en su interior. Algunos equipos te permiten anular el daño del enemigo o ser capaz de soportarlo aumentando tus PV. Si el jugador sobrevive a la mazmorra con al menos 1 PV, gana esa ronda. Si no, pierde. A continuación, los jugadores barajan de nuevo todas las cartas para formar un nuevo mazo de monstruos y vuelven a equiparse con todo el equipo para comenzar una nueva ronda. El juego termina cuando alguien ha ganado dos veces o cuando solo queda un jugador en pie. «Welcome to the Dungeon» incluye cuatro conjuntos diferentes de cartas de personaje, mientras que «Dungeon of Mandom» solo cuenta con un único personaje."
