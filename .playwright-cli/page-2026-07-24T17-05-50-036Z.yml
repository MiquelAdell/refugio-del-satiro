        - article [ref=e6368]:
          - link "Ciudad de Puntos — Disponible" [ref=e6369] [cursor=pointer]:
            - /url: /ludoteca/juegos/ciudad-de-puntos
            - generic [ref=e6371]:
              - generic [ref=e6372]: "7.1"
              - heading "Ciudad de Puntos" [level=3] [ref=e6373]
              - paragraph [ref=e6374]: "Del equipo responsable del gran éxito «Point Salad», «Point City» es un juego de selección de cartas y construcción de motores de juego con más de 150 cartas de edificios únicas, ¡que te ofrece la oportunidad de crear una ciudad completamente diferente cada vez que juegues! Las reglas son sencillas: coge dos cartas adyacentes de la dinámica cuadrícula de la ciudad y añádelas a tu ciudad en expansión. Usa tus cartas de recursos y bonificaciones para construir cartas de edificios que requieran combinaciones específicas. ¡Construye estructuras cívicas especiales para multiplicar los puntos de tu ciudad y conviértete en el mejor urbanista! «Point City» parte del mismo concepto sencillo de seleccionar cartas y crear las mejores combinaciones, pero añade nuevas capas de gestión de recursos y desarrollo de mecánicas al juego, lo que lo hace fácil de aprender, ¡pero desafiante para todos! —Descripción del diseñador"
              - list [ref=e6375]:
