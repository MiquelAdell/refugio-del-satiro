        - article [ref=e10569]:
          - link "The White Castle — Disponible" [ref=e10570] [cursor=pointer]:
            - /url: /ludoteca/juegos/the-white-castle
            - generic [ref=e10572]:
              - generic [ref=e10573]: "8.0"
              - heading "The White Castle" [level=3] [ref=e10574]
              - paragraph [ref=e10575]: La garza sobrevuela el cielo de Himeji mientras el daimyo, desde lo alto del castillo, observa cómo se mueven sus sirvientes. Los jardineros cuidan el estanque, donde viven las carpas koi; los guerreros montan guardia en las murallas; y los cortesanos se agolpan en las puertas, anhelando una audiencia que los acerque a los círculos más íntimos de la corte. Al caer la noche, se encienden las linternas y los trabajadores regresan a su clan. En «El castillo blanco», los jugadores controlarán uno de estos clanes con el objetivo de sumar más puntos de victoria que el resto. Para ello, deberán acumular influencia en la corte, gestionar los recursos con audacia y colocar a sus trabajadores en el lugar adecuado en el momento oportuno. Los autores son Sheila Santos e Israel Cendrero, el dúo conocido como Llama Dice, que también diseñó el exitoso juego «La catedral roja» con Devir. En este caso, dejamos atrás el Moscú de Iván el Terrible para explorar la fortaleza más imponente del Japón moderno, el castillo de Himeji, donde ondea el estandarte del clan Sakai bajo las órdenes del daimyo Sakai Tadakiyo. «The White Castle» es un juego de tipo europeo con mecánicas de gestión de recursos, colocación de trabajadores y lanzamiento de dados para llevar a cabo acciones. Durante la partida, a lo largo de tres rondas, los jugadores enviarán a miembros de su clan a cuidar los jardines, defender el castillo o ascender en la escala social de la nobleza. Al final de la partida, estas acciones otorgarán a los jugadores puntos de victoria de diversas formas. El tablero central muestra el castillo de Himeji en todo su esplendor, dividido en varias zonas. La más grande es el interior del castillo, con la Sala de las Mil Alfombras, donde los cortesanos deben ascender socialmente hasta alcanzar el círculo más cercano al daimyo para gozar de su favor. También están el estanque y los jardines, cuidados pacientemente por los jardineros, donde todos pueden relajarse y contemplar su belleza sin restricciones. Otra zona importante es la muralla y el exterior del castillo, donde los guerreros patrullan y montan guardia. Por último, encontramos la zona de los tres puentes, donde se acumulan los tres tipos de dados que pueden utilizarse para realizar acciones, y el dominio personal de cada jugador, donde llevará la cuenta de sus recursos y donde tendrá la reserva de trabajadores. Con unas reglas accesibles y una ambientación muy cuidada, «The White Castle» es un título muy versátil que encajará con diferentes grupos de jugadores. Como es habitual en los títulos de Llama Dice, su diseño elegante y sencillo esconde una gran profundidad estratégica al alcance de los jugadores. —Descripción del editor
