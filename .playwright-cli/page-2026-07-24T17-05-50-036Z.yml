        - article [ref=e10799]:
          - 'link "Twilight Imperium: Cuarta Edición — Disponible" [ref=e10800] [cursor=pointer]':
            - /url: /ludoteca/juegos/twilight-imperium-cuarta-edicion
            - generic [ref=e10802]:
              - generic [ref=e10803]: "8.6"
              - 'heading "Twilight Imperium: Cuarta Edición" [level=3] [ref=e10804]'
              - paragraph [ref=e10805]: Twilight Imperium (4.ª edición) es un juego de conquista galáctica en el que entre tres y seis jugadores asumen cada uno el papel de una de las diecisiete facciones que compiten por el dominio galáctico mediante el poderío militar, las maniobras políticas y las negociaciones económicas. Cada facción ofrece una experiencia de juego completamente diferente, desde los «Fantasmas de Creuss», que se desplazan a través de agujeros de gusano, hasta los «Emiratos de Hacan», maestros del comercio y la economía. Estas diecisiete razas disponen de múltiples caminos hacia la victoria, pero solo una podrá sentarse en el trono de Mecatol Rex como nuevos amos de la galaxia. No hay dos partidas de Twilight Imperium que sean idénticas. Al comienzo de cada era galáctica, el tablero de juego se construye de forma única y estratégica a partir de 51 fichas de galaxia que incluyen desde nuevos y exuberantes planetas y supernovas hasta campos de asteroides y grietas gravitatorias. A los jugadores se les reparte una mano de estas fichas y, por turnos, crean la galaxia en torno a Mecatol Rex, el planeta capital situado en el centro del tablero. Una tormenta de iones puede impedir que tu raza avance por la galaxia, mientras que una grieta gravitatoria colocada fortuitamente puede protegerte de tus enemigos más cercanos. La galaxia es tuya para crearla y dominarla. Una ronda de Twilight Imperium comienza cuando los jugadores eligen una de las ocho cartas de estrategia que determinan el orden de juego y otorgan a su propietario una acción estratégica única para esa ronda. Estas pueden servir para cualquier cosa, desde proporcionar fichas de mando adicionales hasta permitir a un jugador controlar el comercio en toda la galaxia. Una vez seleccionadas estas estrategias, los jugadores se turnan para mover sus flotas de un sistema a otro, reclamar nuevos planetas para sus imperios y entablar guerras o comerciar con otras facciones. Al final de un turno, los jugadores se reúnen en un gran consejo para aprobar nuevas leyes y agendas, lo que altera el juego de formas impredecibles. Una vez que todos los jugadores han completado su turno, avanzan en la escala de victoria comprobando si han cumplido algún objetivo a lo largo del turno y sumando los puntos correspondientes. Los objetivos se determinan colocando diez cartas de objetivo públicas al inicio de cada partida, que se van revelando gradualmente a lo largo del juego. Además, cada jugador elige entre dos objetivos secretos aleatorios al inicio de la partida, cuya consecución otorga puntos de victoria —solo para quien posea ese objetivo—. Estos objetivos pueden ser de todo tipo, desde investigar nuevas tecnologías hasta apoderarse del sistema natal de tu vecino. Al final de cada turno, un jugador puede reclamar un objetivo público y un objetivo secreto. A medida que avanza la partida, se revelan más de estos objetivos y se reparten más objetivos secretos, lo que proporciona a los jugadores metas que cambian dinámicamente a lo largo de la partida. La partida continúa hasta que un jugador alcanza los diez puntos de victoria. —Descripción del editor
