        - article [ref=e9810]:
          - link "Sagrada — Disponible" [ref=e9811] [cursor=pointer]:
            - /url: /ludoteca/juegos/sagrada
            - generic [ref=e9813]:
              - generic [ref=e9814]: "7.5"
              - heading "Sagrada" [level=3] [ref=e9815]
              - paragraph [ref=e9816]: Selecciona los dados y utiliza las herramientas propias del oficio en «Sagrada» para construir con esmero tu obra maestra de vitral. Más concretamente, cada jugador crea un vitral colocando una cuadrícula de dados en su tablero de jugador. Cada tablero tiene ciertas restricciones sobre qué color o tono (valor) de dado se puede colocar en cada casilla. Los dados del mismo tono o color nunca pueden colocarse uno al lado del otro. Los dados se eligen por orden de juego, y el jugador inicial va rotando en cada ronda, volviendo al principio una vez que el último jugador haya elegido dos dados. La puntuación varía en cada partida en función de la consecución de diversos patrones y formas de colocación...así como puntos extra por los tonos oscuros de un color concreto relacionado con un objetivo oculto. Se pueden utilizar herramientas especiales que te permiten saltarte las reglas a cambio de fichas de habilidad; una vez utilizada una herramienta, los demás jugadores necesitarán más fichas de habilidad para poder usarla. ¡Gana el artesano de vitrales que consiga la puntuación más alta!
