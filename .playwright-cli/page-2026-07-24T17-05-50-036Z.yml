        - article [ref=e6529]:
          - link "Coloretto — Disponible" [ref=e6530] [cursor=pointer]:
            - /url: /ludoteca/juegos/coloretto
            - generic [ref=e6532]:
              - generic [ref=e6533]: "7.0"
              - heading "Coloretto" [level=3] [ref=e6534]
              - paragraph [ref=e6535]: "La mecánica de juego de Coloretto es sencilla: puedes robar una carta para colocarla en una fila, o bien coger una fila de cartas para añadirlas a tu colección. Una fila puede tener como máximo tres cartas, por lo que, en algún momento, todos se ven obligados a coger una fila. Una vez que se han cogido todas las filas, los jugadores comienzan una nueva ronda, robando o cogiendo de nuevo. ¿Qué intentas conseguir con estas cartas? Reunir grandes conjuntos, pero solo en tres colores, ya que cada color que supere el tercero te restará puntos. Los comodines son muy apreciados, ya que siempre encajan con lo que necesitas, y las cartas +2 te garantizan puntos, lo que te ofrece un plan B si las cosas se tuercen en cuanto a los colores que estás reuniendo. Cuando solo quedan unas pocas cartas en el mazo, la ronda termina y todos calculan su puntuación, eligiendo tres colores de cartas para sumar puntos positivos, mientras que cualquier otro color cuenta en tu contra. Cada color se puntúa utilizando un sistema de números triangulares: la primera carta de un color vale ±1 punto, la segunda ±2 puntos, y así sucesivamente. ¡Gana el jugador con la puntuación más alta! Algunas versiones de Coloretto incluyen una variante para dos jugadores, cuyo único cambio es que en las filas solo se pueden colocar entre 1 y 3 cartas, dependiendo de los iconos que aparezcan en las cartas de fila. La versión nórdica incluye las expansiones: «Coloretto: Las cartas extra», «Coloretto: Las cartas límite» y «Coloretto para dos jugadores»."
              - list [ref=e6536]:
                - listitem [ref=e6537]: 8+
                - listitem [ref=e6541]: 30min
