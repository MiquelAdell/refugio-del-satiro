        - article [ref=e6483]:
          - link "Codi secret — Disponible" [ref=e6484] [cursor=pointer]:
            - /url: /ludoteca/juegos/codi-secret
            - generic [ref=e6486]:
              - generic [ref=e6487]: "7.5"
              - heading "Codi secret" [level=3] [ref=e6488]
              - paragraph [ref=e6489]: "Dos jefes de espionaje rivales conocen las identidades secretas de 25 agentes. Sus compañeros de equipo solo conocen a los agentes por sus nombres en clave: etiquetas de una sola palabra como «enfermedad», «Alemania» y «zanahoria». Sí, «zanahoria». Es un nombre en clave válido. Cada jefe de espías quiere que su equipo identifique a sus agentes primero… sin descubrir al asesino por error. En Codenames, dos equipos compiten para ver quién consigue contactar primero con todos sus agentes. Coloca 25 cartas, cada una con una sola palabra. Los jefes de espionaje miran una carta que muestra la identidad de cada agente y, a continuación, se turnan para dar pistas a sus compañeros de equipo. Una pista consiste en una sola palabra y un número, donde el número indica cuántas cartas en juego guardan alguna relación con la palabra dada como pista. A continuación, los compañeros de equipo identifican a un agente que creen que pertenece a su equipo; si aciertan, pueden seguir adivinando hasta una vez más del número indicado; si el agente pertenece al equipo contrario o es un inocente, el turno del equipo termina; y si han señalado al asesino, pierden la partida. Los jefes de espías siguen dando pistas hasta que un equipo haya identificado a todos sus agentes o el asesino haya eliminado a un equipo del juego."
              - list [ref=e6490]:
                - listitem [ref=e6491]: 10+
                - listitem [ref=e6495]: 15min
                - listitem [ref=e6499]: 2-8
              - generic [ref=e6505]: Fiesta
        - article [ref=e6506]:
          - 'link "Código Secreto: Dúo — Disponible" [ref=e6507] [cursor=pointer]':
            - /url: /ludoteca/juegos/codigo-secreto-duo
            - generic [ref=e6509]:
              - generic [ref=e6510]: "7.4"
              - 'heading "Código Secreto: Dúo" [level=3] [ref=e6511]'
              - paragraph [ref=e6512]: Codenames Duet conserva los elementos básicos de Codenames —dar pistas de una sola palabra para intentar que alguien identifique a tus agentes entre los que hay sobre la mesa—, pero ahora trabajáis juntos como un equipo para encontrar a todos vuestros agentes. (¡El motivo por el que aún no sabes quiénes son tus agentes es una pregunta por la que los investigadores del Congreso te presionarán más adelante!) Para preparar la partida, coloca 25 cartas de palabras en una cuadrícula de 5×5. Coloca una carta clave en el soporte de manera que cada jugador vea una de las caras de la carta. Cada jugador ve una cuadrícula de 5×5 en la carta, con nueve casillas de color verde (que representan a tus agentes) y tres casillas de color negro (que representan a los asesinos). Tres de las nueve casillas de cada lado también son verdes por el otro lado; un asesino es negro por ambos lados; otro es verde por el otro lado; y el último es un transeúnte inocente por el otro lado. En conjunto, debéis descubrir a los quince agentes —sin descubrir a ningún asesino— antes de que se acabe el tiempo para ganar la partida. Cualquiera de los jugadores puede decidir dar la primera pista de una sola palabra al otro jugador, junto con un número. Quien reciba la pista coloca un dedo sobre una carta para identificar a ese agente. Si acierta, puede intentar identificar a otro. Si identifica a un transeúnte, su turno de adivinar termina. Si identifica a un asesino, ¡ambos perdéis! A diferencia del «Codenames» normal, pueden seguir adivinando siempre que identifiquen a un agente cada vez; esto resulta útil para volver a pistas anteriores y encontrar aquellas que se les habían pasado por alto. Una vez dada la primera pista, los jugadores se turnan para dar pistas.
              - list [ref=e6513]:
