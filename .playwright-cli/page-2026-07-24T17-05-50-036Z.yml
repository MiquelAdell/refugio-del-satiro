        - article [ref=e5747]:
          - link "Alhambra — Disponible" [ref=e5748] [cursor=pointer]:
            - /url: /ludoteca/juegos/alhambra
            - generic [ref=e5750]:
              - generic [ref=e5751]: "7.0"
              - heading "Alhambra" [level=3] [ref=e5752]
              - paragraph [ref=e5753]: "Granada, 1278. A los pies de la Sierra Nevada, da comienzo uno de los proyectos más apasionantes e interesantes de la Edad Media española: la construcción de la ALHAMBRA. Los mejores maestros de obras de toda Europa y Arabia quieren demostrar su destreza. Contrata a los equipos de constructores más adecuados y asegúrate de disponer siempre de la moneda adecuada en cantidad suficiente. Porque, ya sean canteros del norte o jardineros del sur, todos quieren un salario digno e insisten en cobrar en su moneda «nativa». Con su ayuda se pueden construir torres, diseñar jardines, erigir pabellones y arcadas, y levantar serraglios y aposentos. En Alhambra, los jugadores adquieren edificios para colocarlos dentro de su complejo de la Alhambra. El dinero en Alhambra se presenta en cuatro monedas diferentes y está disponible en el mercado monetario abierto. Los 54 edificios de seis tipos distintos se ponen a la venta en el mercado de edificios de cuatro en cuatro; hay un edificio disponible en cada una de las cuatro monedas diferentes. En su turno, un jugador puede: 1) retirar dinero del mercado monetario abierto, 2) comprar un edificio en el mercado de edificios y colocarlo en su Alhambra o en su reserva, o 3) emprender proyectos de construcción y reconstrucción con edificios que se hayan colocado en su Alhambra o en su reserva. El juego premia la eficiencia, ya que cuando un jugador compra un edificio del mercado por el importe exacto, puede jugar otro turno. Los jugadores que tengan más edificios de cada uno de los seis tipos de edificios en su Alhambra obtienen puntos en cada una de las fases de puntuación, y se otorgan puntos por el tramo de «muro» exterior más largo que los jugadores tengan dentro de su complejo. El juego termina cuando el mercado de edificios ya no puede reponerse con la reserva de fichas de edificios, y se realiza una puntuación final, tras la cual gana el jugador con la puntuación más alta."
              - list [ref=e5754]:
                - listitem [ref=e5755]: 8+
                - listitem [ref=e5759]: 60min
                - listitem [ref=e5763]: 2-6
              - generic [ref=e5769]: Familiar
        - article [ref=e5770]:
          - link "Alquimistas — Disponible" [ref=e5771] [cursor=pointer]:
            - /url: /ludoteca/juegos/alquimistas
            - generic [ref=e5773]:
              - generic [ref=e5774]: "7.6"
              - heading "Alquimistas" [level=3] [ref=e5775]
              - paragraph [ref=e5776]: "En «Alchemists», entre dos y cuatro alquimistas en ciernes compiten por descubrir los secretos de su arte místico. Se pueden ganar puntos de diversas formas, pero la mayoría se obtienen publicando teorías —teorías correctas, claro está— y ahí radica el problema. El juego se desarrolla en seis rondas. Al comienzo de cada ronda, los jugadores eligen su orden de juego. Quienes eligen jugar más tarde obtienen mayores recompensas. Los jugadores anuncian todas sus acciones colocando cubos en las distintas casillas de acción; a continuación, cada casilla de acción se evalúa por orden. Los jugadores adquieren conocimientos mezclando ingredientes y comprobando los resultados mediante una aplicación para smartphone (iOS, Android y también Windows) que genera aleatoriamente las reglas de la alquimia para cada nueva partida. Y si los alquimistas anhelan algo aún más especial, siempre pueden comprar artefactos mágicos para obtener un empujón extra. Hay nueve de ellos (diferentes en cada partida) y no solo son muy poderosos, sino también muy caros. ¡Pero el dinero no significa nada cuando está en juego el orgullo académico! Además, poseer estos artefactos sin duda te reportará algo de reputación. Los jugadores también pueden ganar dinero vendiendo pociones de calidad dudosa a los aventureros, pero el dinero no es más que un medio para alcanzar un fin. Al fin y al cabo, los alquimistas no buscan riquezas. Quieren respeto, y el respeto suele venir de la publicación de teorías. Durante la partida, la reputación de los jugadores subirá y bajará. Tras seis rondas y una exhibición final, la reputación se convertirá en puntos. También se obtendrán puntos por los artefactos y las subvenciones. A continuación, se revelan los secretos de la alquimia y los jugadores ganan o pierden puntos en función de si sus teorías eran correctas. Quien tenga más puntos al final de la partida gana. Texto atmosférico: Raíz de mandrágora y cola de escorpión; seta esponjosa y sapo verrugoso: estos son los pilares del sustento, la ciencia y el arte del alquimista. Pero, ¿qué secretos arcanos esconden estos extraños ingredientes? Ha llegado el momento de descubrirlo. Mézclalos para crear pociones y bébetelas para determinar sus efectos… ¡o ve a lo seguro y prueba el brebaje en un asistente servicial! Amasa una fortuna vendiendo pociones a aventureros errantes e invierte esa riqueza en poderosos artefactos. A medida que tu conocimiento crezca, también lo hará tu reputación, al publicar tus teorías para que todos las vean. El conocimiento, la riqueza y la fama se encuentran en las turbias profundidades del caldero del alquimista."
              - list [ref=e5777]:
                - listitem [ref=e5778]: 12+
                - listitem [ref=e5782]: 120min
                - listitem [ref=e5786]: 2-4
              - generic [ref=e5792]: Estrategia
        - article [ref=e5793]:
          - link "Anarchy Pancakes — Disponible" [ref=e5794] [cursor=pointer]:
            - /url: /ludoteca/juegos/anarchy-pancakes
            - generic [ref=e5796]:
              - generic [ref=e5797]: "5.6"
              - heading "Anarchy Pancakes" [level=3] [ref=e5798]
              - paragraph [ref=e5799]: En el trepidante juego de emparejar «Anarchy Pancakes», cada jugador empieza con siete cartas de tortitas que muestran diversos ingredientes poco habituales, como una lombriz, una rosquilla en llamas y una calavera con un gorro de fiesta. A la cuenta de tres, los jugadores intentan emparejar los ingredientes de sus cartas de tortitas con los de otros jugadores, obligándoles a quedarse con las cartas y formar una «pila de tortitas». El primer jugador que se deshaga de todas sus cartas y grite «¡Anarchy Pancakes!» gana esa ronda y se lleva una «porción de mantequilla». El primer jugador que consiga dos «trozos de mantequilla» gana. Las cartas de «Anarchy Pancakes» se parecen a las de «Spot it!»/«Dobble», y «Exploding Kittens» ha desarrollado este diseño en colaboración con Zygomatic Games, la editorial de «Spot it!».
              - list [ref=e5800]:
