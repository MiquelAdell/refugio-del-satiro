        - article [ref=e9193]:
          - link "Paella Park — Disponible" [ref=e9194] [cursor=pointer]:
            - /url: /ludoteca/juegos/paella-park
            - generic [ref=e9196]:
              - generic [ref=e9197]: "7.7"
              - heading "Paella Park" [level=3] [ref=e9198]
              - paragraph [ref=e9199]: "¡Bienvenidos a Paella Park, el parque de atracciones más famoso de Valencia! Subid a la noria con forma de paella, esquivad a los zombis e intentad haceros una foto con la escurridiza Reina de los Zombis. Disfrutad al máximo de estas 8 horas antes de los fuegos artificiales de cierre. Planifica tu ruta, evita las aglomeraciones, disfruta de algunos espectáculos y ¡prepárate para pasártelo en grande! Paella Park es uno de los primeros juegos sobre parques temáticos en los que los jugadores no tienen que gestionar el parque, ¡sino visitarlo! El juego se desarrolla por turnos y dura 4 rondas, que representan 8 horas en el parque de atracciones. Gana el jugador con la puntuación más alta. El juego no se desarrolla en sentido horario ni antihorario. En cada turno, primero identificarás al jugador activo mirando la zona de espera. Los jugadores solo pueden realizar UNA ACCIÓN por turno. Cada acción consume tiempo y existen diferentes estrategias para ganar puntos. Las acciones disponibles incluyen: pasear por el parque, montarse en las atracciones, ver espectáculos, acudir a los servicios de atención al visitante, ir de compras, hacerse fotos con la mascota del parque, etc. La mayoría de estas acciones requieren planificar un desplazamiento eficiente de un punto a otro y asumir riesgos con mecánicas de «tentar a la suerte». El juego incluye una ruleta de la paella en 3D que los jugadores deben girar cuando visitan atracciones y espectáculos. —Descripción del diseñador"
              - list [ref=e9200]:
