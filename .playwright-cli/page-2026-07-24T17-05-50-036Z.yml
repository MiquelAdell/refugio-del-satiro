              - generic [ref=e6924]: "7.3"
              - heading "Downforce" [level=3] [ref=e6925]
              - paragraph [ref=e6926]: "Apuestas de alto riesgo por coches de carreras que valen millones de dólares. Apuestas frenéticas realizadas en secreto incluso mientras los coches recorren el circuito. Y para el vencedor, el mayor premio de todos. Pero en el mundo del automovilismo, la diferencia entre la victoria y la derrota puede reducirse a un solo instante: una curva peraltada y pronunciada, los neumáticos chirriando y echando humo, y la carga aerodinámica, que te clava en el asiento y te mantiene en la pista mientras te abres paso por el interior para adelantar. Downforce es un juego de subastas, carreras y apuestas basado en cartas, para entre 2 y 6 jugadores, inspirado en Top Race, el galardonado diseño del legendario Wolfgang Kramer. Los jugadores primero pujan para hacerse con los seis coches de la carrera y, a continuación, juegan cartas de su mano para hacerlos circular por la pista. Sin embargo, la mayoría de las cartas también moverán los coches de sus oponentes. Por eso, averiguar cuál es el momento adecuado para jugar una carta es la clave de la victoria. A lo largo de la partida, los jugadores realizan apuestas secretas sobre quién creen que ganará la carrera. Gana quien tenga más dinero procedente de los premios, las apuestas ganadas y el saldo restante. Se trata de un juego cuyo diseño no necesitaba ningún retoque. Años de juego y múltiples versiones lo han perfeccionado hasta casi la perfección. Por el contrario, uno de los retos de diseño fue decidir cuáles de los numerosos módulos de reglas incorporar para crear la versión más divertida. Downforce también añade poderes variables para los jugadores con el fin de mejorar la rejugabilidad. Pero, sobre todo, mejora el aspecto del juego para que resulte atractivo y fácil de jugar. Se prestó especial atención a los colores, la disposición de las cartas, el diseño de los coches, los detalles del tablero y mucho más."
              - list [ref=e6927]:
                - listitem [ref=e6928]: 10+
                - listitem [ref=e6932]: 40min
                - listitem [ref=e6936]: 2-6
              - generic [ref=e6942]: Familiar
        - article [ref=e6943]:
          - link "Dragonkeepers — Disponible" [ref=e6944] [cursor=pointer]:
            - /url: /ludoteca/juegos/dragonkeepers
            - generic [ref=e6946]:
              - generic [ref=e6947]: "7.1"
              - heading "Dragonkeepers" [level=3] [ref=e6948]
              - paragraph [ref=e6949]: Cualquiera puede pastorear ovejas, pero ¿alguna vez has pastoreado dragones? En Dragonkeepers, competís entre vosotros como magos. Dos pilas de cartas forman el «Libro mágico», que indica qué dragones y cuántos se pueden pastorear. Con cada carta que se roba, esta información cambia, pero, por suerte, puedes lanzar hechizos y devolver tus cartas al Libro mágico para cambiarla a tu favor y sumar puntos. Pero, ¿a cuál de tus dragones puedes sacrificar para lanzar hechizos?
              - list [ref=e6950]:
