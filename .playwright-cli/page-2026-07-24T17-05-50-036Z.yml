        - article [ref=e7012]:
          - link "Dungeon Raiders — Disponible" [ref=e7013] [cursor=pointer]:
            - /url: /ludoteca/juegos/dungeon-raiders
            - generic [ref=e7015]:
              - generic [ref=e7016]: "6.6"
              - heading "Dungeon Raiders" [level=3] [ref=e7017]
              - paragraph [ref=e7018]: ¡Únete a un valiente grupo de aventureros! ¡Explora una mazmorra llena de monstruos, trampas y tesoros! En Dungeon Raiders, cada jugador asume el papel de un aventurero diferente. Tendréis que colaborar para sobrevivir en la mazmorra, ¡pero solo uno de vosotros conseguirá salir con el mayor tesoro y ganar la partida! La mazmorra es diferente cada vez que juegáis, lo que os ofrece nuevas sorpresas mientras recogéis tesoros, activáis trampas y lucháis contra horribles monstruos.
              - list [ref=e7019]:
                - listitem [ref=e7020]: 8+
                - listitem [ref=e7024]: 60min
                - listitem [ref=e7028]: 3-5
              - generic [ref=e7034]: Temático
        - article [ref=e7035]:
          - 'link "Eclipse: New Dawn for the Galaxy — Disponible" [ref=e7036] [cursor=pointer]':
            - /url: /ludoteca/juegos/eclipse-new-dawn-for-the-galaxy
            - generic [ref=e7038]:
              - generic [ref=e7039]: "7.8"
              - 'heading "Eclipse: New Dawn for the Galaxy" [level=3] [ref=e7040]'
              - paragraph [ref=e7041]: La galaxia ha sido un lugar pacífico durante muchos años. Tras la despiadada Guerra entre los Terranos y la Hegemonía (30.027–33.364), todas las principales especies con capacidad espacial han dedicado grandes esfuerzos a evitar que se repitan aquellos terribles acontecimientos. El Consejo Galáctico se creó para hacer cumplir esta preciada paz, y se han llevado a cabo numerosas y valientes iniciativas para evitar la escalada de actos maliciosos. Sin embargo, la tensión y la discordia van en aumento entre las siete especies principales y en el propio Consejo. Las antiguas alianzas se están desmoronando y se firman en secreto tratados diplomáticos precipitados. Un enfrentamiento entre las superpotencias parece inevitable; solo queda por ver cuál será el desenlace del conflicto galáctico. ¿Qué facción saldrá victoriosa y gobernará la galaxia? En el juego Eclipse, te pones al mando de una vasta civilización interestelar que compite por el éxito con sus rivales. Explorarás nuevos sistemas estelares, investigarás tecnologías y construirás naves espaciales con las que librar la guerra. Hay muchos caminos posibles hacia la victoria, por lo que deberás planificar tu estrategia en función de los puntos fuertes y débiles de tu especie, sin perder de vista los movimientos de las demás civilizaciones. Las sombras de las grandes civilizaciones están a punto de eclipsar la galaxia. ¡Lleva a tu pueblo a la victoria!
              - list [ref=e7042]:
                - listitem [ref=e7043]: 14+
                - listitem [ref=e7047]: 180min
                - listitem [ref=e7051]: 2-6
              - generic [ref=e7057]: Estrategia
        - article [ref=e7058]:
          - 'link "El Desierto Prohibido: la ciudad bajo las dunas — Disponible" [ref=e7059] [cursor=pointer]':
            - /url: /ludoteca/juegos/el-desierto-prohibido-la-ciudad-bajo-las-dunas
            - generic [ref=e7061]:
              - generic [ref=e7062]: "7.1"
              - 'heading "El Desierto Prohibido: la ciudad bajo las dunas" [level=3] [ref=e7063]'
              - paragraph [ref=e7064]: Prepárate para una emocionante aventura en la que deberás recuperar una legendaria máquina voladora enterrada en lo más profundo de las ruinas de una antigua ciudad del desierto. Tendrás que coordinarte con tus compañeros de equipo y aprovechar todos los recursos disponibles si quieres sobrevivir al calor abrasador y a la implacable tormenta de arena. ¡Encuentra la máquina voladora y escapa antes de que todos os convirtáis en artefactos permanentes del desierto prohibido! En «Forbidden Desert», una secuela temática de «Forbidden Island», los jugadores asumen el papel de valientes aventureros que deben dejar a un lado la precaución y sobrevivir tanto al calor abrasador como a la arena arremolinada para recuperar una legendaria máquina voladora enterrada bajo una antigua ciudad del desierto. Aunque presenta una mecánica de juego cooperativa similar a la de «Forbidden Island», «Forbidden Desert» es un juego nuevo y original basado en un conjunto innovador de mecanismos, como un tablero en constante cambio, la gestión individual de recursos y un método único para localizar las piezas de la máquina voladora.
              - list [ref=e7065]:
