        - article [ref=e9879]:
          - link "SCAPE — Disponible" [ref=e9880] [cursor=pointer]:
            - /url: /ludoteca/juegos/scape
            - generic [ref=e9882]:
              - generic [ref=e9883]: "5.9"
              - heading "SCAPE" [level=3] [ref=e9884]
              - paragraph [ref=e9885]: "SCAPE es un juego basado en un intento de fuga de prisioneros de guerra británicos y de la Commonwealth del Stalag Luft III (un campo de prisioneros de guerra alemán) durante la Segunda Guerra Mundial. ¿Podrán escapar los prisioneros británicos y de la Commonwealth? ¿Solo uno de ellos? ¿Ninguno? Durante la partida, los jugadores deben jugar cartas para construir el túnel o realizar la acción indicada en la carta con el fin de averiguar quién es quién. Por turnos, el jugador activo debe jugar una carta (si es posible) y pasar el turno hasta que se hayan jugado todas las cartas de la partida. Hay dos formas de jugar las cartas: 1) BOCAS ABAJO: Coloca una carta de túnel en el centro de la mesa para completar la palabra «SCAPE». Si ya se ha jugado de esta forma otra carta con la misma letra, debes colocarla encima. 2) BOCA ARRIBA: Realiza la acción indicada en la carta y, a continuación, descártala, mostrando la letra y la identidad de la carta. Termina tu turno robando cartas hasta tener cuatro (si es posible); a continuación, el jugador a tu derecha pasa a ser el activo. Cuando se hayan jugado todas las cartas, se revela la primera carta de cada pila de túnel. Si la palabra «SCAPE» no está completa, el jugador «SS» gana la partida. Si hay alguna carta con la identidad «SS» revelada en cualquier pila, el jugador «SS» gana; de lo contrario, gana el equipo (RAF/USAF) que tenga más pilas con su afiliación."
