            - generic [ref=e9491]:
              - generic [ref=e9492]: "7.3"
              - heading "PitchCar" [level=3] [ref=e9493]
              - paragraph [ref=e9494]: "Esta ficha de juego hace referencia a dos juegos casi idénticos que no son compatibles entre sí. A partir de 6 años. PitchCar y Carabande son juegos de destreza en los que se utilizan piezas grandes de madera, similares a las de un rompecabezas, para construir un circuito que, una vez terminado, se parece mucho a una pista de coches de slot. Pero, en lugar de electricidad, los jugadores utilizan el movimiento de los dedos para hacer rodar pequeños discos por la pista, al estilo del Carrom. Contenido: Ocho discos de coche Un disco «separador» negro Seis rectas Diez curvas de 90 grados Piezas de riel para rectas y curvas Una pegatina de línea de salida/meta Una hoja de reglas con diseños de pista sugeridos Un bloc de puntuación Carabande fue producido por Goldsieber y solo contó con una única expansión: el «Action Set». Ambos están actualmente descatalogados. También se produjo una edición especial «Audi», titulada «Rennspiel-Action». En la galería de fotos de BGG, Carabande tiene raíles de color amarillo/naranja. Ampliado por: Carabande Action Set PitchCar es un juego producido por Ferti. Actualmente cuenta con nueve expansiones que añaden curvas «cerradas», cruces, pequeños saltos, largas rectas, curvas de 45 grados, cuellos de botella curvos, bucles y un adaptador que permite combinar PitchCar y PitchCar Mini. Al parecer, PitchCar también cuenta con dos ediciones: la primera tiene el laminado negro en la parte superior e inferior de las piezas de la pista, mientras que la segunda solo lo tiene en la parte superior. En la galería de fotos de BGG, PitchCar tiene raíles rojos. Ampliado por: Ampliación de PitchCar Ampliación de PitchCar 2 Ampliación de PitchCar 3: Rectas largas especiales Ampliación de PitchCar 4: Carrera de acrobacias Ampliación de PitchCar 5: La Cruz Ampliación de PitchCar 6: Sin límites Ampliación de PitchCar 7: El bucle Ampliación de PitchCar: El Upsilon Ampliación de PitchCar: El adaptador Reimplementado por: PitchCar Mini"
