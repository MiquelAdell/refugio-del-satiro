        - article [ref=e8480]:
          - link "Los Pilares de la Tierra — Disponible" [ref=e8481] [cursor=pointer]:
            - /url: /ludoteca/juegos/los-pilares-de-la-tierra
            - generic [ref=e8483]:
              - generic [ref=e8484]: "7.3"
              - heading "Los Pilares de la Tierra" [level=3] [ref=e8485]
              - paragraph [ref=e8486]: "«Die Säulen der Erde» / «Los pilares de la Tierra» se basa en la novela superventas de Ken Follett y en el juego de 2006 de la línea Kosmos de juegos basados en obras literarias. A principios del siglo XIII, comienza la construcción de la catedral más grande y hermosa de Inglaterra. Los jugadores son constructores que intentan contribuir al máximo a la construcción de esta catedral y, al hacerlo, conseguir el mayor número de puntos de victoria. La mecánica del juego consiste, a grandes rasgos, en utilizar obreros para producir materias primas y, a continuación, emplear a artesanos para convertir esas materias en puntos de victoria. Los obreros también pueden utilizarse para producir oro, la moneda del juego. Los jugadores también disponen de tres maestros de obras en cada turno, cada uno de los cuales puede realizar diversas tareas, como reclutar más trabajadores, comprar o vender mercancías, o simplemente obtener puntos de victoria. Tomar decisiones tempranas con un maestro de obras cuesta oro, al igual que la compra de mejores artesanos. Los jugadores deben encontrar un equilibrio entre ganar oro para financiar sus compras y obtener puntos de victoria. Ampliado por: El juego de expansión «Los pilares de la Tierra» (que incluye las cartas de expansión en algunas ediciones) «Los pilares de la Tierra: Cartas de expansión» (que se incluyen en el juego de expansión en algunas ediciones)"
              - list [ref=e8487]:
                - listitem [ref=e8488]: 12+
                - listitem [ref=e8492]: 120min
                - listitem [ref=e8496]: 2-4
              - generic [ref=e8502]: Estrategia
        - article [ref=e8503]:
          - link "Love Letter — Disponible" [ref=e8504] [cursor=pointer]:
            - /url: /ludoteca/juegos/love-letter
            - generic [ref=e8506]:
              - generic [ref=e8507]: "7.5"
              - heading "Love Letter" [level=3] [ref=e8508]
              - paragraph [ref=e8509]: La noble princesa busca una pareja ideal y un confidente que la ayude con sus obligaciones reales cuando, algún día, asuma el trono. Debes demostrar tu valía y ganarte su confianza reclutando a aliados, amigos y familiares de la princesa para que le entreguen una carta de intenciones. ¿Podrás ganarte la confianza de la princesa y convertirte en su confidente? Jugando cartas de una en una, los jugadores de Love Letter utilizan las habilidades de estas personas clave en la vida de la princesa para burlar a sus oponentes, entregar con éxito su carta y ganarse su favor. Los jugadores deben utilizar la habilidad especial de cada personaje para evitar ser descubiertos y entregar con éxito su carta a la princesa. Una vez que se haya conseguido un número determinado de fichas de favor, ese jugador gana y se convierte en el confidente de la princesa. Esta edición de 2019 de Love Letter incluye nuevas ilustraciones del artista de Citadels, Andrew Bosley, fichas serigrafiadas y dos nuevos personajes (cinco cartas en total) que permiten partidas de hasta seis jugadores. Cuando se juega, el Canciller (valor 6) te permite robar dos cartas nuevas, añadirlas a tu mano y, a continuación, colocar dos cartas de tu elección en el fondo del mazo. El Espía (valor 0) te hace ganar una ficha de favor si has sido el único jugador en jugar o descartar un espía durante la ronda. Esta edición de 2025 de Love Letter incluye las ilustraciones del artista de Citadels, Andrew Bosley, fichas serigrafiadas y los dos personajes de 2019 (cinco cartas en total), lo que permite partidas de hasta seis jugadores. —Descripción del editor
              - list [ref=e8510]:
                - listitem [ref=e8511]: 10+
                - listitem [ref=e8515]: 20min
                - listitem [ref=e8519]: 2-6
              - generic [ref=e8525]: Fiesta
        - article [ref=e8526]:
          - link "Lutier — Disponible" [ref=e8527] [cursor=pointer]:
            - /url: /ludoteca/juegos/lutier
            - generic [ref=e8529]:
              - generic [ref=e8530]: "8.2"
              - heading "Lutier" [level=3] [ref=e8531]
              - paragraph [ref=e8532]: «Luthier» transporta a los jugadores a la época dorada de la música clásica en Europa Occidental, cuando el arte de la fabricación de instrumentos era defendido por igual por hábiles artesanos, mecenas nobles, intérpretes virtuosos y compositores famosos como Bach, Mozart y Beethoven. Mediante una combinación nueva y única de pujas ocultas y colocación de trabajadores, los jugadores gestionan recursos para fabricar diversos instrumentos musicales en su taller, al tiempo que se ganan el favor de mecenas históricos reales a través de un tablero personal de acciones y bonificaciones en constante cambio. Cada jugador decide cómo equilibrar la mejora de sus habilidades en múltiples vías, desbloqueando habilidades especializadas de los trabajadores y otras bonificaciones. La decisión de centrarse en diferentes estrategias y objetivos de juego —como las actuaciones musicales, la construcción y reparación de instrumentos, la formación de aprendices y la ampliación del taller, así como la reputación general como fabricante de instrumentos— ofrece múltiples caminos hacia la victoria. Luthier alcanza la verdadera armonía gracias a una combinación auténtica y original de temática y mecánica de juego, lo que da como resultado una rica experiencia de juego que atrae por igual tanto a los aficionados a los juegos estratégicos como a los amantes de la música clásica. —Descripción del editor
