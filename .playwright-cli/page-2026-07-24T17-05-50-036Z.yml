        - article [ref=e8043]:
          - link "Kingsport Festival — Disponible" [ref=e8044] [cursor=pointer]:
            - /url: /ludoteca/juegos/kingsport-festival
            - generic [ref=e8046]:
              - generic [ref=e8047]: "6.7"
              - heading "Kingsport Festival" [level=3] [ref=e8048]
              - paragraph [ref=e8049]: "Aquella columna de llamas brotaba con fuerza volcánica. La combustión no desprendía calor, sino solo la humedad pegajosa de la muerte y la putrefacción. – «El Festival», H. P. Lovecraft, 1923 En la oscuridad inimaginable de Kingsport, unos errantes silenciosos son convocados a una celebración profana. Su objetivo: ¡invocar horrores inconcebibles! Un terror espantoso que no es de este mundo ni de ningún otro —sino más bien de los espacios entre las estrellas— exige tu sumisión. Mientras tanto, unos investigadores incautos intentan en vano detener este espantoso capítulo de la oscura historia de Arkham. Como sumo sacerdote de uno de estos cultos sombríos, debes dominar la ciudad. Invocarás a criaturas cósmicas y dioses impíos para recibir sus «dones», pero deberás tener cuidado de preservar tu cordura y frustrar los planes de los investigadores que intentan detenerte. Esta vez, vosotros sois los malos. ¿Por qué conformarse con el mal menor? Kingsport Festival, un juego de cultos extraños ambientado en el aterrador mundo de Howard Phillips Lovecraft, dura 12 rondas, cada una dividida en seis fases. Todos los cultistas lanzan sus dados y el que haya obtenido la suma más baja jugará primero, y así sucesivamente; a continuación (por orden de turno), cada uno puede invocar a un Dios Antiguo utilizando uno o más de sus dados, siempre que la suma de sus valores sea exactamente igual al número del Dios Antiguo, o bien pasar. Una vez colocados todos los dados o cuando los jugadores hayan pasado, en orden ascendente, los Dioses Antiguos otorgan sus dones a los cultistas que los han invocado: es posible que los cultistas tengan que perder puntos de cordura para recibir las recompensas. Una vez que los cultistas hayan recuperado sus dados, por orden de turno, cada uno podrá colocar su disco en un edificio que esté conectado con otro que ya haya marcado (empezando por la Casa). Para ello, deberá pagar los recursos del dominio necesarios. En los turnos marcados con un marcador azul en el calendario, tiene lugar una incursión: primero se revela la carta de Evento y luego la carta de Investigador. Cada cultista calcula su Fuerza sumando los modificadores que tenga debido a hechizos, edificios y otros efectos del juego (como eventos, escenarios, etc.). Si su fuerza es mayor, el cultista recibe recompensas; si es menor, sufre la penalización. La partida finaliza tras disputarse la duodécima ronda. Si el escenario incluye una carta de Festival, se revela y se resuelven sus efectos en ese momento. El cultista que tenga más puntos de culto es el ganador."
              - list [ref=e8050]:
                - listitem [ref=e8051]: 12+
                - listitem [ref=e8055]: 90min
                - listitem [ref=e8059]: 3-5
              - generic [ref=e8065]: Temático
        - article [ref=e8066]:
          - link "Kitty Paw — Disponible" [ref=e8067] [cursor=pointer]:
            - /url: /ludoteca/juegos/kitty-paw
            - generic [ref=e8069]:
              - generic [ref=e8070]: "5.8"
              - heading "Kitty Paw" [level=3] [ref=e8071]
              - paragraph [ref=e8072]: "¿Qué pasa cuando siete gatos se topan con unas cajas de cartón? ¡Pues un juego de escondite felino de lo más alocado! Kitty Paw es un juego de destreza y reacción. Los jugadores intentan ser los primeros en completar las combinaciones de gatitos que aparecen en las cartas de gatito para sumar puntos de victoria (PV). El jugador con más PV al final gana. Cada jugador recibe una carta de gatito en cada ronda e intenta ser el primero en crear los patrones que aparecen en las cartas. Dado que se trata de un juego de reconocimiento y reacción, todos los jugadores actúan al mismo tiempo. Más en detalle: Todos los jugadores ponen una mano en el centro de la mesa y gritan «¡Kitty Paw!» para dar comienzo al juego. Cada jugador coge una carta de gatito de la fila y la coloca delante de sí. A continuación, los jugadores cogen fichas de Kitty del centro de la mesa y las colocan de forma que coincidan con los patrones que aparecen en su propia carta de Kitty. Utilizando solo una mano —la «Kitty Paw» que colocaron en el centro de la mesa al inicio del juego—, los jugadores cogen solo una ficha de Kitty cada vez, en lugar de coger varias fichas a la vez. Si alguna jugadora cree que ha completado el patrón de su carta de Kitty, grita «¡Miau!» y hace el gesto del «Gato de la Suerte»."
              - list [ref=e8073]:
                - listitem [ref=e8074]: 6+
                - listitem [ref=e8078]: 30min
                - listitem [ref=e8082]: 1-4
              - generic [ref=e8088]: Familiar
        - article [ref=e8089]:
          - link "Kobayakawa — Disponible" [ref=e8090] [cursor=pointer]:
            - /url: /ludoteca/juegos/kobayakawa
            - generic [ref=e8092]:
              - generic [ref=e8093]: "6.3"
              - heading "Kobayakawa" [level=3] [ref=e8094]
              - paragraph [ref=e8095]: "Kobayakawa es un juego de farol y deducción. En este nuevo y elegante juego de Jun Sasaki, los componentes se reducen al mínimo: solo hay 15 cartas, 32 fichas y el marcador de primer jugador. Las reglas son sencillas: Al comienzo, cada jugador recibe 4 fichas. Además, se colocan 8 fichas en el centro de la mesa. Las fichas sobrantes se apartan. Se baraja el mazo y se reparte una carta boca abajo a cada jugador; además, se coloca una carta boca arriba junto al mazo (esta carta se denomina «Kobayakawa»). Cada jugador juega su turno y puede: - Robar una carta para su mano y descartar una de sus dos cartas de mano, colocándola boca arriba delante de sí. O - Dar la vuelta a la carta superior del mazo para sustituir a la actual «Kobayakawa». Una vez que todos los jugadores hayan jugado su turno, cada uno debe decidir si quiere seguir en la partida y «luchar» apostando una ficha. Todos los jugadores que hayan decidido luchar revelan su carta. El jugador que tenga la carta de menor valor suma el valor de la Kobayakawa actual a su propia carta. El jugador con el número más alto (su propia carta o su propia carta más el Kobayakawa) gana la ronda y se lleva todas las fichas que los jugadores hayan apostado, además de una ficha de bonificación del centro de la mesa, y se queda con la ficha de jugador inicial para la siguiente ronda. En la séptima ronda (cuando solo quedan 2 fichas en el centro), las apuestas y la bonificación se duplican a 2 fichas. Tras esta séptima ronda, la partida finaliza y el jugador con más fichas gana la partida. Ejemplo de ronda: Kobayakawa: 8 Jugador A: 9 Jugador B: Pasa Jugador C: 15 Jugador D: 12 El jugador C tiene el valor de carta más alto (15), pero el jugador A es declarado ganador, ya que la suma de la carta más baja (9) y la de Kobayakawa (8) es 17."
              - list [ref=e8096]:
                - listitem [ref=e8097]: 9+
                - listitem [ref=e8101]: 15min
                - listitem [ref=e8105]: 3-6
              - generic [ref=e8111]: Fiesta
        - article [ref=e8112]:
          - link "La Cucaracha — Disponible" [ref=e8113] [cursor=pointer]:
            - /url: /ludoteca/juegos/la-cucaracha
            - generic [ref=e8115]:
              - generic [ref=e8116]: "6.0"
              - heading "La Cucaracha" [level=3] [ref=e8117]
              - paragraph [ref=e8118]: "¡Hay un bichito molesto en la cocina! Y no es un bicho cualquiera: ¡es un HEXBUG® nano® que corretea por el tablero de juego! Rápido, ¿puedes atraparlo en la trampa? Girando los cuchillos, tenedores y cucharas puedes dirigir al bicho hacia la trampa. Tira el dado para descubrir qué cubiertos puedes girar. Atrapa al bichito en la trampa y gana una ficha: el primer jugador que consiga 5 fichas gana la partida."
              - list [ref=e8119]:
                - listitem [ref=e8120]: 6+
                - listitem [ref=e8124]: 20min
                - listitem [ref=e8128]: 2-4
              - generic [ref=e8134]: Infantil
        - article [ref=e8135]:
          - link "La Familia Hort — Disponible" [ref=e8136] [cursor=pointer]:
            - /url: /ludoteca/juegos/la-familia-hort
            - generic [ref=e8138]:
              - generic [ref=e8139]: "7.0"
              - heading "La Familia Hort" [level=3] [ref=e8140]
              - paragraph [ref=e8141]: "¡«La Familia Hort» es un juego para toda la familia en el que tendrás que ocuparte de la granja de la abuela! La abuela Hortensia, propietaria de las tierras de una excéntrica familia de granjeros, fallece un día sin dejar testamento. Una noche, la luna se tiñe de rojo y la abuela reaparece como un fantasma para poner a prueba a sus cuatro nietos. Los visitará tres veces, siempre coincidiendo con la luna roja. Tras sus tres apariciones, quien se haya convertido en el granjero con más experiencia heredará todas sus tierras. La gestión del dinero, el agua y el abono es la clave para ganar a «La Familia Hort», y tu objetivo es tener el mayor número de puntos de experiencia tras las tres visitas de la abuela Hortensia. El juego se desarrolla en rondas, y cada ronda consta de cinco pasos determinados por la carta de ronda activa: Mercado: se roban fichas de cultivos, utensilios y animales del montón del tipo indicado. Compra: cada jugador puede comprar sucesivamente una ficha del mercado. Fertilizante: cada jugador recibe una ficha de fertilizante del banco para colocarla en sus propios cultivos o en los de sus rivales, dependiendo de la ronda en la que se juegue. Riego: los jugadores colocan una ficha de agua por cada ficha de cultivo o de animal. El agua disponible varía en función del tiempo que haga en cada ronda. Venta: los productos se venden a cambio de monedas y puntos de experiencia. Los cultivos que hayan sido regados por completo deben venderse. El fertilizante se utiliza para obtener el mayor valor de venta en este paso. El juego continúa a lo largo de las rondas hasta que aparece la tercera carta de ronda de la luna roja y, en consecuencia, la abuela Hortensia realiza su tercera visita."
              - list [ref=e8142]:
                - listitem [ref=e8143]: 8+
                - listitem [ref=e8147]: 40min
                - listitem [ref=e8151]: 2-4
              - generic [ref=e8157]: Card Game
        - article [ref=e8158]:
          - link "La Resistencia — Disponible" [ref=e8159] [cursor=pointer]:
            - /url: /ludoteca/juegos/la-resistencia
            - generic [ref=e8161]:
              - generic [ref=e8162]: "7.2"
              - heading "La Resistencia" [level=3] [ref=e8163]
              - paragraph [ref=e8164]: "El Imperio debe caer. Nuestra misión debe tener éxito. Al destruir sus bases clave, acabaremos con el poder imperial y liberaremos a nuestro pueblo. Sin embargo, hay espías infiltrados en nuestras filas, listos para sabotearnos. Debemos desenmascararlos. En cinco noches cambiaremos el curso del destino o moriremos en el intento. ¡Somos la Resistencia! La Resistencia es un juego de deducción social para grupos. Está diseñado para entre cinco y diez jugadores, dura unos 30 minutos y no hay eliminación de jugadores. La Resistencia se inspira en Mafia/Hombre Lobo, pero es único en su mecánica principal, que aumenta los recursos para tomar decisiones informadas, intensifica la interacción entre los jugadores y elimina la eliminación de jugadores. Los jugadores son o bien agentes de la Resistencia o bien espías imperiales. Durante tres a cinco rondas, deben confiar los unos en los otros para llevar a cabo misiones contra el Imperio. Al mismo tiempo, deben intentar deducir las identidades de los demás jugadores y ganarse su confianza. Cada ronda comienza con un debate. Cuando todo está listo, el líder confía una serie de planes a un número determinado de jugadores (entre los que puede incluirse a sí mismo). Todos votan si aprueban o no la asignación. Una vez aprobada, los jugadores elegidos deciden en secreto si apoyan o sabotean la misión. En función de los resultados, la misión tiene éxito (victoria de la Resistencia) o fracasa (victoria del Imperio). Cuando un equipo gana tres misiones, se lleva la partida. Corrección de las reglas: En la primera edición (compras de 2010), las reglas de la expansión debían decir: «Las partidas de 5 a 6 jugadores utilizan 7 cartas de trama; las partidas con 7 o más jugadores utilizan las 15 cartas de trama». y «...en cada ronda, el líder roba cartas de trama (1 para 5-6 jugadores, 2 para 7-8 jugadores y 3 para 9-10 jugadores)». Esto se ha corregido en las ediciones posteriores."
              - list [ref=e8165]:
                - listitem [ref=e8166]: 13+
                - listitem [ref=e8170]: 30min
                - listitem [ref=e8174]: 5-10
              - generic [ref=e8180]: Fiesta
