        - article [ref=e9101]:
          - link "Oh My Pigeons! — Disponible" [ref=e9102] [cursor=pointer]:
            - /url: /ludoteca/juegos/oh-my-pigeons
            - generic [ref=e9104]:
              - generic [ref=e9105]: "6.0"
              - heading "Oh My Pigeons!" [level=3] [ref=e9106]
              - paragraph [ref=e9107]: En «Oh My Pigeons!», un divertido juego de mesa de travesuras avícolas, los jugadores llenan sus bancos con adorables miniaturas de palomas para demostrar quién manda en el gallinero. En tu turno, utiliza tus cartas para atraer a las palomas con golosinas, robarles palomas a tus vecinos o dejarlo en manos del azar al lanzar —¿o dar un golpecito?— el dado. ¿Serás capaz de ser más astuto, jugar mejor y superar a tus amigos en el juego de las palomas? —Descripción del editor
              - list [ref=e9108]:
