        - article [ref=e6161]:
          - link "Cartagena — Disponible" [ref=e6162] [cursor=pointer]:
            - /url: /ludoteca/juegos/cartagena
            - generic [ref=e6164]:
              - generic [ref=e6165]: "6.7"
              - heading "Cartagena" [level=3] [ref=e6166]
              - paragraph [ref=e6167]: Cartagena tiene como tema la famosa fuga de la fortaleza de Cartagena, liderada por piratas en 1672. Cada jugador cuenta con un grupo de seis piratas, y el objetivo es ser el primero en lograr que los seis escapen a través del tortuoso pasadizo subterráneo que conecta la fortaleza con el puerto, donde les espera una balandra. Para mover a un pirata, debes jugar una carta de tu mano. Cada carta lleva uno de los seis símbolos (pistola, ron, loro, etc.) y, al jugar una carta, mueves a uno de tus piratas hacia delante hasta el siguiente símbolo coincidente en el túnel, saltando por encima de los símbolos coincidentes en los que ya se encuentra otro pirata. Sin embargo, la única forma de conseguir más cartas es retroceder; más concretamente, debes mover a uno de tus piratas hacia atrás hasta la primera casilla en la que haya uno o dos piratas, y al hacerlo, robas una o dos cartas. En cada turno, realizas entre 1 y 3 acciones, ya sea avanzando, retrocediendo o ambas cosas. Cuando mueves a un pirata hasta el final del recorrido, este se sube a la balandra, donde debe esperar al resto de piratas de su tripulación. Sin embargo, con cada paso hacia la victoria, dispones de cada vez menos piratas para mover en cada turno, lo que puede obligarte a realizar acciones que no deseas, ¡así que asegúrate de planificar con antelación y no quedarte con las manos vacías! Esta versión de Cartagena combina el juego básico clásico con Cartagena 2, «El Nido del Pirata» y varias variantes nuevas. El juego incluye ocho tableros de doble cara, y para jugar la partida básica solo se utilizan seis de ellos. Utiliza más tableros para una partida más larga, o menos tableros (y posiblemente menos piratas) para una partida más corta. Para reproducir «Cartagena 2», puedes dar la vuelta a tres o más de los tableros de juego para crear una ruta secundaria independiente de la primera. Ahora, al colocar piratas en la balandra, puedes usar una acción para moverla al inicio de la segunda ruta; y con dos rutas, resulta más difícil dar grandes saltos desde el inicio hasta el final. «Morgan» es una variante en la que los jugadores ahora pueden robar cartas moviendo hacia delante al pirata de un oponente, robando una o dos cartas cuando el pirata se detiene en la primera casilla que contenga uno o dos piratas; esta variante y todas las demás se pueden utilizar en cualquier versión del juego. Con la variante «Filibusters», cada vez que alguien juegue una de las doce cartas con fondo oscuro, todos los jugadores excepto el activo deben descartar cartas hasta que tengan como máximo siete en la mano. Por último, la variante «Black Magic Woman» introduce poderes especiales para los seis símbolos de la carta, y cuando juegas una carta, puedes usarla para mover a un pirata como de costumbre o utilizar el poder de la carta. Puedes jugar dos loros como si fueran cualquier otro símbolo, o usar una linterna para mirar las cuatro primeras cartas de la baraja y quedarte con una de tu elección. Con la pistola, robas una carta de tu elección de la mano de un rival, y a cambio este roba una carta gratis. El símbolo del cofre del tesoro te permite recoger el cofre del tesoro de la casilla en la que te encuentras, lo que probablemente te permita robar cartas del mazo como bonificación, ¡pero también puede que sufras una mordedura de serpiente que te haga correr a por ron para ayudarte a olvidar el dolor!
