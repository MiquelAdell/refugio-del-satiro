        - article [ref=e9331]:
          - link "Park Royale — Disponible" [ref=e9332] [cursor=pointer]:
            - /url: /ludoteca/juegos/park-royale
            - generic [ref=e9334]:
              - generic [ref=e9335]: "7.7"
              - heading "Park Royale" [level=3] [ref=e9336]
              - paragraph [ref=e9337]: "Juego de estrategia y eliminación con temática urbana para entre 2 y 6 jugadores: conviértete en el rey del parque infantil en un juego de mesa competitivo en el que cada movimiento cuenta. Muévete entre columpios, areneros y toboganes mientras recoges objetos y eliminas a tus rivales. Mecánicas trepidantes con dados y ataques visuales: Tira los dados, avanza por el tablero y dispara pistolas de agua, tirachinas o flechas con ventosas. Cada turno combina movimiento, acción y defensa en un combate dinámico. Armas, armaduras y poderes especiales: Más de 50 cartas de equipamiento y consumibles te permiten personalizar tu estrategia. Mejora tu defensa con armaduras o lanza ataques en cadena para eliminar las coronas enemigas. Poder supremo en el castillo central: Quien llegue al castillo obtiene el poder de atacar sin límites. Pero si te derrotan allí, pierdes la partida. Solo el último que quede en pie será coronado como el nuevo rey del barrio. Componentes de primera calidad y diversión en grupo: incluye un tablero reversible, coronas de madera, dados, cartas ilustradas y fichas de personajes. Ideal para partidas rápidas de 30 minutos con amigos o familiares, a partir de 8 años. —Descripción del editor"
              - list [ref=e9338]:
                - listitem [ref=e9339]: 8+
