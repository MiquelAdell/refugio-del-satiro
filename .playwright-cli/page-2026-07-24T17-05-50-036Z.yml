        - article [ref=e7652]:
          - link "Gasha — Disponible" [ref=e7653] [cursor=pointer]:
            - /url: /ludoteca/juegos/gasha
            - generic [ref=e7655]:
              - generic [ref=e7656]: "6.5"
              - heading "Gasha" [level=3] [ref=e7657]
              - paragraph [ref=e7658]: ¡Metas una moneda en la máquina y giras la manivela, pero no puedes predecir qué Gasha te tocará! Estos Gashas se utilizarán para conseguir recompensas por puntos y, a veces, fichas extra. ¡Ganas quien consiga más puntos! En tu turno en Gasha, puedes robar dos cartas de Gasha o cambiar cartas de Gasha por una carta de recompensa de conjunto, que cuenta como puntos y, al mismo tiempo, equivale a la mitad de un boleto. En cuanto tengas dos mitades de boleto, robas una ficha de bonificación. Cuando se haya cogido la última ficha de bonificación o cuando la pila de recompensas por conjuntos esté vacía, el juego termina y gana quien tenga más puntos de colección, de bonificación y de Gasha.
              - list [ref=e7659]:
