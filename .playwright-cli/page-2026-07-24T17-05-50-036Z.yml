        - article [ref=e10615]:
          - link "Through the Desert — Disponible" [ref=e10616] [cursor=pointer]:
            - /url: /ludoteca/juegos/through-the-desert
            - generic [ref=e10618]:
              - generic [ref=e10619]: "7.2"
              - heading "Through the Desert" [level=3] [ref=e10620]
              - paragraph [ref=e10621]: Cada jugador intenta sumar el máximo de puntos trazando rutas de caravanas por el desierto, tratando de llegar a los oasis y bloqueando tramos del desierto. A mucha gente le recuerda al Go. Descripción del editor ¡Del galardonado diseñador de juegos Reiner Knizia nos llega un juego de estrategia, paciencia y camellos de plástico geniales! El desierto sigue siendo traicionero, misterioso y despiadado. Pero para aquellos dispuestos a arriesgarse ante los peligros de las arenas movedizas y abrasadas por el sol, el desierto esconde riquezas incomparables. En «Through the Desert», de dos a cinco jugadores controlan cada uno una tribu de nómadas que compiten por el dominio del desierto. Al establecer caravanas y hacerse con el control de los oasis, los jugadores obtienen puntos a medida que sus tribus ganan poder. La estrategia es fundamental a la hora de decidir cómo y dónde construir las caravanas de tu tribu. Hay múltiples formas de ganar puntos y varias formas de ganar. ¿Deberías intentar construir la caravana más larga? ¿O deberías dominar los oasis del desierto? No te olvides de vigilar las caravanas de tus oponentes, o tu propia tribu podría quedarse aislada de los valiosos abrevaderos. «Through the Desert» forma parte de la denominada trilogía de juegos de colocación de fichas de Knizia.
