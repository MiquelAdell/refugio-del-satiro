        - article [ref=e10339]:
          - link "Super Farmer — Disponible" [ref=e10340] [cursor=pointer]:
            - /url: /ludoteca/juegos/super-farmer
            - generic [ref=e10342]:
              - generic [ref=e10343]: "5.7"
              - heading "Super Farmer" [level=3] [ref=e10344]
              - paragraph [ref=e10345]: "En Superfarmer, cada jugador asume el papel de propietario de una granja de animales. El objetivo principal es criar, intercambiar y reunir diferentes animales (conejos, ovejas, cerdos, vacas, caballos y dos tipos de perros), y gana quien consiga reunir al menos un ejemplar de cada especie (excepto los perros). Pero ten cuidado: hay zorros por ahí que intentan llevarse tus conejos y lobos que pueden comerse al resto de tus animales (por eso necesitas perros para proteger a tu rebaño). El juego fue diseñado en la Polonia ocupada durante la Segunda Guerra Mundial por un famoso matemático polaco, Karol Borsuk. Las primeras copias las fabricó en casa su esposa, Zofia Borsukowa, y la familia las vendió con el nombre original de «Hodowla zwierzątek» («Cría de animales»). En aquellos tiempos difíciles, el juego se hizo muy popular. Lamentablemente, durante el levantamiento de Varsovia, al final de la guerra, todas las copias fueron destruidas, salvo una que se conservaba en otra ciudad. Tras la guerra, fue devuelta a la familia Borsuk. En 1997, por iniciativa de Zofia Borsukowa, una editorial polaca decidió lanzar el juego al mercado. El turno de cada jugador consta de dos acciones: primero tienes la posibilidad de intercambiar tus animales según la tabla especial (por ejemplo, por seis conejos obtienes una oveja, tres cerdos por una vaca) y, a continuación, lanzas dos dados especiales de 12 caras con imágenes de animales en cada cara. Se cuenta el número de pares de animales que salen en los dados (junto con los que hay en la granja) y ese es el número de nuevos animales que se obtienen, dividido por dos. La clave está en que en uno de los dados hay un zorro y en el otro un lobo, que se comen a tus animales. El juego se basa principalmente en el factor suerte (los dados). Pero también hay un poco de estrategia. ¿Te decantas por animales más «caros» (que tienen menos probabilidades de tener crías) o te quedas con los conejos, que se reproducen rápido pero son «baratos»? ¿Cambias tus animales por un «seguro» (perros) contra los zorros y los lobos o te arriesgas para alcanzar a los demás granjeros? El juego estaba pensado para niños, pero, sorprendentemente, también es divertido para adultos. Reimplementado por: Have You Herd? (con reglas simplificadas) Rancho (¡con reglas más complejas!)"
