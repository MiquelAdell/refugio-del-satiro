            - generic [ref=e7291]:
              - generic [ref=e7292]: "6.1"
              - 'heading "El Señor de los Anillos: El viaje a Mordor" [level=3] [ref=e7293]'
              - paragraph [ref=e7294]: "Sauron amenaza con sumir a la Tierra Media en una oscuridad eterna en su afán por hacerse con el Anillo Único. Toda la esperanza recae en Frodo Bolsón y sus amigos de la Comarca. Tu misión: llevar el Anillo Único a Mordor y destruirlo en el Monte del Destino. Con cada tirada de dados en *El Señor de los Anillos: El Viaje a Mordor*, los jugadores toman decisiones e intentan mover a sus hobbits lo más rápido posible para llegar al Monte del Destino. Cuentan con el apoyo de Gandalf y la comunidad, pero también pueden verse bloqueados por los orcos y perseguidos por los Espectros del Anillo. Los jugadores deben ser lo suficientemente audaces como para elegir los símbolos correctos de los dados y deshacerse de los Nazgul."
