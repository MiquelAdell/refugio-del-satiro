        - article [ref=e7813]:
          - link "HILO — Disponible" [ref=e7814] [cursor=pointer]:
            - /url: /ludoteca/juegos/hilo
            - generic [ref=e7816]:
              - generic [ref=e7817]: "6.4"
              - heading "HILO" [level=3] [ref=e7818]
              - paragraph [ref=e7819]: HILO es un juego de cartas inspirado en el juego de dominio público «Golf» y en otros conceptos similares. Cada jugador dispone de una cuadrícula de 3 x 3 cartas y, durante la ronda, debe intentar que el valor total de sus cartas sea lo más bajo posible sustituyendo las cartas de mayor valor por otras de menor valor. La novedad de HILO es que el color importa. Si consigues formar una fila, columna o diagonal completa de tres cartas del mismo color, puedes descartar toda la fila o columna. Por lo tanto, incluso puede merecer la pena quedarse con una carta de alto valor siempre que creas que podrás descartarla. Esto también garantiza un alto nivel de interacción entre los jugadores. ¿Dejarás una carta en la parte superior de la pila de descarte que ayude al siguiente jugador a descartar una fila completa? La partida se desarrolla a lo largo de varias rondas hasta que un jugador alcance al menos 100 puntos. Gana el jugador con menos puntos.
