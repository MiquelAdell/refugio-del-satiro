        - article [ref=e11006]:
          - link "Zodiac Duel — Disponible" [ref=e11007] [cursor=pointer]:
            - /url: /ludoteca/juegos/zodiac-duel
            - generic [ref=e11009]:
              - generic [ref=e11010]: "7.4"
              - heading "Zodiac Duel" [level=3] [ref=e11011]
              - paragraph [ref=e11012]: Cassandra y Sibyl son las adivinas más populares de la ciudad. Para zanjar su eterna rivalidad, deciden enfrentarse en un duelo definitivo utilizando los 12 signos del zodiaco y el poder de las estrellas. «Zodiac Duel» es un frenético juego de cartas para dos jugadores dividido en dos fases. En primer lugar, durante la fase de selección, tendrás que formar un equipo de 5 luchadores y 3 estrellas. Cada carta representa tanto a un luchador como a una estrella, pero solo puedes quedarte con una de las dos partes, así que… ¡elige con cuidado! En la segunda fase, te enfrentarás a tu oponente con las cartas que hayas elegido durante un máximo de 5 duelos. Decide estratégicamente cómo utilizar a tus luchadores —cada signo tiene un poder diferente— y coloca tus estrellas para modificar cada duelo. ¡El primer jugador que gane 3 duelos se llevará la partida! —descripción del editor
