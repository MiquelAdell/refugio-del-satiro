            - generic [ref=e10779]:
              - generic [ref=e10780]: "6.8"
              - heading "Truffle Shuffle" [level=3] [ref=e10781]
              - paragraph [ref=e10782]: En «Truffle Shuffle», un juego rápido de selección de cartas, los jugadores se turnan para elegir trufas de una caja común de cartas superpuestas con el fin de crear sus propias combinaciones de bombones para vender. Los jugadores pueden completar diversos conjuntos utilizando modificadores especiales y cartas de acción. Con tantas trufas de chocolate diferentes que desenvolver y tantas formas distintas de combinarlas, ¡cada partida de Truffle Shuffle es única! —Descripción del editor
