        - article [ref=e10891]:
          - link "VIP RIP — Disponible" [ref=e10892] [cursor=pointer]:
            - /url: /ludoteca/juegos/vip-rip
            - generic [ref=e10894]:
              - generic [ref=e10895]: "6.6"
              - heading "VIP RIP" [level=3] [ref=e10896]
              - paragraph [ref=e10897]: Aurora, la sepulturera, es una mujer glamurosa que solo entierra a famosos. ¡Ayúdala a decidir qué inscripción llevará cada famoso en su lápida! En este juego de fiesta pueden participar hasta 8 personas y ofrece modos tanto cooperativo como competitivo para equipos. En cada ronda, un jugador asumirá el papel de Aurora, la sepulturera. Para ganar, la sepulturera tendrá que usar su imaginación para relacionar tres refranes o dichos populares dados con tres famosos fallecidos —personas reales o personajes de ficción—. ¿Serán capaces los demás jugadores de descubrir esas conexiones? ¿Qué entenderán? ¿El significado literal o el metafórico de los refranes? —Descripción de la editorial
