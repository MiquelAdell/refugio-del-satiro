            - generic [ref=e10319]:
              - generic [ref=e10320]: "7.4"
              - heading "Splendor" [level=3] [ref=e10321]
              - paragraph [ref=e10322]: Splendor es un juego de recolección de fichas y desarrollo de cartas. Los jugadores son comerciantes del Renacimiento que intentan comprar minas de gemas, medios de transporte y tiendas, todo ello con el fin de conseguir el mayor número de puntos de prestigio. Si eres lo suficientemente rico, es posible que incluso recibas la visita de un noble en algún momento, lo que, por supuesto, aumentará aún más tu prestigio. En tu turno, puedes (1) recoger fichas (gemas), o (2) comprar y construir una carta, o (3) reservar una carta. Si recoges fichas, puedes coger tres tipos diferentes de fichas o dos fichas del mismo tipo. Si compras una carta, pagas su precio en fichas y la añades a tu zona de juego. Para reservar una carta —con el fin de asegurarte de conseguirla o, por qué no, de que tus oponentes no la consigan—, la colocas boca abajo delante de ti para construirla más adelante; esto te cuesta una ronda, pero también obtienes oro en forma de ficha comodín, que puedes usar como cualquier gema. Todas las cartas que compres aumentan tu riqueza, ya que te proporcionan una bonificación permanente de gemas para compras posteriores; algunas de las cartas también te otorgan puntos de prestigio. Para ganar la partida, debes alcanzar los 15 puntos de prestigio antes que tus oponentes.
