        - article [ref=e10293]:
          - link "Speed Cups — Disponible" [ref=e10294] [cursor=pointer]:
            - /url: /ludoteca/juegos/speed-cups
            - generic [ref=e10296]:
              - generic [ref=e10297]: "6.2"
              - heading "Speed Cups" [level=3] [ref=e10298]
              - paragraph [ref=e10299]: "El juego más famoso diseñado por Haim Shafir, «Halli Galli», incluye uno de los accesorios de juego más conocidos que existen: una campana. A los jugadores, tanto jóvenes como mayores, les encanta tocar la campana tras descubrir una combinación ganadora, por lo que no es de extrañar que la campana vuelva a aparecer en otro diseño de Shafir: Speed Cups, también conocido como Quick Cups. En este juego, cada jugador recibe un juego de cinco vasos de plástico, cada uno de un color diferente; se baraja una baraja de 24 cartas y se coloca boca abajo en el centro de la mesa, junto a la campana. Un jugador da la vuelta a la carta superior, en la que aparecen objetos de colores —trenes, pájaros, vasos, etc.— apilados vertical u horizontalmente; a continuación, todos intentan recrear esa secuencia de colores con su propio juego de vasos. El primer jugador en conseguirlo toca la campana, disfruta del «ding» que alegra el alma y, si es correcto, se queda con la carta. A continuación, alguien descubre la siguiente carta y los jugadores vuelven a mezclar los vasos. Una vez que se han repartido todas las cartas, ¡gana quien tenga más cartas!"
