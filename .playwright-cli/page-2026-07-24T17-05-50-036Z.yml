              - generic [ref=e10872]: "6.5"
              - heading "Un imperio en 8 minutos" [level=3] [ref=e10873]
              - paragraph [ref=e10874]: "«Eight-Minute Empire», de Ryan Laukat, es un juego rápido que desarrolla la temática de la civilización y la exploración mediante el control de áreas basado en cartas (colocando ejércitos y ciudades en un mapa reducido) y la colección de conjuntos (obteniendo recursos del tablero y de las cartas). Los jugadores se distribuyen por el mapa con el objetivo de sumar puntos al final de la partida al conseguir mayorías en regiones y continentes. Todas las acciones (como el movimiento por tierra o mar, la producción de ejércitos o la fundación de ciudades) se realizan mediante cartas que se colocan boca arriba (seis a la vez) y que se pueden adquirir a precios crecientes. Las cartas también contienen recursos, que otorgan puntos al final de la partida si se recogen correctamente. Su primera versión estaba disponible como «print-and-play», y en 2013 se publicó una versión estándar (financiada a través de Kickstarter). Existe una expansión con un mapa de Europa (Eight-Minute Empire: Europe Expansion Board), y también se ha publicado una secuela independiente (Eight-Minute Empire: Legends). De la editorial: ¡Construye un imperio y conquista el territorio en unos ocho minutos! En Eight-Minute Empire, de 2 a 5 jugadores se turnan para seleccionar una carta de entre las seis que se muestran. La carta proporciona un bien y, además, incluye una acción que el jugador debe realizar de inmediato. Las acciones ayudan a los jugadores a hacerse con el control del mapa, pero los conjuntos de bienes valen puntos al final de la partida, por lo que los jugadores deben encontrar el equilibrio entre ambos aspectos. Eight-Minute Empire es un juego de control de territorio ultrarrápido que plantea decisiones difíciles. Es fácil de aprender y perfecto para cuando solo dispones de unos minutos."
