            - generic [ref=e9698]:
              - generic [ref=e9699]: "7.4"
              - heading "Regicide" [level=3] [ref=e9700]
              - paragraph [ref=e9701]: «Regicide» es un juego de cartas cooperativo de fantasía para entre 1 y 4 jugadores, que se juega con una baraja estándar. Los jugadores colaboran para derrotar a 12 poderosos enemigos. En su turno, un jugador juega una carta sobre la mesa para atacar al enemigo y, una vez que se ha infligido suficiente daño, el enemigo queda derrotado. Los jugadores ganan cuando se derrota al último rey. ¡Pero cuidado! En cada turno, el enemigo contraataca. Los jugadores deberán descartar cartas para compensar el daño y, si no pueden descartar suficientes, todos pierden. Con numerosas decisiones tácticas y un profundo árbol heurístico, Regicide supone un enorme desafío para cualquiera que sea lo suficientemente valiente como para afrontarlo. —Descripción del diseñador Si te apetece un juego basado en dados, inspirado en un error tipográfico y anunciado el 1 de abril por los mismos diseñadores, ¡prueba Regidice!
