              - generic [ref=e9745]: "7.1"
              - heading "¡Rescate!" [level=3] [ref=e9746]
              - paragraph [ref=e9747]: "Llega la llamada... «911, ¿cuál es su emergencia?». Al otro lado se oye una respuesta presa del pánico: «¡INCENDIO!». Unos instantes después, os ponéis los trajes protectores que os mantendrán con vida, recogéis vuestro equipo y os precipitáis hacia el lugar de un infierno de llamas. El equipo solo dispone de unos segundos para evaluar la situación y trazar un plan de ataque; después, entráis en acción como los profesionales entrenados que sois. Debéis enfrentaros a vuestros miedos, no rendiros nunca y, por encima de todo, trabajar en equipo, porque el fuego arde con fuerza, el edificio amenaza con derrumbarse y hay vidas en peligro. Debéis tener éxito. Sois los valientes hombres y mujeres del cuerpo de bomberos; la gente depende de vosotros. Esto es lo que hacéis cada día. Flash Point: Fire Rescue es un juego cooperativo de rescate en incendios. Hay dos modalidades de juego en Flash Point: el juego básico y el juego para expertos. En ambas variantes, los jugadores intentan rescatar a 7 de las 10 víctimas de un incendio que arrasa el edificio. Mientras los jugadores intentan rescatar a las víctimas, el fuego se propaga a otras partes del edificio, causando daños estructurales y bloqueando posiblemente las vías de acceso a través del edificio. En cada turno, un jugador puede gastar puntos de acción para intentar extinguir los incendios, desplazarse por el edificio, sacar a las víctimas del edificio o realizar diversas acciones especiales, como mover vehículos de emergencia. Si perecen 4 víctimas en el incendio o el edificio se derrumba por sufrir demasiados daños estructurales, los jugadores pierden. De lo contrario, los jugadores ganan al instante cuando rescatan a la séptima víctima. La variante para expertos incluida en el juego añade elementos temáticos como el «flash-over», materiales combustibles, configuración aleatoria y variaciones en la dificultad del juego, desde principiante hasta heroica. El juego incluye un tablero de doble cara con dos planos de edificio diferentes y hay varios mapas de expansión disponibles."
