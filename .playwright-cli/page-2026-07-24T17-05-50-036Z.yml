            - generic [ref=e8667]:
              - generic [ref=e8668]: "7.0"
              - heading "Mesos" [level=3] [ref=e8669]
              - paragraph [ref=e8670]: Hace miles de años, comenzaba una nueva era para la humanidad. Los cazadores-recolectores nómadas, que se habían ganado a pulso su lugar en la Tierra, se organizaron en pequeños grupos, diferenciaron los roles sociales, construyeron los primeros asentamientos e iniciaron una gran revolución. Los científicos denominan a este periodo «Mesolítico», y este juego trata sobre esas personas. En MESOS, eres el líder de una tribu ancestral y, como tal, tu función consiste en fomentar el crecimiento de tu tribu incorporando nuevos miembros, garantizando su sustento, construyendo edificios y haciendo frente a los acontecimientos que se van sucediendo. En cada ronda, debes colocar tu ficha de tótem en la pista de ofertas y, siguiendo el orden de las fichas en la pista, adquirirás cartas de personaje o de edificio y las añadirás a tu tribu. Cada carta tiene efectos específicos y puede otorgarte puntos de prestigio (PP) a medida que construyes edificios especializados y te preparas con prudencia para los acontecimientos a los que te enfrentarás. Gana quien consiga aportar más prestigio a su tribu.
              - list [ref=e8671]:
