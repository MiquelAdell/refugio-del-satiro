        - article [ref=e7836]:
          - 'link "Holmes: Sherlock & Mycroft — Disponible" [ref=e7837] [cursor=pointer]':
            - /url: /ludoteca/juegos/holmes-sherlock-mycroft
            - generic [ref=e7839]:
              - generic [ref=e7840]: "6.8"
              - 'heading "Holmes: Sherlock & Mycroft" [level=3] [ref=e7841]'
              - paragraph [ref=e7842]: "En febrero de 1895, Londres se despertó con una fuerte explosión. Una gran columna de humo indicaba que una bomba había estallado en el Parlamento. Las fuerzas de seguridad se movilizaron de inmediato y detuvieron a un joven obrero sospechoso cerca de la zona. Mycroft Holmes, al servicio de la Corona, recibió el encargo de investigar la relación del joven obrero con grupos anarquistas. Piensa que será una tarea fácil que podrá llevar a cabo desde la comodidad de su sillón en el Club Diógenes… hasta que le comunican una noticia inquietante: su hermano menor, Sherlock Holmes, detective consultor, ha sido contratado por los padres del chico para demostrar la inocencia de su hijo, quien cree ser el chivo expiatorio de una oscura conspiración. Por primera vez, las mentes más brillantes de Londres se enfrentan entre sí. ¿Estuvo el joven obrero implicado en este terrible atentado o es simplemente el chivo expiatorio de una oscura conspiración? Una partida de Holmes: Sherlock & Mycroft dura siete turnos (días de investigación). Al comienzo de cada día, aparecen en Londres personajes famosos extraídos de los libros de Arthur Conan Doyle. Cada jugador dispone de tres fichas de acción que se mueven de un personaje a otro para utilizar sus habilidades especiales, sabiendo que un jugador nunca puede tener dos fichas en el mismo personaje. Por lo tanto, hay que liberar a un personaje antes de volver a utilizarlo. Las habilidades de cada personaje les permiten obtener cartas de prueba o ganar fichas de investigación de múltiples formas. El juego tiene un gran valor de rejugabilidad, ya que no se sabe si un personaje con una habilidad específica aparecerá en el tablero el día 1 o en el último día, el 7. ¡Cada partida es diferente!"
              - list [ref=e7843]:
                - listitem [ref=e7844]: 10+
                - listitem [ref=e7848]: 30min
                - listitem [ref=e7852]: 2-2
              - generic [ref=e7858]: Familiar
        - article [ref=e7859]:
          - link "Horrified — Disponible" [ref=e7860] [cursor=pointer]:
            - /url: /ludoteca/juegos/horrified
            - generic [ref=e7862]:
              - generic [ref=e7863]: "7.6"
              - heading "Horrified" [level=3] [ref=e7864]
              - paragraph [ref=e7865]: Imagina vivir en un lugar tan desolador que no está plagado de uno, dos o incluso tres monstruos, ¡sino de siete de los demonios más terroríficos! En este juego, te enfrentarás a todos ellos mientras colaboráis para librar al pueblo de estas criaturas maníacas o incomprendidas, antes de que sea demasiado tarde. Horrified es un juego cooperativo en el que los jugadores se enfrentan a los clásicos monstruos de las películas de Universal. Los jugadores ganan o pierden juntos. Los jugadores ganan cuando se derrota a todos los monstruos, pero pierden si el indicador de Terror alcanza la casilla de la calavera O si el mazo de monstruos se agota cuando se necesita robar una carta. En el turno de un jugador, este realizará las acciones de la fase de héroe. A continuación, los monstruos actúan en la fase de monstruos. Las cartas de evento determinan qué monstruo está en juego. «Horrified» incluye miniaturas esculpidas de alta calidad (Frankenstein, La novia de Frankenstein, El hombre lobo, Drácula, La momia, El hombre invisible, La criatura del lago negro). Su mecánica de juego cooperativa, innovadora y fácil de aprender, hace que los jugadores colaboren contra los monstruos con distintos niveles de dificultad. Al igual que cada monstruo es único, se requieren diferentes estrategias y tácticas para derrotarlos. —Descripción del editor
