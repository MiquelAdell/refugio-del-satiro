        - article [ref=e10546]:
          - link "The Lucky Garden — Disponible" [ref=e10547] [cursor=pointer]:
            - /url: /ludoteca/juegos/the-lucky-garden
            - generic [ref=e10549]:
              - generic [ref=e10550]: "7.2"
              - heading "The Lucky Garden" [level=3] [ref=e10551]
              - paragraph [ref=e10552]: "The Lucky Garden is a fun tile-laying game for 1-4 players in which you'll have to find the gnomes hidden in a garden. The game is divided into 2 phases: in the first phase, each player on their turn will place a tile face up adjacent to one of the previous ones, until a 5x5 garden is created. Once the garden is created, we'll flip all the tiles over. In the second phase, each player, taking turns, will pick one of the mission tiles that will indicate how many gnomes, of what colors, and the maximum number of tiles you can flip to find them. —description from the publisher The Lucky Garden es un divertido juego de losetas para 1-4 jugadores en el que tendremos que encontrar a los gnomos escondidos en un jardín. La partida se divide en 2 fases: en la primera cada jugador en su turno colocará una loseta boca arriba adyacente a una de las anteriores, hasta que se crea un jardín 5x5 . Una vez creado el jardín, daremos la vuelta a todas las losetas. En la segunda fase, por turnos, cada jugador cogerá una de las losetas de misión que te indicará cuantos gnomos, de qué colores y el máximo de losetas que puedes girar para encontrarlos. —description from the publisher (Spanish)"
