        - article [ref=e10638]:
          - link "TimemiT — Disponible" [ref=e10639] [cursor=pointer]:
            - /url: /ludoteca/juegos/timemit
            - generic [ref=e10641]:
              - generic [ref=e10642]: "8.1"
              - heading "TimemiT" [level=3] [ref=e10643]
              - paragraph [ref=e10644]: "TimemiT es un juego de mesa para dos jugadores en el que te sumergirás en una épica batalla contra el tiempo en la que está en juego el destino de la humanidad. Elige quién quieres ser: Nora, una ingeniera decidida a salvar el mundo, o Aron, una IA empeñada en destruirlo. Mientras te embarcas en una intensa carrera contra el tiempo, tendrás que utilizar con prudencia los Kronos, paquetes de energía que alteran el espacio-tiempo y forman pequeños agujeros de gusano. El juego se desarrolla en dos fases: Combate y Puja. Durante la fase de combate, ambos jugadores revelan cartas para mover la nave por el tablero del tiempo, pero ten cuidado: revelar el mismo símbolo tres veces puede desencadenar una paradoja temporal. A continuación, durante la fase de pujas, se utilizan las cartas Kronos para pujar y obtener cartas de poder y eventos temporales que pueden cambiar el curso de la partida. Utiliza tus cartas Kronos para conseguir cartas de poder y construir un mazo con el que derrotar a tu oponente. Avanza la nave por el tablero del tiempo hasta llegar al otro extremo. Nora debe viajar al pasado, a 1980, y Aron al futuro, a 2220. Si ninguno de los jugadores ha llegado al final del tablero cuando se hayan utilizado todas las cartas de evento, ganará quien haya avanzado más. ¡Pero cuidado! Si tu ficha de personaje contiene 6 triángulos de paradoja, acabarás en una dimensión paralela y perderás la partida inmediatamente. —Descripción del editor"
