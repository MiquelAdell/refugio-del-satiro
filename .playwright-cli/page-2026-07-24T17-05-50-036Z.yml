        - article [ref=e8894]:
          - link "My Shelfie — Disponible" [ref=e8895] [cursor=pointer]:
            - /url: /ludoteca/juegos/my-shelfie
            - generic [ref=e8897]:
              - generic [ref=e8898]: "6.5"
              - heading "My Shelfie" [level=3] [ref=e8899]
              - paragraph [ref=e8900]: "Acabas de llevarte a casa tu nueva estantería y ahora es el momento de colocar en ella tus objetos favoritos: libros, juegos de mesa, retratos... ¿Quién conseguirá la foto de la estantería mejor organizada? En tu turno, debes coger 1, 2 o 3 fichas de objetos del tablero del salón (compartido por todos los jugadores), siguiendo estas reglas: • Las fichas que cojas deben estar adyacentes entre sí y formar una línea recta. • Todas las fichas que cojas deben tener al menos un lado libre al comienzo de tu turno. A continuación, debes colocar todas las fichas que hayas cogido en una columna de tu estantería (una exposición en 3D) para cumplir con las cartas de objetivo personal, que otorgan puntos si haces coincidir los espacios resaltados con las fichas de objeto correspondientes, o con las cartas de objetivo común, que otorgan puntos si consigues el patrón ilustrado. También se obtienen puntos si se conectan fichas de objetos del mismo tipo. El primer jugador que llene todos los espacios de su estantería activa el final de la partida y se lleva la ficha de final de partida, que otorga puntos adicionales. La partida continúa hasta el final del turno del jugador situado a la derecha del jugador que tiene la ficha de primer jugador. El jugador que consiga más puntos gana la partida. Un juego de estrategia y perspicacia, diferente cada vez gracias a la variedad de objetivos comunes y personales. Las preciosas imágenes de las fichas de objeto te harán sentir realmente que estás ordenando tu preciada estantería. -Descripción del diseñador"
              - list [ref=e8901]:
