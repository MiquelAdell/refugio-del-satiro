        - article [ref=e7445]:
          - link "Evo — Disponible" [ref=e7446] [cursor=pointer]:
            - /url: /ludoteca/juegos/evo
            - generic [ref=e7448]:
              - generic [ref=e7449]: "6.8"
              - heading "Evo" [level=3] [ref=e7450]
              - paragraph [ref=e7451]: Hace 217 453 883 años, siete meses y 26 días, los primeros dinosaurios abandonaron su hogar en el mar y se adentraron en la tierra firme. El clima en constante cambio fue su primer adversario, lo que les obligó a estar en constante movimiento. Pero el clima no era su único problema. Para sobrevivir y prosperar, tenían que evolucionar, ¡y hacerlo rápidamente! En Evo, controlas la supervivencia y la evolución de una especie de dinosaurios llamada Dinos. Guias sus migraciones hacia climas templados, adquieres los genes perfectos para desarrollar a tus Dinos y hacerlos mutar, y expulsas a otras criaturas que aún no han aprendido el significado del término «especie dominante». Al final de la partida, tú y tus Dinos no seréis los ganadores a menos que hayáis evolucionado más rápido y con más éxito que todos los demás. Cada turno se divide en seis fases, en las que los Dinos se mueven, luchan, se reproducen y evolucionan para garantizar que su especie tenga las características necesarias para sobrevivir a los diversos peligros de la vida prehistórica. Los jugadores ganan y gastan puntos de mutación para adaptar a su especie a la supervivencia, pero no los gastes todos, ya que los que sobren se tienen en cuenta para determinar el ganador. Con cada ronda de juego, un meteorito se acerca un paso más a la Tierra. Cuando el meteorito impacte (lo cual se determina en parte con los dados), ¡el juego termina!
