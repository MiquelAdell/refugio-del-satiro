            - generic [ref=e8207]:
              - generic [ref=e8208]: "6.4"
              - heading "Laberinto" [level=3] [ref=e8209]
              - paragraph [ref=e8210]: Labyrinth (antes conocido como The aMAZEing Labyrinth) ha dado lugar a toda una serie de juegos de Labyrinth. El tablero de juego cuenta con un conjunto de fichas fijadas de forma sólida en él; el resto de fichas que conforman el laberinto se deslizan hacia dentro y hacia fuera de las filas creadas por las fichas que están fijadas en su sitio. Siempre queda una ficha fuera del laberinto, y los jugadores, por turnos, cogen esta ficha extra y la deslizan dentro de una fila del laberinto, moviendo todas esas fichas y empujando una hacia el otro lado del tablero; esta ficha recién retirada se convierte en la pieza que el siguiente jugador deberá añadir al laberinto. Los jugadores se desplazan por los caminos cambiantes del laberinto en una carrera para recoger diversos tesoros. ¡Gana quien recoja primero todos sus tesoros y regrese a su casilla de partida! «Labyrinth» parece sencillo a primera vista y es un excelente juego de resolución de acertijos para niños; también pueden jugarlo los adultos, utilizando más estrategia y adoptando un enfoque más competitivo.
              - list [ref=e8211]:
