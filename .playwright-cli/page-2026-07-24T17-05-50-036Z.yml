        - article [ref=e9649]:
          - link "Rebel Princess — Disponible" [ref=e9650] [cursor=pointer]:
            - /url: /ludoteca/juegos/rebel-princess
            - generic [ref=e9652]:
              - generic [ref=e9653]: "7.4"
              - heading "Rebel Princess" [level=3] [ref=e9654]
              - paragraph [ref=e9655]: Blancanieves, La Sirenita, Cenicienta y muchas otras princesas de cuento de hadas están celebrando una fiesta de cinco días. Los príncipes azules, que no han sido invitados, intentarán colarse en el baile para pedirles matrimonio a las chicas. Como princesa, debes evitar las propuestas de matrimonio y seguir soltera e independiente tras las celebraciones. «Rebel Princess» se desarrolla a lo largo de cinco rondas, que representan los cinco días de la fiesta, y cada ronda tiene una regla especial que hace que cada partida sea totalmente diferente. La mecánica general es la de los juegos de bazas, en los que cada jugador juega una carta numerada en cada baza, siguiendo uno de los cuatro palos del juego. El jugador con el número más alto del palo que ha iniciado la baza se lleva todas las cartas de esa baza, pero eso no es necesariamente bueno, ya que los jugadores quieren evitar quedarse con cartas que incluyan a los príncipes azules —cada uno de los cuales trae una propuesta de matrimonio—, aparte de la rana encantada, que trae cinco propuestas. Gana el jugador con el menor número de propuestas de matrimonio tras cinco rondas. Es importante destacar que cada jugador asume el papel de una princesa de cuento de hadas diferente y tiene una habilidad especial que puede usar una vez por ronda. —Descripción de la editorial
