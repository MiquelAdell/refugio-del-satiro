              - generic [ref=e8847]: Infantil
        - article [ref=e8848]:
          - link "Mü & More — Disponible" [ref=e8849] [cursor=pointer]:
            - /url: /ludoteca/juegos/mu-more
            - generic [ref=e8851]:
              - generic [ref=e8852]: "7.2"
              - heading "Mü & More" [level=3] [ref=e8853]
              - paragraph [ref=e8854]: "Aunque el juego estrella, «Mü», es la principal atracción, esta baraja de cartas personalizadas incluye reglas para varios juegos: «Mü»: un complejo juego de bazas. Para 3-6 jugadores, a partir de 12 años. The Last Panther: un juego de bazas similar al Hearts, en el que los jugadores intentan evitar los puntos negativos. Para 3-8 jugadores, a partir de 10 años. Wimmüln: un juego de bazas en el que los jugadores deben estimar cuántas bazas van a ganar, similar a Oh Hell!. Para 3-6 jugadores, a partir de 8 años. Rummü: un juego de cartas similar al Rummy en el que los jugadores intentan deshacerse de sus manos jugando combinaciones de cartas que sumen muchos puntos. Para 3-6 jugadores, a partir de 8 años. Safarü: un juego de «atrapar» cartas en el que se utilizan habilidades básicas de suma. Para 2-4 jugadores, a partir de 10 años. Calcory (solo en la edición original de 1995-1998): un juego de memoria y cálculo en el que los jugadores ponen a prueba su suerte para descubrir el mayor número de cartas. Para 2-4 jugadores, a partir de 7 años. Calcory utiliza fichas de madera que no se incluyeron en las ediciones posteriores, por lo que el juego se eliminó del conjunto. Mü es considerado por muchos como una de las mejores propuestas del género de los juegos de bazas. Los jugadores revelan cartas para declarar sus pujas: el que puja más alto se convierte en el Jefe y el segundo con la puja más alta es el Vicajefe. Tanto el Vicejefe como el Jefe eligen un triunfo (ya sea un número o un palo), y a continuación los jugadores intentan ganar bazas para sumar el mayor número de puntos. El Jefe elige un compañero e intenta cumplir la apuesta para obtener puntos de bonificación, mientras que el Vicejefe y el resto de jugadores intentan impedir que el Jefe alcance su objetivo. La baraja consta de 60 cartas repartidas en 5 palos de diferentes colores. Cada palo contiene cartas numeradas del 0 al 9, con dos ejemplares de cada una de las cartas 1 y 7. Las cartas también tienen impresos 0, 1 o 2 triángulos que indican el valor en puntos de dicha carta. «Mü and Lots More» incluye una versión mejorada de «Mü» y un conjunto diferente de juegos. La edición coreana de 2020 de DiceTree (titulada «The Last Panther + 6 juegos») incluye «Calcory» y otro nuevo juego de cartas de escalada, «기드라» (Ghydra), de Changhyun Baek."
