        - article [ref=e9216]:
          - link "Paleo — Disponible" [ref=e9217] [cursor=pointer]:
            - /url: /ludoteca/juegos/paleo
            - generic [ref=e9219]:
              - generic [ref=e9220]: "7.7"
              - heading "Paleo" [level=3] [ref=e9221]
              - paragraph [ref=e9222]: "«Paleo» es un juego de aventuras cooperativo ambientado en la Edad de Piedra, en el que los jugadores intentan mantener con vida a los seres humanos a su cargo mientras completan misiones. A veces necesitas una piel, otras veces una tienda de campaña, pero todas estas son misiones secundarias en comparación con tu objetivo a largo plazo: pintar un mamut lanudo en la pared para que los humanos, miles de años después, sepan que alguna vez exististe. (Vale, simplemente crees que la pintura del mamut queda genial. Conservar un registro de tu existencia pasada es solo la guinda del pastel.) ¿Qué podría impedirte pintar ese mamut? La muerte, en todas sus formas. Cada jugador comienza la partida con un par de humanos, cada uno de los cuales tiene una habilidad y una serie de puntos de vida. En cada turno, cada jugador elige ir a una ubicación —posiblemente del mismo tipo que la de otros jugadores, aunque no sea la misma ubicación— y, aunque tengas una idea de lo que podrías encontrar allí, no lo sabrás con certeza hasta que llegues, momento en el que podrías conseguir comida o recursos, encontrar lo necesario para fabricar un objeto útil, descubrir que puedes ayudar a otra persona en su proyecto o sufrir una mordedura de serpiente que te lleve al borde de la muerte. La vida está llena tanto de maravillas como de terrores... Al final del día, necesitas comida para todos los miembros de tu grupo, así como diversas oficios o habilidades que te permitan completar misiones. Si no lo consigues, se suma otra calavera al marcador, y una vez que hayas acumulado suficientes, decidirás que vivir es cosa de tontos y te rendirás, declarando que, por lo que a ti respecta, los futuros humanos pueden limitarse a admirar a otra persona. Paleo incluye múltiples módulos que permiten una gran variedad de personajes, lugares, misiones y mucho más durante tu estancia en el año 10 000 a. C."
