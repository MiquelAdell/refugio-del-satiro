        - article [ref=e10247]:
          - link "Snakelake — Disponible" [ref=e10248] [cursor=pointer]:
            - /url: /ludoteca/juegos/snakelake
            - generic [ref=e10250]:
              - generic [ref=e10251]: "5.5"
              - heading "Snakelake" [level=3] [ref=e10252]
              - paragraph [ref=e10253]: "De la editorial: «El juego trata sobre un grupo de serpientes que deambulan por el bosque intentando comerse las manzanas que caen de los árboles (y evitando comerse las setas venenosas). El frenesí de las serpientes las lleva a correr entre los árboles y los jugadores deben ser capaces de «pilotarlas» hasta las manzanas, evitando las setas, los árboles y las demás serpientes. El juego se desarrolla mediante cartas (las cartas describen los movimientos posibles)». SnakeLake es una mezcla entre el antiguo videojuego Snake y el juego de mesa Robo Rally, pero es mucho más sencillo y rápido que RR. Se dispone de un tablero sencillo con una cuadrícula en la que se colocan algunos manzanos, y luego cada jugador elige un punto de partida. Cada jugador utiliza cartas para programar en secreto sus tres siguientes movimientos en su propia tabla; el segundo y tercer movimiento se desplazan hacia abajo en cada turno cuando se utiliza la primera carta, y se coloca una nueva carta en la tercera casilla. Las cartas indican simplemente «adelante», «izquierda» y «derecha» (dos veces cada una), además de una carta de «parada». También te indican que robes una carta de «Evento», lo que añade un toque de aleatoriedad. Si tu serpiente choca contra un árbol, se sale del tablero sin estar completa o choca contra el cuerpo de otra serpiente, vuelves a empezar desde otro lugar, reprogramando tus tres siguientes movimientos. Si chocas contra la cabeza de otra serpiente, esta desaparece y ganas un punto por cada segmento de su cuerpo. Si consigues que toda tu serpiente esté en el tablero y luego tu cabeza sale del tablero, sumas puntos por la longitud de tu serpiente. Pero los puntos importantes provienen de comerte las manzanas que caen de los manzanos. Estas valen entre 8 y 12 puntos, y tu serpiente debe pasar por encima de ellas para comérselas y revelar los puntos obtenidos. Del mismo modo, hay algunas setas que restan puntos si te las comes. Las manzanas y las setas se colocan cuando lo indica una carta de evento. Otros eventos incluyen quitar una manzana, hacer que la serpiente de un rival se duerma (se salte un turno) y alargar o acortar el cuerpo de tu serpiente. «Snake Lake» es un juego ligero, rápido y divertido, más adecuado para niños que para adultos. La mejor estrategia parece consistir en comerse una manzana y luego ser expulsado del tablero para empezar en otro lugar, cerca de más manzanas. Conseguir que toda tu serpiente entre y salga del tablero es una tarea ardua y, en comparación, reporta pocos puntos. Los componentes están bien fabricados, con buenas cartas brillantes que deberían resistir bien el uso. Las reglas necesitan una pequeña revisión, pero son lo suficientemente claras. Sin embargo, Snake Lake podría ser más adecuado para 3 o 4 jugadores que para 6, ya que se satura muy rápidamente, incluso en el lado más grande del tablero."
