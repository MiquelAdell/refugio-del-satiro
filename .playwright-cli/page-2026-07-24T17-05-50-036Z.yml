        - article [ref=e7974]:
          - link "Jurassic Zoom — Disponible" [ref=e7975] [cursor=pointer]:
            - /url: /ludoteca/juegos/jurassic-zoom
            - generic [ref=e7977]:
              - generic [ref=e7978]: "7.6"
              - heading "Jurassic Zoom" [level=3] [ref=e7979]
              - paragraph [ref=e7980]: "¡Bienvenidos a Zoom Island! La única isla del mundo descubierta recientemente donde aún viven dinosaurios. Os han invitado a vosotros y a vuestros amigos a un safari fotográfico, pero Zoom Island es tan extensa y salvaje que algunos dinosaurios se han escondido, manteniéndose fuera de la vista y lejos del zoom de vuestras cámaras. A medida que los jugadores retiren las cartas de vegetación transparentes, descubrirán a los dinosaurios que se esconden detrás de ellas: ¡un momento inestimable! Tira los dados y adéntrate en la vegetación, intercambia cartas con tus amigos o roba de ellos, pero, sobre todo, ¡cuidado con los meteoritos que pueden hacerte perder algunos de tus dinosaurios! —Descripción del editor"
              - list [ref=e7981]:
