        - article [ref=e10914]:
          - link "Virtù — Disponible" [ref=e10915] [cursor=pointer]:
            - /url: /ludoteca/juegos/virtu
            - generic [ref=e10917]:
              - generic [ref=e10918]: "7.3"
              - heading "Virtù" [level=3] [ref=e10919]
              - paragraph [ref=e10920]: Es una época de grandes cambios, en la que la Edad Media llega a su fin y nace la modernidad. Para quienes ocupan cargos en el gobierno, la situación es propicia para actuar. Tu ciudad debe mantener su prestigio y tú, como su príncipe, debes hacer que así sea. Virtù se desarrolla durante el Renacimiento italiano, y cada jugador encarna a una de las poderosas ciudades italianas de la época e intenta hacerla más poderosa que todas las demás a través de la «virtù», la capacidad de lograr grandes cosas mediante un Estado fuerte (según Maquiavelo). La base del juego es la «construcción de la rueda», es decir, crear una «rueda de acciones» en tu tablero personal de jugador, que tiene una disposición única en comparación con la de los demás jugadores y en la que dispones de un conjunto diferente de cartas de familia iniciales. Dependiendo de cómo coloques las cartas, dispones de múltiples opciones y de una estrategia inicial, pero puedes adquirir y colocar nuevas cartas para modificar tu enfoque a lo largo de la partida. Interactúas con los demás de forma indirecta, quitándoles las cartas que desean o compitiendo por alcanzar objetivos, o de forma directa, enviando agentes al palacio o a sus ciudades, así como atacando ciudades. Los artistas, comerciantes y diplomáticos también pueden contribuir a aumentar tu prestigio. Virtù incluye un modo para dos jugadores que se desarrolla de forma diferente al juego con 3-5 jugadores.
              - list [ref=e10921]:
