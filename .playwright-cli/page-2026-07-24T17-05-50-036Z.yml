        - article [ref=e6138]:
          - link "Carrera de Tortugas — Disponible" [ref=e6139] [cursor=pointer]:
            - /url: /ludoteca/juegos/carrera-de-tortugas
            - generic [ref=e6141]:
              - generic [ref=e6142]: "6.8"
              - heading "Carrera de Tortugas" [level=3] [ref=e6143]
              - paragraph [ref=e6144]: «Las tortugas no siempre tienen prisa, pero incluso ellas llegan a participar en una carrera para intentar ser la primera en llegar a la sabrosa ensalada que hay al otro extremo del campo. Pero como las tortugas no tienen mucha resistencia, les gusta descansar de vez en cuando, preferiblemente sobre el caparazón de otra tortuga para que las lleve un rato». Antes de empezar la partida, cada jugador roba en secreto un color para saber a qué tortugas corresponde. El movimiento de las tortugas se controla mediante cartas que se roban de un mazo común (siempre se eligen de entre las 5 cartas que se tienen en la mano). Estas cartas representan tortugas de colores (de un solo color o del arcoíris) y movimientos (1 o 2 pasos hacia delante, 1 paso hacia atrás; además, en el caso de algunas cartas de tortugas del arcoíris, mover la última tortuga hacia delante). Cuando una tortuga se desplaza a una casilla en la que hay otra tortuga esperando, se coloca encima de esa tortuga. Cuando se mueve una tortuga que lleva otras tortugas a cuestas, todas las demás tortugas que hay encima de ella se desplazan con ella. La primera tortuga en llegar a la última casilla gana. —Descripción de Spielbox «Ribbit», la reedición de SimplyFun de 2007, tiene ranas en lugar de tortugas. Preguntas frecuentes sobre Schildkrötenrennen A partir de 5 años
