        - article [ref=e9147]:
          - link "Overparked — Disponible" [ref=e9148] [cursor=pointer]:
            - /url: /ludoteca/juegos/overparked
            - generic [ref=e9150]:
              - generic [ref=e9151]: "7.3"
              - heading "Overparked" [level=3] [ref=e9152]
              - paragraph [ref=e9153]: ¡Es el día del gran concierto y los vehículos llegan de todas partes! ¿Serás capaz de gestionar el ajetreo del tráfico aparcando de forma inteligente todos los vehículos que llegan para maximizar tus puntos? De la mano del veterano diseñador de juegos de estrategia y puzles Daryl Chow y del aclamado ilustrador japonés TANSAN, «Overparked» ofrece una experiencia interactiva de estrategia y puzles sin igual. Los jugadores se turnan para girar el volante, determinando así qué vehículos llegarán a la parcela de cada uno. A continuación, todos los jugadores deciden qué vehículos colocar. El juego termina cuando a un jugador se le acaba el espacio y todos los jugadores suman puntos por sus vehículos conectados, los camiones rodeados y los objetivos para ver quién es el maestro del aparcamiento.
