        - article [ref=e7081]:
          - link "El Gran Dalmuti — Disponible" [ref=e7082] [cursor=pointer]:
            - /url: /ludoteca/juegos/el-gran-dalmuti
            - generic [ref=e7084]:
              - generic [ref=e7085]: "6.6"
              - heading "El Gran Dalmuti" [level=3] [ref=e7086]
              - paragraph [ref=e7087]: "Un juego de cartas sencillo en el que los jugadores ganan prestigio al ser los primeros en quedarse sin cartas. La baraja comercial, de 80 cartas, contiene cartas con valores del 12 al 1, además de dos bufones. Cada carta lleva un número que no solo indica su valor, sino también cuántas cartas de ese valor hay en la baraja. En otras palabras, hay doce cartas de valor 12, once de valor 11, cuatro de valor 4 y una sola carta de valor 1. Cuanto menor sea el número, mayor será el valor. Se reparten las cartas a todos los jugadores y el objetivo es deshacerse de las propias cartas lo más rápido posible. La partida comienza cuando un jugador coloca una o más cartas en el centro de la mesa. Las cartas jugadas deben ser todas del mismo valor (aunque los bufones son comodines y pueden jugarse con cualquier otra carta). A continuación, cada jugador, por turnos, debe jugar el mismo número de cartas de un valor superior o pasar. El juego continúa alrededor de la mesa hasta que todos hayan pasado; en ese momento, se retiran las cartas y quien haya jugado el último conjunto de cartas lidera la siguiente ronda. Una vez que todos se han quedado sin cartas, se establece la clasificación de los jugadores. Por ejemplo, la persona que se haya deshecho primero de todas sus cartas se convierte en «El Gran Dalmuti». Los jugadores cambian de asiento para reflejar la nueva jerarquía y comienzan otra ronda. El Gran Dalmuti suele jugarse a lo largo de muchas rondas. Se trata de una versión comercial del tradicional juego de cartas «President» (basado en el juego chino «Zheng Shangyou»), que también se ha reinterpretado como: Dilbert: Corporate Shuffle Pyramid Card Scum: The Food Chain Game Deathtrap Dungeon: Card Game"
              - list [ref=e7088]:
                - listitem [ref=e7089]: 8+
                - listitem [ref=e7093]: 60min
                - listitem [ref=e7097]: 4-8
              - generic [ref=e7103]: Fiesta
        - article [ref=e7104]:
          - link "El Guerrero — Disponible" [ref=e7105] [cursor=pointer]:
            - /url: /ludoteca/juegos/el-guerrero
            - generic [ref=e7107]:
              - generic [ref=e7108]: "7.5"
              - heading "El Guerrero" [level=3] [ref=e7109]
              - paragraph [ref=e7110]: El segundo jinete del Apocalipsis ha llegado. Primero fue «La Muerte» (El Mortal, publicado por Átomo y GDM Games) y ahora las tropas de todos los ejércitos conocidos de la humanidad se enfrentarán en el campo de batalla en una lucha épica sin precedentes en la historia. Elige tus ejércitos y juega tus cartas con astucia para tender trampas, equipar a tus huestes y debilitar a tus oponentes. Con tu mano de cartas puedes traer un ejército a tu pequeño tablero, equiparlo, debilitar los ejércitos de tus oponentes y colocar trampas boca abajo (que pueden ser trampas o no). A continuación, elige un adversario y lucha contra él para ganar puntos de moral. Una vez que llegue el guerrero, ¡el jugador con mayor moral lo sustituirá como jinete del Apocalipsis! «El Guerrero» es la secuela temática de «El Mortal» y promete ser uno de los juegos de cartas más hostiles del año.
              - list [ref=e7111]:
                - listitem [ref=e7112]: 8+
                - listitem [ref=e7116]: 30min
                - listitem [ref=e7120]: 3-6
              - generic [ref=e7126]: Card Game
        - article [ref=e7127]:
          - link "El Laberinto Mágico — Disponible" [ref=e7128] [cursor=pointer]:
            - /url: /ludoteca/juegos/el-laberinto-magico
            - generic [ref=e7130]:
              - generic [ref=e7131]: "6.8"
              - heading "El Laberinto Mágico" [level=3] [ref=e7132]
              - paragraph [ref=e7133]: Los pequeños aprendices de mago han perdido algunos objetos mágicos dentro del laberinto del maestro. Ahora intentan recuperarlos antes de que el maestro se dé cuenta de nada. Sin embargo, en el laberinto hay paredes invisibles y solo se revela uno de los objetos perdidos cada vez. Así que tienen que abrirse paso por el laberinto gracias a su buena memoria y a mucha habilidad. Cada jugador mueve a su mago por el tablero mientras intenta no chocar contra el laberinto que hay debajo. Cada mago está unido a una bola magnética, por lo que, si chocas contra una pared, la bola se cae y tienes que volver a empezar desde el principio.
              - list [ref=e7134]:
                - listitem [ref=e7135]: 6+
                - listitem [ref=e7139]: 30min
                - listitem [ref=e7143]: 2-4
              - generic [ref=e7149]: Infantil
        - article [ref=e7150]:
          - link "El lince — Disponible" [ref=e7151] [cursor=pointer]:
            - /url: /ludoteca/juegos/el-lince
            - generic [ref=e7153]:
              - generic [ref=e7154]: "5.5"
              - heading "El lince" [level=3] [ref=e7155]
              - paragraph [ref=e7156]: "Hay un tablero grande en el que se muestran cientos de imágenes diferentes. Este tablero se puede montar de diversas formas. Los jugadores sacan de una bolsa fichas con una sola imagen y tratan de encontrar esa imagen en el tablero. Los jugadores pueden elegir entre dos modalidades de juego: o bien se saca una ficha y todos los jugadores intentan encontrarla al mismo tiempo, o bien cada jugador saca varias fichas de la bolsa y gana el primero que encuentre todas sus imágenes en el tablero. En este juego, los jugadores encarnan a gatos que intentan encontrar diferentes objetos. El tablero tiene muchas imágenes (unas 300); se roba una carta con una imagen y, a continuación, se intenta encontrarla en el tablero y desplazarse hasta allí."
              - list [ref=e7157]:
                - listitem [ref=e7158]: 5+
                - listitem [ref=e7162]: 20min
                - listitem [ref=e7166]: 2-6
              - generic [ref=e7172]: Infantil
        - article [ref=e7173]:
          - link "El Mercado de los Ladrones — Disponible" [ref=e7174] [cursor=pointer]:
            - /url: /ludoteca/juegos/el-mercado-de-los-ladrones
            - generic [ref=e7176]:
              - generic [ref=e7177]: "6.4"
              - heading "El Mercado de los Ladrones" [level=3] [ref=e7178]
              - paragraph [ref=e7179]: ¡Sois todos unos ladrones! En cada ronda de «Thief’s Market», tiráis los dados del botín y lo repartís; después, utilizáis vuestras ganancias para comprar planes retorcidos, secuaces y atuendos elegantes con el fin de convertiros en el ladrón más famoso de todos. Cuando ya no se pueda reponer el surtido de cartas disponibles para comprar, la partida termina. Los jugadores con más secuaces y oro obtienen puntos de bonificación; a continuación, ¡gana el jugador con mayor notoriedad en cartas, fichas y bonificaciones!
              - list [ref=e7180]:
                - listitem [ref=e7181]: 10+
                - listitem [ref=e7185]: 50min
                - listitem [ref=e7189]: 3-5
              - generic [ref=e7195]: Familiar
        - article [ref=e7196]:
          - link "El monstre de colors — Disponible" [ref=e7197] [cursor=pointer]:
            - /url: /ludoteca/juegos/el-monstre-de-colors
            - generic [ref=e7199]:
              - generic [ref=e7200]: "6.5"
              - heading "El monstre de colors" [level=3] [ref=e7201]
              - paragraph [ref=e7202]: En «The Color Monster», los jugadores colaboran para ayudar al monstruo a identificar sus emociones. Por turnos, lanzan el dado que les permite mover al monstruo por el tablero. Cuando el monstruo llega a una casilla con una ficha de emoción, el jugador puede cogerla y buscar el frasco correspondiente. Todos los frascos están colocados en estantes con sus colores ocultos. Si el jugador elige el frasco que coincide con el color de la emoción, puede colocar la ficha de emoción en el frasco. De lo contrario, el frasco vuelve a la estantería tal y como estaba. Para poder coger una ficha de emoción, los jugadores tienen que explicar un recuerdo o una situación en la que hayan sentido la emoción que están eligiendo (alegría, tristeza, enfado, miedo o calma). Los jugadores pueden perder la partida si el Monstruo se confunde demasiado y dan la vuelta a demasiados frascos de emociones mezcladas, o ganar la partida cuando todas las emociones estén colocadas en sus frascos correctos. —Descripción del editor
              - list [ref=e7203]:
                - listitem [ref=e7204]: 3+
                - listitem [ref=e7208]: 25min
                - listitem [ref=e7212]: 2-5
              - generic [ref=e7218]: Infantil
        - article [ref=e7219]:
          - link "El Rey de los Dados — Disponible" [ref=e7220] [cursor=pointer]:
            - /url: /ludoteca/juegos/el-rey-de-los-dados
            - generic [ref=e7222]:
              - generic [ref=e7223]: "6.9"
              - heading "El Rey de los Dados" [level=3] [ref=e7224]
              - paragraph [ref=e7225]: "El rey de los dados ¡Por fin eres rey! Todos tus sueños se han hecho realidad. Te sientas satisfecho en tu castillo y contemplas tu maravilloso reino. Prados verdes, campos ondulados, altas montañas y ríos cristalinos se extienden hasta donde alcanza la vista... pero a tu reino le falta algo: ¡ciudadanos! Así que anuncias las bondades del reino por todo el país: en las ciudades ricas, a los gnomos alocados en sus talleres, a los enanos en sus profundas minas, y también a los orcos, las hadas y los aprendices de hechicero. Pero no es fácil convencerlos; al fin y al cabo, también hay otros reyes intentando ganárselos. Por eso necesitas habilidad y suerte con los dados para atraer a los mejores ciudadanos a tu reino. Pero ten cuidado con los sinvergüenzas y los dragones. De lo contrario, tu próspero reino pronto se convertirá en un desolado páramo, y tendrás que ver cómo alguien más es coronado Rey de los Dados. ¡Haz que tu reino prospere! Paso 1: Consigue nuevos ciudadanos para tu reino cumpliendo los distintos requisitos de las cartas con tres tiradas de dados. Paso 2: Las cartas especiales te proporcionan ventajas. Pero ten cuidado con los sinvergüenzas y los dragones. Paso 3: ¡El jugador que tenga los mejores ciudadanos al final gana la partida!"
              - list [ref=e7226]:
                - listitem [ref=e7227]: 8+
                - listitem [ref=e7231]: 30min
                - listitem [ref=e7235]: 2-5
              - generic [ref=e7241]: Familiar
        - article [ref=e7242]:
          - link "El Rey de los Enanos — Disponible" [ref=e7243] [cursor=pointer]:
            - /url: /ludoteca/juegos/el-rey-de-los-enanos
            - generic [ref=e7245]:
              - generic [ref=e7246]: "6.5"
              - heading "El Rey de los Enanos" [level=3] [ref=e7247]
              - paragraph [ref=e7248]: "«El Rey de los Enanos» (Le Roi des Nains) es un juego de bazas que se juega con una baraja de 53 cartas: tres palos (Enanos, Goblins y Caballeros) de trece cartas cada uno y catorce cartas especiales. El juego también incluye veinte fichas de contrato. El juego se desarrolla a lo largo de siete rondas. Al comienzo de cada ronda, el repartidor roba al azar una carta especial, la lee en voz alta a todos los jugadores, la baraja con el mazo y, a continuación, reparte las cartas de forma equitativa entre todos los jugadores. (El repartidor de la primera ronda es el propietario del juego; en las rondas siguientes, el repartidor es quien se quedó con el 5 de Enanos en la ronda anterior.) El jugador que reciba el 5 de Caballeros roba una ficha de contrato, la lee y, a continuación, elige una de las dos reglas de puntuación que figuran en ella para aplicarla en esa ronda. El jugador que tenga el 5 de Goblins abre la primera baza. Los jugadores deben seguir el palo si es posible, y el juego no incluye triunfos. La carta más alta jugada del palo de salida gana la baza y abre la siguiente. Una vez que se han jugado todas las cartas, los jugadores suman sus puntos (que pueden ser negativos), retiran la carta especial y la ficha de contrato del juego y, a continuación, barajan para la siguiente ronda. El jugador que consiga más puntos a lo largo de siete rondas gana la partida. Orígenes de Barbu"
              - list [ref=e7249]:
                - listitem [ref=e7250]: 10+
                - listitem [ref=e7254]: 40min
                - listitem [ref=e7258]: 3-5
              - generic [ref=e7264]: Familiar
