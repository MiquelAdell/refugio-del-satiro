        - article [ref=e9170]:
          - 'link "Pacífica: La ciudad bajo el mar — Disponible" [ref=e9171] [cursor=pointer]':
            - /url: /ludoteca/juegos/pacifica-la-ciudad-bajo-el-mar
            - generic [ref=e9173]:
              - generic [ref=e9174]: "6.5"
              - 'heading "Pacífica: La ciudad bajo el mar" [level=3] [ref=e9175]'
              - paragraph [ref=e9176]: La ciudad sumergida de Pacifica está volviendo a la vida, y dos personas tendrán la oportunidad de decidir cómo será la ciudad en el futuro. Para ello, recogen tesoros artísticos, construyen caminos y promueven inventos. Quien se imponga en una disciplina recibe un ídolo. ¿Quién conseguirá avanzar lo más rápido posible en la construcción de la ciudad submarina de Pacifica? ¿Quién tendrá la estrategia adecuada… y un poco de suerte?
              - list [ref=e9177]:
