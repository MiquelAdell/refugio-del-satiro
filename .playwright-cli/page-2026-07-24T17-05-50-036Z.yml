        - article [ref=e8365]:
          - link "Licántropo — Disponible" [ref=e8366] [cursor=pointer]:
            - /url: /ludoteca/juegos/licantropo
            - generic [ref=e8368]:
              - generic [ref=e8369]: "7.0"
              - heading "Licántropo" [level=3] [ref=e8370]
              - paragraph [ref=e8371]: "Sin moderador, sin eliminaciones, partidas de diez minutos. One Night Ultimate Werewolf es un juego rápido para entre 3 y 10 jugadores en el que todos asumen un papel: uno de los malvados hombres lobo, el astuto alborotador, el servicial vidente o uno de los doce personajes diferentes, cada uno con una habilidad especial. En el transcurso de una sola mañana, tu pueblo decidirá quién es el hombre lobo... ¡porque basta con linchar a un solo hombre lobo para ganar! Como «One Night Ultimate Werewolf» es tan rápido, divertido y adictivo, querrás jugarlo una y otra vez, y nunca habrá dos partidas iguales. Este juego se puede combinar con «One Night Ultimate Werewolf: Daybreak»."
              - list [ref=e8372]:
                - listitem [ref=e8373]: 8+
                - listitem [ref=e8377]: 10min
                - listitem [ref=e8381]: 3-10
              - generic [ref=e8387]: Fiesta
        - article [ref=e8388]:
          - link "L'Illa prohibida — Disponible" [ref=e8389] [cursor=pointer]:
            - /url: /ludoteca/juegos/l-illa-prohibida
            - generic [ref=e8391]:
              - generic [ref=e8392]: "6.8"
              - heading "L'Illa prohibida" [level=3] [ref=e8393]
              - paragraph [ref=e8394]: "«Forbidden Island» es un juego de mesa cooperativo visualmente impresionante. En lugar de ganar compitiendo con otros jugadores, como ocurre en la mayoría de los juegos, todos deben colaborar para ganar la partida. Los jugadores se turnan para mover sus fichas por la «isla», que se construye colocando las numerosas fichas, bellamente serigrafiadas, antes de que comience la partida. A medida que avanza la partida, cada vez se hunden más fichas de la isla, que dejan de estar disponibles, y el ritmo se acelera. Los jugadores utilizan estrategias para evitar que la isla se hunda, al tiempo que intentan recoger tesoros y objetos. A medida que sube el nivel del agua, la partida se vuelve más difícil: hay que hacer sacrificios. Lo que hace que este juego destaque realmente tanto entre los juegos cooperativos como entre los competitivos es el extremo detalle que se ha prestado a los componentes físicos del juego. Viene en una lata resistente y bien organizada, de un tamaño ideal para guardarla en la estantería. Las piezas de tesoro de plástico y las fichas de madera están bien elaboradas y encajan a la perfección en la caja. Las cartas son resistentes, están bien impresas y son fáciles de entender. Las fichas de la isla son la verdadera joya: están serigrafiadas con colores vivos, y cada una presenta una imagen única y atractiva. Con múltiples niveles de dificultad, diferentes personajes entre los que elegir (cada uno con su propia habilidad especial), numerosas configuraciones opcionales de la isla y variantes de juego disponibles, «Forbidden Island» tiene un enorme valor de rejugabilidad. El juego puede disputarse con un mínimo de dos jugadores y hasta cuatro (aunque admite hasta cinco). Cuantos más jugadores, más rápido y difícil es el juego, aunque la ayuda extra puede marcar la diferencia. Se trata de un juego divertido y desafiante para jugadores de casi cualquier edad. Con un precio inferior a veinte dólares, curiosamente, «Forbidden Island» es uno de esos juegos poco comunes que combinan calidad y precio asequible. Para aquellos a los que les guste «Forbidden Island», en 2013 se lanzó un proyecto sucesor de Gamewright titulado «Forbidden Desert». De la página web de la editorial: ¡Atrévete a descubrir Forbidden Island! Únete a un equipo de intrépidos aventureros en una misión a vida o muerte para hacerse con cuatro tesoros sagrados de las ruinas de este peligroso paraíso. ¡Tu equipo tendrá que trabajar en equipo y llevar a cabo maniobras trepidantes, ya que la isla se hundirá con cada paso que deis! ¡Corre para recoger los tesoros y lograr una huida triunfal antes de que te trague el abismo acuático!"
              - list [ref=e8395]:
                - listitem [ref=e8396]: 10+
                - listitem [ref=e8400]: 30min
                - listitem [ref=e8404]: 2-4
              - generic [ref=e8410]: Familiar
        - article [ref=e8411]:
          - link "Listillo — Disponible" [ref=e8412] [cursor=pointer]:
            - /url: /ludoteca/juegos/listillo
            - generic [ref=e8414]:
              - generic [ref=e8415]: "6.7"
              - heading "Listillo" [level=3] [ref=e8416]
              - paragraph [ref=e8417]: "En este juego tienes dos opciones: si sabes la respuesta y quieres presumir de tu inteligencia, o si crees que tu invento suena convincente aunque no tengas ni idea, escribe la respuesta correcta (o la que suene más correcta). Si no se te ocurre nada muy creíble, inventa la respuesta más divertida y haz que tus compañeros voten por ti como el que les ha hecho reír. ¡Ganarás puntos tanto si creen que tu respuesta es la correcta como si escribes la más divertida! —Descripción del editor"
              - list [ref=e8418]:
