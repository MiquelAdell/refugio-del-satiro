        - article [ref=e6966]:
          - link "Duelo por Cardia — Disponible" [ref=e6967] [cursor=pointer]:
            - /url: /ludoteca/juegos/duelo-por-cardia
            - generic [ref=e6969]:
              - generic [ref=e6970]: "7.5"
              - heading "Duelo por Cardia" [level=3] [ref=e6971]
              - paragraph [ref=e6972]: "Cardia es un juego de cartas estratégico y trepidante para dos jugadores: elige bien tus cartas para ganar cada enfrentamiento contra tu rival. En agradecimiento por su liberación, un poderoso genio creó la maravillosa ciudad de Cardia. Cuenta la leyenda que quien se imponga a las cuatro facciones y consiga sus cinco poderosos anillos con sello gobernará la ciudad. ¡Tu objetivo está claro! Cada jugador controlará uno de los dos mazos, compuestos por las mismas cartas para cada uno, con valores del 1 al 16 y en los que cada carta tiene habilidades únicas. ¡Juega tus cartas en el momento en que tu rival menos se lo espere y utiliza sus habilidades con inteligencia para burlarte de él! —Descripción del editor"
              - list [ref=e6973]:
