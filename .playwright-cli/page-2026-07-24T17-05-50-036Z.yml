              - heading "Taco Gato Cabra Queso Pizza" [level=3] [ref=e10413]
              - paragraph [ref=e10414]: ¡El juego «Taco Cat Goat Cheese Pizza» está repleto de caos y palmadas! Al igual que en «Snap» y «Dobble», cada jugador coloca una carta de su mano boca arriba en una pila común mientras dice «taco», «gato», «cabra», «queso» o «pizza» siguiendo el orden de los jugadores. Cuando la carta coincide con el mantra —¡bum!—, todos dan una palmada sobre el mazo, y el último en hacerlo se queda con las cartas. ¡El primero en deshacerse de todas sus cartas gana! Para que sea aún más divertido, las cartas de acción especiales —el gorila, el narval y la marmota— obligan a los jugadores a hacer ciertos gestos antes de correr a dar una palmada en el montón.
