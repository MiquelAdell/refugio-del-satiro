        - article [ref=e8595]:
          - link "Mascarade — Disponible" [ref=e8596] [cursor=pointer]:
            - /url: /ludoteca/juegos/mascarade
            - generic [ref=e8598]:
              - generic [ref=e8599]: "6.5"
              - heading "Mascarade" [level=3] [ref=e8600]
              - paragraph [ref=e8601]: "¿Quién eres en Mascarade? Quien quieras ser… ¡al menos hasta que alguien te descubra! Cada personaje recibe una carta de rol boca abajo al comienzo de la partida y, en una partida de 4 a 5 jugadores, algunas cartas de rol se colocan en el centro de la mesa. En tu turno, puedes realizar una de estas tres acciones: Anunciar tu personaje: Reivindica el poder de un personaje concreto y realiza la acción asociada. No es necesario que tengas esa carta de personaje delante de ti para realizar esta acción, pero si otro jugador afirma que es ese personaje y revela la carta para demostrarlo, ese jugador realizará la acción en tu lugar, mientras que tú perderás una moneda a favor del tribunal. Intercambiar cartas o no: Coge la carta de personaje de otro jugador junto con la tuya, colócalas debajo de la mesa, baraja un poco y, a continuación, devuelve una carta al otro jugador mientras te quedas con otra. Tú (presumiblemente) sabes si has cambiado de personaje y puedes hacerte una idea de quién eres ahora, pero es posible que el otro jugador no tenga ni idea. Mira en secreto tu personaje: Echa un vistazo a tu carta de personaje para asegurarte de quién eres. La partida continúa hasta que un jugador haya reunido 13 monedas y gane, o hasta que un jugador haya perdido todas sus monedas, en cuyo caso gana el jugador con más monedas. Mascarade incluye más cartas de personaje que el número de jugadores, por lo que no se utilizarán todos los personajes en cada partida. Las reglas sugieren que utilices determinados personajes en tus primeras partidas, pero una vez que conozcas el juego y sus roles, puedes probar muchas otras configuraciones."
