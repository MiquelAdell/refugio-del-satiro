        - article [ref=e5862]:
          - link "Azul — Disponible" [ref=e5863] [cursor=pointer]:
            - /url: /ludoteca/juegos/azul
            - generic [ref=e5865]:
              - generic [ref=e5866]: "7.7"
              - heading "Azul" [level=3] [ref=e5867]
              - paragraph [ref=e5868]: Introducidos por los moros, los azulejos (originalmente baldosas de cerámica blancas y azules) fueron acogidos con gran entusiasmo por los portugueses cuando su rey Manuel I, durante una visita al palacio de la Alhambra, en el sur de España, quedó hipnotizado por la impresionante belleza de los azulejos decorativos moriscos. El rey, impresionado por la belleza interior de la Alhambra, ordenó inmediatamente que su propio palacio en Portugal se decorara con azulejos similares. Como artista especializado en la colocación de azulejos, se te ha encomendado la tarea de embellecer las paredes del Palacio Real de Évora. En el juego Azul, los jugadores se turnan para adquirir azulejos de colores de los proveedores y colocarlos en su tablero de jugador. Más adelante en la ronda, los jugadores obtienen puntos en función de cómo hayan colocado sus azulejos para decorar el palacio. Se obtienen puntos extra por patrones específicos y por completar conjuntos; los recursos desperdiciados perjudican la puntuación del jugador. El jugador con más puntos al final de la partida gana.
