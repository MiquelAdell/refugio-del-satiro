        - article [ref=e10960]:
          - link "Wake up, Cthulhu! — Disponible" [ref=e10961] [cursor=pointer]:
            - /url: /ludoteca/juegos/wake-up-cthulhu
            - generic [ref=e10963]:
              - generic [ref=e10964]: "5.4"
              - heading "Wake up, Cthulhu!" [level=3] [ref=e10965]
              - paragraph [ref=e10966]: "Un horror indescriptible está despertando. Lo conoces, lo adorabas, te concedió poderes con los que el resto de nosotros solo podemos soñar. Sabes que, cuando despierte, devorará todo lo que se encuentre a su paso. Solo tienes una opción: demostrar que comprendes el Gran Arcano mejor que los demás cultistas y convertirte en su mano derecha en sus planes de dominación dimensional. El problema surge cuando el resto de los sectarios también quieren sobrevivir al despertar del Señor, y algunos de ellos tienen más conocimientos que tú. ¡Utiliza el Grimorio y demuestra al Señor que tu sabiduría está por encima de la de los demás! «¡Despierta, Cthulhu!» es un juego de cartas para 2-4 jugadores en el que debes convertirte en el jugador con más puntos de Conocimiento Arcano en tu poder en el tablero cuando despierte el Vástago del Inframundo. Para ello, dispones de un conjunto de ingredientes, representados por símbolos, cuya combinación te permitirá lanzar hechizos que extraerás del grimorio. Algunos hechizos te permiten adquirir dicho conocimiento (puntos arcanos en el tablero) y otros te darán la opción de demostrar tu sabiduría mediante diversas estrategias. Pero cuidado: al final de cada ronda, una maldición se abate sobre los jugadores (el uso de poderes oscuros tiene sus consecuencias) y puede inclinar la balanza hacia un lado u otro. Algunas de estas maldiciones pueden provocar que el Horror despierte antes de lo esperado y que todos los jugadores sean devorados, por lo que, en ocasiones, deberán unir fuerzas antes de seguir luchando."
