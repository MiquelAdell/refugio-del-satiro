            - generic [ref=e10181]:
              - generic [ref=e10182]: "8.1"
              - heading "Sky Team" [level=3] [ref=e10183]
              - paragraph [ref=e10184]: Sky Team es un juego cooperativo, exclusivamente para dos jugadores, en el que encarnáis a un piloto y a un copiloto a los mandos de un avión de pasajeros. Vuestro objetivo es trabajar juntos como un equipo para aterrizar vuestro avión en diferentes aeropuertos de todo el mundo. Para aterrizar el avión, debéis colocar en silencio los dados en las casillas correctas de la cabina para equilibrar el eje del avión, controlar su velocidad, desplegar los alerones, extender el tren de aterrizaje, contactar con la torre de control para que os despejen la pista e incluso tomaros un cafecito para mejorar vuestra concentración lo suficiente como para cambiar el valor de los dados. Si el avión se inclina demasiado y entra en pérdida, se pasa de la pista o choca con otra aeronave, perderás la partida… y tu licencia de piloto… y probablemente la vida. Desde Montreal hasta Tokio, cada aeropuerto presenta sus propios retos. ¡Cuidado con las turbulencias, ya que el vuelo podría acabar siendo bastante agitado! —Descripción del editor
