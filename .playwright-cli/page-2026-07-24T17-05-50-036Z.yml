        - article [ref=e7399]:
          - link "Esqueleto Calavera Diablito — Disponible" [ref=e7400] [cursor=pointer]:
            - /url: /ludoteca/juegos/esqueleto-calavera-diablito
            - generic [ref=e7402]:
              - generic [ref=e7403]: "6.0"
              - heading "Esqueleto Calavera Diablito" [level=3] [ref=e7404]
              - paragraph [ref=e7405]: "«Esqueleto, Calavera, Diablito» («Skeleton, Skull, Devil») es un juego de cartas competitivo y trepidante en el que los jugadores deben descartar sus cartas, sin seguir un orden de turno, para agotar todo su mazo y ganar la partida. Al comienzo de la partida, cada jugador recibe un mazo de cartas de esqueleto, calavera y diablito del mismo color y las coloca boca abajo en su mano. Tras una cuenta atrás, comienza la partida y los jugadores deben descartar sus cartas en el centro de la mesa en el siguiente orden: Esqueleto - Calavera - Diablito - Esqueleto - Calavera... Cada jugador debe mirar las cartas de su mazo una a una y ver si puede colocarlas en el centro de la mesa continuando la secuencia o no. Si puede, coloca la carta encima de las anteriores y anuncia qué carta ha puesto. Por el contrario, si la carta no es válida para la secuencia, debe colocarla al final de su mazo y robar la siguiente carta. El juego termina cuando a un jugador se le acaban las cartas; ese jugador abre el portal al más allá y puede reunirse con las almas de sus seres queridos. Durante el Día de Muertos, las almas de quienes han fallecido tienen la oportunidad de volver junto a sus seres queridos. Solo la más veloz podrá cruzar el portal que separa ambos mundos. Rápido. Quien primero se quede sin cartas, gana. Reúne todas las cartas de un mismo color y barájalas. Descarta tus cartas siguiendo este orden: Esqueleto, Calavera y Diablito."
              - list [ref=e7406]:
                - listitem [ref=e7407]: 8+
                - listitem [ref=e7411]: 3min
