              - heading "Max MäuseSchreck" [level=3] [ref=e8623]
              - paragraph [ref=e8624]: Cada jugador es un ratón que corre de un lado a otro alrededor de un queso gigante, ¡deslizándose por los agujeros! Compite para ser el primero en recoger cinco trozos de queso y ganar. ¡Cuidado, el gato (Max) te está esperando! Si te pilla, ¡perderás tu queso!
