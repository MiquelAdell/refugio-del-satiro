        - article [ref=e6828]:
          - link "Distop-IA — Disponible" [ref=e6829] [cursor=pointer]:
            - /url: /ludoteca/juegos/distop-ia
            - generic [ref=e6831]:
              - generic [ref=e6832]: "8.0"
              - heading "Distop-IA" [level=3] [ref=e6833]
              - paragraph [ref=e6834]: "Distop-IA es un juego de cartas ambientado en una distopía de un futuro cercano en la que los objetos analógicos están prohibidos. Los jugadores asumen el papel de contrabandistas que intentan transportar libros, juguetes o casetes entre distritos y a través de la frontera, todo ello mientras evitan a los guardias robóticos que patrullan. El juego se desarrolla por turnos alternos: cada jugador elige uno de sus distritos, recoge todas sus cartas y las distribuye en sentido antihorario, como en una partida de Mancala. Los jugadores deben actuar con estrategia para hacer pasar los bienes a escondidas ante los guardias y llevarlos a los distritos rivales. A lo largo de la partida, pueden aparecer cartas de alarma con sirenas que hacen que los guardias se desplacen, lo que complica aún más el contrabando. El juego termina cuando se agota el mazo o cuando un jugador tiene un guardia en cada distrito. Al final, los jugadores suman sus puntos en función de los bienes valiosos que hayan conseguido conservar, y cada guardia elimina una carta valiosa. Gana el jugador con más puntos. También hay un modo avanzado que incluye cartas de misión con modificadores de puntos y otras cartas especiales."
              - list [ref=e6835]:
                - listitem [ref=e6836]: 10+
                - listitem [ref=e6840]: 15min
                - listitem [ref=e6844]: 2-2
              - generic [ref=e6850]: Card Game
        - article [ref=e6851]:
          - 'link "Dixit: Odyssey — Disponible" [ref=e6852] [cursor=pointer]':
            - /url: /ludoteca/juegos/dixit-odyssey
            - generic [ref=e6854]:
              - generic [ref=e6855]: "7.4"
              - 'heading "Dixit: Odyssey" [level=3] [ref=e6856]'
              - paragraph [ref=e6857]: "Dixit Odyssey es tanto un juego independiente como una expansión (Dixit: Odyssey (expansión)) del juego Dixit, de Jean-Louis Roubira, que ganó el premio alemán Spiel des Jahres en 2010. La mecánica de juego de Dixit Odyssey es idéntica a la de Dixit: en cada turno, un jugador actúa como narrador. Este jugador elige en secreto una carta de su mano y, a continuación, da una palabra o frase para describirla, pero sin que resulte demasiado obvio. Cada uno de los demás jugadores elige una carta de su mano que coincida con esa palabra o frase y se la entrega al narrador. A continuación, el narrador coloca las cartas sobre la mesa y el resto de jugadores votan cuál de ellas es la del narrador. Si nadie o todos adivinan la carta del narrador, este no recibe ningún punto y todos los jugadores reciben dos; en caso contrario, tanto el narrador como quienes hayan acertado reciben tres puntos cada uno. Los jugadores obtienen un punto por cada voto que reciba su imagen. Los jugadores reponen sus manos y el siguiente jugador se convierte en el narrador. Cuando se agota el mazo, gana el jugador con más puntos. Dixit Odyssey contiene 84 cartas nuevas, cada una con una imagen única dibujada por Pierô y coloreada por Marie Cardouat, artista de Dixit y Dixit 2. La versión independiente también incluye un tablero de juego plegable, 6 nuevas fichas de puntuación con forma de conejo (12 en total) y una caja lo suficientemente grande como para guardar todas las cartas de Dixit publicadas hasta la fecha. La versión independiente de Dixit Odyssey incluye componentes suficientes para hasta doce jugadores y también cuenta con reglas alternativas para el juego por equipos y nuevas formas de jugar con las cartas. Diferencias entre la versión de expansión y la versión independiente del juego. La versión independiente viene en una caja cuadrada (lanzada en 2011, pero puede que aún esté disponible). La versión de expansión viene en una caja rectangular (disponible a partir de 2013): Dixit: Odyssey (expansión)"
              - list [ref=e6858]:
                - listitem [ref=e6859]: 8+
                - listitem [ref=e6863]: 30min
                - listitem [ref=e6867]: 3-12
              - generic [ref=e6873]: Fiesta
        - article [ref=e6874]:
          - link "Dominion — Disponible" [ref=e6875] [cursor=pointer]:
            - /url: /ludoteca/juegos/dominion
            - generic [ref=e6877]:
              - generic [ref=e6878]: "7.6"
              - heading "Dominion" [level=3] [ref=e6879]
              - paragraph [ref=e6880]: «Eres un monarca, como lo fueron tus padres antes que tú, gobernante de un pequeño y agradable reino de ríos y árboles de hoja perenne. Sin embargo, a diferencia de tus padres, ¡tienes esperanzas y sueños! Quieres un reino más grande y más agradable, con más ríos y una mayor variedad de árboles. ¡Quieres un dominio! En todas direcciones se extienden feudos, propiedades libres y dominios feudales. Todos son pequeños pedazos de tierra, controlados por señores de poca monta y al borde de la anarquía. Llevarás la civilización a estas gentes, uniéndolas bajo tu estandarte. ¡Pero espera! Debe de ser algo que hay en el aire; varios otros monarcas han tenido exactamente la misma idea. Debes dar prisa para hacerte con la mayor cantidad posible de tierras sin reclamar, repeliéndolos por el camino. Para ello, contratarás secuaces, construirás edificios, embellecerás tu castillo y llenarás las arcas de tu tesorería. Tus padres no estarían orgullosos, pero tus abuelos, por parte de tu madre, estarían encantados». —Descripción de la parte trasera de la caja En Dominion, cada jugador comienza con un mazo de cartas idéntico y muy pequeño. En el centro de la mesa hay una selección de otras cartas que los jugadores pueden «comprar» a medida que se lo puedan permitir. A través de la selección de cartas que compran y de cómo juegan las que roban, los jugadores construyen su mazo sobre la marcha, buscando la ruta más eficaz para conseguir los preciados puntos de victoria al final de la partida. Dominion no es un juego de cartas coleccionables (JCC), pero su mecánica es similar a la construcción y el juego de un mazo de JCC. El juego incluye 500 cartas. Se eligen 10 de los 25 tipos de cartas de Reino para incluirlas en cada partida, lo que da lugar a una inmensa variedad. —Resumen del usuario Parte de la serie Dominion.
