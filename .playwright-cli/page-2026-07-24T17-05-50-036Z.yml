        - article [ref=e8434]:
          - link "Los Hombres Lobo de Castronegro — Disponible" [ref=e8435] [cursor=pointer]:
            - /url: /ludoteca/juegos/los-hombres-lobo-de-castronegro
            - generic [ref=e8437]:
              - generic [ref=e8438]: "6.7"
              - heading "Los Hombres Lobo de Castronegro" [level=3] [ref=e8439]
              - paragraph [ref=e8440]: "«Los hombres lobo de Miller's Hollow» es un juego que tiene lugar en un pequeño pueblo acechado por hombres lobo. A cada jugador se le asigna en secreto un papel: hombre lobo, aldeano corriente o personaje especial, como el sheriff, el cazador, la bruja, la niña pequeña, la adivina, etc. También hay un jugador moderador que controla el desarrollo de la partida. El juego alterna entre fases nocturnas y diurnas. Por la noche, los hombres lobo eligen en secreto a un aldeano al que matar. Durante el día, se revela la identidad del aldeano asesinado, que queda fuera del juego. Los aldeanos restantes (tanto normales como especiales) deliberan y votan entonces a un jugador del que sospechan que es un hombre lobo, ayudados (o entorpecidos) por las pistas que los personajes especiales aportan a la deliberación general. El jugador elegido es «linchado», revela su papel y queda fuera del juego. «Los hombres lobo» es un juego social que no requiere material alguno para jugar y que puede adaptarse a casi cualquier grupo numeroso de jugadores. «Los hombres lobo de Miller's Hollow»/«Les Loups-Garous de Thiercelieux»/«Die Werwölfe von Düsterwald» es una versión editada por Hervé Marly y Philippe des Pallières y publicada por Lui-même en 2001 para entre 8 y 23 jugadores. Este juego fue nominado al premio Spiel des Jahres de 2003. «Los hombres lobo de Miller's Hollow» es un juego independiente de «Hombre lobo» y se separó de esa entrada a petición de Asmodee."
              - list [ref=e8441]:
                - listitem [ref=e8442]: 10+
