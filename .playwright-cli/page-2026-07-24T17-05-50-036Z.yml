        - article [ref=e7675]:
          - link "Genial — Disponible" [ref=e7676] [cursor=pointer]:
            - /url: /ludoteca/juegos/genial
            - generic [ref=e7678]:
              - generic [ref=e7679]: "7.1"
              - heading "Genial" [level=3] [ref=e7680]
              - paragraph [ref=e7681]: En Ingenious, también conocido como Einfach Genial, los jugadores se turnan para colocar fichas de colores, similares a las de un dominó, en un tablero de juego, y suman puntos por cada línea de símbolos del mismo color que consigan alargar. Sin embargo, la clave está en que la puntuación de un jugador es igual a la de su color con peor puntuación, no a la de su mejor color, por lo que debe intentar sumar puntos con todos los colores en lugar de especializarse solo en uno o dos. Más concretamente, el juego incluye 120 fichas al estilo dominó, cada una formada por dos hexágonos unidos; cada hexágono tiene uno de los seis colores, y la mayoría de las fichas tienen hexágonos de colores diferentes. Cada jugador dispone de un soporte con seis fichas, y en su turno coloca una ficha de su soporte sobre dos hexágonos del tablero de juego. Por cada hexágono de esta ficha, obtiene un punto de ese color por cada hexágono del mismo color que se encuentre adyacente a él y por cada hexágono situado en línea recta con respecto a él. Si un jugador alcanza los 18 puntos en un color, juega inmediatamente otro turno. Al final de su turno, vuelve a llenar su estante hasta tener seis fichas. (Antes de rellenar su estante, si no tiene ninguna ficha que contenga hexágonos de su color con menor puntuación, puede descartar todas sus fichas y, a continuación, robar seis fichas nuevas de la bolsa). Cuando ya no se puedan colocar más fichas en el tablero o cuando un jugador alcance los 18 puntos en cada color, la partida termina. A continuación, los jugadores comparan sus puntuaciones más bajas, y gana quien tenga la puntuación baja más alta. Ingenious incluye reglas para jugar en solitario y por equipos; en este último caso, juegan dos equipos de dos personas, en los que cada jugador no puede ver las fichas de su compañero y los equipos suman una puntuación conjunta que alcanza un máximo de 36 en lugar de 18.
