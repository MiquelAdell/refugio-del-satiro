        - article [ref=e10753]:
          - link "Trio — Disponible" [ref=e10754] [cursor=pointer]:
            - /url: /ludoteca/juegos/trio
            - generic [ref=e10756]:
              - generic [ref=e10757]: "7.4"
              - heading "Trio" [level=3] [ref=e10758]
              - paragraph [ref=e10759]: «Nana», que más tarde se reeditó con el nombre de «Trio», es un juego de cartas en el que los jugadores deben formar un trío. La baraja consta de 36 cartas, numeradas del 1 al 12 tres veces. Los jugadores reciben algunas cartas en la mano, que deben ordenar de menor a mayor, y las cartas restantes se colocan boca abajo sobre la mesa. En tu turno, elige cualquier carta para descubrirla, ya sea la carta más baja o la más alta de la mano de un jugador (incluida la tuya) o cualquier carta boca abajo de la mesa. A continuación, repite la operación. Si las dos cartas muestran el mismo número, continúa tu turno; si no es así, devuelve las cartas a su lugar original y termina tu turno. Si descubres tres cartas con el mismo número, toma estas cartas como un conjunto y colócalas delante de ti. Si eres el primer jugador en reunir tres conjuntos, ganas; salvo que un jugador gane inmediatamente si reúne el conjunto de sietes o dos conjuntos cuya suma o resta dé 7, por ejemplo, cuatros y once. Ten en cuenta que «nana» y «Trio» contienen componentes idénticos, pero «nana» está pensada para 2-5 jugadores, mientras que «Trio» lo está para 3-6 jugadores. «Trio» presenta ligeras modificaciones en las reglas, ya que los jugadores utilizan todas las cartas independientemente del número de participantes. Además, se puede jugar en modo normal —en el que se gana con tres series o con los 7— o en modo «picante», en el que se gana con dos series relacionadas o con los 7. Por último, «Trio» incluye reglas para jugar por equipos de cuatro o seis jugadores.
