        - article [ref=e6207]:
          - link "Catan — Disponible" [ref=e6208] [cursor=pointer]:
            - /url: /ludoteca/juegos/catan
            - generic [ref=e6210]:
              - generic [ref=e6211]: "7.1"
              - heading "Catan" [level=3] [ref=e6212]
              - paragraph [ref=e6213]: "En CATAN (antes conocido como «Los colonos de Catán»), los jugadores intentan convertirse en la fuerza dominante de la isla de Catán construyendo asentamientos, ciudades y caminos. En cada turno se lanzan los dados para determinar qué recursos produce la isla. Los jugadores construyen estructuras «gastando» recursos (ovejas, trigo, madera, ladrillos y mineral), que están representados por las correspondientes cartas de recurso; cada tipo de terreno, a excepción del desierto improductivo, produce un recurso específico: las colinas producen ladrillos, los bosques producen madera, las montañas producen mineral, los campos producen trigo y los pastos producen ovejas. La preparación del juego consiste en colocar al azar grandes fichas hexagonales (cada una de las cuales representa uno de los cinco tipos de terreno productores de recursos —o el desierto—) formando un panal y rodeándolas con fichas de agua, algunas de las cuales contienen puertos de intercambio. En cada ficha de terreno se coloca un disco numérico, cuyo valor se corresponderá con la tirada de dos dados de seis caras. A cada jugador se le entregan dos asentamientos (imagínate: casas) y caminos (palitos), que se colocan en las intersecciones y los bordes de las fichas de terreno. Los jugadores recogen una mano de cartas de recursos en función de las fichas de terreno a las que esté adyacente su último asentamiento colocado. Se coloca una ficha de ladrón en la ficha de desierto. Un turno consiste en tirar los dados, recoger cartas de recursos en función de la tirada y de la posición de los asentamientos (o ciudades mejoradas —piensa en hoteles—), canjear cartas de recursos (si es posible y se desea) por mejoras, intercambiar cartas en un puerto, posiblemente jugar una carta de desarrollo o intercambiar cartas de recursos con otros jugadores. Si la tirada de dados es un 7, el jugador activo mueve al ladrón a una nueva casilla de terreno y roba una carta de recurso a otro jugador que tenga un asentamiento adyacente a esa casilla. Los puntos se acumulan construyendo asentamientos y ciudades, teniendo la carretera más larga o el ejército más grande (gracias a algunas de las cartas de desarrollo) y reuniendo determinadas cartas de desarrollo que simplemente otorgan puntos de victoria. Cuando un jugador ha acumulado 10 puntos (algunos de los cuales pueden mantenerse en secreto), lo anuncia y se proclama vencedor."
