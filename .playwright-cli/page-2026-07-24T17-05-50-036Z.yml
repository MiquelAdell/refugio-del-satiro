        - article [ref=e6046]:
          - link "Botanicus — Disponible" [ref=e6047] [cursor=pointer]:
            - /url: /ludoteca/juegos/botanicus
            - generic [ref=e6049]:
              - generic [ref=e6050]: "7.4"
              - heading "Botanicus" [level=3] [ref=e6051]
              - paragraph [ref=e6052]: ¿Qué tal si creas tu propio jardín botánico? Como aristócrata de finales del siglo XIX, has comprado un terreno, has contratado a un jardinero y te has propuesto encontrar las mejores plantas que existen. Como ya sabes, los visitantes son muy exigentes con las plantas que quieren ver, por lo que tu tarea no solo consiste en adquirir las plantas, sino también en clasificarlas según las preferencias de los visitantes. En Botanicus, compites por los mejores lugares de acción mediante un mecanismo de selección único y, a continuación, aprovechas al máximo las opciones que tienes a tu disposición. Tienes que recolectar nuevas plantas, cuidarlas, regarlas y vigilar al jardinero. Por último, pero no menos importante, tienes que reunir algo de dinero por el camino para pagar todo esto. Al final, lo que cuenta es cuántos visitantes satisfaces y lo bonito que es tu jardín. ¿Serás capaz de superar a los jardines de tus competidores? —descripción del editor (traducida) ¿Qué te parecería crear tu propio jardín botánico? Como miembro de la aristocracia de finales del siglo XIX, has comprado un terreno, has contratado a un jardinero y te has propuesto encontrar las plantas más bonitas que existan. Sin embargo, los visitantes tienen ideas muy concretas sobre qué plantas quieren admirar en tu jardín. Así que no basta con plantarlas de cualquier manera; no, por desgracia, también tienes que colocarlas de tal forma que los visitantes adecuados vean lo que quieren ver. En Botancius compites con tus compañeros de juego mediante un nuevo mecanismo de acción para conseguir el mayor rendimiento de tu jardín. Así que debes hacerte con las plantas adecuadas y regarlas en el momento oportuno, ocuparte de tu jardinero y, por supuesto, ¡tampoco puedes descuidar tus finanzas! Al final, lo que cuenta es cuántos de los curiosos quedan satisfechos con su visita y lo bonito que es vuestro jardín. ¿Conseguirás eclipsar los jardines de tus rivales? —descripción del editor
