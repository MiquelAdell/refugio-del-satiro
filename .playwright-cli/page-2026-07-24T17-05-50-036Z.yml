        - article [ref=e9511]:
          - link "Pócimas y Brebajes — Disponible" [ref=e9512] [cursor=pointer]:
            - /url: /ludoteca/juegos/pocimas-y-brebajes
            - generic [ref=e9514]:
              - generic [ref=e9515]: "7.8"
              - heading "Pócimas y Brebajes" [level=3] [ref=e9516]
              - paragraph [ref=e9517]: En Quacks, que se publicó por primera vez con el título de The Quacks of Quedlinburg, los jugadores son charlatanes —o médicos charlatanes— y cada uno elabora su propio brebaje secreto añadiendo ingredientes de uno en uno. Pero ten cuidado con lo que añades, porque una pizca de más de esto o aquello echará a perder toda la mezcla. Cada jugador tiene su propia bolsa de fichas de ingredientes. Durante cada ronda, todos roban simultáneamente fichas de sus bolsas y las añaden a sus calderos. Cuanto mayor sea el valor nominal de la ficha robada, más lejos se colocará en el patrón en espiral del caldero, lo que aumentará el valor de la poción. Tienta a la suerte todo lo que puedas, pero si añades demasiadas bombas de cereza, ¡tu caldero explotará! Al final de cada ronda, los jugadores obtienen puntos de victoria y monedas para gastar en nuevos ingredientes, dependiendo de lo bien que hayan conseguido llenar sus calderos. Pero los jugadores cuyos calderos hayan explotado deben elegir entre puntos o monedas, ¡no ambos! El jugador con más puntos de victoria al final de las nueve rondas gana la partida.
