        - article [ref=e7537]:
          - 'link "Fills de la Boira: el joc de construcció de piles — Disponible" [ref=e7538] [cursor=pointer]':
            - /url: /ludoteca/juegos/fills-de-la-boira-el-joc-de-construccio-de-piles
            - generic [ref=e7540]:
              - generic [ref=e7541]: "7.7"
              - 'heading "Fills de la Boira: el joc de construcció de piles" [level=3] [ref=e7542]'
              - paragraph [ref=e7543]: "Basado en la exitosa serie de novelas «Mistborn», de Brandon Sanderson, «Mistborn: The Deckbuilding Game» sumerge a los jugadores en el mundo de Scadrial. De la mano del diseñador John D. Clair, los jugadores podrán controlar a personajes emblemáticos de la serie y «quemar» metales para desbloquear poderes alománticos en combates trepidantes. Mistborn es un juego independiente de construcción de mazos en el que «compras» cartas a medida que juegas para construir y mejorar tu mazo. «Quema» metales para activar cartas. Cada metal tiene sus propias ventajas: infligir daño a los oponentes, ganar puntos de misión y manipular a los aliados. ¡Hay múltiples formas de ganar! Derrota a tus oponentes en furiosas batallas alománticas o completa una serie de peligrosas misiones antes que tus enemigos. ¡Juega cara a cara contra tus amigos o enfréntate al Señor Gobernante en modo individual o cooperativo! —Descripción del editor"
              - list [ref=e7544]:
                - listitem [ref=e7545]: 13+
