        - article [ref=e7997]:
          - link "King of New York — Disponible" [ref=e7998] [cursor=pointer]:
            - /url: /ludoteca/juegos/king-of-new-york
            - generic [ref=e8000]:
              - generic [ref=e8001]: "6.9"
              - heading "King of New York" [level=3] [ref=e8002]
              - paragraph [ref=e8003]: "Siempre pasa algo en la ciudad que nunca duerme. ¡Quizá sean las luces, quizá sea la energía, o quizá sean los monstruos gigantes que intentan arrasar el lugar! King of New York es un juego independiente del diseñador Richard Garfield que mantiene las ideas fundamentales de King of Tokyo al tiempo que introduce nuevas formas de jugar. Al igual que en KoT, tu objetivo es ser el primer monstruo en acumular 20 puntos de victoria (PV) o ser el último monstruo en pie. En tu turno, lanzas seis dados hasta tres veces y, a continuación, realizas las acciones indicadas en los resultados. Las garras infligen daño a otros monstruos, los corazones curan el daño que has sufrido y la energía se acumula para que puedas comprar cartas de poder que te proporcionan efectos únicos a los que nadie más tiene acceso. La novedad de King of New York es que ahora puedes intentar convertirte en una estrella en la gran ciudad; más concretamente, puedes alcanzar la «Fama», lo que te reporta PV, pero el estatus de superestrella es efímero, así que disfruta de tu momento bajo los focos. El tablero de juego de King of New York es más grande que el de KoT: cada monstruo ocupa un distrito de la ciudad y todos intentan brillar en Manhattan. Cuando atacas, puedes desplazar a un monstruo a otro distrito, ya sea para escapar de las fuerzas militares o para encontrar nuevas oportunidades de destrucción. Sí, «destruir», porque ahora puedes derribar edificios y obtener bonificaciones por hacerlo, pero cuanta más destrucción causes, más intensa será la respuesta militar. Los monstruos de King of New York se pueden usar en KoT y viceversa, pero las cartas de poder son específicas de este juego. Parte de la serie King of Tokyo."
              - list [ref=e8004]:
                - listitem [ref=e8005]: 10+
                - listitem [ref=e8009]: 40min
                - listitem [ref=e8013]: 2-6
              - generic [ref=e8019]: Familiar
        - article [ref=e8020]:
          - link "King of Tokyo — Disponible" [ref=e8021] [cursor=pointer]:
            - /url: /ludoteca/juegos/king-of-tokyo
            - generic [ref=e8023]:
              - generic [ref=e8024]: "7.1"
              - heading "King of Tokyo" [level=3] [ref=e8025]
              - paragraph [ref=e8026]: "En King of Tokyo, encarnas a monstruos mutantes, robots gigantes y extraños alienígenas, todos ellos dedicados a destruir Tokio y a enfrentarse entre sí para convertirse en el único y auténtico Rey de Tokio. Al comienzo de cada turno, lanzas seis dados, que muestran los siguientes seis símbolos: 1, 2 o 3 puntos de victoria, energía, curación y ataque. A lo largo de tres tiradas sucesivas, elige si quieres quedarte con cada dado o descartarlo para ganar puntos de victoria, obtener energía, recuperar salud o atacar a otros jugadores y hacerles comprender que Tokio es TU territorio. El jugador más feroz ocupará Tokio y ganará puntos de victoria extra, ¡pero ese jugador no podrá curarse y deberá enfrentarse solo a todos los demás monstruos! A esto se suman las cartas especiales que se compran con energía y que tienen efectos permanentes o temporales, como el crecimiento de una segunda cabeza que te otorga un dado adicional, armadura corporal, un rayo mortal nova y mucho más... ¡Es uno de los juegos más explosivos del año! Para ganar la partida, hay que destruir Tokio acumulando 20 puntos de victoria o ser el único monstruo superviviente una vez que haya terminado la lucha. Primera partida de la serie «King of Tokyo»"
              - list [ref=e8027]:
                - listitem [ref=e8028]: 8+
                - listitem [ref=e8032]: 30min
                - listitem [ref=e8036]: 2-6
