              - heading "PUSH" [level=3] [ref=e9585]
              - paragraph [ref=e9586]: "Tienta a la suerte... ¡pero sin pasarte! Acumula puntos colocando cartas en las pilas, ¡pero ten cuidado! No puedes repetir ni el color ni el número. Elige cuándo parar y sumar los puntos de la mejor pila, ¡o tienta a la suerte e intenta conseguir más! Distribución de las cartas: 5 colores: rojo, azul, amarillo, verde y morado (90 en total) Cada color tiene números del 1 al 6, con 3 cartas de cada número (un total de 18 cartas por color) 18 cartas de «roll» 12 cartas de «switch» Total de cartas: 120 (90 de color + 18 de tirada + 12 de intercambio) Tamaño de las cartas: 2-1/2\" x 3-1/2\" (63 mm x 89 mm) — del mismo tamaño que las de «Magic: The Gathering» o «Pokémon»"
