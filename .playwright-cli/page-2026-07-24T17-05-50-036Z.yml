        - article [ref=e6253]:
          - link "Caverna 2 Jugadores — Disponible" [ref=e6254] [cursor=pointer]:
            - /url: /ludoteca/juegos/caverna-2-jugadores
            - generic [ref=e6256]:
              - generic [ref=e6257]: "7.1"
              - heading "Caverna 2 Jugadores" [level=3] [ref=e6258]
              - paragraph [ref=e6259]: "En el juego para dos jugadores «Caverna: Cave vs. Cave», cada jugador comienza la partida con solo dos enanos y una pequeña excavación en la ladera de una montaña. A lo largo de ocho rondas, duplicarán su mano de obra, abrirán nuevos espacios habitables en la montaña, construirán nuevos edificios y habitaciones en las que vivir, y excavarán en busca de metales preciosos. Más concretamente, cada jugador comienza la partida con un tablero de jugador individual cubierto por una selección aleatoria de fichas de edificios y habitaciones boca abajo y con un único espacio. Algunas fichas están boca arriba y disponibles para su compra al inicio de la partida. También hay cuatro fichas de acción boca arriba. Al comienzo de cada una de las ocho rondas, se revela una nueva ficha de acción; a continuación, los jugadores se turnan para realizar acciones, y el número de acciones aumenta de dos a cuatro a lo largo de la partida. A medida que los jugadores excavan en su tablero de jugador, que parece una montaña, se añaden nuevas fichas de edificios y habitaciones al fondo común; algunas habitaciones se pueden usar inmediatamente al adquirirlas, mientras que otras requieren el uso de una ficha de acción. Tras ocho rondas, los jugadores suman sus puntos por los edificios construidos y el oro recogido para determinar quién gana."
              - list [ref=e6260]:
                - listitem [ref=e6261]: 10+
                - listitem [ref=e6265]: 40min
                - listitem [ref=e6269]: 1-2
              - generic [ref=e6275]: Estrategia
        - article [ref=e6276]:
          - link "Caza Bombas — Disponible" [ref=e6277] [cursor=pointer]:
            - /url: /ludoteca/juegos/caza-bombas
            - generic [ref=e6279]:
              - generic [ref=e6280]: "8.0"
              - heading "Caza Bombas" [level=3] [ref=e6281]
              - paragraph [ref=e6282]: "Hay una bomba llena de cables y la cuenta atrás ha comenzado... ¿A quién vas a llamar? ¡A TI! Para desactivar la bomba, ¡tienes que colaborar con tu equipo de expertos en desactivación de bombas! Utilizando los cables del soporte que tienes delante, intenta averiguar cuáles son los cables de tus compañeros de equipo. Encuentra y corta los cables idénticos, pero ten cuidado: si cortas un cable rojo... ¡BOOM! Usa tu equipo con inteligencia para superar los diversos retos, que se van volviendo cada vez más difíciles. Tic-tac, tic-tac... ¿Lo resolverás antes de que sea demasiado tarde? En «Bomb Busters», hay un conjunto de 48 cartas de cables normales numeradas del 1 al 12 (4 de cada valor), junto con algunas cartas de cables amarillos y rojos. Estas se reparten entre los jugadores. Cada misión es diferente, pero tu objetivo es siempre el mismo: ¡recorrer los 12 números sin que explote la bomba! Los jugadores colocan las fichas en sus soportes y, a continuación, se turnan para señalar los cables de los demás y adivinar sus valores. Si la suposición es correcta, se cortan los cables. Si no, ¡el detonador avanza! Si consigues cortar todos los cables sin que la bomba explote, ¡enhorabuena, la misión está completada! Pero si la bomba explota... ¡Inténtalo de nuevo! Con 66 misiones, habrá: => 66 formas diferentes de jugar según tu estado de ánimo (en orden, por nivel de dificultad, con tu configuración favorita) => 66 retos para jugar una y otra vez (¡aunque ya te hayas vuelto loco!) => Un montón de bombas complicadas que se vuelven cada vez más peligrosas (¡pero no te preocupes por eso!)"
              - list [ref=e6283]:
                - listitem [ref=e6284]: 10+
                - listitem [ref=e6288]: 30min
                - listitem [ref=e6292]: 2-5
              - generic [ref=e6298]: Familiar
        - article [ref=e6299]:
          - link "Celestia — Disponible" [ref=e6300] [cursor=pointer]:
            - /url: /ludoteca/juegos/celestia
            - generic [ref=e6302]:
              - generic [ref=e6303]: "6.9"
              - heading "Celestia" [level=3] [ref=e6304]
              - paragraph [ref=e6305]: "En Celestia, una versión renovada de Cloud 9, te subes a un avión junto con un equipo de aventureros para realizar numerosos viajes por las ciudades de Celestia y recuperar sus maravillosos tesoros. ¡Tu viaje no estará exento de peligros, pero intentarás convertirte en el aventurero más rico reuniendo los tesoros más valiosos! Al comienzo de un viaje, todos los jugadores colocan sus fichas dentro de la aeronave; los jugadores empiezan la partida con seis cartas en la mano (u ocho, dependiendo del número de jugadores). Al comienzo de cada ronda, se elige a un jugador para que sea el capitán del viaje y este lanza entre 2 y 4 dados para descubrir los retos a los que se enfrentarán: niebla, rayos, aves asesinas o piratas. A continuación, debe jugar las cartas adecuadas —una brújula, un pararrayos, una sirena de niebla o incluso cañones— para continuar el viaje y llegar a la siguiente ciudad. Pero antes de que el capitán juegue las cartas adecuadas, cada jugador debe decidir si se queda en la aeronave: Si sales, tienes garantizados los puntos de victoria que se obtienen al explorar la ciudad actual. Si te quedas a bordo, esperas llegar a la siguiente ciudad para hacerte con más tesoros valiosos. Sin embargo, si el capitán no consigue superar el desafío, todos se estrellarán con las manos vacías y tendrás que comenzar un nuevo viaje con todos los pasajeros a bordo. Durante el viaje, cada aventurero puede intentar retirarse del juego con objetos fabulosos (un jetpack, prismáticos astronómicos, etc.) o modificando el viaje (cambiando la ruta o abandonando a un explorador en la ciudad). En cuanto un jugador consiga un tesoro por valor de al menos cincuenta puntos, el juego termina y ese jugador gana."
              - list [ref=e6306]:
                - listitem [ref=e6307]: 8+
                - listitem [ref=e6311]: 30min
                - listitem [ref=e6315]: 2-6
              - generic [ref=e6321]: Familiar
        - article [ref=e6322]:
          - link "Chactun — Disponible" [ref=e6323] [cursor=pointer]:
            - /url: /ludoteca/juegos/chactun
            - generic [ref=e6325]:
              - generic [ref=e6326]: "6.8"
              - heading "Chactun" [level=3] [ref=e6327]
              - paragraph [ref=e6328]: Según la leyenda, Chactún se encuentra en lo más profundo de la selva. Una antigua ciudad protegida por un temible guardián ancestral llamado Chac Bolay. Esquiva los peligros de la selva, adelanta a tus rivales y sé el primero en descubrir los misterios de Chactún. Prepara la expedición, evita los peligros de la selva y adelanta a tus oponentes. Tira los dados e intenta obtener un resultado que esté dentro del rango de tu carta de ruta superior. Puedes usar las cartas de tu mano para modificar el resultado. Si sacas un doble, se desatará un efecto aleatorio de la selva sobre toda la mesa. Si sacas un 7, Chac Bolay, el guardián de la ciudad perdida, pasará a un nuevo jugador. Si tienes éxito, puedes apartar la carta de camino y decidir si sigues jugando o si te quedas con las cartas apartadas en tu mano. Si no tienes éxito, perderás tu turno, pero podrás intentar robar una carta a otro jugador. El objetivo es ser el primero en deshacerte de todo el mazo de caminos. -Descripción del editor
