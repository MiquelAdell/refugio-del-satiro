        - article [ref=e5885]:
          - link "Bamboo — Disponible" [ref=e5886] [cursor=pointer]:
            - /url: /ludoteca/juegos/bamboo
            - generic [ref=e5888]:
              - generic [ref=e5889]: "7.1"
              - heading "Bamboo" [level=3] [ref=e5890]
              - paragraph [ref=e5891]: "Durante generaciones, la cosecha de bambú ha traído prosperidad a tu hogar. El trabajo, la perseverancia, el equilibrio y la oración han hecho florecer un pequeño pueblo que ha crecido a costa de los campos de caña. Hoy en día, varios clanes viven en armonía con la naturaleza. En Bamboo, los jugadores asumen el papel de clanes que cultivan bambú y utilizan los frutos de su trabajo para cuidar de su familia y, de este modo, sumar puntos de felicidad. Se trata de un juego de gestión de acciones y optimización de fichas que resulta a la vez accesible y profundo. Con una ambientación muy cuidada, Bamboo forma parte de la saga Kemushi, a la que también pertenecen Bitoku y Silk. Las partidas de Bamboo se componen de 4 años o rondas, que a su vez se dividen en 4 fases o estaciones. En sus turnos, los jugadores quemarán incienso en los templos para ganarse el favor de los espíritus y utilizarán brotes de bambú para realizar acciones como buscar el equilibrio, cocinar, mejorar el hogar o gestionar las finanzas. Seguir las doctrinas de la disciplina del equilibrio doméstico permite una mejor optimización de las fichas de hogar, lo que la convierte en un pilar fundamental para avanzar en el juego. Para puntuar las fichas de equilibrio, debes utilizar la acción de equilibrio y seguir el patrón indicado en la ficha, que siempre tiene que ver con el tipo de fichas de hogar que obtienes durante la partida. Hay cuatro clases de fichas de hogar: decoración, jardín, fe o utilidad. Dependiendo de cómo las coloquen en su tablero, los jugadores obtendrán puntos de felicidad. Además de gestionar el hogar, los jugadores deberán prepararse para cuando lleguen tiempos difíciles. Para superar el invierno, será necesario alimentar a los miembros de la familia con el té, el arroz o el ramen que se haya preparado y almacenado en la temporada anterior. Y todo ello sin olvidar honrar a los espíritus y a los antepasados en los templos. El jugador que haya realizado la mayor ofrenda de incienso en cada espacio sagrado recibirá el favor de uno de los siete espíritus del bosque, como muestra de agradecimiento. Las fichas de espíritus, además de ayudar a los jugadores a lo largo de la partida, ofrecen puntos de bonificación en la fase final en función del número de espíritus diferentes que haya en el área de juego de cada jugador. Con unas reglas accesibles y fáciles de aprender, Bamboo es un título muy versátil que encajará en cualquier estantería. Sin embargo, tras su aparente simplicidad se esconde una gran profundidad estratégica, con numerosas opciones a disposición de los jugadores. Además, Bamboo cuenta con un modo de juego avanzado en el reverso de los tableros personales, lo que aportará a las partidas un nivel adicional de dificultad. Cosecha bambú y encuentra el equilibrio en tu hogar para ganar la partida. ¡Que los espíritus te acompañen! —Descripción del editor"
