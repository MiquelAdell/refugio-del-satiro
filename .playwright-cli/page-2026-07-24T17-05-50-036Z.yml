            - generic [ref=e6348]:
              - generic [ref=e6349]: "7.1"
              - heading "Challengers!" [level=3] [ref=e6350]
              - paragraph [ref=e6351]: ¡Challengers! es un juego interactivo de gestión de mazo para entre 1 y 8 jugadores que dura unos 45 minutos, independientemente del número de participantes. En el modo de juego de torneo, te enfrentas a un rival diferente en cada ronda. En la fase de mazo, eliges nuevos miembros y los añades a tu mazo, que puede estar formado por un mago, un extraterrestre, un gato, un gánster y un kraken. 75 personajes distintos con más de 40 efectos emocionantes crean una experiencia única en cada partida. Elige entre seis conjuntos diferentes y descubre nuevas estrategias y sinergias en cada partida. En la fase de partida, mantén la posesión de la bandera para ganar el trofeo de esa ronda. Intenta conseguir el mayor número de seguidores y trofeos a lo largo de siete rondas para poder clasificarte para la final. Si consigues vencer a tu rival en la final, ¡ganarás Challengers! (Si te parece que todo esto se parece mucho a una adaptación en formato de juego de mesa de un «autobattler» digital, ¡nos enorgullece decirte que este es el primero de su clase!) —Descripción del editor
