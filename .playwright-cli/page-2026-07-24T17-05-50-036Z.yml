              - generic [ref=e8875]: "5.9"
              - heading "Munchkin" [level=3] [ref=e8876]
              - paragraph [ref=e8877]: "Descripción del editor: Adéntrate en la mazmorra. Mata a todo lo que te encuentres. Apuñala por la espalda a tus amigos y róbales sus cosas. Hazte con el tesoro y huye. Admítelo. Te encanta. Este galardonado juego de cartas, diseñado por Steve Jackson, captura la esencia de la experiencia de las mazmorras… sin nada de esas tonterías de los juegos de rol. Tú y tus amigos competís por matar monstruos y haceros con objetos mágicos. ¡Y qué objetos mágicos! Ponte el «Casco Cornudo» y las «Botas de Patadas en el Trasero». Empuña el «Bastón de Napalm»... o quizá la «Motosierra del Desmembramiento Sangriento». Empieza matando a la «Planta en Maceta» y al «Limo Baboso», y ve subiendo de nivel hasta llegar al «Dragón de Plutonio»... ¡Y está ilustrado por John Kovalic! Rápido y disparatado, Munchkin puede llevar a la histeria a cualquier grupo de juego de rol. Y, mientras se ríen, puedes robarles sus cosas. Parte de la serie Munchkin. Munchkin es un juego de cartas satírico basado en los clichés y rarezas de Dungeons and Dragons y otros juegos de rol. Cada jugador empieza en el nivel 1 y gana el primero en alcanzar el nivel 10. Durante la partida, los jugadores pueden adquirir clases de personajes al estilo de D&D que determinan, en cierta medida, las cartas que pueden jugar. Hay dos tipos de cartas: de tesoro y de encuentros. En cada turno, el jugador de turno «derriba la puerta», es decir, roba una carta de encuentro del mazo. Normalmente, esto implicará luchar contra un monstruo. Los monstruos tienen sus propios niveles y los jugadores deben intentar vencerlos utilizando los niveles, las armas y los poderes que hayan adquirido durante la partida, o bien huir. Los demás jugadores pueden optar por ayudar al jugador o ponerle trabas añadiendo monstruos adicionales al encuentro. Derrotar a un monstruo suele dar lugar a robar cartas de tesoro y subir de nivel. Ser derrotado por un monstruo conlleva «cosas malas», lo que suele implicar perder niveles y tesoro. En mayo de 2010, Steve Jackson Games hizo el «gran anuncio».» Se modificaron muchas reglas y cartas. Para más detalles, consulta «El gran cambio de Munchkin de 2010». Cabe destacar para los aficionados a Munchkin que la carta «Kneepads of Allure», que había sido eliminada en la 14.ª edición, se volvió a añadir al juego, aunque modificada para que fuera menos poderosa. Secuelas: «The Good, the Bad, and the Munchkin» «Munchkin Apocalypse» «Munchkin Axe Cop» «Munchkin Bites!» Munchkin Booty Munchkin Conan Munchkin Cthulhu Munchkin Fu Munchkin Impossible Munchkin Legends Munchkin Pathfinder Munchkin Zombies Star Munchkin Super Munchkin Juegos de mesa relacionados Munchkin Quest Juego en línea Vassal ya no es compatible con Munchkin. Enlace anterior: Módulo de Vassal Ampliaciones de Pegasus Munchkin Sammlerbox Munchkin Sammlerkoffer Marcapáginas promocionales de Munchkin Edición navideña de Munchkin: igual que Munchkin, pero con un botón promocional que otorga al que lo lleva un tesoro extra (si se lleva puesto en diciembre). Partida en línea: hay una fantástica partida en YouTube con Will Wheaton y Steve Jackson (sí, el mismísimo Steve Jackson) que puedes ver aquí ENLACE"
