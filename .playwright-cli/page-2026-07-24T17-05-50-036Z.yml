        - article [ref=e9902]:
          - link "Secret Hitler — Disponible" [ref=e9903] [cursor=pointer]:
            - /url: /ludoteca/juegos/secret-hitler
            - generic [ref=e9905]:
              - generic [ref=e9906]: "7.5"
              - heading "Secret Hitler" [level=3] [ref=e9907]
              - paragraph [ref=e9908]: «Secret Hitler» es un juego dramático de intriga política y traición ambientado en la Alemania de los años 30. A cada jugador se le asigna al azar y en secreto el papel de liberal o de fascista, y un jugador es el «Secret Hitler». Los fascistas se coordinan para sembrar la desconfianza e instalar a su despiadado líder; los liberales deben encontrar y detener al Hitler Secreto antes de que sea demasiado tarde. El equipo liberal siempre tiene la mayoría. Al comienzo de la partida, los jugadores cierran los ojos y los fascistas se revelan entre sí. El «Secret Hitler» mantiene los ojos cerrados, pero levanta el pulgar para que los fascistas puedan ver quién es. Los fascistas descubren quién es Hitler, pero este no sabe quiénes son sus compañeros fascistas, y los liberales no saben quién es nadie. En cada ronda, los jugadores eligen a un presidente y a un canciller que trabajarán juntos para promulgar una ley de un mazo aleatorio. Si el gobierno aprueba una ley fascista, los jugadores deben intentar averiguar si han sido traicionados o simplemente han tenido mala suerte. «Secret Hitler» también cuenta con poderes gubernamentales que entran en juego a medida que avanza el fascismo. Los fascistas utilizarán esos poderes para sembrar el caos, a menos que los liberales consigan alejar a la nación del borde de la guerra. El objetivo del equipo liberal es aprobar cinco políticas liberales o asesinar a «Secret Hitler». El objetivo del equipo fascista es aprobar seis políticas fascistas o elegir a «Secret Hitler» como canciller tras la aprobación de tres políticas fascistas.
              - list [ref=e9909]:
