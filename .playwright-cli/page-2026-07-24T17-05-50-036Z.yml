              - heading "Monstrys Halloween" [level=3] [ref=e8784]
              - paragraph [ref=e8785]: Se acerca la aterradora noche de Halloween. Los Monstrys se disfrazan de los personajes más espeluznantes del mundo y, con esos trajes terroríficos, van de puerta en puerta por las casas del barrio pidiendo «truco o trato» y aprovechando para asustar a todo el mundo. Tú y tus amigos no tenéis miedo a los fantasmas, las momias, los vampiros ni los esqueletos, y estáis listos para volver a darles caza. Monstrys es un juego de cartas para toda la familia, a partir de 5 años, del género «tenta a la suerte», para entre 2 y 5 jugadores; la partida dura entre 10 y 15 minutos. —descripción del editor Llega la terrorífica noche de Halloween. Los Monstrys se disfrazan de los personajes más espeluznantes del mundo, y con estos terribles atuendos van de casa en casa por el barrio pidiendo «truco o trato»... ¡y aprovechan para asustar a todo el mundo! Tus amigos y tú no tenéis miedo a los fantasmas, momias, vampiros o esqueletos, y estáis dispuestos a volver a darles caza. —Descripción del editor (español)
