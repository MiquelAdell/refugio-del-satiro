        - article [ref=e6391]:
          - link "Ciudad Machi Koro — Disponible" [ref=e6392] [cursor=pointer]:
            - /url: /ludoteca/juegos/ciudad-machi-koro
            - generic [ref=e6394]:
              - generic [ref=e6395]: "6.6"
              - heading "Ciudad Machi Koro" [level=3] [ref=e6396]
              - paragraph [ref=e6397]: "Bienvenido a la ciudad de Machi Koro. Acabas de ser elegido alcalde. ¡Enhorabuena! Por desgracia, los ciudadanos tienen unas exigencias bastante importantes: puestos de trabajo, un parque temático, un par de fábricas de queso y quizá incluso una torre de radio. Una tarea complicada, ya que la ciudad se compone actualmente de un campo de trigo, una panadería y un único dado. Armado únicamente con tu fiel dado y un sueño, debes convertir Machi Koro en la ciudad más grande de la región. Tendrás que recaudar ingresos de las obras de urbanización, construir obras públicas y robar de las arcas de tus vecinos. ¡Pero asegúrate de que ellos no te hagan lo mismo a ti! Machi Koro es un juego trepidante para 2-4 jugadores. Cada jugador quiere desarrollar la ciudad a su manera para completar todos los edificios emblemáticos en construcción antes que sus rivales. En su turno, cada jugador lanza uno o dos dados. Si la suma de los dados lanzados coincide con el número de un edificio que el jugador posee, obtiene el efecto de ese edificio; en algunos casos, los oponentes también se beneficiarán de tus dados (al igual que tú puedes beneficiarte de los suyos). A continuación, con el dinero en mano, un jugador puede construir un monumento o un nuevo edificio, lo que, en el mejor de los casos, aumentará la riqueza de su ciudad en turnos futuros. ¡El primer jugador en construir todos sus monumentos gana!"
              - list [ref=e6398]:
                - listitem [ref=e6399]: 10+
                - listitem [ref=e6403]: 30min
