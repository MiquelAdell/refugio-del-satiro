        - article [ref=e10707]:
          - link "¡Toma6! Junior — Disponible" [ref=e10708] [cursor=pointer]:
            - /url: /ludoteca/juegos/toma6-junior
            - generic [ref=e10710]:
              - generic [ref=e10711]: "5.7"
              - heading "¡Toma6! Junior" [level=3] [ref=e10712]
              - paragraph [ref=e10713]: Versión infantil de «Take 5» (¡6 nimmt!) Los jugadores colocan animales en cuatro establos. La partida avanza en el sentido de las agujas del reloj alrededor de la mesa, y los jugadores van dando la vuelta a una carta del mazo en la que aparece uno (o, a veces, dos o tres) de los seis animales diferentes. El jugador añade el animal a un establo en el que aún no aparezca (si es posible). Cuando la carta es el sexto animal diferente para ese establo, el jugador se queda con todas esas cartas de animales como puntos. El juego termina cuando se agota la pila de robo. Gana el jugador que consiga más cartas. En el libro de reglas hay algunas variantes, incluida una en la que no hay que quedarse con las cartas, como en el juego básico.
