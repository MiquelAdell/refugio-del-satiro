            - generic [ref=e7563]:
              - generic [ref=e7564]: "7.1"
              - heading "Finca" [level=3] [ref=e7565]
              - paragraph [ref=e7566]: "El tablero de juego de «Finca» representa la isla mediterránea de Mallorca. Los jugadores intentan cosechar y entregar los frutos de Mallorca (como naranjas, limones, almendras, uvas, etc.) moviendo a sus trabajadores por un molino de viento tradicional. El objetivo del juego es distribuir la cosecha de la forma más eficaz posible para realizar las entregas antes que los oponentes. De la caja: Mallorca, la isla del viento. Un lugar de playas doradas y un mar azul claro. La cosecha de almendras está al caer y, además, las jugosas naranjas, los limones y los higos están listos para ser recolectados y llevados al mercado. Los olivos hechizan el campo con sus ramas retorcidas y los suntuosos viñedos invitan a los transeúntes a pasear entre su tierra cálida. En medio de este paisaje, tu centenaria casa de campo de piedra natural te sirve de hogar y alberga tu gran molino de viento: tu FINCA. ¡Escucha el viento, que impulsa tu molino! A continuación, recoge durante la cosecha anual los frutos más dulces y valiosos de la tierra. Cárgalos en tu vieja carreta tirada por un burro y recorre la isla vendiéndolos por todas partes. Si lo haces con rapidez, pronto te convertirás en el granjero más rico de la isla. Nota: La edición de Pandasaurus Games de 2024 admite hasta 5 jugadores, mientras que las ediciones anteriores admiten hasta 4. Las aceitunas se han sustituido por pescado. Recomendaciones: Ganador del Premio Húngaro de Juegos de Mesa 2011 Ludoteca Ideale 2011 (Italia) Nominado al «Spiel des Jahres 2009» 4.º puesto en el «Deutscher Spielepreis 2009» Nominado al «Graf Ludo 2009» Juego para adultos del año 2010 (Finlandia)"
