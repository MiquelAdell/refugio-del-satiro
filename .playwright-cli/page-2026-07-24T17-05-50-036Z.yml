        - article [ref=e8572]:
          - link "Manila — Disponible" [ref=e8573] [cursor=pointer]:
            - /url: /ludoteca/juegos/manila
            - generic [ref=e8575]:
              - generic [ref=e8576]: "7.0"
              - heading "Manila" [level=3] [ref=e8577]
              - paragraph [ref=e8578]: "Las barcazas, la mercancía y los beneficios son el centro de todo en Manila, un juego de especulación para entre 3 y 5 jugadores. Los cargamentos de mercancías, destinados a ser transportados por rutas marítimas, corren el riesgo de acumular polvo en los almacenes o de perderse en el mar durante una tormenta. Mientras los jugadores especulan sobre el éxito y el fracaso, el destino final de los barcos lo determinarán los dados. Hay cuatro cargamentos que deben llegar a Manila: jade, ginseng, seda y nuez moscada. Una ronda comienza con una subasta inicial para convertirse en capitán del puerto. Si ganas, podrás comprar una participación en uno de los cargamentos, elegir qué tres cargamentos te gustaría llevar río abajo y estimar la probabilidad de que lleguen a su destino en el puerto. Si llegan a Manila, el precio de tu participación aumentará. El objetivo del juego es apostar por el resultado de estos cargamentos, cuyo destino lo determinarán en última instancia los dados. ¿Cuántos de los tres barcos llegarán a buen puerto y cuáles serán? ¿Te gustaría contratar un seguro contra posibles naufragios o quizá crees que los piratas aprovecharán la oportunidad para hacerse con el control? ¡Manila es un divertido juego familiar que se aprende en cuestión de minutos y da vida a los barcos fluviales de Filipinas!"
