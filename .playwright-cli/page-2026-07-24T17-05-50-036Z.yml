        - article [ref=e10661]:
          - link "Time's Up! Family — Disponible" [ref=e10662] [cursor=pointer]:
            - /url: /ludoteca/juegos/time-s-up-family
            - generic [ref=e10664]:
              - generic [ref=e10665]: "7.2"
              - heading "Time's Up! Family" [level=3] [ref=e10666]
              - paragraph [ref=e10667]: «Time's Up! Family» es un juego de fiesta basado en las charadas para equipos de dos o más jugadores (aunque es más divertido con equipos de dos). Antes de que comience la partida, cada jugador echa un vistazo a varias cartas en las que aparecen objetos, manualidades y animales conocidos, y elige algunas de ellas. Las tarjetas de cada jugador se barajan para formar un mazo, y este mazo se utiliza en cada una de las tres rondas del juego. En cada ronda, los miembros del equipo se turnan para intentar que sus compañeros adivinen el mayor número posible de palabras y frases de las tarjetas en 30 segundos. En la ronda 1, se permite casi cualquier tipo de pista, y quien da la pista no puede saltarse ninguna carta. En la ronda 2, no se puede utilizar más de una palabra en cada pista (aunque se permiten sonidos y gestos ilimitados); quien da la pista puede saltarse cualquier carta que desee, y los compañeros de equipo solo pueden dar una única respuesta. En la ronda 3, quien da la pista no puede utilizar ninguna palabra y puede saltarse tantas cartas como quiera; de nuevo, los compañeros solo pueden dar una única respuesta. ¡Da buenas pistas físicas en la ronda 1, y te serán muy útiles más adelante, cuando tengas que mantener la boca cerrada y gesticular como un loco antes de que se acabe el tiempo! Time’s Up! Family 2 cuenta con 440 palabras nuevas.
