        - article [ref=e9078]:
          - link "Océanos de Papel — Disponible" [ref=e9079] [cursor=pointer]:
            - /url: /ludoteca/juegos/oceanos-de-papel
            - generic [ref=e9081]:
              - generic [ref=e9082]: "7.5"
              - heading "Océanos de Papel" [level=3] [ref=e9083]
              - paragraph [ref=e9084]: "Durante tu turno, formas tu mano, quizá coloques cartas para activar su efecto y decides si quieres terminar la ronda. Pero, ¿crees que eres el que tiene más puntos en la mano? Tendrás que elegir: ¿detener la ronda inmediatamente o dar a los demás un turno extra para intentar ampliar la ventaja? ¿Merece la pena correr el riesgo? El juego termina cuando alcances 30/35/40 puntos (4/3/2 jugadores). La emoción de terminar la ronda para pillar a tus oponentes desprevenidos El placer de jugar tus cartas de efecto y crear combinaciones Es un juego de cartas de colección de conjuntos similar al Rummy. El origami creado especialmente para el juego consiste únicamente en las ilustraciones de las cartas."
