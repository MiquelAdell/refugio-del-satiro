        - article [ref=e6713]:
          - 'link "Decktective: La mirada del fantasma — Disponible" [ref=e6714] [cursor=pointer]':
            - /url: /ludoteca/juegos/decktective-la-mirada-del-fantasma
            - generic [ref=e6716]:
              - generic [ref=e6717]: "6.4"
              - 'heading "Decktective: La mirada del fantasma" [level=3] [ref=e6718]'
              - paragraph [ref=e6719]: "«Decktective: The Gaze of the Ghost» es un juego cooperativo de investigación que presenta una escena del crimen en 3D. Los jugadores deben resolver un caso misterioso. Juegan sus cartas para compartir información, descartan aquellas que creen que les llevarán por el camino equivocado, debaten las pistas que encuentran con los demás jugadores, formulan hipótesis y hacen deducciones para dar con la solución. Al final de la partida, los jugadores deben responder a varias preguntas: cada respuesta correcta vale puntos. Cuantos más puntos consigan, mejor será su resultado. En su turno, los jugadores pueden jugar una carta de su mano y colocarla boca arriba sobre la mesa, compartiendo la información que contiene, o bien descartar una carta de su mano boca abajo en el archivo, sin poder hablar de la información que contiene hasta el final de la investigación. Cada carta tiene un valor del 1 al 10 en la esquina superior izquierda. Una carta solo se puede jugar boca arriba sobre la mesa si su valor es igual o inferior al número actual de cartas del archivo. —Descripción del editor"
