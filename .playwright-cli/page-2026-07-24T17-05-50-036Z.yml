        - article [ref=e8825]:
          - link "Monza — Disponible" [ref=e8826] [cursor=pointer]:
            - /url: /ludoteca/juegos/monza
            - generic [ref=e8828]:
              - generic [ref=e8829]: "6.6"
              - heading "Monza" [level=3] [ref=e8830]
              - paragraph [ref=e8831]: "Monza es un juego de carreras de coches para niños. En su turno, los jugadores lanzan seis dados y mueven su coche según los colores que salgan en los dados. Los dados son idénticos y cada uno tiene seis colores diferentes, uno en cada cara. El tablero es un circuito de carreras de tres carriles. Monza fomenta el pensamiento táctico, así como el reconocimiento de colores. El juego indica que es para niños a partir de 5 años, pero los niños de 3 a 4 años también pueden unirse a la diversión. Desarrollo de la partida: Seis coches de carreras se encuentran en la parrilla de salida del tablero de tres carriles. Pero solo el jugador que consiga los colores correctos con los dados y realice combinaciones inteligentes podrá avanzar rápidamente. El primer jugador lanza los seis dados. Ahora intenta mover tu coche según los colores obtenidos. Debes comparar los colores de los dados con los colores de las casillas situadas justo delante de tu coche. Después de cada movimiento, aparta el dado correspondiente. Si no puedes utilizar ciertos colores, tu turno termina. ¡Cuidado! Solo puedes mover tu coche hacia delante y debes evitar las casillas con obstáculos. Solo se permite cambiar de carril si el extremo más alejado de la casilla contigua se encuentra por delante de la casilla en la que está tu coche. Si tu coche cae en una casilla en la que ya hay otro coche, este se retrocede a la siguiente casilla disponible en el mismo carril."
              - list [ref=e8832]:
                - listitem [ref=e8833]: 5+
                - listitem [ref=e8837]: 15min
