        - article [ref=e9603]:
          - link "Quest — Disponible" [ref=e9604] [cursor=pointer]:
            - /url: /ludoteca/juegos/quest
            - generic [ref=e9606]:
              - generic [ref=e9607]: "7.3"
              - heading "Quest" [level=3] [ref=e9608]
              - paragraph [ref=e9609]: "En Quest, todos mostrarán su verdadera cara mientras el Bien y el Mal luchan por el futuro de la civilización. Entre los leales sirvientes del rey Arturo se esconden los secuaces sin escrúpulos de Mordred. Estas fuerzas del Mal son pocas, pero si pasan desapercibidas, pueden sabotear las grandes misiones de Arturo. A los jugadores se les asignan en secreto unos roles que determinan si su lealtad es hacia el Bien o hacia el Mal. A continuación, los jugadores debaten, razonan y mienten mientras deciden a quién enviar a las misiones, sabiendo que si se une tan solo un secuaz de Mordred, la misión podría fracasar. Quest incluye 25 personajes diferentes y muchas formas distintas de jugar al juego básico. «Quest» también incluye el «Director’s Cut», una recomendación personal del diseñador sobre la forma preferida de jugar a «Quest». Errata: La página 7 del libro de reglas debería decir: (para la versión que no sea «Director’s Cut») Tres misiones completadas con éxito: ¡gana el Bien! La partida termina. Nota: Cuando se utilice el «Cazador Ciego» opcional, este se revela y tiene lugar una «Caza» (véase la página 8). No hay debate ni «Última oportunidad del Bien». Aunque el «Cazador Ciego» figura como opcional, ese rol debe incluirse siempre que se incluyan roles del Bien con nombre, para aplicar una penalización por reivindicarlos. La regla de la errata anterior no se aplica a la versión «Director’s Cut»."
