        - article [ref=e7928]:
          - link "Jungo — Disponible" [ref=e7929] [cursor=pointer]:
            - /url: /ludoteca/juegos/jungo
            - generic [ref=e7931]:
              - generic [ref=e7932]: "7.1"
              - heading "Jungo" [level=3] [ref=e7933]
              - paragraph [ref=e7934]: "Jungo es un juego de construcción de mano en el que hay que intentar ser el primer jugador en deshacerse de todas sus cartas. A partir de un mazo de 72 cartas, con ocho copias de cada valor del 1 al 8, los jugadores reciben una mano de cartas que no pueden reorganizar. El jugador inicial juega una carta o un conjunto de cartas del mismo valor, pero solo puede jugar varias cartas si estas están contiguas entre sí en su mano. Si ya hay cartas jugadas sobre la mesa, para jugar debes poner el mismo número de cartas con un valor mayor o un conjunto de cartas más grande, por ejemplo: 2 < 5 < 3,3 < 6,6 < 2,2,2 < 1,1,1,1. Cuando superas la jugada de otro jugador, puedes recoger las cartas que has superado y añadirlas a tu mano donde desees, o bien descartarlas. Si no puedes jugar o decides no hacerlo, debes pasar, robando una carta de una pila boca abajo; algunas cartas tienen dos valores, por ejemplo, 1/2 o 5/6, y pueden jugarse como cualquiera de los dos números. Puedes añadir esta carta a tu mano donde quieras, descartarla o —acogiéndote a la regla del «jungo»— jugarla inmediatamente como parte de una combinación de tu mano que supere lo que hay sobre la mesa. Si todos los jugadores menos uno pasan, se despeja la mesa, y el jugador que haya jugado en último lugar es el que deja la mesa vacía. ¡Gana quien primero se quede sin cartas! Como alternativa, dado que la partida es corta, se pueden jugar varias rondas, y gana la partida el primer jugador que gane dos rondas."
              - list [ref=e7935]:
                - listitem [ref=e7936]: 8+
                - listitem [ref=e7940]: 15min
