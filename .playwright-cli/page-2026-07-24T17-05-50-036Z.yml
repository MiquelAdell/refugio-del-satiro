        - article [ref=e5908]:
          - 'link "Battlestar Galactica: El juego de tablero — Disponible" [ref=e5909] [cursor=pointer]':
            - /url: /ludoteca/juegos/battlestar-galactica-el-juego-de-tablero
            - generic [ref=e5911]:
              - generic [ref=e5912]: "7.7"
              - 'heading "Battlestar Galactica: El juego de tablero" [level=3] [ref=e5913]'
              - paragraph [ref=e5914]: "«Battlestar Galactica: El juego de mesa» es un juego de desconfianza, intriga y lucha por la supervivencia. Basado en la serie del canal Sci Fi, «Battlestar Galactica: El juego de mesa» sitúa a los jugadores en el papel de uno de los diez personajes favoritos de la serie. Cada personaje jugable tiene sus propias habilidades y debilidades, y todos deben colaborar para que la humanidad tenga alguna esperanza de sobrevivir. Sin embargo, en cada partida, uno o más jugadores se alían en secreto con los Cylons. Los jugadores deben intentar desenmascarar al traidor mientras la escasez de combustible, la contaminación de los alimentos y la inestabilidad política amenazan con desintegrar la flota. Tras el ataque de los Cylons a las Colonias, los maltrechos supervivientes de la raza humana se encuentran huyendo, en constante búsqueda de la siguiente señal en el camino hacia la Tierra. Se enfrentan a la amenaza de los ataques de los Cylons desde el exterior, y a la traición y la crisis desde el interior. La humanidad debe trabajar unida si quiere tener alguna esperanza de sobrevivir… pero ¿cómo pueden hacerlo, cuando cualquiera de ellos podría ser, de hecho, un agente cylon? «Battlestar Galactica: El juego de mesa» es un juego semicooperativo. Los jugadores eligen entre pilotos, líderes políticos, líderes militares o ingenieros para formar la tripulación de la Galactica. Además, al inicio de la partida se les reparte una carta de lealtad para determinar si son humanos o Cylons, junto con un surtido de cartas de habilidad basadas en las capacidades de sus personajes. A continuación, los jugadores pueden moverse y realizar acciones, ya sea en la Galactica, en el Colonial 1 o en un Viper. Deben recoger cartas de habilidad, repeler a las naves Cylon y mantener a la Galactica y a la flota en movimiento. Cada turno trae además una carta de crisis, con diversas tareas que los jugadores deben superar. Los jugadores deben jugar cartas de habilidad que coincidan para hacer frente a los problemas; las cartas de habilidad que no coincidan dificultan el éxito de los jugadores. ¡El destino podría estar en contra de la tripulación, o podría haber un Cylon traidor! A medida que los jugadores se acercan cada vez más a la Tierra, se reparten otra ronda de cartas de lealtad y pueden aparecer más Cylons. Si los jugadores consiguen mantener sus reservas de comida, los niveles de combustible, la moral de la nave y la población, y logran mantener la Galactica a flote el tiempo suficiente para llegar a la Tierra, los humanos ganan la partida. Pero si los jugadores Cylon se revelan en el momento adecuado y derriban la Galactica, los humanos habrán perdido."
