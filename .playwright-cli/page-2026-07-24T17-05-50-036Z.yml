        - article [ref=e10477]:
          - link "TETO — Disponible" [ref=e10478] [cursor=pointer]:
            - /url: /ludoteca/juegos/teto
            - generic [ref=e10480]:
              - generic [ref=e10481]: "7.2"
              - heading "TETO" [level=3] [ref=e10482]
              - paragraph [ref=e10483]: "¿Teto? ¿Te refieres a «héroe»? ¿Hola? ¿Memo? ¿Cero? ¡Pero haz algo con las manos y los pies, por favor, que nadie te entiende! Teto es un juego por equipos en el que tendréis que cooperar y ayudaros mutuamente para descifrar todas las palabras que aparecen en vuestras cartas antes que el equipo contrario. No pierdas el tiempo, agudiza el oído, abre bien los ojos y ¡JJAJ! CÓMO JUGAR Un jugador al azar de un equipo cualquiera, o del equipo con más jugadores, juega el primer turno. Para jugar un turno: 1 - Activa el temporizador de 30 segundos. 2 - Descarta la carta superior del mazo hasta que aparezca una nueva consonante. Omite este paso en el primer turno. 3 - La persona a la que le toca el turno lee en voz alta la primera palabra de su carta secreta que su equipo aún no haya adivinado, sustituyendo todas las consonantes de esa palabra por la letra que aparece en la carta superior del mazo. Una vez que haya leído la palabra en voz alta, puede volver a leerla mientras hace gestos con el cuerpo, con el objetivo de que sus compañeros de equipo adivinen la palabra secreta. El juego termina cuando un equipo consigue adivinar todas las palabras secretas que aparecen en todas sus cartas. El equipo contrario tiene un turno para empatar el juego, siempre y cuando no haya sido el que haya jugado el primer turno."
