            - generic [ref=e6095]:
              - generic [ref=e6096]: "7.5"
              - heading "Captain Sonar" [level=3] [ref=e6097]
              - paragraph [ref=e6098]: "¡En el fondo del océano, nadie oirá tus gritos! En Captain Sonar, tú y tus compañeros de equipo controláis un submarino de última generación e intentáis localizar un submarino enemigo para hundirlo antes de que ellos puedan hacer lo mismo con vosotros. Cada función es importante, y el enfrentamiento es implacable. Organizaos y comunicáos, porque un capitán no es nada sin su tripulación: el primer oficial, el operador de radio y el ingeniero. Todos los miembros de un equipo se sientan a un lado de la mesa, y cada uno asume un papel concreto en el submarino; la distribución de tareas para estos roles depende del número de jugadores que participen en la partida. Entre los roles se incluyen el capitán, responsable de mover el submarino y anunciar algunos detalles de este movimiento; el operador de radio, que escucha las órdenes del capitán rival e intenta descifrar dónde podría encontrarse ese submarino en el agua; y el ingeniero, que trabaja en la sala de municiones para preparar torpedos, minas y otros dispositivos que permitirán el combate. Captain Sonar se puede jugar en dos modos: por turnos o simultáneo. En esta última configuración, todos los miembros de un equipo realizan sus acciones al mismo tiempo, mientras intentan seguir también lo que hacen los oponentes. Cuando un capitán está listo para lanzar un ataque, la acción se detiene un momento para ver si se ha registrado un impacto; a continuación, el juego se reanuda con el objetivo habiéndose escabullido mientras el atacante hacía una pausa o con fragmentos de metal esparcidos por el fondo del océano. Se incluyen varios mapas con distintos niveles de dificultad."
