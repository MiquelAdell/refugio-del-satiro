              - heading "Escondite Fantasma" [level=3] [ref=e7362]
              - paragraph [ref=e7363]: ¡Escóndete! ¡Vienen los humanos! En «Run, Ghost, Run!», te pones en la piel de un grupo de fantasmas traviesos que intentan colarse en un hotel sin que los vean los humanos que miran por la cerradura. Mueve al mayor número posible de tus fantasmas por el vestíbulo del hotel, escondiéndolos detrás de los muebles del vestíbulo, si es posible, mientras intentas descubrir los escondites de tus oponentes.
