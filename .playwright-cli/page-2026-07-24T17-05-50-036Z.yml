        - article [ref=e8986]:
          - link "Nictofobia — Disponible" [ref=e8987] [cursor=pointer]:
            - /url: /ludoteca/juegos/nictofobia
            - generic [ref=e8989]:
              - generic [ref=e8990]: "6.0"
              - heading "Nictofobia" [level=3] [ref=e8991]
              - paragraph [ref=e8992]: "Bienvenidos al juego de mesa experiencial que va a redefinir lo que significa jugar. Nyctophobia, que significa «miedo a la oscuridad», es un juego cooperativo de supervivencia en el que hasta cuatro jugadores deben colaborar para escapar de un depredador desquiciado que los persigue por un bosque sumido en la más absoluta oscuridad. Pero hay una complicación: los aspirantes a supervivientes juegan con gafas que les impiden ver. Los jugadores no pueden ver el tablero y tienen que guiarse por el tacto para encontrar el camino hacia un lugar seguro. Entonces, ¿te da miedo la oscuridad? Más en detalle, Nyctophobia es un juego cooperativo táctil de laberinto para entre 3 y 5 jugadores. Todos los jugadores, excepto uno, juegan sin poder ver el tablero en absoluto. Los jugadores con los ojos vendados forman el equipo de los «Cazados». Su misión es encontrar la casilla del coche en el tablero y sobrevivir hasta que llegue la policía para rescatarlos. El jugador que ve es el «Cazador», cuya misión es perseguir a los «Cazados» y reducir a uno de ellos a cero puntos de salud antes de que llegue la policía. Nyctophobia incluye dos versiones del «Cazador» que puedes utilizar: el asesino del hacha y el mago. El asesino del hacha os acecha a ti y a tus amigos en el bosque, avanzando sin cuidado ni pensarlo dos veces, talando los árboles que os separan para llegar hasta vosotros lo antes posible; esta es la experiencia más básica y primitiva de todas las que puedes vivir en Nyctophobia. La maga, por el contrario, es una embaucadora. Al mago no le basta con cazar a sus víctimas. Su objetivo es jugar con sus mentes, manipular el bosque que les rodea y dejar a los oponentes, ahora ciegos, más perdidos de lo que estaban cuando los encontró. El mago puede girar el mapa, mover árboles por el bosque y, en general, confundir a los jugadores."
              - list [ref=e8993]:
                - listitem [ref=e8994]: 9+
                - listitem [ref=e8998]: 45min
                - listitem [ref=e9002]: 3-5
              - generic [ref=e9008]: Familiar
        - article [ref=e9009]:
          - link "No Lo Testeamos Ni Un Poco — Disponible" [ref=e9010] [cursor=pointer]:
            - /url: /ludoteca/juegos/no-lo-testeamos-ni-un-poco
            - generic [ref=e9012]:
              - generic [ref=e9013]: "5.6"
              - heading "No Lo Testeamos Ni Un Poco" [level=3] [ref=e9014]
              - paragraph [ref=e9015]: "Esta versión de «We Didn't Playtest This at All» incluye la expansión «Chaos Pack» y viene en una caja resistente, similar a la de dos barajas de cartas, con tapa abatible. La expansión «Chaos Pack» contiene una baraja secundaria de 15 cartas que puedes utilizar junto con «We Didn't Playtest This at All». En cada partida, robas al azar una carta de «Chaos», y esta se convierte en una regla que debe respetarse durante toda la partida. De la página web del editor: «¡El juego con el nombre más acertado de la historia! En este juego excepcionalmente absurdo y genial, ¡tu objetivo es ganar! Muy sencillo. Por desgracia, todos tus oponentes tienen el mismo objetivo sencillo y están intentando que pierdas. Entre partidas de piedra, papel o tijera, ser devorado por un dragón al azar o salvado por una emboscada de gatitos, hay muchos peligros que evitar». Resumen del juego Todos empiezan con 2 cartas. En tu turno, roba una carta del mazo y, a continuación, juega una de tu mano siguiendo las instrucciones de la carta. Hay muchos peligros que evitar, entre ellos: bombas, dragones, flechas, punteros láser, agujeros negros, duelos de piedra, papel o tijera, duelos de números, zombis, etc. Por suerte, también abundan los objetos que pueden salvarte: naves espaciales, ciencia, escudos, dinosaurios y ¡una emboscada de gatitos! Hay cartas estrella: son claramente superiores a las cartas normales. Todos los jugadores tienen las mismas posibilidades de robar una carta estrella del mazo. Se integra con: Tampoco hemos probado este juego"
              - list [ref=e9016]:
                - listitem [ref=e9017]: 10+
                - listitem [ref=e9021]: 10min
                - listitem [ref=e9025]: 2-10
