        - article [ref=e7698]:
          - link "Gold Nugget — Disponible" [ref=e7699] [cursor=pointer]:
            - /url: /ludoteca/juegos/gold-nugget
            - generic [ref=e7701]:
              - generic [ref=e7702]: "6.8"
              - heading "Gold Nugget" [level=3] [ref=e7703]
              - paragraph [ref=e7704]: «Gold Nugget» es una versión magnífica y única del género de los juegos de farol, en la que entre 2 y 5 jugadores compiten en el papel de criaturas del bosque que intentan encontrar, robar y hacerse con la pepita de oro entre las numerosas piedras del nido del cuervo. El cuervo ha abandonado el bosque durante unos días, dejando su preciada pepita de oro sin vigilancia. ¿Qué criatura del bosque conseguirá saquear el nido en este singular juego de farol y deducción? Cada personaje tiene un poder único que puede cambiar el rumbo de la partida, así como un momento del día en el que se va a dormir. Sí, una vez al día tendrás que cerrar los ojos e «irte a dormir», lo que hace aún más difícil seguir la pista de la pepita de oro… ¡además de las piedras que esconden consecuencias negativas cuando se revelan! El juego fomenta la interacción y seguro que te hará dudar de tus oponentes. Además, está repleto de cartas únicas, acciones especiales y un montón de criaturas que harán que quieras volver a jugar una y otra vez. —Descripción del editor
              - list [ref=e7705]:
