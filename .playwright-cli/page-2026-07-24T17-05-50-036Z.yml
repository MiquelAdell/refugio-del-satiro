              - generic [ref=e8962]: Temático
        - article [ref=e8963]:
          - 'link "Nemesis: Lockdown — Disponible" [ref=e8964] [cursor=pointer]':
            - /url: /ludoteca/juegos/nemesis-lockdown
            - generic [ref=e8966]:
              - generic [ref=e8967]: "8.2"
              - 'heading "Nemesis: Lockdown" [level=3] [ref=e8968]'
              - paragraph [ref=e8969]: "«Nemesis Lockdown» es la primera expansión independiente de «Nemesis». Durante la partida, los jugadores se verán transportados a un escenario totalmente nuevo: una base secreta en Marte, representada por un tablero de varios niveles. «Lockdown» conservará la experiencia semicooperativa y altamente cinematográfica del juego original, al tiempo que introducirá numerosas mecánicas nuevas y originales. Durante la tensa partida, tú y tus compañeros de juego recogeréis objetos, exploraréis diferentes salas y utilizaréis vuestras acciones para fabricar objetos, correr y luchar contra otras especies. Al mismo tiempo, cada jugador intentará completar su objetivo secreto, que le otorgará la victoria… A veces, a costa de los demás. Algunas de las nuevas mecánicas son: Base de varios niveles con escaleras y ascensores Acciones informáticas avanzadas Sistema de escotillas CSS Suministro eléctrico e iluminación en diferentes niveles Procedimiento de contingencia Nuevos personajes y raza alienígena"
