        - article [ref=e6184]:
          - link "Castillos y Catapultas — Disponible" [ref=e6185] [cursor=pointer]:
            - /url: /ludoteca/juegos/castillos-y-catapultas
            - generic [ref=e6187]:
              - generic [ref=e6188]: "7.0"
              - heading "Castillos y Catapultas" [level=3] [ref=e6189]
              - paragraph [ref=e6190]: "¡Construye tus castillos, despliega tus tropas, carga tus catapultas y utiliza tus astutas tácticas para salir victorioso! ¡La Guerra por el Suelo ha comenzado una vez más! Catapult Feud (la serie original se llamaba «Catapult Kingdoms») es un juego en el que gana el último que quede en pie. ¡Tu objetivo es derribar todas las tropas de tu rival! Empezando por el jugador más joven, elige tu familia: Chaufort o Cunningfields. A continuación, utiliza tus ladrillos para construir un castillo con el que fortificar tus tropas. Con tu catapulta, lanza rocas para intentar destruir el castillo de tu rival y derribar sus tropas. Cuando todas las tropas de una familia hayan sido derribadas, la batalla habrá terminado. La familia ganadora debe tener al menos una tropa en pie. El juego se desarrolla en una serie de rondas. Durante una ronda, empezando por el jugador más joven, todos juegan por turnos. El turno de cada jugador se divide en cuatro fases: Táctica, Apuntar, Disparar y Recogida. Realiza estas fases en orden, terminando cada una antes de pasar a la siguiente. Cuando todos los jugadores hayan jugado su turno, la ronda termina. Se sigue jugando ronda tras ronda hasta que solo quede un jugador con tropas sobre la mesa. ¡Atención! Este es un juego de construcción y destrucción de bloques y figuras de plástico... ¡NO de tu oponente, mascotas o personas que puedan pasar imprudentemente por el campo de batalla! Por favor, jugad limpio y tened cuidado de no haceros daño ni de dañar nada… ¡excepto el intento de tu oponente de construir una fortaleza impenetrable! En marzo de 2022 se añadió una edición especial para recaudar fondos para Ucrania a varios foros de financiación colectiva. —Descripción del editor Incluye: - 10 miniaturas - 2 catapultas - 32 ladrillos - 2 puertas - 2 tableros de jugador - 8 proyectiles de roca - 12 cartas de acción - 1 libro de reglas"
              - list [ref=e6191]:
                - listitem [ref=e6192]: 7+
