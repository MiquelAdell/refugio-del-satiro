        - article [ref=e9308]:
          - 'link "Paris: La Cité de la Lumière — Disponible" [ref=e9309] [cursor=pointer]':
            - /url: /ludoteca/juegos/paris-la-cite-de-la-lumiere
            - generic [ref=e9311]:
              - generic [ref=e9312]: "7.2"
              - 'heading "Paris: La Cité de la Lumière" [level=3] [ref=e9313]'
              - paragraph [ref=e9314]: «Paris» es un juego de mesa para dos jugadores creado por José Antonio Abascal, impregnado de la estética parisina gracias al artista del juego, Oriol Hernández. La acción se desarrolla en el París de finales del siglo XIX, durante la «Exposición Universal» de 1889, cuando la electricidad pública era un tema candente. La electricidad se extendió por toda la ciudad, dando lugar a las hermosas calles parisinas nocturnas que conocemos hoy en día y acuñando el apodo de París como «La Cité de la Lumière» (la Ciudad de la Luz). Los edificios mejor iluminados son los que más admiración suscitan entre los transeúntes. En la primera fase, los jugadores pueden colocar fichas o ampliar su reserva de edificios. Las fichas de adoquines se dividen en cuatro espacios aleatorios (su color, el color de sus oponentes, una farola o un espacio de color mixto en el que cualquiera de los jugadores puede construir). A continuación, en la segunda fase, los jugadores construyen sobre los espacios de su color o en los espacios mixtos, con el objetivo de situar sus edificios lo más cerca posible de tantas farolas como sea posible. Cuantas más farolas, más admiración y más puntos se obtienen. El jugador con los edificios mejor iluminados se gana el corazón de los peatones parisinos y gana la partida. —Descripción del editor
              - list [ref=e9315]:
