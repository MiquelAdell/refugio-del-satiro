        - article [ref=e9239]:
          - link "Pandemic — Disponible" [ref=e9240] [cursor=pointer]:
            - /url: /ludoteca/juegos/pandemic
            - generic [ref=e9242]:
              - generic [ref=e9243]: "7.5"
              - heading "Pandemic" [level=3] [ref=e9244]
              - paragraph [ref=e9245]: ¡En «Pandemic», varias enfermedades virulentas han surgido simultáneamente por todo el mundo! Los jugadores son especialistas en la lucha contra las enfermedades cuya misión consiste en tratar los focos de contagio mientras investigan curas para cada una de las cuatro plagas antes de que se les vaya de las manos. El tablero de juego muestra varios de los principales núcleos de población de la Tierra. En cada turno, un jugador puede realizar hasta cuatro acciones para desplazarse entre ciudades, tratar a la población infectada, descubrir una cura o construir una estación de investigación. Un mazo de cartas proporciona a los jugadores estas habilidades, pero entre ellas se intercalan cartas de «¡Epidemia!» que aceleran e intensifican la actividad de las enfermedades. Un segundo mazo de cartas, independiente, controla la propagación «normal» de las infecciones. Al asumir un papel único dentro del equipo, los jugadores deben planificar su estrategia para aprovechar al máximo las fortalezas de sus especialistas con el fin de vencer a las enfermedades. Por ejemplo, el experto en operaciones puede construir estaciones de investigación, necesarias para encontrar curas para las enfermedades y que permiten una mayor movilidad entre ciudades; el científico solo necesita cuatro cartas de una enfermedad concreta para curarla, en lugar de las cinco habituales, pero las enfermedades se propagan rápidamente y el tiempo se agota. Si una o más enfermedades se propagan hasta un punto en el que ya no hay remedio, o si transcurre demasiado tiempo, todos los jugadores pierden. Si curan las cuatro enfermedades, ¡todos ganan! La edición de 2013 de Pandemic incluye dos nuevos personajes —el Planificador de Contingencias y el Especialista en Cuarentena— que no estaban disponibles en ediciones anteriores del juego. Pandemic es el primer juego de la serie Pandemic.
