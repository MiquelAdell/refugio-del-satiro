          - link "1,2,3! Now you see me... — Prestado" [ref=e5586] [cursor=pointer]:
            - /url: /ludoteca/juegos/1-2-3-now-you-see-me
            - generic [ref=e5587]: EN PRÉSTAMO
            - generic [ref=e5589]:
              - generic [ref=e5590]: "6.0"
              - heading "1,2,3! Now you see me..." [level=3] [ref=e5591]
              - paragraph [ref=e5592]: Los animales de la granja están jugando al «semáforo», ¡pero han decidido cambiar algunas reglas sin decírselo al cerdito Bonaparte! ¿Estás listo para la sorpresa? ¡1, 2, 3! Ahora me ves..., uno de los jugadores coge un montón de animales, los deja caer sobre la mesa y pide al resto de jugadores que cierren los ojos. Mientras nadie mira, realiza una acción con los animales (mover un animal, añadir un animal, esconder un animal o intercambiar el lugar de dos animales) y, a continuación, les dice a sus amigos que abran los ojos. ¡A ver si adivinan qué animal (o animales) ha realizado la acción! Cada jugador que acierte gana 1 punto, ¡y luego se vuelve a empezar!
              - list [ref=e5593]:
                - listitem [ref=e5594]: 6+
                - listitem [ref=e5598]: 15min
                - listitem [ref=e5602]: 2-8
              - generic [ref=e5608]: Infantil
        - article [ref=e5609]:
          - link "1920 Wall Street — Disponible" [ref=e5610] [cursor=pointer]:
            - /url: /ludoteca/juegos/1920-wall-street
            - generic [ref=e5612]:
              - generic [ref=e5613]: "6.7"
              - heading "1920 Wall Street" [level=3] [ref=e5614]
              - paragraph [ref=e5615]: En «1920 Wall Street», un juego de cartas para entre 2 y 5 jugadores, cada jugador intenta acumular acciones de cuatro empresas diferentes (maíz, algodón, acero y petróleo), venderlas si necesita dinero e influir en el valor de las distintas empresas en la bolsa. Se ganan puntos por provocar fluctuaciones en el mercado y por las acciones que se acumulan —¡siempre que se alcance la cantidad mínima de cada tipo! Todo ello con el telón de fondo del atentado de Wall Street, ocurrido en 1920 en el distrito financiero de Manhattan, que provocará el final de la partida y introducirá algunos cambios en la forma de puntuar. Estos cambios dependen de la forma en que los jugadores descarten sus cartas durante la partida.
              - list [ref=e5616]:
                - listitem [ref=e5617]: 12+
                - listitem [ref=e5621]: 60min
                - listitem [ref=e5625]: 2-5
              - generic [ref=e5631]: Estrategia
        - article [ref=e5632]:
          - link "7 Wonders — Disponible" [ref=e5633] [cursor=pointer]:
            - /url: /ludoteca/juegos/7-wonders
            - generic [ref=e5635]:
              - generic [ref=e5636]: "7.7"
              - heading "7 Wonders" [level=3] [ref=e5637]
              - paragraph [ref=e5638]: Eres el líder de una de las siete grandes ciudades del Mundo Antiguo. Reúne recursos, desarrolla rutas comerciales y afianza tu supremacía militar. Construye tu ciudad y erige una maravilla arquitectónica que perdurará a lo largo de los siglos. 7 Wonders se desarrolla a lo largo de tres eras. En cada era, los jugadores reciben siete cartas de un mazo concreto, eligen una de ellas y pasan el resto al jugador adyacente. Los jugadores revelan sus cartas simultáneamente, pagando recursos si es necesario, obteniendo recursos o interactuando con otros jugadores de diversas formas. (Los jugadores disponen de tableros individuales con poderes especiales en los que organizar sus cartas; además, los tableros son de doble cara). A continuación, cada jugador elige otra carta del mazo que le han pasado, y el proceso se repite hasta que los jugadores tengan seis cartas en juego de esa era. Tras tres eras, el juego termina. En esencia, 7 Wonders es un juego de desarrollo de cartas. Algunas cartas tienen efectos inmediatos, mientras que otras proporcionan bonificaciones o mejoras más adelante en la partida. Algunas cartas ofrecen descuentos en compras futuras. Otras aportan fuerza militar para dominar a tus vecinos y otras no dan más que puntos de victoria. Cada carta se juega inmediatamente después de ser seleccionada, por lo que sabrás qué cartas está recibiendo tu vecino y cómo sus elecciones podrían afectar a lo que ya has construido. Las cartas se pasan de izquierda a derecha y de derecha a izquierda a lo largo de las tres eras, por lo que debes estar atento a los vecinos en ambas direcciones. Aunque en la caja de las ediciones anteriores se indica que es para 3-7 jugadores, en las instrucciones se incluye una variante oficial para 2 jugadores.
              - list [ref=e5639]:
                - listitem [ref=e5640]: 10+
                - listitem [ref=e5644]: 30min
                - listitem [ref=e5648]: 2-7
              - generic [ref=e5654]: Familiar
        - article [ref=e5655]:
          - link "7 Wonders Duel — Disponible" [ref=e5656] [cursor=pointer]:
            - /url: /ludoteca/juegos/7-wonders-duel
            - generic [ref=e5658]:
              - generic [ref=e5659]: "8.1"
              - heading "7 Wonders Duel" [level=3] [ref=e5660]
              - paragraph [ref=e5661]: "En muchos aspectos, «7 Wonders Duel» se asemeja a su juego original, «7 Wonders». A lo largo de tres eras, los jugadores adquieren cartas que les proporcionan recursos o les permiten avanzar en su desarrollo militar o científico con el fin de desarrollar una civilización y completar maravillas. La diferencia de «7 Wonders Duel» es que, como sugiere el título, el juego es exclusivamente para dos jugadores. Los jugadores no eligen cartas simultáneamente de mazos, sino de una disposición de cartas boca abajo y boca arriba colocadas al inicio de cada ronda. Un jugador solo puede coger una carta si no está cubierta por ninguna otra, por lo que el momento en que se realiza la jugada es clave, al igual que ocurre con los movimientos extra que permiten al jugador coger una segunda carta inmediatamente. Al igual que en el juego original, cada carta adquirida puede utilizarse para construir, descartarse a cambio de monedas o emplearse para construir una maravilla. Cada jugador comienza además con cuatro cartas de maravilla, y la construcción de una de ellas otorga a su propietario una habilidad especial. Sin embargo, solo se pueden construir siete maravillas, por lo que a uno de los jugadores le faltará una. Los jugadores pueden comprar recursos en cualquier momento al banco, o bien obtener durante la partida cartas que les proporcionen recursos para futuras construcciones; a medida que se adquieren, el coste de esos recursos aumenta para el oponente, lo que refleja el dominio del propietario en ese ámbito. Puedes ganar a 7 Wonders Duel de una de estas tres formas: cada vez que adquieras una carta militar, avanzas el marcador militar hacia la capital de tu oponente (lo que además te otorga una bonificación en determinadas posiciones). Si llegas a la capital del oponente, ganas la partida inmediatamente. O bien, si consigues seis de los siete símbolos científicos diferentes, alcanzas el dominio científico y ganas inmediatamente. Si no se da ninguna de estas situaciones, gana el jugador con más puntos al final de la partida."
              - list [ref=e5662]:
                - listitem [ref=e5663]: 10+
                - listitem [ref=e5667]: 30min
                - listitem [ref=e5671]: 2-2
              - generic [ref=e5677]: Estrategia
        - article [ref=e5678]:
          - link "A por la corona — Disponible" [ref=e5679] [cursor=pointer]:
            - /url: /ludoteca/juegos/a-por-la-corona
            - generic [ref=e5681]:
              - generic [ref=e5682]: "6.3"
              - heading "A por la corona" [level=3] [ref=e5683]
              - paragraph [ref=e5684]: "Los caballeros de la Mesa Redonda están eligiendo a su nuevo líder. Todos los jugadores levantan sus espadas. Pero cuidado: no todos son leales al reino. Tienes que adivinar cuántos jugadores están del lado de la corona. Las predicciones acertadas se premian con gemas. El jugador con la colección de gemas más valiosa es el ganador. —Descripción del editor Breves instrucciones del juego: 1. Coloca la corona y las fichas boca abajo en el centro de la mesa. Ten a mano la bolsita de piedras preciosas. Cada jugador coge una espada. 2. Se juega por turnos en el sentido de las agujas del reloj. 3. El jugador al que le toca el turno mira en secreto dos fichas de escudo. Blandid las espadas: a la señal, todos alzan simultáneamente su espada, ya sea hacia la corona o al aire. ¿Coincide el número de una de las dos fichas de escudo con el número de espadas que apuntan a la corona? ¡Entonces coge una gema de la bolsa! De lo contrario, sigue con las manos vacías. A continuación, le toca el turno al siguiente jugador. 4. ¡En cuanto alguien haya reunido 2 piedras preciosas del mismo color o 4 de colores diferentes, se proclama ganador!"
              - list [ref=e5685]:
                - listitem [ref=e5686]: 6+
                - listitem [ref=e5690]: 10min
                - listitem [ref=e5694]: 2-4
              - generic [ref=e5700]: Fantasy
        - article [ref=e5701]:
          - link "Agent Avenue — Disponible" [ref=e5702] [cursor=pointer]:
            - /url: /ludoteca/juegos/agent-avenue
            - generic [ref=e5704]:
              - generic [ref=e5705]: "7.5"
              - heading "Agent Avenue" [level=3] [ref=e5706]
              - paragraph [ref=e5707]: Agent Avenue es un juego de cartas competitivo que combina el farol, la colección estratégica de conjuntos y una carrera por descubrir la identidad de tu rival. Ambientado en un colorido mundo antropomórfico, los jugadores se meten en la piel de espías retirados en un barrio residencial, intentándose burlar unos a otros con cartas que pueden sumar puntos o activar efectos especiales. El diseño artístico del juego da vida a un peculiar barrio de espías animales. Utiliza una mecánica única de «yo divido, tú eliges» para jugar una carta boca arriba y otra boca abajo en cada turno. Tu rival elige una, lo que influye en las estrategias de ambos. Las cartas incluyen diferentes agentes y herramientas que influyen en la puntuación y en el avance por el tablero, impulsando la carrera de «atrápame» para descubrir al espía rival. Supera en ingenio a tus oponentes reuniendo estratégicamente conjuntos de agentes y utilizando eficazmente las herramientas de espionaje. El juego termina cuando un jugador consigue descubrir a su oponente, combinando profundidad estratégica y elementos de farol. Perfecto para quienes disfrutan de una mezcla de estrategia y competición desenfadada, «Agent Avenue» te reta a pensar como un espía y a actuar como un vecino amistoso. —Descripción del editor
              - list [ref=e5708]:
                - listitem [ref=e5709]: 8+
                - listitem [ref=e5713]: 20min
                - listitem [ref=e5717]: 2-4
              - generic [ref=e5723]: Familiar
        - article [ref=e5724]:
          - link "¿Alcachofas?¡No, gracias! — Disponible" [ref=e5725] [cursor=pointer]:
            - /url: /ludoteca/juegos/alcachofas-no-gracias
            - generic [ref=e5727]:
              - generic [ref=e5728]: "6.6"
              - heading "¿Alcachofas?¡No, gracias!" [level=3] [ref=e5729]
              - paragraph [ref=e5730]: "¡«Abandon All Artichokes» no es el típico juego de cartas! Una cosecha abundante de este producto espinoso se ha apoderado de tu huerto, y solo hay una opción: ¡abandonar todas las alcachofas! Recorta tu mazo cosechando verduras frescas, cada una con un poder especial que te permite intercambiar, descartar o convertir en abono las cartas. ¡Necesitarás suerte, estrategia y mano para la jardinería para conseguir una mano ganadora! —Descripción del editor"
              - list [ref=e5731]:
