            - generic [ref=e10204]:
              - generic [ref=e10205]: "6.6"
              - heading "Skyjo" [level=3] [ref=e10206]
              - paragraph [ref=e10207]: "Cada jugador tiene 12 cartas ocultas (3x4). Dos de ellas están boca arriba. En tu turno, puedes coger la carta superior de la pila de descarte o de robo. Puedes cambiar una carta (oculta o boca arriba) de tu mano. La ronda termina cuando un jugador solo tiene cartas boca arriba. (turnos iguales). Se revelarán todas las cartas. Suma los valores de las cartas para calcular la puntuación. La partida termina cuando un jugador alcanza 100 puntos o más. Gana quien tenga la puntuación más baja. Regla especial: siempre que una columna de 3 cartas tenga el mismo valor, se descartarán y ya no se puntuarán. Las cartas se clasifican del -2 al 12."
