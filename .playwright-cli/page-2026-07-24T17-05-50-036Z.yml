        - article [ref=e8273]:
          - link "Lava House — Disponible" [ref=e8274] [cursor=pointer]:
            - /url: /ludoteca/juegos/lava-house
            - generic [ref=e8276]:
              - generic [ref=e8277]: "6.8"
              - heading "Lava House" [level=3] [ref=e8278]
              - paragraph [ref=e8279]: En «Lava House», tu objetivo es llegar el primero a la salida. Si alguna vez has jugado a «Floor is Lava», lo entenderás en un santiamén. En cada ronda, tiras los dados, que te indicarán la cantidad de equilibrio, fuerza e impulso que puedes usar. Analiza las diferentes rutas del tablero y gasta estos puntos para avanzar hacia la meta. Al comienzo de la partida y en determinados momentos del recorrido, recibirás cartas especiales para potenciar tus tiradas y facilitar tu viaje. Pero ten cuidado, porque cada vez que tiras los dados, te arriesgas a sacar el símbolo de la lava. Si acumulas 3, caerás en la lava y tendrás que superar la prueba de salto para evitar perder una vida. Si pierdes todas tus vidas, volverás al punto de partida. ¡Gestiona bien tus cartas y tus tiradas y gana siendo el más rápido en llegar a la meta!
