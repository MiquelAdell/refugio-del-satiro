        - article [ref=e10983]:
          - link "Yokai Sketch — Disponible" [ref=e10984] [cursor=pointer]:
            - /url: /ludoteca/juegos/yokai-sketch
            - generic [ref=e10986]:
              - generic [ref=e10987]: "6.7"
              - heading "Yokai Sketch" [level=3] [ref=e10988]
              - paragraph [ref=e10989]: "Los niños que se adentran en el bosque pueden encontrarse con algunos yokai, es decir, criaturas y fenómenos sobrenaturales. Impulsados por una curiosidad sin límites, los más pequeños dibujan a estos espíritus en sus cuadernos para comprender su naturaleza y aprender de ellos. Con una mecánica central de colección de conjuntos, el objetivo de Yokai Sketch es conseguir más puntos de yokai que el otro jugador completando bocetos de los escurridizos espíritus del bosque. El juego consta de dos barajas de cartas: en una hay cuatro tipos de yokai, cada uno asociado a un elemento (agua, fuego, tierra y viento) y a un valor numérico que se corresponde con puntos de victoria; y en la otra, bocetos realizados por humanos, dos de los cuatro elementos y, posiblemente, una habilidad especial. Al comienzo de la partida, las cartas de yokai se apilan en cuatro mazos (uno por cada elemento) y se reparten tres cartas de boceto boca abajo entre los jugadores. En su turno, los jugadores roban una nueva carta de boceto y deslizan una de sus cuatro cartas debajo de uno de los cuatro mazos situados en el centro de la mesa, de modo que quede al descubierto el elemento asociado a ese yokai. Si al hacer esto el yokai alcanza o supera el número de bocetos necesarios para dibujarlo (sumando los bocetos de ambos lados de la carta), el jugador que haya acumulado más bocetos en su lado de la mesa se lo queda. Las cartas de boceto del ganador se colocarán en la pila de descarte, y las del otro jugador permanecerán donde están, ya que se utilizarán para la siguiente carta de yokai de ese tipo. Si hay un empate en el número de bocetos a ambos lados de la carta, el yokai se asusta y se pierde. En este caso, ninguno de los jugadores consigue terminar el dibujo y todas las cartas de boceto de ambos lados de esa pila de yokai se descartan. Las cartas de boceto también pueden incluir poderes: invocar al yokai o distraerlo para mover cartas. El juego termina cuando una o más barajas de yokai se quedan vacías. -descripción del editor"
