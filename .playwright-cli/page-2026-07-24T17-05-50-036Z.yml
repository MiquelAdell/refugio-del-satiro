        - article [ref=e7905]:
          - link "Jungle Speed — Disponible" [ref=e7906] [cursor=pointer]:
            - /url: /ludoteca/juegos/jungle-speed
            - generic [ref=e7908]:
              - generic [ref=e7909]: "6.5"
              - heading "Jungle Speed" [level=3] [ref=e7910]
              - paragraph [ref=e7911]: En Jungle Speed, debes confiar en tu agudo sentido de la observación y en tus rápidos reflejos. Se necesita mano firme, ¡algo que puede resultar difícil de mantener durante los numerosos ataques de risa maníaca! El tótem de madera se coloca en el centro de la mesa, a la espera de que el jugador con los reflejos más rápidos se haga con él y gane la partida. A cada jugador se le reparte una mano de cartas. Para ganar, debes ser el primer jugador en deshacerte de todas tus cartas. En cada turno, todos los jugadores revelan una de sus cartas. Si dos cartas son idénticas, esos jugadores deben intentar hacerse con el tótem. El jugador más rápido entrega entonces sus cartas a su desafortunado adversario. Para aumentar la dificultad, algunas cartas son casi idénticas, lo que puede llevar a un jugador desprevenido a hacerse con el tótem por error —un grave error—. Otras cartas obligan a todos los jugadores a intentar hacerse con él a la vez, cambian la forma de jugar o aumentan la dificultad de alguna otra manera. «Jungle Jam», «Медвед» y «Prawo Dżungli» son reproducciones no autorizadas de «Jungle Speed/Arriba!».
              - list [ref=e7912]:
