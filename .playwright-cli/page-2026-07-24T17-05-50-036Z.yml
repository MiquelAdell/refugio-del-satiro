        - article [ref=e10592]:
          - 'link "Through the Ages: Una Nueva Historia de la Civilización — Disponible" [ref=e10593] [cursor=pointer]':
            - /url: /ludoteca/juegos/through-the-ages-una-nueva-historia-de-la-civilizacion
            - generic [ref=e10595]:
              - generic [ref=e10596]: "8.2"
              - 'heading "Through the Ages: Una Nueva Historia de la Civilización" [level=3] [ref=e10597]'
              - paragraph [ref=e10598]: "«Through the Ages: A New Story of Civilization» es la nueva edición de «Through the Ages: A Story of Civilization», con numerosos cambios, tanto pequeños como grandes, en las cartas del juego a lo largo de sus tres eras, así como modificaciones sustanciales en el funcionamiento del sistema militar. «Through the Ages» (TTA) es un juego de construcción de civilizaciones. Cada jugador intenta construir la mejor civilización mediante una gestión cuidadosa de los recursos y: descubriendo nuevas tecnologías, eligiendo líderes competentes, construyendo maravillas y manteniendo un ejército fuerte. Cualquier debilidad en cualquier ámbito puede ser aprovechada por tus oponentes. El juego se desarrolla a lo largo de las épocas, comenzando en la Antigüedad y terminando en la era moderna. Uno de los mecanismos principales de TTA es la selección de cartas. Las tecnologías, las maravillas y los líderes entran en juego y se vuelven más fáciles de seleccionar cuanto más tiempo llevan en juego. Para utilizar una tecnología, necesitarás suficiente ciencia para descubrirla, suficiente comida para crear una población que la maneje y suficientes recursos (mineral) para construir el edificio en el que se utilizará. Mientras equilibras los recursos necesarios para avanzar en tu tecnología, también debes desarrollar un ejército. El ejército se «construye» de la misma manera que los edificios civiles. Los jugadores con un ejército débil serán presa de otros jugadores. No hay mapa en el juego, por lo que no se puede perder territorio, pero los jugadores con un ejército más fuerte robarán recursos y ciencia, matarán a los líderes y se llevarán población o cultura. Es muy difícil ganar con un ejército fuerte, pero es muy fácil perder por tener uno débil. La victoria la consigue el jugador cuya nación tenga más cultura al final de la era moderna."
