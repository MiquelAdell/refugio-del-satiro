              - heading "LetraALetra" [level=3] [ref=e8301]
              - paragraph [ref=e8302]: En WordAround, los jugadores intentan descubrir y leer las palabras escritas en círculo en unas fichas redondas antes que sus oponentes. El jugador que acierte se lleva la ficha como punto. Gana quien tenga más fichas al final de la partida. El juego incluye 100 fichas con 300 palabras.
