        - article [ref=e9354]:
          - link "Patente de Corso — Disponible" [ref=e9355] [cursor=pointer]:
            - /url: /ludoteca/juegos/patente-de-corso
            - generic [ref=e9357]:
              - generic [ref=e9358]: "4.7"
              - heading "Patente de Corso" [level=3] [ref=e9359]
              - paragraph [ref=e9360]: Un sencillo juego de cartas de Bruno Faidutti, basado totalmente en el farol. Los jugadores intentan trasladar sus cinco tesoros a uno de sus barcos, pero solo dos de sus cinco barcos pueden ir armados con cañones. ¿Quién conseguirá cruzar los océanos haciendo faroles mientras sus rivales intentan enviar piratas para atacar los barcos desprotegidos?
