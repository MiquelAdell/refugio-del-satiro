        - article [ref=e7629]:
          - link "Galeones, Cañones y Doblones — Disponible" [ref=e7630] [cursor=pointer]:
            - /url: /ludoteca/juegos/galeones-canones-y-doblones
            - generic [ref=e7632]:
              - generic [ref=e7633]: "6.0"
              - heading "Galeones, Cañones y Doblones" [level=3] [ref=e7634]
              - paragraph [ref=e7635]: "Navega por alta mar como capitán de tu propio barco pirata. ¡Busca valiosos barcos mercantes y saquea sus mercancías! ¡Contrata a nuevos tripulantes, mejora tu barco y entrega tu tesoro al Rey de los Piratas a cambio de fama y gloria! «Rattle, Battle, Grab the Loot» combina la diversión de tirar los dados con un variado mazo de escenarios para que cada partida sea diferente. En cada ronda, los jugadores se enfrentan a buques mercantes y otras embarcaciones, intentando hacerse con el mayor botín posible. Un jugador recoge los dados de todos los participantes, los agita en la mano y luego los lanza dentro de la caja del juego para resolver la batalla. El lugar donde caen los dados en la caja, además de los símbolos que salen, determina el resultado de la batalla; a continuación, los jugadores se quedan con su botín. Los jugadores pueden ahora regresar a puerto para mejorar su barco, contratar nueva tripulación o entregar sus mercancías al Rey Pirata a cambio de su favor. Al mejorar su barco, los jugadores utilizan piezas físicas para montarlo, lo que hace que cada barco tenga un aspecto diferente. En la caja hay docenas de piezas troqueladas para personalizar tu barco. Además de los objetos y tripulantes comunes, ¡habrá mejoras de objetos y tripulantes únicos que harán que tu barco destaque entre los demás! Al final de la partida, ¡gana el jugador que haya obtenido más favor del Rey Pirata! *Nota: Según la editorial, lamentablemente hay un error de impresión en la lista de componentes del libro de reglas: Las cantidades correctas de fichas de botín que hay en la caja son: 10 especias 18 rones 18 telas 10 objetos de valor Además, el número correcto de cartas de botín especial de la miniexpansión es 5 (no 8)."
