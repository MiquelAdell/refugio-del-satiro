        - article [ref=e9718]:
          - link "República de Roma — Disponible" [ref=e9719] [cursor=pointer]:
            - /url: /ludoteca/juegos/republica-de-roma
            - generic [ref=e9721]:
              - generic [ref=e9722]: "7.5"
              - heading "República de Roma" [level=3] [ref=e9723]
              - paragraph [ref=e9724]: La República de Roma es una abstracción de más de 250 años de historia. Simula la política del Senado romano durante la república. Los jugadores asumen el papel de diversas facciones que compiten por el control del Senado. Controlan a las distintas familias poderosas de la época, que compiten por cargos públicos, el mando militar, concesiones económicas y nuevos seguidores. Para ganar, el jugador debe conseguir que su facción se convierta en la más poderosa de Roma. Sin embargo, al hacerlo, debe mantenerse un equilibrio. Una situación mundial hostil y los caprichos del pueblo romano hacen que los jugadores también deban cooperar para que la propia Roma no sucumba a esta presión. Si Roma no perdura, tampoco lo hará el Senado, ¡y todos los jugadores perderán! Los jugadores presentan propuestas al Senado, sobre las que luego votan los demás jugadores. La capacidad de un jugador para presentar propuestas viene determinada por los cargos que ocupan sus senadores. La influencia de un jugador en las votaciones viene determinada por el número de senadores que ha reclutado y el nivel de influencia que dichos senadores han alcanzado. Las propuestas pueden incluir el nombramiento de senadores para gobernar provincias (lo que genera ingresos), el reclutamiento de un ejército para luchar contra un enemigo externo, atender las preocupaciones del pueblo romano, asignar cargos o enjuiciar a antiguos titulares de cargos. Los jugadores deben cooperar para superar las diversas amenazas que el juego lanza contra Roma (guerras, hambrunas, disturbios, quiebra), al tiempo que trabajan para reforzar las posiciones de sus propios senadores y generales y socavar las de sus oponentes. Un general poderoso o un senador influyente puede convertirse en emperador (y así ganar el juego), pero también puede caer repentinamente víctima de la peste o de la espada de un asesino.
