              - generic [ref=e7886]: "7.2"
              - heading "Infiltraidores" [level=3] [ref=e7887]
              - paragraph [ref=e7888]: Tu organización ha sido infiltrada por topos, informantes malvados del enemigo. Como agentes leales, debéis trabajar juntos para descubrir y eliminar a todos los traidores. Infiltraitors es un desafiante juego de cartas de deducción con veinte misiones. Al comienzo del juego se apartan las cartas de sospechosos; estos son los traidores que deben identificarse por palo y número. Los jugadores deben gestionar sus manos para dar pistas sobre las cartas de sospechosos. Las pistas pueden coincidir con un traidor si tienen el mismo palo o si el número es un múltiplo o un divisor del número del traidor. A medida que se acumulan las pistas, los jugadores pueden deducir la identidad de una carta de traidor, pero ¿seréis capaces de atraparlos a todos antes de que se acabe el tiempo?
              - list [ref=e7889]:
