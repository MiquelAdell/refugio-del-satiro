              - paragraph [ref=e8187]: "En el juego cooperativo de bazas «The Crew: The Quest for Planet Nine», los jugadores se embarcan como astronautas en una aventura espacial llena de incertidumbres. ¿En qué consisten los rumores sobre el planeta desconocido? El accidentado viaje por el espacio se extiende a lo largo de 50 emocionantes misiones. Pero solo se puede superar este juego si cada jugador cumple con sus tareas individuales comunes. Para superar los diversos retos, la comunicación dentro del equipo es esencial. Pero esto resulta más difícil de lo esperado en el espacio. Con cada misión, el juego se vuelve más difícil. Tras cada misión, se puede pausar la partida y continuarla más tarde. Durante cada misión, lo que cuenta no es el número de bazas, sino las bazas adecuadas en el momento adecuado. El equipo solo completará una misión si todos y cada uno de los jugadores logran cumplir con éxito sus tareas. El juego incluye 50 misiones, además de tres misiones adicionales publicadas en la revista «spielbox» n.º 2/2020."
