              - 'heading "Espada Negra: Juego de Mesa – Edición Dormenia" [level=3] [ref=e7385]'
              - paragraph [ref=e7386]: Espada negra is a game card set in the lands of Dormenia in which players control a powerful family in the kingdom. With a system of dynamic and entertaining auction, players will have to manage their assets and serve the military power of their opponents to get new cards resources, troops and win the coveted points. - Espada Negra es un juego de cartas ambientado en las tierras de Dormenia en el que los jugadores controlarán a una poderosa familia del reino. Con un sistema de subastas dinámico y entretenido, los jugadores tendrán que gestionar sus bienes y atender al poder militar de sus oponentes para conseguir nuevas cartas de recursos, tropas y los ansiados puntos de victoria.
