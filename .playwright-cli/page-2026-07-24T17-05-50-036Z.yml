        - article [ref=e9856]:
          - link "Sand — Disponible" [ref=e9857] [cursor=pointer]:
            - /url: /ludoteca/juegos/sand
            - generic [ref=e9859]:
              - generic [ref=e9860]: "6.7"
              - heading "Sand" [level=3] [ref=e9861]
              - paragraph [ref=e9862]: La gente se refiere a este vasto lugar simplemente como «el desierto», ya que nadie recuerda lo que había aquí antes. La edad de oro de la humanidad quedó atrás hace mucho tiempo. Ahora solo hay arena, y la única esperanza reside en la humedad. Los viajeros cruzan el desierto que se extiende desde las laderas de las montañas Akaishi hasta los acantilados de Seaclaw. Las antiguas ciudades semirruinadas albergan a las últimas comunidades humanas, que luchan por sobrevivir recolectando lo poco verde que queda en pie. Estos viajeros del desierto transportan mercancías a lomos de sus orugas. Aunque su único objetivo es ganar todo el dinero que puedan, al mismo tiempo —y de forma más o menos deliberada— están ayudando a devolver la vida al desierto al llevar pequeñas plantas desde los invernaderos artificiales de las ciudades hasta los rincones más remotos de este océano de arena. Diseñado por Ariel Di Costanzo y Javier Pelizzari e ilustrado por Ernest Sala, Sand es un juego cuyo mecanismo principal consiste en recoger y entregar, que se puede disfrutar en solitario o en grupos de hasta cuatro jugadores en partidas de unos 120 minutos de duración. Para ganar, los jugadores deben acumular la mayor cantidad de oro posible tras seis rondas (cinco en una partida de cuatro jugadores). En Sand, los jugadores se ponen en la piel de estos intrépidos viajeros del desierto que recorren los caminos del tablero y visitan las diferentes localidades. Recogen mercancías para llevarlas a otros lugares y, de este modo, ganan oro por el servicio de transporte. Atravesan las dunas a lomos de sus fieles orugas, que, si se cuidan bien, crecerán y ayudarán a los jugadores a completar sus tareas con mayor eficacia. Por el camino se les unirán compañeros serviciales y se les encomendarán misiones que, si se completan, reportarán grandes beneficios al final del viaje. Ayuda a las plantas a echar raíces de nuevo, y quizá aún haya alguna esperanza para este lugar desolado... —descripción del editor
