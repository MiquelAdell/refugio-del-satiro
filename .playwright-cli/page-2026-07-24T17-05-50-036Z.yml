        - article [ref=e7767]:
          - link "Hello — Disponible" [ref=e7768] [cursor=pointer]:
            - /url: /ludoteca/juegos/hello
            - generic [ref=e7770]:
              - generic [ref=e7771]: "7.6"
              - heading "Hello" [level=3] [ref=e7772]
              - paragraph [ref=e7773]: Will you join this daring global adventure? From the bustling streets of Tokyo to the vast plains or dense jungles of Africa, each destination offers us the possibility to share and experience the local culture. To do this,we will have to greet like a native ! Get ready to laugh, learn, and greet like never before! Each turn a card will be revealed and if 2 players agree on the greeting or the color of the card, you will have to do the other player's greeting. The fastest person will win. —description from the publisher ¿Te unes a esta atrevida aventura mundial? Desde las bulliciosas calles de Tokio hasta las vastas llanuras o densas selvas de África, cada destino nos ofrece la posibilidad de compartir y experimentar la cultura de la zona. ¡Para ello necesitaremos saludar como una persona nativa más! ¡Prepárate para reír, aprender y saludar como nunca antes lo habías hecho! En cada turno se revelará una carta y si 2 jugadores coinciden en el saludo o en el color de la carta, tendrás que hacer el saludo del otro jugador. La persona más rápida, ganará —description from the publisher (Spanish)
              - list [ref=e7774]:
