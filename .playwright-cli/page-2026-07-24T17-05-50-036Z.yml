        - article [ref=e5931]:
          - link "Behind the Throne — Disponible" [ref=e5932] [cursor=pointer]:
            - /url: /ludoteca/juegos/behind-the-throne
            - generic [ref=e5934]:
              - generic [ref=e5935]: "6.2"
              - heading "Behind the Throne" [level=3] [ref=e5936]
              - paragraph [ref=e5937]: Cuatro poderosas organizaciones secretas luchan por el derecho a gobernar en el antiguo reino, y solo podrás conseguir seguridad, control y dominio económico mediante la conquista de la influencia política en la corte real. Cuantos más sirvientes, nobles y dignatarios consigas controlar, más cerca estarás de tu objetivo. Las intrigas, el chantaje o las amenazas son herramientas adecuadas para todos aquellos que luchan en la sombra del trono real. El poder sobre cada nuevo aristócrata te proporciona un nuevo método para influir en los demás. Pronto se sabrá quién es el jugador con poder absoluto tras el trono. «Behind the Throne» es un juego de cartas rápido y sencillo en el que los jugadores recopilan conjuntos de cartas para obtener nuevas habilidades especiales. Los jugadores ganan puntos de victoria por los héroes que recopilan, y quien tenga más puntos de victoria al final de la partida gana.
