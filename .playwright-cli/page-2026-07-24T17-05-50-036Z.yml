        - article [ref=e6897]:
          - link "Donde las papas queman — Disponible" [ref=e6898] [cursor=pointer]:
            - /url: /ludoteca/juegos/donde-las-papas-queman
            - generic [ref=e6900]:
              - generic [ref=e6901]: "6.8"
              - heading "Donde las papas queman" [level=3] [ref=e6902]
              - paragraph [ref=e6903]: It is an entertaining card game for the whole family. But be careful not to upset another player! He will have many ways to get revenge. Play different potatoes to attack and defend against other players while earning golden potatoes to take victory. 2 to 6 players can play, and whoever gets the necessary amount of golden potatoes wins! On your turn you can play as many action cards as you want, unless you play an alarm card which ends your turn automatically. On your turn you can exchange three potato cards of the same value to win a golden potato. At the end of your turn, you draw a card. Es un entretenido juego de cartas para toda la familia. ¡Pero ten cuidado de no enfadar a otro jugador! Tendrá muchas formas de vengarse. Juega diferentes papas para atacar y defenderte de otros jugadores mientras ganas papas doradas para llevarte la victoria. Pueden jugar de 2 a 6 jugadores, ¡y quien consiga la cantidad necesaria de papas de oro gana! En tu turno puedes jugar todas las cartas de acción que quieras, a menos que juegues una carta de alarma que finalizan tu turno automaticamente. En tu turno puedes puedes cambiar tres cartas de papa del mismo valor para ganar una papa de oro. Al terminar tu turno, robas una carta.
