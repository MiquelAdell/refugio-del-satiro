              - heading "¡Camarero!" [level=3] [ref=e6074]
              - paragraph [ref=e6075]: «Garçon» significa «camarero» en francés. Se trata de un juego de cartas en el que los jugadores asumen el papel de camareros en un café-bar. Su objetivo es memorizar los pedidos para conseguir la mayor propina posible, pero para llevarlos a cabo será necesario utilizar con acierto las cartas de evento, frustrar los planes de los demás jugadores y estar atentos al tiempo que pasa. El juego consta de 77 cartas y es apto para jugadores a partir de 8 años.
