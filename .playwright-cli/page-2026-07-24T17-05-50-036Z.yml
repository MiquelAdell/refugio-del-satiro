              - heading "Moirai" [level=3] [ref=e8738]
              - paragraph [ref=e8739]: Las Moiras (a menudo llamadas «Las Tres Parcas» en español) son diosas de la mitología griega. Han puesto en marcha su rueca para tejer el destino de la humanidad. Cloto hila el hilo de la vida, Láquesis utiliza su vara para medir la longitud de ese hilo y Átropos se encarga de decidir cuándo cortar el hilo de un alma. Siguiendo las órdenes de las tres Moiras, los jugadores deben crear un telar con cartas en el que se entretejerán diversas vidas. En su turno, los jugadores pueden elegir entre quedarse con una carta o coger toda la pila de descartes y colocar todas esas cartas en su telar. Al final de Moirai, los jugadores suman puntos según los criterios de puntuación de las cartas de Cloto, Láquesis y Átropos. Gana quien obtenga la mejor puntuación. —Descripción del editor
