        - article [ref=e7514]:
          - link "Faraón — Disponible" [ref=e7515] [cursor=pointer]:
            - /url: /ludoteca/juegos/faraon
            - generic [ref=e7517]:
              - generic [ref=e7518]: "5.8"
              - heading "Faraón" [level=3] [ref=e7519]
              - paragraph [ref=e7520]: "El faraón, inmensamente rico pero, por desgracia, un poco despistado, había acumulado a lo largo de su vida tesoros procedentes de todo su reino. Decidió esconderlos en su pirámide para evitar que se los robaran. Por desgracia, ya no está seguro de dónde ha enterrado cada cosa. Con un poco de suerte, podrás ayudarle a recuperar su tesoro. El jugador que encuentre la mayor cantidad de tesoros del faraón y, por lo tanto, reúna el mayor número de cartas de búsqueda, será el ganador. Una vez colocadas las fichas en el tablero de juego, colocadas las pirámides encima y girado el tablero unas cuantas veces con la esperanza de que los jugadores no sepan dónde se encuentran las fichas de tesoro, el primer jugador elige una carta de tesoro que asigna el número de puntos que valdría el tesoro si el jugador lo encontrara. Las cartas de tesoro se han separado en tres montones marcados con los números 1, 2 y 3. Una vez agotado el montón 1, el juego continúa con el montón 2, y así sucesivamente. A continuación, el jugador desliza una pirámide hacia un espacio vacío del tablero. Si no encuentra ninguna ficha de tesoro, el jugador mueve otra pirámide. Si la ficha no coincide con su carta, su turno termina. Si se encuentra el tesoro, el jugador se queda con la carta de tesoro, pero la ficha permanece donde está. Entre las cartas de tesoro hay cartas de evento como las siguientes: Tormenta de arena: Gira el tablero 180 grados y toma el siguiente montón de la carta. Regalo: Dirígete a uno de los doce tesoros. Cada jugador que tenga una o más cartas de búsqueda que representen este tesoro debe entregarte una de ellas. Riesgo: Elige dos tesoros que no estén actualmente mostrados en el tablero. Dirígete primero a uno y luego al otro. Si lo consigues, ¡enhorabuena! Si no lo consigues, debes entregar una de tus cartas de búsqueda a uno de tus oponentes. Espejismo: Robas una carta de búsqueda de la colección de tu vecino de la derecha. Si consigues llegar a este tesoro sin cometer ningún error, puedes quedarte con la carta. Si no lo consigues, debes darle a tu vecino de la derecha una de tus cartas. Póquer del desierto: Un jugador de tu elección debe intentar encontrar un tesoro que tú designes. Si lo consigue, puede quedarse con una de tus cartas de búsqueda. Si falla, tú puedes quedarte con una de las suyas. Fin de la partida: El faraón está contento porque se han encontrado todos los tesoros. En cuanto se dé la vuelta a esta carta (solo del montón 3), la partida termina y los jugadores suman los puntos que aparecen en sus cartas de búsqueda. Una vez que cada jugador haya encontrado un tesoro, el tablero se gira 90 grados en la dirección elegida. Cuando se hayan agotado todas las cartas de búsqueda de la segunda pila, se utiliza la pila «3». En esta ronda final, todos los tesoros de las cartas de búsqueda valen 4 puntos y cualquiera que aún no haya tenido mucho éxito puede, con ingenio y suerte, superar a todos los demás. Cuando un jugador encuentra una ficha de tesoro que no es la que estaba buscando, queda eliminado del juego. Los jugadores restantes continúan. El juego continúa hasta que todos los jugadores hayan sido eliminados o se haya dado la vuelta a la carta de «Fin de partida». Todos los jugadores suman los puntos que figuran en las cartas de búsqueda que han recogido. El jugador con el mayor número de puntos es el ganador."
              - list [ref=e7521]:
