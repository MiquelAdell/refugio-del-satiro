              - heading "Bikini d'Ou" [level=3] [ref=e5982]
              - paragraph [ref=e5983]: «Mixto Con Huevo» es un juego de rapidez visual en el que los jugadores tendrán que ser los más rápidos a la hora de identificar patrones (tipos de bocadillos) en el centro de la mesa para ganar la partida. El que se quede con todas las cartas es el ganador.
