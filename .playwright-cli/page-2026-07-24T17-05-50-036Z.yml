        - article [ref=e8227]:
          - link "Las Ruinas Perdidas de Arnak — Disponible" [ref=e8228] [cursor=pointer]:
            - /url: /ludoteca/juegos/las-ruinas-perdidas-de-arnak
            - generic [ref=e8230]:
              - generic [ref=e8231]: "8.1"
              - heading "Las Ruinas Perdidas de Arnak" [level=3] [ref=e8232]
              - paragraph [ref=e8233]: En una isla deshabitada situada en mares inexplorados, unos exploradores han encontrado rastros de una gran civilización. Ahora liderarás una expedición para explorar la isla, encontrar artefactos perdidos y enfrentarte a temibles guardianes, todo ello con el objetivo de desentrañar los secretos de la isla. Lost Ruins of Arnak combina la construcción de mazos y la colocación de trabajadores en un juego de exploración, gestión de recursos y descubrimiento. Además de los efectos tradicionales de los juegos de construcción de mazos, las cartas también pueden utilizarse para colocar trabajadores, y a medida que los jugadores exploran la isla se desbloquean nuevas acciones para los trabajadores. Algunas de estas acciones requieren recursos en lugar de trabajadores, por lo que será esencial construir una base sólida de recursos. Solo puedes realizar una acción por turno, así que elige con cuidado… ¿qué acción te beneficiará más ahora? ¿Y qué te puedes permitir hacer más adelante… siempre y cuando nadie más se adelante a realizar esa acción? Los mazos son pequeños, y la aleatoriedad del juego queda muy atenuada por la gran variedad de decisiones tácticas que ofrece el tablero. Con una gran variedad de acciones de trabajadores, artefactos y cartas de equipamiento, la configuración de cada partida será única, lo que animará a los jugadores a explorar nuevas estrategias para superar el reto. ¡Descubre las ruinas perdidas de Arnak! —Descripción del editor
