        - article [ref=e6230]:
          - link "Cathood — Disponible" [ref=e6231] [cursor=pointer]:
            - /url: /ludoteca/juegos/cathood
            - generic [ref=e6233]:
              - generic [ref=e6234]: "6.9"
              - heading "Cathood" [level=3] [ref=e6235]
              - paragraph [ref=e6236]: «Cathood» significa «el estado o la esencia de ser un gato», y eso es precisamente lo que intentas conseguir. En Cathood, eres uno de los ocho adorables gatos, cada uno con su propia personalidad, que se mueven por el barrio para conocer a los humanos, recoger juguetes y visitar parques con el fin de marcar su territorio. Al hacerlo, ganas «puntos» —por utilizar el sistema de medición equivalente al de los humanos— mientras te esfuerzas por convertirte en el gato más querido del barrio. En términos de juego, este diseño es un juego de control de áreas, recogida y entrega, y colección de conjuntos, en el que gestionar los recursos adecuados es esencial para el éxito. El barrio modular, en constante cambio, aporta un toque innovador de rompecabezas a las decisiones, pone a prueba la capacidad de orientación en un mapa y anima a los jugadores a pensar e interactuar como un gato. ¿Van a caminar por las calles o a saltar por los tejados? ¿Se detendrán en un café para gatos para intercambiar recursos, o le bufarán a otro jugador para robarle de su reserva personal? ¿Aprenderán nuevos trucos y completarán objetivos secretos, o serán los primeros en visitar lugares importantes y ampliar su influencia? Dado que los jugadores activan un número limitado de acciones por turno en función del número de discos que tienen delante, crear la sinergia adecuada es clave para una estrategia ganadora. ¿Estás listo? ¡Purrrrfecto! Cathood fue uno de los cinco finalistas del «I Concurso de creación de juegos Zacatrus». —Descripción del diseñador
              - list [ref=e6237]:
