            - generic [ref=e8552]:
              - generic [ref=e8553]: "6.9"
              - heading "Magic Maze" [level=3] [ref=e8554]
              - paragraph [ref=e8555]: "Descripción de la editorial: Tras quedarse sin todas sus pertenencias, un mago, un guerrero, un elfo y un enano se ven obligados a asaltar el centro comercial local «Magic Maze» para hacerse con todo el equipo necesario para su próxima aventura. Acuerdan trazar primero un mapa completo del laberinto, después buscar la tienda favorita de cada uno y, por último, localizar la salida. Para eludir la vigilancia de los guardias, que observaron su llegada con recelo, los cuatro llevarán a cabo sus atracos simultáneamente y luego correrán hacia la salida. Ese es el plan, al menos… pero ¿serán capaces de llevarlo a cabo? «Magic Maze» es un juego cooperativo en tiempo real. Cada jugador puede controlar a cualquier héroe para que este realice una acción muy específica, a la que los demás jugadores no tienen acceso: desplazarse hacia el norte, explorar una nueva zona, subir por una escalera mecánica… Todo ello requiere una cooperación rigurosa entre los jugadores para lograr mover a los héroes con prudencia. Sin embargo, solo se permite comunicarse durante breves intervalos a lo largo de la partida; el resto del tiempo, debéis jugar sin daros ninguna señal visual ni sonora entre vosotros. Si todos los héroes consiguen salir del centro comercial en el tiempo limitado asignado para la partida, habiendo robado cada uno un objeto muy concreto, entonces todos ganáis juntos. Al comienzo del juego, solo disponéis de tres minutos para realizar acciones. Las casillas con relojes de arena que encontréis por el camino os darán más tiempo. Si el reloj de arena se agota por completo, todos los jugadores pierden la partida: ¡vuestra presencia sospechosa ha despertado las sospechas y los guardias de seguridad del centro comercial os detienen!"
