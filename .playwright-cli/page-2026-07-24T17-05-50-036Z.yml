            - generic [ref=e7314]:
              - generic [ref=e7315]: "7.1"
              - heading "Ensalada de puntos" [level=3] [ref=e7316]
              - paragraph [ref=e7317]: «Point Salad» es un juego rápido y divertido de selección de cartas para toda la familia. Hay más de 100 formas de sumar puntos. Los jugadores pueden emplear diversas estrategias y ¡cada partida de «Point Salad» es única! Las cartas representan seis tipos diferentes de verduras, y el reverso de cada una indica un método de puntuación distinto. Por ejemplo, un método de puntuación puede otorgar 2 puntos por cada zanahoria que tengas, pero restar un punto por cada cebolla. Al elegir combinaciones de verduras y cartas de puntos que se adapten a tu estrategia, podrás acumular el mayor número de puntos y ganar. —Descripción del editor
