        - article [ref=e6989]:
          - 'link "Dune: Imperium – Insurrección — Disponible" [ref=e6990] [cursor=pointer]':
            - /url: /ludoteca/juegos/dune-imperium-insurreccion
            - generic [ref=e6992]:
              - generic [ref=e6993]: "8.7"
              - 'heading "Dune: Imperium – Insurrección" [level=3] [ref=e6994]'
              - paragraph [ref=e6995]: "En «Dune: Imperium Uprising», tendrás que seguir equilibrando el poderío militar con las intrigas políticas, utilizando nuevas herramientas en tu búsqueda de la victoria. ¡Los espías reforzarán tus planes, los contratos vitales ampliarán tus recursos, o podrás aprender las costumbres de los fremen y cabalgar poderosos gusanos de arena hacia la batalla! «Dune: Imperium Uprising» es una expansión independiente de «Dune: Imperium» que amplía la combinación de construcción de mazos y colocación de trabajadores de ese juego, al tiempo que introduce un nuevo modo para seis jugadores en el que dos equipos se enfrentan entre sí en la mayor contienda hasta la fecha. Las expansiones de Dune: Imperium, «Rise of Ix» e «Immortality», son compatibles con «Uprising», al igual que casi todas las cartas del juego básico, y algunos elementos de «Uprising» pueden utilizarse con Dune: Imperium. La decisión es tuya. ¡El Imperium te espera!"
              - list [ref=e6996]:
