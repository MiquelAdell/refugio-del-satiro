            - generic [ref=e10526]:
              - generic [ref=e10527]: "6.2"
              - heading "The Gardens of the Alhambra" [level=3] [ref=e10528]
              - paragraph [ref=e10529]: «The Gardens of Alhambra» es un juego abstracto de influencia creado por Dirk Henn en el que cada jugador está representado por plantas de un color concreto. Utilizando fichas que incluyen los cuatro colores, los jugadores las colocan en el tablero en ubicaciones fijas. Al hacerlo, intentan rodear los marcadores de puntos de victoria y capturarlos. Por supuesto, dado que cada ficha contiene todos los colores del jugador, cada colocación debe pensarse detenidamente para maximizar los propios puntos y minimizar los de los oponentes. Los empates descalifican a los jugadores, por lo que el siguiente con la puntuación total más alta se llevará los puntos. El jugador con más puntos de victoria al final de la partida es el ganador.
