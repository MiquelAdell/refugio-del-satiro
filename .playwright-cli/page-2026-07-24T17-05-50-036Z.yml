        - article [ref=e6552]:
          - link "Colt Express — Disponible" [ref=e6553] [cursor=pointer]:
            - /url: /ludoteca/juegos/colt-express
            - generic [ref=e6555]:
              - generic [ref=e6556]: "7.1"
              - heading "Colt Express" [level=3] [ref=e6557]
              - paragraph [ref=e6558]: "El 11 de julio de 1899, a las 10 de la mañana, el Union Pacific Express partió de Folsom, Nuevo México, con 47 pasajeros a bordo. Al cabo de unos minutos, se oyeron disparos y pasos apresurados en el techo. Unos bandidos fuertemente armados han venido a robar las carteras y las joyas de los ciudadanos honrados. ¿Conseguirán robar la maleta que contiene el sueldo semanal de la Nice Valley Coal Company, a pesar de que haya sido puesta bajo la supervisión del alguacil Samuel Ford? ¿Se entorpecerán estos bandidos entre sí más que al alguacil, ya que solo el más rico de ellos puede salir victorioso? En Colt Express, juegas como un bandido que atraca un tren al mismo tiempo que otros bandidos, y tu objetivo es convertirte en el forajido más rico del Viejo Oeste. El juego consta de cinco rondas, y cada ronda tiene dos fases: Fase 1: «Schemin'» Cada jugador juega entre 2 y 5 cartas de acción en una pila común; las cartas se colocan boca arriba o boca abajo dependiendo del tipo de ronda. En lugar de jugar una carta, un jugador puede robar tres cartas de su mazo. Fase 2: «Robar». Las cartas de acción se ejecutan en el orden en que se han jugado, ¡y es posible que los planes mejor trazados de un jugador no salgan bien debido a errores y descuidos! El juego se desarrolla en un tren en 3D en el que los bandidos pueden desplazarse de un vagón a otro, correr por el techo, dar puñetazos a los demás bandidos, dispararles, robar a los pasajeros o sacar al alguacil de su posición. El tren tiene tantos vagones como jugadores, y cada vagón contiene gemas, bolsas de botín o maletas al inicio de la partida. Cada jugador comienza una ronda con seis cartas en la mano, y cada carta muestra una de estas acciones. Al comienzo de una ronda, se revela una carta de ronda que indica cuántas cartas se jugarán; si se jugarán boca arriba o boca abajo, o individualmente o por parejas; y qué acción tendrá lugar al final de la ronda (por ejemplo, todos los bandidos que estén en el techo del tren se desplazan a la locomotora). Solo puedes recoger botín, gemas o maletas jugando una carta de «robar» cuando te encuentres en un vagón que contenga uno de estos objetos; pero, dado que todo el mundo pretende hacerse con estos bienes, tendrás que moverte, dar puñetazos y disparar para apartar a los demás de tu camino. Solo puedes dar un puñetazo a alguien que esté en el mismo vagón que tú y, cuando lo hagas, el otro bandido suelta uno de los objetos que haya recogido y sale disparado a un vagón adyacente. El personaje de cada jugador tiene un poder especial, como empezar la ronda con una carta extra, jugar tu primera carta boca abajo o quedarte con una bolsa de botín cuando golpeas a alguien en lugar de dejar que caiga al suelo. Puedes disparar a alguien que esté en un vagón adyacente o (si vas corriendo por el techo del tren) a cualquiera que tengas a la vista, y cuando lo haces, le das a ese jugador una de tus seis cartas de bala; esa carta se baraja en el mazo del oponente, lo que posiblemente le deje una carta inservible en la mano en un turno futuro y le obligue a robar en lugar de jugar algo. Si el alguacil acaba en el mismo vagón que tú, probablemente porque otros bandidos lo han atraído a través del tren, también estará encantado de darte una bala. Al final de la partida, quien haya disparado más balas recibe una bonificación de fanfarrón de 1.000 $, ¡y quien se haya llevado el botín más cuantioso gana!"
              - list [ref=e6559]:
                - listitem [ref=e6560]: 10+
                - listitem [ref=e6564]: 40min
