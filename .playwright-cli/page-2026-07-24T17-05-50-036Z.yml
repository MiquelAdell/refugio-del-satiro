        - article [ref=e9285]:
          - 'link "Pandemic: Respuesta rápida — Disponible" [ref=e9286] [cursor=pointer]':
            - /url: /ludoteca/juegos/pandemic-respuesta-rapida
            - generic [ref=e9288]:
              - generic [ref=e9289]: "6.5"
              - 'heading "Pandemic: Respuesta rápida" [level=3] [ref=e9290]'
              - paragraph [ref=e9291]: "¡Se ha producido una catástrofe! Ciudades de todo el mundo necesitan urgentemente alimentos, agua, vacunas y otros suministros. Tú y tu equipo formáis parte de la Unidad de Respuesta a Crisis (CRU), un equipo de élite compuesto por médicos y especialistas. Con un avión especialmente equipado, tenéis la capacidad única de proporcionar ayuda vital en cualquier momento y en cualquier lugar. Pandemic: Rapid Response es una carrera contra el reloj. Tira los dados para generar suministros, pilotar el avión y realizar entregas a las ciudades que lo necesitan. A medida que el temporizador va bajando, debéis coordinaros rápidamente y trabajar en equipo para reaccionar ante nuevas catástrofes. ¿Seréis capaces tú y tu equipo de responder a tiempo? Las naciones del mundo han aunado sus recursos y han reunido a una tripulación diversa. Cada una de las siete cartas de rol únicas cuenta con su propia habilidad. La analista, Adjoua Soro, puede volver a tirar los dados hasta dos veces más. La ingeniera, Soojin Sohn, puede cambiar el resultado de cualquier dado con un avión por un símbolo diferente. Jugad por turnos lo más rápido posible, utilizando la habilidad única de vuestro rol y asignando estratégicamente vuestros dados para ser lo más eficientes posible a la hora de crear suministros. Cuando estés listo para un nuevo reto, ajusta el nivel de dificultad o añade cartas de crisis para contar con una mayor variedad de obstáculos que superar. ¡Date prisa: el reloj no se detiene y el mundo necesita tu ayuda! —Descripción del editor"
