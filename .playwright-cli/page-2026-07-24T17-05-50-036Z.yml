        - article [ref=e6644]:
          - link "Crack It — Disponible" [ref=e6645] [cursor=pointer]:
            - /url: /ludoteca/juegos/crack-it
            - generic [ref=e6647]:
              - generic [ref=e6648]: "7.4"
              - heading "Crack It" [level=3] [ref=e6649]
              - paragraph [ref=e6650]: "En «City of Thieves», la mano más rápida se lleva el botín. Tendrás que usar tu ingenio para descifrar la combinación de la caja fuerte de tus rivales mientras proteges tu propio alijo. ¡Gira el dial hasta que oigas un «CLIC»! Al final, solo uno alcanzará la gloria. ¿Te convertirás en el Rey de los Ladrones? Crack It es un juego en el que los jugadores asumen el papel de un ladrón de cajas fuertes e intentan averiguar la combinación de las cajas de sus rivales. Durante tu turno, puedes limitar el número de la combinación de la caja de un rival y realizar tantas acciones como quieras (y tengas). Hay varias acciones disponibles. Pero no te dejes engañar: cualquier acción puede ser bloqueada por otros jugadores mediante cartas de bloqueo. Al final de tu turno, roba de nuevo hasta completar tu mano y pasa el turno al jugador de tu izquierda. Si se revela el tercer número de un rival, su caja fuerte se abre y queda fuera de la lucha por ser el último ladrón en pie. El juego termina cuando solo queda una caja fuerte por abrir. Dependiendo del modo de juego elegido, el ganador será el último ladrón en pie o aquel que tenga más puntos de prestigio. —Descripción del editor"
              - list [ref=e6651]:
                - listitem [ref=e6652]: 8+
                - listitem [ref=e6656]: 30min
                - listitem [ref=e6660]: 2-5
              - generic [ref=e6666]: Familiar
        - article [ref=e6667]:
          - link "Daitoshi — Disponible" [ref=e6668] [cursor=pointer]:
            - /url: /ludoteca/juegos/daitoshi
            - generic [ref=e6670]:
              - generic [ref=e6671]: "7.5"
              - heading "Daitoshi" [level=3] [ref=e6672]
              - paragraph [ref=e6673]: "¡Por fin hemos perfeccionado el poder del vapor y ahora podemos aprovecharlo en nuestro beneficio! Vivimos en una era de progreso sin precedentes, y los nuevos inventos impulsados por vapor se desarrollan más rápido que nunca. Las ciudades crecen, el comercio florece y estamos construyendo nuestra máquina más ambiciosa hasta la fecha: un artilugio gigante que traerá aún más progreso a la ciudad. Sí, se están talando algunos árboles y el río ya no fluye con tanta abundancia como antes, pero sigue habiendo árboles y agua en abundancia, y podemos aprovechar el espacio extra para ampliar nuestra ciudad —y no es que las viejas criaturas de esos bosques puedan hacer nada al respecto. En tu turno en Daitoshi, puedes producir o mover a tu magnate a un nuevo distrito en el que podrás enviar a tus trabajadores a trabajar, ordenar la explotación de hexágonos de bosque o río para alimentar tu inagotable necesidad de vapor, y realizar una acción para expandirte y demostrar tu grandeza a la ciudad. Estas acciones no solo te ayudan en tu búsqueda de reconocimiento, sino que benefician a todos los habitantes de la gran ciudad. Ampliarás la ciudad y electrificarás sus distritos, descubrirás y desarrollarás nuevos inventos impulsados por vapor, y comerciarás con ciudades lejanas. Incluso podrías ayudar a la ciudad a construir su gigantesco proyecto: la megamáquina. Es posible que se talen algunos bosques y que algunos ríos se sequen, pero, en un gesto de generosidad, ayudarás a los trabajadores desplazados de esas zonas ofreciéndoles nuevos puestos de trabajo a tu servicio. Las antiguas leyendas sugieren que los bosques y los ríos están custodiados por yōkai, pero el progreso no puede detenerse por culpa de unos viejos cuentos de hadas. No obstante, por si acaso, podría ser prudente participar en algunos proyectos de reforestación y ocultar tu participación en el abuso de los recursos naturales... —descripción del editor"
              - list [ref=e6674]:
                - listitem [ref=e6675]: 14+
                - listitem [ref=e6679]: 120min
