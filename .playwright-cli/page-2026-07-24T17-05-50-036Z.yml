              - heading "Silk Road" [level=3] [ref=e10022]
              - paragraph [ref=e10023]: "De la página web de Bruno Faidutti: La Ruta de la Seda es una especie de juego de «recogida y entrega» en el que todos los jugadores forman parte de la misma caravana que viaja de este a oeste, desde China hasta Europa. Cada jugador intenta que la caravana pase por las ciudades que más le convienen, para cerrar los mejores acuerdos con los comerciantes locales y ser el más rico al final."
