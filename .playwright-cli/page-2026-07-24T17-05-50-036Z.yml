        - article [ref=e7790]:
          - link "Hero Realms — Disponible" [ref=e7791] [cursor=pointer]:
            - /url: /ludoteca/juegos/hero-realms
            - generic [ref=e7793]:
              - generic [ref=e7794]: "7.5"
              - heading "Hero Realms" [level=3] [ref=e7795]
              - paragraph [ref=e7796]: Hero Realms es un juego de construcción de mazos de temática fantástica que constituye una adaptación del galardonado juego Star Realms. El juego incluye reglas básicas para partidas de dos jugadores, además de reglas para formatos multijugador como «Todos contra todos», «Cazador» e «Hidra». Cada jugador comienza la partida con un mazo personal de diez cartas que contiene oro (para comprar) y armas (para el combate). Empiezas cada turno con una nueva mano de cinco cartas de tu mazo personal. Cuando se te acaba el mazo, barajas tu pila de descartes para formar tu nuevo mazo. Todos los jugadores comparten un mazo de mercado de 80 cartas, del que se revelan cinco para crear la fila del mercado. A medida que juegas, utilizas oro para comprar cartas de campeón y cartas de acción del mercado. Estos campeones y acciones pueden generar grandes cantidades de oro, combate u otros efectos poderosos. Utilizas el combate para atacar a tu oponente y a sus campeones. Cuando reduces la puntuación de tu oponente (lo que se denomina «salud») a cero, ¡ganas! Hay varias expansiones disponibles para Hero Realms que permiten a los jugadores empezar como un personaje concreto (clérigo, luchador, guardabosques, ladrón o mago) y luchar de forma cooperativa contra un jefe, enfrentarse entre sí con mazos de jefes o competir en un modo de campaña en el que se gana experiencia para avanzar por diferentes niveles de misiones.
