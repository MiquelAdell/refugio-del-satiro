        - article [ref=e6759]:
          - link "Diamant — Disponible" [ref=e6760] [cursor=pointer]:
            - /url: /ludoteca/juegos/diamant
            - generic [ref=e6762]:
              - generic [ref=e6763]: "6.8"
              - heading "Diamant" [level=3] [ref=e6764]
              - paragraph [ref=e6765]: "Diamant —también publicado como Incan Gold— es un juego rápido y divertido en el que hay que poner a prueba la suerte. Los jugadores se adentran en los pozos de las minas o exploran senderos en la selva dando la vuelta a las cartas de un mazo y repartiéndose a partes iguales las gemas que encuentran por el camino; las gemas que sobren se colocan sobre la carta. Antes de que se revele la siguiente carta, tienes la oportunidad de salir de la mina y guardar lo que hayas acumulado, incluidas las gemas que consigas al salir. ¿Por qué te irías? Porque el mazo también contiene peligros: escorpiones, serpientes, gas venenoso, explosiones y desprendimientos de rocas. Cuando se revela un peligro concreto por segunda vez (por ejemplo, un segundo escorpión), cualquiera que siga en el pozo o en el sendero tiene que soltar todas las gemas que haya recogido en esa ronda y huir para ponerse a salvo. La clave está en que, a medida que más jugadores se retiran en cada turno, tu parte del botín aumenta, lo que quizá te anime a explorar más a fondo —pero con el riesgo de quedarte sin nada. Todas las ediciones de «Incan Gold» y las ediciones posteriores de «Diamant» incluyen cinco cartas de artefacto que se barajan con el mazo de cartas de gemas y de peligros, ya sea una por ronda o todas a la vez. Cuando se revela una carta de artefacto, nadie puede quedarse con ella y se coloca en el camino. Si al final de un turno se retira exactamente un jugador, este recoge no solo todas las gemas que quedan en el camino, sino también el artefacto, que vale puntos extra al final de la partida."
