        - article [ref=e10937]:
          - link "¡Viva el rey! — Disponible" [ref=e10938] [cursor=pointer]:
            - /url: /ludoteca/juegos/viva-el-rey
            - generic [ref=e10940]:
              - generic [ref=e10941]: "6.4"
              - heading "¡Viva el rey!" [level=3] [ref=e10942]
              - paragraph [ref=e10943]: "¡Con el anuncio de la jubilación del rey, comienza la carrera por la sucesión! Todos sus súbditos, desde el zapatero hasta el cocinero, pasando por el pintor, el paladín, la debutante y la duquesa, se afanan por todo el castillo preparándose para la sucesión. Uno de tus favoritos puede alcanzar el trono. ¡Pero cuidado! ¡Se necesitarán maniobras inteligentes y un posicionamiento estratégico para estar en el lugar adecuado en el momento oportuno y hacerse con la corona! «Vive le Roi!» es un juego de farol y deducción. Los jugadores reciben una carta en la que figuran varios personajes y deben mantenerla oculta al resto de jugadores. El juego se gana por puntos, y los jugadores obtienen puntos en función de lo «alto» que se encuentren sus personajes en el castillo. Las plantas inferiores valen menos puntos, y las superiores, más. Al comienzo de la partida, los jugadores se turnan para colocar uno de los 13 personajes en el tablero, respetando el límite de 4 personas por planta. Una vez realizada esta configuración inicial, un turno es sencillo: se sube (nunca se baja) un piso con el personaje que se elija. Fácil. El trono del rey, situado en la planta superior, es el que más puntos vale, pero cada vez que se mueve un personaje a ese lugar, todo el grupo vota simultáneamente «Sí» (para lo cual disponen de un número ilimitado de cartas de «Sí») o «No» (y cada jugador tiene un número limitado de cartas de «No»). Si hay tan solo un voto en «No», el personaje en cuestión queda eliminado de la ronda y no se puntúa. Cuando todos acaban votando «Sí» (normalmente por accidente, pero a veces porque se han quedado sin cartas de «No») a favor de un rey propuesto, la ronda termina y se realiza el recuento de puntos. Al final de unas cuantas rondas, gana el jugador con más puntos. Nota del administrador: La mayoría de las ediciones de King Up! son para 3-6 jugadores, mientras que la edición de 2025 admite de 2 a 8 jugadores."
