        - article [ref=e6575]:
          - link "Concept — Disponible" [ref=e6576] [cursor=pointer]:
            - /url: /ludoteca/juegos/concept
            - generic [ref=e6578]:
              - generic [ref=e6579]: "6.7"
              - heading "Concept" [level=3] [ref=e6580]
              - paragraph [ref=e6581]: En Concept, el objetivo es adivinar palabras mediante la asociación de iconos. Un equipo formado por dos jugadores —vecinos en la mesa— elige una palabra o frase que los demás jugadores deben adivinar. Actuando al unísono, este equipo coloca las fichas de forma estratégica sobre los iconos disponibles en el tablero de juego. Para que los demás adivinen «leche», por ejemplo, el equipo podría colocar el icono del signo de interrogación (que representa el concepto principal) sobre el icono del líquido y, a continuación, cubos de ese color en los iconos de «comida/bebida» y «blanco». Para un concepto más complicado, como «Leonardo DiCaprio», el equipo puede utilizar el concepto principal y sus cubos correspondientes para dar pistas a los jugadores sobre que la frase oculta se refiere a un actor o director, y luego utilizar iconos de subconceptos y sus cubos correspondientes para dar pistas sobre películas concretas en las que DiCaprio ha protagonizado, como *Titanic* o *Origen*. El primer jugador en descubrir la palabra o frase recibe 2 puntos de victoria; el equipo también recibe puntos, y gana el jugador que termine con más puntos.
              - list [ref=e6582]:
                - listitem [ref=e6583]: 10+
                - listitem [ref=e6587]: 40min
                - listitem [ref=e6591]: 4-12
              - generic [ref=e6597]: Fiesta
        - article [ref=e6598]:
          - link "Coral — Disponible" [ref=e6599] [cursor=pointer]:
            - /url: /ludoteca/juegos/coral
            - generic [ref=e6601]:
              - generic [ref=e6602]: "6.5"
              - heading "Coral" [level=3] [ref=e6603]
              - paragraph [ref=e6604]: En «Coral», los jugadores construyen juntos un arrecife de coral, al tiempo que compiten por situar a su propia especie lo más cerca posible de la superficie, donde puede absorber la luz solar que da vida. Juntos —tanto como compitiendo entre vosotros— construiréis una estructura 3D única y magnífica a partir de preciosas piezas de madera. Esta representa un arrecife de coral que crece y vive en una armonía compleja y competitiva. ¡Movéos por la mesa para encontrar los mejores lugares donde hacer crecer vuestra especie, mientras bloqueáis a vuestros oponentes! Al final de la partida, el jugador con más piezas visibles desde arriba del arrecife es el ganador. --- Coral incluye un modo de rompecabezas individual a medida y varios modos de juego multijugador, para partidas emocionantes de 1 a 4 jugadores. —descripción del editor
              - list [ref=e6605]:
                - listitem [ref=e6606]: 8+
                - listitem [ref=e6610]: 20min
                - listitem [ref=e6614]: 1-4
              - generic [ref=e6620]: Abstracto
        - article [ref=e6621]:
          - link "Coyote — Disponible" [ref=e6622] [cursor=pointer]:
            - /url: /ludoteca/juegos/coyote
            - generic [ref=e6624]:
              - generic [ref=e6625]: "6.6"
              - heading "Coyote" [level=3] [ref=e6626]
              - paragraph [ref=e6627]: Coyote es un sencillo juego de farol ambientado en el Oeste. Cada jugador recibe una carta (sujeta a la frente con una cinta de tela) en la que aparece un número de indios «ocultos» o un valor especial. No sabes cuál es el valor de tu carta, pero puedes ver todas las demás. El objetivo del juego es adivinar cuántos indios aparecen en las cartas, declarando un número cada vez mayor en cada turno. Si te pillan exagerando, pierdes. Las numerosas cartas especiales hacen que cada partida sea una sorpresa, y no olvides que nunca sabes qué carta llevas en la frente. Kidultgame publicó originalmente el juego en 2003. ¡Las ediciones francesas de Tilsit (2004, 2005 y 2006) convencieron con su accesorio de plumas auténticas! El juego ha sido reeditado por la empresa italiana Oliphante en 2010. A partir de 2011, la empresa francesa Gigamic obtuvo los derechos internacionales y el juego se ha reimpreso y distribuido en una edición totalmente nueva.
              - list [ref=e6628]:
                - listitem [ref=e6629]: 10+
                - listitem [ref=e6633]: 30min
                - listitem [ref=e6637]: 3-6
