        - article [ref=e10684]:
          - link "¡Toma 6! — Disponible" [ref=e10685] [cursor=pointer]:
            - /url: /ludoteca/juegos/toma-6
            - generic [ref=e10687]:
              - generic [ref=e10688]: "7.0"
              - heading "¡Toma 6!" [level=3] [ref=e10689]
              - paragraph [ref=e10690]: En «Take 5», también conocido como «6 nimmt!», «Category 5» y muchos otros nombres, el objetivo es sumar el menor número de puntos posible. Para jugar, se barajan las 104 cartas numéricas, se colocan cuatro cartas boca arriba para iniciar las cuatro filas y, a continuación, se reparten diez cartas a cada jugador. En cada turno, los jugadores eligen y revelan simultáneamente una carta de su mano y, a continuación, añaden las cartas a las filas, colocándolas en orden ascendente según su número; concretamente, cada carta se coloca en la fila que termina con el número más alto que sea inferior al de la carta. Cuando se coloca la sexta carta en una fila, el propietario de esa carta se queda con las otras cinco cartas y la sexta carta pasa a ser la primera de su fila. Además de un número del 1 al 104, cada carta tiene un valor en puntos. Tras completar diez rondas, los jugadores suman sus puntos y comprueban si la partida termina. (La categoría 5 termina cuando un jugador tiene una puntuación superior a 74, por ejemplo, mientras que «6 nimmt!» termina cuando alguien supera los 66). Cuando esto ocurre, ¡gana el jugador con menos puntos! «6 nimmt!» se juega con entre 2 y 10 jugadores, y la dinámica del juego cambia cuanto mayor es el número de participantes. Una variante del juego consiste en utilizar solo las 34 cartas más bajas, las 44 cartas, las 54 cartas, etc. (en lugar de las 104 cartas) cuando hay tres, cuatro, cinco, etc., jugadores. Este cambio permite saber exactamente qué cartas están en juego, lo que a su vez permite llevar un control de las cartas que se han jugado y saber qué esperar, de modo que (en teoría) se puedan tomar mejores decisiones sobre qué carta jugar y cuándo.
