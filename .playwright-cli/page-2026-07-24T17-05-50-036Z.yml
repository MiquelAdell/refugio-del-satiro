        - article [ref=e10730]:
          - link "Treu la Llengua — Disponible" [ref=e10731] [cursor=pointer]:
            - /url: /ludoteca/juegos/treu-la-llengua
            - generic [ref=e10733]:
              - generic [ref=e10734]: "6.0"
              - heading "Treu la Llengua" [level=3] [ref=e10735]
              - paragraph [ref=e10736]: "«Saca la Lengua / Treu la Llengua» («Saca la lengua») es un juego sobre el microbioma oral creado en colaboración con el Centro de Regulación Genómica (CRG, Barcelona) para su proyecto de ciencia ciudadana «Saca la Lengua». La idea del juego se diseñó en sesiones de cocreación con científicos, periodistas, profesores y diversos ciudadanos. Posteriormente, fue desarrollado por los autores en colaboración con el equipo de comunicación científica del CRG. «Saca la Lengua / Treu la Llengua» es un juego cooperativo en el que los jugadores representan a miembros de la población general con determinadas características de su microbioma (representadas en el juego por ocho géneros de bacterias, cuya población se representa mediante el valor de ocho dados). El objetivo es mantener el microbioma bucal de los jugadores lo más cerca posible de los valores de equilibrio ideales (obtenidos en la vida real gracias al proyecto de investigación). Durante 5 rondas, los jugadores realizan las siguientes acciones: a) Cada jugador que tenga 2 o más géneros en equilibrio roba una carta de acción, con la que puede mejorar el microbioma de otros jugadores. b) Cada jugador roba una carta «La vida es dura» y aplica sus efectos sobre sí mismo. A continuación, se roba una carta común «La vida es dura» y debe aplicarse a uno de los jugadores (elegido de forma cooperativa). Algunas cartas añaden dados de «infección» o marcadores de «afección grave» adicionales. Cuando los jugadores superan un umbral determinado de dados de infección o marcadores de afección grave, pierden la partida. De lo contrario, si llegan al final de la quinta ronda, ganan y calculan los puntos para conocer el grado de equilibrio de su microbiota bucal. —Descripción del diseñador"
              - list [ref=e10737]:
                - listitem [ref=e10738]: 12+
                - listitem [ref=e10742]: 70min
