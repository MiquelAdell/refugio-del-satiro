        - article [ref=e10224]:
          - link "Small World — Disponible" [ref=e10225] [cursor=pointer]:
            - /url: /ludoteca/juegos/small-world
            - generic [ref=e10227]:
              - generic [ref=e10228]: "7.2"
              - heading "Small World" [level=3] [ref=e10229]
              - paragraph [ref=e10230]: "En Small World, los jugadores compiten por la conquista y el control de un mundo que es, sencillamente, demasiado pequeño para dar cabida a todos. Diseñado por Philippe Keyaerts como una secuela de fantasía de su galardonado Vinci, Small World está poblado por un variopinto elenco de personajes, como enanos, magos, amazonas, gigantes, orcos e incluso humanos, que utilizan sus tropas para ocupar territorio y conquistar tierras adyacentes con el fin de expulsar a las demás razas de la faz de la tierra. Al elegir la combinación adecuada entre las 14 razas fantásticas diferentes y los 20 poderes especiales únicos, los jugadores se apresuran a expandir sus imperios, a menudo a costa de vecinos más débiles. Sin embargo, también deben saber cuándo llevar a su propia civilización, ya sobreextendida, al declive y conducir a una nueva hacia la victoria. En cada turno, puedes utilizar las múltiples fichas de la raza que hayas elegido (tipo de criaturas) para ocupar territorios adyacentes (normalmente), derrotando posiblemente a razas enemigas más débiles por el camino, o bien renunciar a tu raza y dejar que entre «en declive». Una raza en declive se indica dando la vuelta a las fichas para que queden en su cara en blanco y negro. Al final de tu turno, obtienes un punto (moneda) por cada territorio que ocupen tus razas. Puedes tener una raza activa y una raza en declive en el tablero al mismo tiempo. Tu total de territorios ocupados puede variar en función de las habilidades especiales de tu raza y de los territorios que ocupe. Tras la ronda final, gana el jugador con más monedas. Aclaraciones: disponibles en una publicación fijada del foro."
              - list [ref=e10231]:
                - listitem [ref=e10232]: 8+
                - listitem [ref=e10236]: 80min
