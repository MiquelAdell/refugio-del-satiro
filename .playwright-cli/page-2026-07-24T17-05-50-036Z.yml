        - article [ref=e9400]:
          - link "Pictoo — Disponible" [ref=e9401] [cursor=pointer]:
            - /url: /ludoteca/juegos/pictoo
            - generic [ref=e9403]:
              - generic [ref=e9404]: "6.9"
              - heading "Pictoo" [level=3] [ref=e9405]
              - paragraph [ref=e9406]: "¡Explora siete épocas históricas, desde el Antiguo Egipto y la Edad Media hasta el Salvaje Oeste y el futuro! ¡Compite para encontrar tesoros ocultos en este trepidante juego de percepción visual! Cada carta tiene un objeto en una cara y una imagen detallada en la otra. Cada jugador recibe 5 cartas/escenas para empezar y, a continuación, se da la vuelta a la primera carta del mazo para ver qué objeto hay que encontrar. El primer jugador que encuentre el objeto en una de sus cartas «gana» esa ronda y, a continuación, da la vuelta a la carta que acaba de usar para revelar el siguiente objeto que hay que buscar. Una vez que un jugador encuentra ese objeto en una de sus cartas, la da la vuelta para revelar el siguiente objeto, y así sucesivamente. Esto continúa hasta que un jugador haya dado la vuelta a sus cinco cartas, y ese jugador será el ganador. Un ejemplo sería: el primer objeto que hay que encontrar es un barril. Encuentro un barril en una de mis escenas que tiene lugar en el Salvaje Oeste. Les enseño el barril a todos, confirman que es correcto y, a continuación, doy la vuelta a mi carta del Salvaje Oeste: el objeto que aparece en el reverso de esa carta son unas flores. Encuentro un jardín de flores en otra carta que tengo, una escena ambientada en la Edad Media. De nuevo, se lo enseño a todos para que lo confirmen y, a continuación, le doy la vuelta a la carta. El siguiente objeto, que aparece en el reverso de esta carta, es un pájaro. Otro jugador es el primero en encontrar un pájaro en su carta, lo muestra, lo confirmamos y da la vuelta a esa carta para revelar el siguiente objeto que debemos buscar. Esto continúa hasta que un jugador haya encontrado cinco objetos (uno en cada una de las cartas con las que empezó)."
              - list [ref=e9407]:
                - listitem [ref=e9408]: 4+
                - listitem [ref=e9412]: 2-99
              - generic [ref=e9418]: Card Game
        - article [ref=e9419]:
          - link "Pigeon Punch — Disponible" [ref=e9420] [cursor=pointer]:
            - /url: /ludoteca/juegos/pigeon-punch
            - generic [ref=e9422]:
              - generic [ref=e9423]: "7.2"
              - heading "Pigeon Punch" [level=3] [ref=e9424]
              - paragraph [ref=e9425]: "¡«Pigeon Punch» te pone en la piel de un legendario luchador de palomas, así que prepárate para ser el último en quedar en pie! Al comienzo de la partida, elige a uno de los luchadores; cada uno tiene una habilidad especial que determina su estilo de juego. A continuación, cada jugador roba 5 cartas del mazo. En cada turno debes usar un tipo de carta: SUPERCHARGE: añade daño a tu próximo COMBO. COMBO: la principal fuente de daño; cada carta inflige un punto de daño. BLOQUEO: tu salvación frente a los COMBOS de tus oponentes. ATAQUE ESPECIAL: cartas únicas que tienen diferentes efectos y pueden cambiar el rumbo del combate. Todas las cartas, excepto las de ATAQUE ESPECIAL, tienen iconos de patada o puñetazo; esto es importante a la hora de potenciar los COMBOS y BLOQUEAR ataques. Fácil de aprender pero difícil de dominar: ¡así es la lucha en Pigeon Punch! —Descripción del diseñador"
              - list [ref=e9426]:
                - listitem [ref=e9427]: 8+
                - listitem [ref=e9431]: 45min
                - listitem [ref=e9435]: 2-6
              - generic [ref=e9441]: Card Game
        - article [ref=e9442]:
          - link "Piko Piko Junior — Disponible" [ref=e9443] [cursor=pointer]:
            - /url: /ludoteca/juegos/piko-piko-junior
            - generic [ref=e9445]:
              - generic [ref=e9446]: "6.1"
              - heading "Piko Piko Junior" [level=3] [ref=e9447]
              - paragraph [ref=e9448]: "Los niños llevaban mucho tiempo esperando esto: por fin, la diversión que los jugadores mayores disfrutan con Pick-omino ahora también está al alcance de los más pequeños, en un juego de dados encantador, divertido y perfectamente adaptado a su edad: Heckmeck Junior. El jugador que consiga sacar con los seis dados los ingredientes más sabrosos para su hamburguesa Mac Heck se convertirá en el «Rey de los Gusanos del Día». Los pepinos, el queso y el ketchup hacen que las alitas de pollo de nuestras jóvenes aves aleteen de alegría. Si consigues obtener muchas delicias diferentes con tus tiradas de dados, podrás poner un montón de sabrosos gusanos asados en tu plato. Sin embargo, en caso de que tu manjar deseado ya se haya retirado de la parrilla, por supuesto también puedes comer de los platos de tus oponentes. La principal diferencia entre «Pick-omino» y la versión junior es que, además de los inevitables gusanos, los dados tienen diferentes símbolos de comida (queso, ketchup, panecillos) en lugar de números, y las fichas tienen números de un solo dígito que son más fáciles de contar."
              - list [ref=e9449]:
                - listitem [ref=e9450]: 5+
                - listitem [ref=e9454]: 20min
                - listitem [ref=e9458]: 2-5
              - generic [ref=e9464]: Infantil
        - article [ref=e9465]:
          - link "Piña Coladice — Disponible" [ref=e9466] [cursor=pointer]:
            - /url: /ludoteca/juegos/pina-coladice
            - generic [ref=e9468]:
              - generic [ref=e9469]: "6.8"
              - heading "Piña Coladice" [level=3] [ref=e9470]
              - paragraph [ref=e9471]: «Piña Coladice» es un juego de mesa para toda la familia en el que lanzas los dados hasta tres veces para hacerte con una de las combinaciones disponibles en los posavasos. Coloca estratégicamente tus fichas de cóctel antes que tus rivales. Ganarás valiosos puntos que te acercarán a la victoria... ¡pero la forma más rápida de ganar es alinear cuatro de tus fichas de cóctel para formar el famoso Piña Coladice y ganar al instante! —Descripción del editor
