            - generic [ref=e7471]:
              - generic [ref=e7472]: "7.0"
              - 'heading "Exploding Kittens: Party Pack" [level=3] [ref=e7473]'
              - paragraph [ref=e7474]: Este juego independiente incluye cartas de «Exploding Kittens», «Imploding Kittens» y la aplicación «Exploding Kittens», y es para entre 2 y 10 jugadores Exploding Kittens es una versión con gatitos de la ruleta rusa. Los jugadores se turnan para robar cartas hasta que alguien roba un gatito explosivo y pierde la partida. El mazo está compuesto por cartas que te permiten evitar la explosión echando un vistazo a las cartas antes de robarlas, obligando a tu rival a robar varias cartas o barajando el mazo.
