        - article [ref=e10845]:
          - link "Ubongo Classic — Disponible" [ref=e10846] [cursor=pointer]:
            - /url: /ludoteca/juegos/ubongo-classic
            - generic [ref=e10848]:
              - generic [ref=e10849]: "6.7"
              - heading "Ubongo Classic" [level=3] [ref=e10850]
              - paragraph [ref=e10851]: "En Ubongo, los jugadores compiten por resolver rompecabezas individuales lo más rápido posible para ser los primeros en hacerse con las gemas que hay disponibles. Edición original: El tablero de juego consta de seis filas, con doce gemas (de distintos colores) colocadas en ellas. Al comienzo de la partida, cada jugador coloca su ficha delante de una de esas filas. Además, cada jugador toma doce poliminós —es decir, piezas formadas por entre 2 y 5 cuadrados en alguna configuración—; los jugadores utilizan estas piezas en cada ronda para intentar recrear las formas. Al comienzo de una ronda, cada jugador recibe una carta de rompecabezas que muestra una forma creada por un determinado número de casillas; en una cara de esta carta se muestran seis filas de tres piezas, y en la otra, seis filas de cuatro piezas, para un rompecabezas más difícil. Cuando todos estén listos, alguien lanza un dado para determinar qué fila de piezas puede utilizar cada jugador para recrear la figura de su carta individual. La carrera se cronometra con un reloj de arena, y el resultado de esta carrera determina la acción en el tablero de juego principal. El primero que resuelva su rompecabezas a tiempo puede mover su ficha hasta tres filas a la izquierda o a la derecha; el segundo jugador en terminar, dos filas; y el tercero, solo una fila. A continuación, los jugadores recogen dos gemas de la parte delantera de la fila en la que se encuentra su ficha, lo que significa que cuantas más filas puedas mover, más control tendrás sobre el color de las gemas que puedes recoger. Tras recoger las gemas, cada jugador recibe una nueva carta de rompecabezas y comienza una nueva ronda. Tras nueve rondas, el juego termina y gana quien haya recogido más gemas de un mismo color. Si hay empate, los jugadores comparan quién tiene más gemas de un segundo color, y así sucesivamente. Edición de 2015: La parte del rompecabezas del juego sigue siendo la misma, pero la pista de puntuación y el sistema se han modificado considerablemente, para que sean iguales a los de Ubongo Extreme. Ya no hay fichas, sino que el ganador se lleva una gema de 3 puntos más una gema aleatoria, el jugador que queda en segundo lugar se lleva una gema de 1 punto más una gema aleatoria, y los demás que terminen dentro del tiempo límite se llevan solo una gema aleatoria. Quien consiga más puntos de gemas tras nueve rondas gana la partida."
