        - article [ref=e7744]:
          - link "Hanamikoji — Disponible" [ref=e7745] [cursor=pointer]:
            - /url: /ludoteca/juegos/hanamikoji
            - generic [ref=e7747]:
              - generic [ref=e7748]: "7.5"
              - heading "Hanamikoji" [level=3] [ref=e7749]
              - paragraph [ref=e7750]: Bienvenidos a Hanamikoji, la calle de las geishas más famosa de la antigua capital. Las geishas son mujeres elegantes y gráciles, expertas en arte, música, danza y una gran variedad de actuaciones y ceremonias. Muy respetadas y adoradas, las geishas son maestras del entretenimiento. En Hanamikoji, dos jugadores compiten por ganarse el favor de siete ilustres geishas recogiendo el objeto de actuación preferido de cada una. Con una especulación cuidadosa y algunas jugadas audaces, ¿serás capaz de burlar a tu oponente para ganarte el favor del mayor número de geishas? Jixia Academy presenta la misma mecánica de juego que Hanamikoji, pero con un diseño gráfico diferente. Preguntas frecuentes sobre Hanamikoji
