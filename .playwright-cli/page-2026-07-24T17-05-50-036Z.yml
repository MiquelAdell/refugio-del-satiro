        - article [ref=e9626]:
          - 'link "Railroad Ink: Edición azul profundo — Disponible" [ref=e9627] [cursor=pointer]':
            - /url: /ludoteca/juegos/railroad-ink-edicion-azul-profundo
            - generic [ref=e9629]:
              - generic [ref=e9630]: "7.1"
              - 'heading "Railroad Ink: Edición azul profundo" [level=3] [ref=e9631]'
              - paragraph [ref=e9632]: En el juego de puzles multijugador «Railroad Ink», tu objetivo es conectar el mayor número posible de salidas de tu tablero. En cada ronda, se lanzan unos dados en el centro de la mesa, lo que determina qué tipo de carreteras y vías férreas están disponibles para todos los jugadores. Tienes que trazar estas rutas en tus tableros borrables para crear líneas de transporte y conectar tus salidas, intentando optimizar los símbolos disponibles mejor que tus oponentes. Cuantas más salidas conectes, más puntos obtendrás al final de la partida, pero perderás puntos por cada ruta incompleta, ¡así que planifica con cuidado! ¿Te arriesgarás y tratarás de ampliar tu red de transporte hasta la siguiente salida, o irás a lo seguro y empezarás una nueva ruta más fácil de gestionar? Railroad Ink está disponible en dos versiones, cada una de las cuales incluye dos expansiones con juegos de dados adicionales que añaden nuevas reglas especiales a tus partidas. La edición Deep Blue incluye las expansiones «Rivers» y «Lakes». Aumenta la dificultad añadiendo la ruta fluvial a la mezcla, o utiliza los lagos para conectar tus redes mediante transbordadores. Estas reglas especiales pueden darle más emoción al juego y hacer que cada partida sea diferente. Cada caja te permite jugar de 1 a 6 jugadores, y si combinas varias cajas, puedes jugar con hasta 12 jugadores (o más). ¡El único límite al número de jugadores es el número de tableros que tengas!
