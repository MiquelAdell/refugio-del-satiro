        - article [ref=e7721]:
          - link "Hanabi — Disponible" [ref=e7722] [cursor=pointer]:
            - /url: /ludoteca/juegos/hanabi
            - generic [ref=e7724]:
              - generic [ref=e7725]: "7.0"
              - heading "Hanabi" [level=3] [ref=e7726]
              - paragraph [ref=e7727]: Hanabi —cuyo nombre proviene de la palabra japonesa que significa «fuegos artificiales»— es un juego cooperativo en el que los jugadores intentan crear el espectáculo pirotécnico perfecto colocando las cartas sobre la mesa en el orden correcto. (En japonés, «hanabi» se escribe 花火; se trata de los ideogramas «flor» y «fuego», respectivamente). El mazo está compuesto por cartas de cinco colores diferentes, numeradas del 1 al 5 en cada color. Para cada color, los jugadores intentan formar una fila en el orden correcto, del 1 al 5. Suena fácil, ¿verdad? Bueno, no del todo, ya que en este juego cada uno tiene sus cartas de forma que solo las vean los demás jugadores. Para ayudar a los demás a jugar una carta, debes darles pistas sobre los números o los colores de sus cartas. Los jugadores deben actuar en equipo para evitar errores y terminar el espectáculo de fuegos artificiales antes de que se les acaben las cartas. También se incluye una baraja adicional, con los colores del arcoíris, para partidas avanzadas o variantes. Hanabi se publicó originalmente como parte de Hanabi & Ikebana.
