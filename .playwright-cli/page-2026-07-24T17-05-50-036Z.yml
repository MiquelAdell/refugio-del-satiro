            - generic [ref=e8253]:
              - generic [ref=e8254]: "7.6"
              - heading "Last Bullet" [level=3] [ref=e8255]
              - paragraph [ref=e8256]: "¡Bienvenido al enfrentamiento final! Ponte en la piel de uno de los personajes que han cometido fechorías a lo largo de su vida y se enfrentan a su fin en una mesa de juego. Las reglas son sencillas: solo uno puede salir vivo de la mesa. En cada turno, debes apretar el gatillo, pero ten cuidado: hay balas que te interesará recibir para ganar recompensas. Durante la partida, puedes usar una serie de cartas de objeto para «hacer trampa» y salir ileso. En resumen, es un juego de estadísticas, suerte, apuestas y mucho farol. ¿Estás preparado? —Descripción del editor"
