        - article [ref=e8641]:
          - link "Memory — Disponible" [ref=e8642] [cursor=pointer]:
            - /url: /ludoteca/juegos/memory
            - generic [ref=e8644]:
              - generic [ref=e8645]: "4.8"
              - heading "Memory" [level=3] [ref=e8646]
              - paragraph [ref=e8647]: "Publicado por primera vez en su formato actual por Ravensburger en febrero de 1959, posee los derechos sobre la marca «Memory». Se conocen versiones de Japón del siglo XVI en las que había que emparejar imágenes pintadas en conchas. Se conocían como «Awase» o «Kai-awase». En EE. UU. e Inglaterra se conocían como «Pairs», «Pelmanism» o «Concentration». Pero estos se jugaban con simples naipes. En Suiza existía un juego similar al dominó llamado «Zwillingsspiel» con las mismas raíces. En la República Checa, este tipo de juego se conoce como «Pexeso». El nombre es un acrónimo de «pekelně se soustřed!», que se traduce literalmente como «¡concentrate a más no poder!». Suele constar de 32 pares de cartas cuadradas. Hay miles de juegos de Pexeso con diferentes temáticas. Existen cientos de juegos de memoria diferentes: desde los de 24 cartas para los más pequeños, con todo tipo de animales, arte o países, hasta uno gay y un «Breast Memory», además de varios juegos de memoria gratuitos publicados por empresas. Los jugadores colocan una serie de fichas boca abajo en orden aleatorio. A continuación, van descubriendo dos a la vez. Si coinciden, el jugador se queda con ambas. Si no coinciden, el jugador pierde su turno. Hay dos tipos diferentes de juegos de memoria: tipo A: juegos de memoria puros con parejas de motivos idénticos y tipo B: juegos de memoria con motivos similares, p. ej., un juego de memoria 1x1 en el que una pareja está formada por los números que hay que multiplicar y el resultado. El juego termina cuando se han emparejado todas las fichas. Gana el jugador con mayor número de fichas."
