            - generic [ref=e10043]:
              - generic [ref=e10044]: "6.8"
              - 'heading "Similo: Espeluznante" [level=3] [ref=e10045]'
              - paragraph [ref=e10046]: Similo es un juego cooperativo de deducción, y cada versión del juego —por ejemplo, Fábulas, Historia, Mitos— incluye un mazo de treinta cartas, bellamente ilustradas por Naïade, en las que aparecen el retrato y el nombre de una serie de personajes con una temática común. Tu objetivo es conseguir que los demás jugadores adivinen un personaje secreto (de entre los doce personajes que se muestran en el centro de la mesa) jugando otras cartas de personaje de tu mano como pistas, indicando si son similares o diferentes al personaje secreto. Tras cada turno, los demás jugadores deben retirar uno o más personajes de la mesa hasta que solo quede el correcto y tú ganes —¡o hasta que se retire y tú pierdas! Puedes jugar con uno de los juegos de Similo por sí solo, utilizando las cartas de, por ejemplo, «Fábulas» tanto para los personajes que se colocan sobre la mesa como para las pistas que se dan a los que tienen que adivinar, o bien puedes usar las cartas de un juego para los doce personajes que se muestran y las cartas de otro juego como pistas. ¡El juego es mucho más complicado de esta manera!
