        - article [ref=e6023]:
          - link "Blood on the Clocktower — Disponible" [ref=e6024] [cursor=pointer]:
            - /url: /ludoteca/juegos/blood-on-the-clocktower
            - generic [ref=e6026]:
              - generic [ref=e6027]: "8.3"
              - heading "Blood on the Clocktower" [level=3] [ref=e6028]
              - paragraph [ref=e6029]: En la tranquila localidad de Ravenswood Bluff, un demonio se pasea entre vosotros. Durante una tormenta infernal, al dar la medianoche, resuena un grito que hiela la sangre. Los vecinos se apresuran a investigar y encuentran al narrador del pueblo asesinado, con el cuerpo empalado en las manecillas de la torre del reloj, de donde la sangre gotea sobre los adoquines. Un demonio anda suelto, asesinando por la noche y disfrazado de humano durante el día. Algunos tienen retazos de información. Otros poseen habilidades para combatir el mal o proteger a los inocentes. Pero el demonio y sus malvados secuaces están difundiendo mentiras para confundir y sembrar la sospecha. ¿Conseguirán los honrados habitantes del pueblo resolver el rompecabezas a tiempo para ejecutar al verdadero demonio y salvarse? ¿O se apoderará el mal de este pueblo que antes era tan tranquilo? «Blood on the Clocktower» es un juego de farol en el que los jugadores se dividen en equipos opuestos del Bien y del Mal, supervisados por un jugador que actúa como Narrador, el cual dirige la acción y toma decisiones cruciales. El objetivo del juego es deducir y ejecutar con éxito a los demonios antes de que superen en número a los habitantes del pueblo. Durante la fase del «día», los jugadores socializan abiertamente y susurran en privado para intercambiar información o difundir mentiras, lo que culmina con la ejecución de un jugador si la mayoría sospecha que pertenece al bando del Mal. Durante la fase de la «noche», los jugadores cierran los ojos y el Narrador los despierta de uno en uno para recabar información, sembrar el caos o matar. El Narrador utiliza las intrincadas fichas del juego para guiar cada partida, lo que permite a los demás jugar sin necesidad de mesa ni tablero. Los jugadores permanecen en el centro de la acción hasta el final, incluso si sus personajes mueren, rondando Ravenswood Bluff como fantasmas que intentan ganar desde el más allá. Si llegas tarde a una partida, puedes incorporarte una vez que haya comenzado como un poderoso personaje «Viajero» con talentos inusuales y lealtades cuestionables. Cada personaje cuenta con su propia habilidad especial y nunca hay dos jugadores en una partida que sean el mismo personaje.
              - list [ref=e6030]:
