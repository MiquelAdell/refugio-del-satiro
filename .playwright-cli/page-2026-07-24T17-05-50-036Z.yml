        - article [ref=e10155]:
          - link "Skull King — Disponible" [ref=e10156] [cursor=pointer]:
            - /url: /ludoteca/juegos/skull-king
            - generic [ref=e10158]:
              - generic [ref=e10159]: "7.5"
              - heading "Skull King" [level=3] [ref=e10160]
              - paragraph [ref=e10161]: "Skull King es un juego de bazas similar a Oh Hell!, Wizard, Euchre y Spades, en el que los jugadores deben declarar cuántas bazas creen que ganarán en cada ronda. Un elemento único de este juego es que las apuestas se realizan simultáneamente, lo que da lugar a rondas en las que a veces se apuesta de más o de menos. Como los jugadores deben ganar exactamente el número de bazas que han apostado para sumar puntos, ganar demasiadas bazas es tan malo como ganar muy pocas, lo que da lugar a una intensa competición en la que perder una baza puede ser tan emocionante como ganar una. Skull King utiliza una baraja de 66 cartas compuesta por cinco cartas «Escape», cuatro palos numerados del 1 al 13, dos «Sirenas», cinco cartas de «Pirata», una carta de «Tigresa» y una carta de «Skull King». El juego dura diez rondas y, en cada una de ellas, a cada jugador se le reparten tantas cartas como indique el número de la ronda. Todos los jugadores pujan simultáneamente por el número de bazas que creen que van a ganar, mostrando el puño cerrado y, a la cuenta de tres, revelando un determinado número de dedos (o, en su caso, el puño cerrado para una puja de cero bazas). Se aplican las reglas estándar para jugar las cartas: un jugador abre la mano con una carta y los demás jugadores siguen el palo, si es posible, y juegan otra cosa si no lo es; sin embargo, un jugador siempre puede optar por jugar una de las cartas especiales sin numerar, y el poder de esas cartas podría permitirte ganar una baza que, de otro modo, se te habría escapado. Más concretamente, el palo negro del «Jolly Roger» se impone a los otros tres palos; una «Sirena» se impone a todas las cartas numeradas; un «Pirata» se impone a la «Sirena»; y el «Rey Calavera» se impone a todo —excepto si aparece en la misma baza que una «Sirena», en cuyo caso ella lo captura y gana en su lugar. Una carta de «Escape» pierde frente a cualquier otra carta, y la carta de la «Tigresa» puede funcionar como carta de pirata o de «Escape», según lo desee el jugador. Quien gane una baza tiene la primera jugada en la siguiente. Si un jugador cumple exactamente su apuesta, suma 20 puntos por baza; si gana más o menos bazas, pierde 10 puntos por cada baza de diferencia. Si un jugador hace una apuesta de cero bazas, gana puntos equivalentes a diez veces el número de la ronda actual; pero si se lleva aunque sea una sola baza, pierde esa misma cantidad de puntos. Si un jugador atrapa a los piratas con el Rey Calavera, o al Rey con una sirena, obtiene puntos de bonificación. Gana quien tenga más puntos tras diez rondas."
