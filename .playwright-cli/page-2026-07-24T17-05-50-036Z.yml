        - article [ref=e11029]:
          - 'link "Zombicide: Green Horde — Disponible" [ref=e11030] [cursor=pointer]':
            - /url: /ludoteca/juegos/zombicide-green-horde
            - generic [ref=e11032]:
              - generic [ref=e11033]: "7.7"
              - 'heading "Zombicide: Green Horde" [level=3] [ref=e11034]'
              - paragraph [ref=e11035]: "Esta secuela de «Zombicide: Black Plague» volverá a sumergir a los jugadores en un mundo de fantasía medieval letal, esta vez repleto de orcos y goblins infectados que pondrán a prueba hasta el límite a los supervivientes. Esta amenaza verde no solo es más fuerte que sus homólogos humanos, sino que además tiende a agruparse en hordas gigantescas que tienden emboscadas a los supervivientes cuando menos se lo esperan. Ambientado en la misma época medieval que Black Plague, los jugadores asumirán el papel de supervivientes que buscan derrotar a la amenaza de los muertos vivientes que se arrastran por el terreno por cualquier medio posible. En Green Horde, hasta seis jugadores pueden unirse a la batalla por la supervivencia. Unirán fuerzas y trabajarán en equipo para alcanzar sus objetivos y, contra todo pronóstico, mantenerse con vida. Los aficionados a la serie Zombicide ya están familiarizados con los Walkers, los Runners, los Fatties y las Abominaciones que deambulan en busca de víctimas. Pero las criaturas a las que se enfrentarán no son solo humanos zombis, ¡son orcos zombis! Los supervivientes tendrán que equiparse con una amplia variedad de armamento medieval si quieren sobrevivir a estos temibles enemigos. Los orcos zombis son más fuertes que los zombis clásicos y suponen un reto aún mayor incluso para los veteranos más curtidos en la caza de muertos vivientes. Un nuevo desafío para los supervivientes es la Horda. Se trata de un grupo cada vez mayor de orcos zombis que están listos para entrar en el tablero por un lugar inesperado y tender una emboscada a los supervivientes. A medida que se roban cartas de zombis con el símbolo de la Horda, se aparta una miniatura de zombi adicional del mismo tipo, formando así la Horda. Permanecerán inmovilizadas hasta que se robe una carta de «¡Entra la Horda!», lo que hará que la Horda aparezca en el tablero. Cualquier superviviente que se encuentre solo cerca de esta amenaza itinerante haría bien en emprender una retirada precipitada. Con unos nuevos enemigos tan amenazantes, los supervivientes tendrán las manos ocupadas lidiando con la Horda Verde. Por suerte, contarán con nuevas armas y hechizos de su lado para ayudar a combatir a las masas putrefactas. Cosas como la «Explosión de lava», la «Espada nórdica» y el «Kukri de hueso» resultarán muy útiles a la hora de abrirse paso a golpes entre una manada de muertos vivientes. Ah, y si se agrupan demasiado, los supervivientes siempre pueden atacarlos con la catapulta... (¿no habíamos mencionado la catapulta?). «Zombicide: Green Horde» incluye diez nuevas y desafiantes misiones, con algunos de los escenarios más duros a los que un superviviente se haya tenido que enfrentar jamás. Con nuevos terrenos, como salientes y charcos, y la amenaza siempre presente de que la Horda Verde haga acto de presencia, el equipo tendrá que planificar sus rutas con cuidado. ¡A veces es mejor evitar los problemas que enfrentarse a ellos de frente! Zombicide: Green Horde es el siguiente capítulo en el mundo en constante evolución de Zombicide. No hay descanso para los supervivientes si esperan abrirse camino hacia una nueva esperanza y un nuevo comienzo."
