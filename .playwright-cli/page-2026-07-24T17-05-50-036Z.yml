        - article [ref=e6782]:
          - 'link "Disney Princess: See the Story — Disponible" [ref=e6783] [cursor=pointer]':
            - /url: /ludoteca/juegos/disney-princess-see-the-story
            - generic [ref=e6785]:
              - generic [ref=e6786]: "6.0"
              - 'heading "Disney Princess: See the Story" [level=3] [ref=e6787]'
              - paragraph [ref=e6788]: "¡Echa un vistazo al mágico pozo de los deseos! Verás objetos encantadores y personajes inolvidables de tus historias favoritas de las Princesas Disney. ¡Compite para encontrar dos imágenes de la misma historia! Lanza tu ficha al pozo y señala dos imágenes de la misma historia de las Princesas Disney. Si aciertas, ¡consigue una de las monedas para tu tablero de las Princesas Disney! ¡Sé el primero en reunir 4 monedas seguidas para ganar! • Incluye a las 12 princesas de Disney. • Gira el cubo giratorio para revelar mágicamente las imágenes del pozo de los deseos. • Las relucientes monedas con imágenes incluyen 60 animales, compañeros y objetos de las películas de las Princesas Disney. • Aprobado por las niñeras: ¡Fácil de aprender, fácil de guardar y divertido de jugar! -Descripción del editor"
