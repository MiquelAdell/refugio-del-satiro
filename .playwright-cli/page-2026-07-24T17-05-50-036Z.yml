        - article [ref=e9557]:
          - link "Puerto Rico 1897 — Disponible" [ref=e9558] [cursor=pointer]:
            - /url: /ludoteca/juegos/puerto-rico-1897
            - generic [ref=e9560]:
              - generic [ref=e9561]: "7.7"
              - heading "Puerto Rico 1897" [level=3] [ref=e9562]
              - paragraph [ref=e9563]: «Puerto Rico 1897» se desarrolla un año después de que Puerto Rico alcanzara la autonomía política y se separara del gobierno colonial español. En el juego, te pones en la piel de un agricultor puertorriqueño independiente en esta nueva era y compites contra otros jugadores para contratar trabajadores con los que cultivar, vender e intercambiar valiosos productos agrícolas. También te encargarás de reconstruir partes del país mientras intentas construir infraestructuras urbanas esenciales. Tu objetivo a lo largo del juego es adquirir más riqueza y prestigio que tus oponentes y convertirte en el agricultor más próspero de todo el país. Cada jugador dispone de su propio tablero pequeño con casillas para edificios urbanos, plantaciones y recursos. Los jugadores comparten tres barcos, una casa de comercio y una reserva de recursos y doblones. «Puerto Rico 1897» utiliza un mecanismo de orden de fases variable en el que, al finalizar un turno, se pasa una ficha en el sentido de las agujas del reloj al siguiente jugador. El jugador que tiene la ficha comienza la ronda eligiendo un rol y realizando la primera acción. El ciclo de recursos del juego consiste en que los jugadores cultivan productos que intercambian por puntos o doblones. Los doblones se pueden utilizar para comprar edificios, lo que permite a los jugadores producir más cultivos o les otorga otras habilidades. Los edificios y las plantaciones no funcionan a menos que cuenten con trabajadores. Durante cada ronda, los jugadores se turnan para seleccionar una carta de rol de entre las que hay sobre la mesa (como «Comerciante» o «Constructor»). Cuando se elige un rol, todos los jugadores pueden realizar la acción asociada a ese rol. El jugador que ha seleccionado el rol también recibe un pequeño privilegio por hacerlo; por ejemplo, elegir el rol de «Constructor» permite a todos los jugadores construir un edificio, pero el jugador que ha elegido el rol puede hacerlo con un descuento en ese turno. Los roles no utilizados obtienen una bonificación de doblones al final de cada turno, y el siguiente jugador que elija ese rol se queda con cualquier bonificación de doblones asociada a él. Esto anima a los jugadores a hacer uso de todos los roles a lo largo del desarrollo habitual de una partida. Los jugadores obtienen puntos de victoria por poseer edificios, por transportar mercancías y por los «grandes edificios» ocupados. Las fichas de transporte acumuladas por cada jugador se mantienen boca abajo y tienen valores de uno o cinco. Esto impide que los demás jugadores puedan determinar la puntuación exacta de otro jugador. Las mercancías y los doblones se colocan a la vista de los demás jugadores, y cualquiera de ellos puede solicitar en cualquier momento los totales de cada uno. A medida que el juego avanza hacia sus últimas fases, la cantidad desconocida de fichas de transporte y sus denominaciones obligan a los jugadores a sopesar sus opciones antes de elegir un papel que pueda poner fin a la partida. Puerto Rico 1897 incluye cuatro expansiones.
