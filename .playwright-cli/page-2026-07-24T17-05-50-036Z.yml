              - heading "Funny Bunny" [level=3] [ref=e7611]
              - paragraph [ref=e7612]: Una versión especial del popular juego Lotti Karotti (Funny Bunny). Esta versión incluye tres novedades (un puente, una verja y un topo), además de miniaturas de conejitos brillantes. Gana el primer jugador que consiga que uno de sus conejitos llegue a la cima de la colina. En cada turno, los jugadores roban una carta que les obliga a mover uno de sus conejitos o a girar la zanahoria situada en la parte superior del tablero, lo que provocará que se abran y se cierren agujeros en el tablero de juego. Cualquier conejito que caiga en un agujero abierto, o que se le abra un agujero debajo, cae por debajo del tablero. Si un jugador pierde sus cuatro conejitos, queda eliminado del juego.
