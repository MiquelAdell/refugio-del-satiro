        - article [ref=e5816]:
          - link "Art Society — Disponible" [ref=e5817] [cursor=pointer]:
            - /url: /ludoteca/juegos/art-society
            - generic [ref=e5819]:
              - generic [ref=e5820]: "7.5"
              - heading "Art Society" [level=3] [ref=e5821]
              - paragraph [ref=e5822]: Art Society es un juego de coleccionismo de arte con reglas fáciles de aprender. En Art Society, eres un experto en arte que intenta impresionar a sus compañeros creando la colección de arte más de moda de todas. Puja por las obras de arte más cotizadas y, a continuación, colócalas en la pared de tu salón para crear una galería con un gusto exquisito que sea la envidia del mundo artístico local. ¡Pero cuidado! La moda es efímera y las tendencias son difíciles de predecir. Los cuadros que tú y tus compañeros coleccionistas no compréis acabarán llegando al museo, lo que modificará el valor de tu colección. Al final, ¿de quién será la pared de la que todo el mundo hable? —Descripción del editor
