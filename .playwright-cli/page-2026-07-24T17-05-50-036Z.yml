        - article [ref=e6690]:
          - link "De Vulgari Eloquentia — Disponible" [ref=e6691] [cursor=pointer]:
            - /url: /ludoteca/juegos/de-vulgari-eloquentia
            - generic [ref=e6693]:
              - generic [ref=e6694]: "7.2"
              - heading "De Vulgari Eloquentia" [level=3] [ref=e6695]
              - paragraph [ref=e6696]: Italia, finales de la Edad Media. Los comerciantes de telas necesitan redactar sus contratos en una lengua que todo el mundo pueda entender, y los cultos buscan una alternativa a la élite del latín tradicional. Así, el volgare, la lengua hablada por el pueblo llano, derivada de los dialectos de las distintas regiones italianas, empieza a cobrar importancia. Durante este periodo, Francisco de Asís escribe su famoso Cántico del Sol y Dante compone la Divina Comedia, ambas obras redactadas en volgare. ¡Los jugadores tendrán que aportar su granito de arena a la creación de esta nueva lengua! Pero, ¿quién les proporcionará los conocimientos necesarios para comprender los manuscritos escritos en los distintos dialectos? ¿Quién logrará desvelar los secretos de los libros que se guardan en la Biblioteca Papal? ¿Quién abrazará la vida religiosa y quién seguirá siendo comerciante? Algunos de los jugadores pueden convertirse en un famoso banquero, ¡mientras que otros pueden ascender en la jerarquía eclesiástica hasta convertirse en el próximo Papa! Pero, al final, ¿quién será el más apreciado y respetado por su estatus y su cultura? El objetivo del juego es obtener más puntos Volgare. Los jugadores ganarán PV leyendo manuscritos y buscando documentos importantes como el Cántico del Sol o «El acertijo de Verona». Los jugadores también pueden ganar PV mejorando su estatus social; por ejemplo, si el comerciante se convierte en banquero, el fraile en monje benedictino o el cardenal en camerlengo o en Papa. Además, se pueden obtener PV con dinero y con el apoyo de políticos, nobles, abadesas y el amanuense.
