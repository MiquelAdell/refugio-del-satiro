        - article [ref=e9764]:
          - link "Riverside — Disponible" [ref=e9765] [cursor=pointer]:
            - /url: /ludoteca/juegos/riverside
            - generic [ref=e9767]:
              - generic [ref=e9768]: "7.1"
              - heading "Riverside" [level=3] [ref=e9769]
              - paragraph [ref=e9770]: "Lejos, al norte, en una remota tierra invernal, los ríos permanecen helados la mayor parte del año. Cuando por fin se puede acceder a los pueblos situados a orillas del río, una pequeña empresa de cruceros fluviales ofrece excursiones exóticas como safaris para avistar osos polares, paseos en renos, pesca en hielo y mucho más. Los turistas con suerte pueden incluso tener la oportunidad de ver la aurora boreal. Trabajas como guía turístico intentando atraer a los turistas a tus barcos para que disfruten de excursiones espectaculares. Riverside es un juego de «tirar y anotar» diferente: el juego incluye un tablero modular que conforma la ruta de la partida. En un barco de crucero fluvial, todos siguen la misma ruta, pero puedes llevar a tus turistas a diferentes excursiones. Puedes planificarlo con antelación, pero ten cuidado: los dados pueden obligarte a cambiar tus planes. Comienzas cada ronda lanzando los dados en un fondo común. Al mismo tiempo, cada jugador elige un dado de un color específico (sin cogerlo físicamente) y ocupa los asientos del barco turístico correspondiente en su propia hoja de jugador. Cada vez que completan una fila de asientos, han vendido un billete de grupo del color correspondiente (excursión). Cuanto más larga sea la fila, más puntos obtienen. Además, este billete es válido durante el resto de la partida: cada vez que realice una excursión en un pueblo de ese color, se llevará a este grupo consigo para ganar aún más puntos. El jugador con más puntos gana la partida. Cada color de dado representa a turistas con preferencia por un tipo específico de excursión. El dado verde transparente es «comodín» y representa la aurora boreal, algo que todo el mundo quiere ver. Riverside plantea decisiones difíciles en un tiempo de juego reducido: algunas filas son cortas y ofrecen pocos puntos y bonificaciones, mientras que otras son largas y ofrecen más puntos y bonificaciones. ¿Por cuál empiezas a completar? En cada barco turístico, debes ir sumando cada vez más puntos, por lo que llevar a demasiados turistas en tus primeras excursiones podría resultarte fatídico. Los jugadores son recompensados si consiguen satisfacer a los cinco tipos de turistas, así que ¿quizás deberías centrarte en sumar puntos con un nuevo color en lugar de intentar alcanzar una puntuación muy alta con otro? Los dados de mayor valor representan a turistas que se están congelando y cuesta símbolos de fuego conseguirlos. ¡Ten en cuenta que el dado verde «comodín» siempre cuesta símbolos de fuego! Tienes un número limitado de símbolos de fuego, así que, ¿cuándo será el momento adecuado para usarlos? —Descripción del diseñador"
