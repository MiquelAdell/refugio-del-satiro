        - article [ref=e6115]:
          - link "Carcassonne — Disponible" [ref=e6116] [cursor=pointer]:
            - /url: /ludoteca/juegos/carcassonne
            - generic [ref=e6118]:
              - generic [ref=e6119]: "7.4"
              - heading "Carcassonne" [level=3] [ref=e6120]
              - paragraph [ref=e6121]: "Carcasona es un juego de colocación de fichas en el que los jugadores roban y colocan una ficha en la que aparece representado un paisaje del sur de Francia. La ficha puede mostrar una ciudad, un camino, un claustro, un prado o una combinación de estos elementos, y debe colocarse junto a fichas que ya se hayan jugado, de tal forma que las ciudades se conecten con otras ciudades, los caminos con otros caminos, etcétera. Una vez colocada la ficha, el jugador puede decidir colocar uno de sus meeples en una de las zonas que aparecen en ella: en la ciudad como caballero, en la carretera como ladrón, en el claustro como monje o en el campo como granjero. Cuando esa zona se completa, ese meeple suma puntos para su propietario. Durante una partida de Carcasona, los jugadores se enfrentan a decisiones como: «¿Realmente vale la pena colocar mi última ficha de personaje ahí?» o «¿Debería usar esta ficha para ampliar mi ciudad, o debería colocarla cerca de mi rival, dificultándole así que la complete y sume puntos?». Dado que los jugadores solo colocan una ficha y tienen la opción de colocar una ficha de jugador sobre ella, los turnos se suceden rápidamente, aunque se trate de un juego repleto de opciones y posibilidades. Primera partida de la serie Carcassonne."
