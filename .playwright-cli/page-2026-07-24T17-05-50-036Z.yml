        - article [ref=e9262]:
          - 'link "Pandemic: El reino de Cthulhu — Disponible" [ref=e9263] [cursor=pointer]':
            - /url: /ludoteca/juegos/pandemic-el-reino-de-cthulhu
            - generic [ref=e9265]:
              - generic [ref=e9266]: "7.4"
              - 'heading "Pandemic: El reino de Cthulhu" [level=3] [ref=e9267]'
              - paragraph [ref=e9268]: "Unos seres del mal ancestral, conocidos como los Antiguos, amenazan con escapar de su prisión cósmica y despertar en el mundo. Todo lo que conoces y amas podría quedar destruido por el caos y la locura. ¿Conseguiréis tú y tus compañeros investigadores encontrar y sellar todos los portales a tiempo? Date prisa antes de que la locura se apodere de ti. En Pandemic: Reign of Cthulhu, vivirás la clásica mecánica de juego de Pandemic con un giro terrorífico que te hará enfrentarte a doce Antiguos, cada uno de los cuales amenaza al mundo con sus poderes únicos. A medida que los jugadores asumen el papel de investigadores que intentan sellar una serie de portales antes de que monstruos de un horror indescriptible se abalancen sobre nuestro mundo, existe, por supuesto, un alto riesgo de que los investigadores pierdan la razón. En lugar de curar enfermedades como en el Pandemic original, los jugadores sellan portales y desmantelan cultos en las clásicas localidades ficticias de Nueva Inglaterra: Arkham, Dunwich, Innsmouth y Kingsport. ¿Conseguiréis tú y tus compañeros investigadores encontrar y sellar todos los portales a tiempo? Daos prisa antes de que la locura y el mal que acecha bajo vuestros pies os consuman... Parte de la serie Pandemic."
              - list [ref=e9269]:
                - listitem [ref=e9270]: 14+
                - listitem [ref=e9274]: 40min
