        - article [ref=e9833]:
          - link "Salton Sea — Disponible" [ref=e9834] [cursor=pointer]:
            - /url: /ludoteca/juegos/salton-sea
            - generic [ref=e9836]:
              - generic [ref=e9837]: "7.4"
              - heading "Salton Sea" [level=3] [ref=e9838]
              - paragraph [ref=e9839]: "El lago Salton es un lugar único situado en California, muy cerca de la frontera con México. Las características de este lago salino lo convierten en un emplazamiento único para generar energía geotérmica, que aprovecha el calor del planeta. En esta zona de intensa actividad geotérmica, perforarás el suelo y extraerás salmuera que, una vez procesada, nos permite obtener el valioso litio y venderlo como parte de una industria moderna, alejada de los combustibles fósiles, que te permitirá liderar la transición energética hacia un futuro totalmente renovable. Diseñado por David Bernal e ilustrado por Amelia Sales, Salton Sea se puede disfrutar en solitario o en grupos de hasta cuatro jugadores en partidas de unos 120 minutos de duración. Durante el juego, los jugadores deben gestionar sus empresas de extracción geotérmica de litio para obtener el mayor número de puntos. La extracción de este material y su posterior procesamiento serán el motor de vuestras empresas. En vuestro turno, colocad a uno de vuestros cuatro ingenieros en una de las casillas disponibles para realizar una acción. Hay tres grupos diferentes de acciones: acciones industriales (que te permiten obtener una licencia de exploración, perforar, extraer, procesar o reparar maquinaria), acciones comerciales (vender, adquirir un contrato y ejecutar un contrato) y acciones de gestión (investigar, comprar acciones, desarrollar el proyecto empresarial o financiarse). Depende de ti gestionar a los ingenieros en cada momento del juego para sacar el máximo partido a tu empresa. Sin embargo, no hay un único camino hacia el éxito. El juego te recompensará por el terreno explotado, los contratos ejecutados, los objetivos a corto plazo, el desarrollo de la empresa o los avances en investigación. ¿Conseguirás dominar el poder del lago Salton para crear la empresa geotérmica más eficiente? —Descripción del editor"
              - list [ref=e9840]:
                - listitem [ref=e9841]: 12+
                - listitem [ref=e9845]: 120min
