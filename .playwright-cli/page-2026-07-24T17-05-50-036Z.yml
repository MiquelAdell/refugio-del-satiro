              - generic [ref=e7269]: "6.7"
              - 'heading "El Señor de los Anillos: Aventura Hacia el Monte del Destino" [level=3] [ref=e7270]'
              - paragraph [ref=e7271]: "En «El Señor de los Anillos: Aventura hacia el Monte del Destino», los jugadores siguen la historia del peligroso viaje de Frodo para destruir el Anillo Único en las llamas del Monte del Destino. Le acompaña su conocida comunidad, encargada de protegerle de los peligros a los que se enfrentará por el camino. Los jugadores controlan juntos el destino de esta compañía moviendo las figuras individuales por el tablero de juego en un viaje a través de muchos lugares conocidos de las queridas novelas de *El Señor de los Anillos*. Es importante tener cuidado con los Nazgul y, al mismo tiempo, asegurarse de que Frodo no pierda la confianza y se quede paralizado por la desesperación. Cuando Frodo llega al Monte del Destino, todos los jugadores ganan juntos. El movimiento de los personajes se controla mediante un mecanismo especial de dados. Los dados de colores determinan qué figura se puede mover. El valor del dado determina el número de casillas que puede recorrer una figura. Al elegir los dados antes y después de la tirada, los jugadores se enfrentan a decisiones que, aunque aparentemente sencillas, son sin embargo significativas para el resultado de la partida. Los dados negros, que siempre deben lanzarse, desencadenan amenazas o provocan encuentros con enemigos o aliados. Las cartas de encuentro garantizan una amenaza continua y cada vez mayor para completar la misión. Al igual que en la mayoría de los juegos cooperativos, los jugadores deben coordinar sus movimientos y acciones entre sí para garantizar el resultado deseado. —Descripción del editor"
