              - heading "Friegas Tú" [level=3] [ref=e7588]
              - paragraph [ref=e7589]: Friegas Tú is a fun game for 2 to 8 players that will turn the center of the table into a sink. Each person has pot cards in their hand with different values that they must place in the sink forming a grid of up to 4x4, but be careful, the rows and columns cannot add up to a value greater than 7. If you cannot play, you will have to do the washing up. In addition, there will be special cards that modify the players' turn. —description from the publisher (translated) Friegas Tú es un divertido juego de 2 a 8 jugadores que convertirá el centro de la mesa en un fregadero. Cada persona tiene cartas de cacharro en la mano con diferentes valores que deberá colocar en el fregadero formando una cuadrícula de hasta 4x4, pero cuidado, las filas y columnas no podrán sumar un valor mayor que 7. Si no puedes jugar, te tocará fregar. Además, habrá cartas especiales que modifican el turno de los jugadores. —description from the publisher
