        - article [ref=e9787]:
          - link "Robo Rally — Disponible" [ref=e9788] [cursor=pointer]:
            - /url: /ludoteca/juegos/robo-rally
            - generic [ref=e9790]:
              - generic [ref=e9791]: "6.9"
              - heading "Robo Rally" [level=3] [ref=e9792]
              - paragraph [ref=e9793]: "La carrera ha comenzado para los robots de la fábrica de automóviles Robo Rally, que trabajan jornadas largas y duras en la cadena de montaje fabricando supercoches de alta velocidad, pero nunca llegan a verlos en acción. Los sábados por la noche, la fábrica cobra vida y se convierte en el circuito de carreras definitivo, con obstáculos traicioneros y sabotajes de los rivales. En Robo Rally, los jugadores mueven a sus robots por el circuito, acelerando por los pasillos y esquivando trampas para llegar los primeros a cada punto de control. ¡Solo los robots más fuertes sobreviven! Adéntrate en el mundo de las máquinas locas y las intrigas peligrosas con el juego de mesa Robo Rally. Los jugadores controlan a su robot mediante cartas de juego que revelan las instrucciones sobre cómo pueden moverse los robots por la frenética fábrica de automóviles de Robo Rally. Usa la estrategia para burlar a los robots rivales mientras compites por llegar a cada punto de control en el recorrido que hayas elegido, siguiendo el orden numérico. Ten cuidado con los obstáculos de la fábrica, como los láseres industriales, los fosos abiertos y las cintas transportadoras en movimiento, que pueden decidir el resultado de la carrera. La edición de 2016 de Robo Rally difiere de las versiones anteriores en varios aspectos: Ahora cada jugador tiene su propio mazo de veinte cartas, con las mismas cartas en cada mazo. En su turno, un jugador roba nueve cartas de su mazo, programa cinco de ellas y luego descarta el resto. Dos cartas indican «De nuevo» y repiten la acción programada en la casilla anterior; una carta indica «Energía» y otorga un cubo de energía que puedes utilizar para comprar opciones. Dado que cada jugador tiene su propio mazo, las cartas ya no tienen números de prioridad para determinar quién se mueve primero. Ahora, el orden de movimiento lo determina quien esté más cerca de un transmisor en el tablero de juego. Cuando los jugadores sufren daños, ya no reciben una carta menos por cada daño (ni se les bloquea uno de sus registros de programa) al comienzo de una ronda; en su lugar, reciben cartas de daño que se barajan y se incorporan a sus mazos. El daño «normal» del tablero o del láser de un robot te inflige daño de «spam». Cuando programas una de estas cartas, la retiras del juego en el momento oportuno y la sustituyes en el registro por la carta superior de tu mazo. ¡Sorpresa! Existen otros tipos de daño: un «caballo de Troya» te otorga dos «spam», un «virus» infecta a los jugadores cercanos y un «gusano» te obliga a reiniciar, lo que te inflige aún más daño. Sin embargo, al jugar la carta de daño, la retiras de tu mazo."
