            - generic [ref=e10365]:
              - generic [ref=e10366]: "7.0"
              - heading "Sushi Go" [level=3] [ref=e10367]
              - paragraph [ref=e10368]: En el trepidante juego de cartas de sushi «Sushi Go!», estás comiendo en un restaurante de sushi e intentas hacerte con la mejor combinación de platos de sushi a medida que pasan a toda velocidad. Consigue puntos por reunir el mayor número de rollos de sushi o por completar un juego completo de sashimi. ¡Moja tu nigiri favorito en wasabi para triplicar su valor! Y una vez que te lo hayas comido todo, ¡termina tu comida con todo el pudín que tengas! Pero ten cuidado con el sushi que dejes que cojan tus amigos; ¡podría ser justo lo que necesitan para ganarte! «Sushi Go!» toma el mecanismo de selección de cartas de «Fairy Tale» y «7 Wonders» y lo condensa en un juego de veinte minutos al que cualquiera puede jugar. La dinámica de «seleccionar y pasar» cobra protagonismo, al tiempo que se reducen las reglas al mínimo. Al ver las primeras manos de cartas, debes evaluar rápidamente la composición de la ronda y decidir a qué tipo de sushi te vas a decantar. A continuación, en cada turno tendrás que sopesar qué cartas te quedas y cuáles pasas. Las diferentes combinaciones de puntuación permiten jugadas ingeniosas y bloqueos astutos. ¡Ronda tras ronda, también debes tener siempre presente el objetivo de tener el mayor número de cartas de postre al final de la partida!
