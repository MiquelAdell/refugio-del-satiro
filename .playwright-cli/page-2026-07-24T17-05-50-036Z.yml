        - article [ref=e9534]:
          - link "Polilla Tramposa — Disponible" [ref=e9535] [cursor=pointer]:
            - /url: /ludoteca/juegos/polilla-tramposa
            - generic [ref=e9537]:
              - generic [ref=e9538]: "6.4"
              - heading "Polilla Tramposa" [level=3] [ref=e9539]
              - paragraph [ref=e9540]: "¿Está prohibido hacer trampa? No en este travieso juego de cartas; de hecho, probablemente tendrás que hacer trampa para ganar. En Mogel Motte, el objetivo es deshacerte de todas las cartas de tu mano antes que nadie. Cada jugador comienza la ronda con ocho cartas en la mano; uno de ellos (el de más edad) recibe el bicho guardián —que permanece sobre la mesa durante toda la partida— y se coloca una carta boca arriba para iniciar la pila de descarte. Las cartas están numeradas del 1 al 5, y la mayoría de ellas solo tienen números; algunas cartas tienen habilidades especiales que entran en juego cuando se añaden a la pila de descarte o a la mano de un jugador. En su turno, un jugador coloca una carta de su mano en la pila de descarte; esa carta debe tener un número exactamente uno mayor o menor que el de la carta que está encima de la pila de descarte. (Los números se repiten, por lo que se puede jugar un 1 sobre un 5 y viceversa). Si un jugador no puede jugar una carta, roba una del mazo y su turno termina. Sin embargo, hay otra forma de deshacerte de las cartas: ¡haciendo trampa! A lo largo de la ronda, puedes hacer desaparecer cartas dejándolas caer al suelo, escondiéndolas en la manga, etc. Debes mantener tu mano de cartas por encima de la mesa en todo momento, no puedes hacer desaparecer más de una carta a la vez y no puedes deshacerte de tu última carta de esta manera. El jugador que tenga la ficha de guardia —¡y solo él!— puede acusar a otros jugadores de hacer trampa, y nadie puede hacer trampa mientras se resuelve la acusación. Si la acusación era falsa, el Guarda debe robar una carta; de lo contrario, la jugadora que hacía trampa recupera la carta que intentó deshacerse, recibe una carta de la mano del Guarda como castigo adicional y se convierte en la nueva Guarda. Hacer trampa es una necesidad, ya que las cartas de «Polilla tramposa» no se pueden jugar en la pila de descarte, sino que deben desaparecer mediante trampa. (El guardia, sin embargo, puede jugar estas cartas, ya que a él no se le permite hacer trampa). Las cartas de acción funcionan de la siguiente manera: Hormiga: Después de jugar una hormiga, todos menos el jugador activo deben robar una carta del mazo. Cucaracha: Después de jugar una cucaracha, todos compiten por colocar encima una carta con el mismo número. Solo la jugadora más rápida puede dejar su carta en su sitio. Mosquito: Tras jugar un mosquito, todos los jugadores, excepto el activo, deben dar una palmada al mazo de cartas. El que sea más lento recibe una carta de la mano de todos los demás jugadores. Araña: Tras jugar esta carta, entrega una carta que no sea de «Polilla tramposa» de tu mano a otro jugador. Cuando un jugador se queda sin cartas en la mano, la ronda termina. El resto de jugadores obtienen 10 puntos por cada «Polilla tramposa» que tengan en la mano, 5 puntos por cada carta de acción y 1 punto por cada carta numérica. Tras un número de rondas igual al número de jugadores, el juego termina y gana el jugador con la puntuación más baja."
