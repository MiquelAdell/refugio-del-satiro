            - generic [ref=e2161]:
              - generic [ref=e2162]: "7.3"
              - 'heading "Werewolf: The Apocalypse (Revised Edition)" [level=3] [ref=e2163]'
              - paragraph [ref=e2164]: "Esta edición es la última, antes de que White Wolf haya puesto fin al antiguo Mundo de las Tinieblas. El libro contiene todas las reglas básicas necesarias para un juego de rol (creación de personajes, tiradas de habilidad, etc.). Una gran parte de este voluminoso libro contiene información de trasfondo sobre la sociedad de los hombres lobo (Garou), sus poderes mágicos (Dones), el mundo paralelo «Umbra», los enemigos de los hombres lobo e información para el director de juego, o mejor dicho, el Narrador. Esta edición incluye la «Profecía del Fénix», una historia sobre los siete signos que anuncian el fin del mundo: el Apocalipsis."
