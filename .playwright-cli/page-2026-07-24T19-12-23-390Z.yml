      - generic [ref=e57]:
        - article [ref=e126]:
          - link "Agent's Handbook — Disponible" [ref=e127] [cursor=pointer]:
            - /url: /ludoteca/rol/agent-s-handbook
            - generic [ref=e129]:
              - generic [ref=e130]: "8.9"
              - heading "Agent's Handbook" [level=3] [ref=e131]
              - paragraph [ref=e132]: "De la contraportada: BIENVENIDOS AL APOCALIPSIS Nacida a raíz de la redada llevada a cabo por el Gobierno de EE. UU. en 1928 en la degenerada localidad costera de Innsmouth, Massachusetts, la agencia secreta conocida como Delta Green pasó cuatro décadas luchando contra las fuerzas de la oscuridad con honor, pero sin gloria. Despojados de su autorización tras una desastrosa operación llevada a cabo en Camboya en 1969, los líderes de Delta Green hicieron un pacto secreto: continuar su labor sin autoridad, sin apoyo y sin miedo. Los agentes de Delta Green se cuelan en el sistema, manipulando la burocracia federal mientras hacen retroceder a la oscuridad un día más, aunque a menudo a un coste personal devastador. En DELTA GREEN: EL JUEGO DE ROL, eres uno de esos agentes. Eres a quien llaman cuando horrores sobrenaturales se cuelan en el mundo. Luchas para evitar que el mal cósmico se cobre vidas humanas y la cordura. Conspiras para encubrirlo todo, para que nadie más tenga que ver lo que tú has visto —ni descubrir las terribles verdades que has desvelado—. El AGENT'S HANDBOOK es un libro de reglas exclusivo para jugadores de DELTA GREEN: THE ROLE-PLAYING GAME. Esta nueva encarnación de la galardonada línea de juegos DELTA GREEN incluye: Reglas para crear agentes de todo tipo. Reglas para investigaciones tensas y dinámicas. Los jugadores que utilicen las habilidades de sus agentes de forma ingeniosa tendrán más posibilidades de triunfar… y de sobrevivir. Reglas de combate que ponen los nervios de punta, en las que los desastres aleatorios pueden echar por tierra la planificación más cuidadosa. Reglas de cordura alucinantes que hacen que los agentes se deterioren gradualmente… y, a veces, pierdan los estribos. Reglas para escenas «caseras» en las que los jugadores ven por qué luchan sus agentes. Reglas rápidas e intuitivas para determinar el equipamiento y los recursos. Expedientes sobre las agencias federales que con mayor probabilidad aparecerán en el juego."
              - list [ref=e133]:
                - listitem [ref=e134]: Manual
                - listitem [ref=e138]: "2016"
              - generic [ref=e142]: Moderno
        - article [ref=e210]:
          - 'link "ALIEN: The Roleplaying Game — Disponible" [ref=e211] [cursor=pointer]':
            - /url: /ludoteca/rol/alien-the-roleplaying-game
            - generic [ref=e213]:
              - generic [ref=e214]: "8.2"
              - 'heading "ALIEN: The Roleplaying Game" [level=3] [ref=e215]'
              - paragraph [ref=e216]: "De la contraportada: «No puedo mentirte sobre tus posibilidades, pero… tienes toda mi simpatía». El espacio es inmenso, oscuro y no es tu amigo. Los rayos gamma y las ráfagas de neutrinos que brotan de las estrellas moribundas te cocerán vivo, los agujeros negros te harán pedazos y el propio vacío te hará hervir la sangre y te paralizará el cerebro. Intenta gritar y nadie te oirá; aguanta la respiración y te reventarán los pulmones. El espacio tampoco está tan vacío como creerías: sus fronteras no dejan de expandirse. Gobiernos rivales libran una guerra fría de agresión, mientras que corporaciones codiciosas compiten por recursos valiosos. Los colonos alcanzan las estrellas y se juegan la vida: cada nuevo mundo colonizado supone o un festín o una hambruna. Y hay cosas acechando en las sombras de cada asteroide: cosas extrañas, diferentes y mortíferas. Cosas alienígenas. Este es el juego de rol de mesa oficial de ALIEN: un universo de horror corporal y política de riesgo corporativo, donde los seres sintéticos juegan a ser dioses mientras que los camioneros espaciales y los marines acogen a criaturas macabras recién nacidas. Es un universo duro e implacable, y tú no eres más que un elemento prescindible. Mantente con vida si puedes. Este libro de tapa dura, bellamente ilustrado y a todo color, presenta el mundo de ALIEN en el año 2183 y ofrece un conjunto de reglas rápido y eficaz diseñado específicamente para mejorar la experiencia de ALIEN. El juego admite dos modos de juego distintos: El modo «Cinemático» se basa en escenarios predefinidos que emulan el arco dramático de una película de ALIEN. Diseñado para jugarse en una sola sesión, este modo de juego hace hincapié en lo que está en juego y en un desarrollo rápido y brutal. No se espera que todos sobreviváis. El libro de reglas básico contiene un escenario cinematográfico introductorio, «El último día de Hope». El modo de campaña está diseñado para partidas continuadas más largas con el mismo grupo de personajes a lo largo de numerosas sesiones de juego, lo que os permite explorar libremente el universo de ALIEN, al estilo «sandbox». El libro de reglas básico contiene tablas aleatorias y otras potentes herramientas para crear rápidamente sistemas estelares, colonias, misiones, encuentros y PNJ para vuestra campaña. Las reglas del juego se basan en el aclamado motor Year Zero Engine, utilizado en juegos galardonados como «Tales from the Loop», «Forbidden Lands» y «Mutant: Year Zero», pero adaptado y perfeccionado para dar cabida plenamente a los temas centrales de ALIEN: el terror y la acción en la fría oscuridad del espacio."
              - list [ref=e217]:
                - listitem [ref=e218]: Manual
                - listitem [ref=e222]: Aventura
                - listitem [ref=e226]: "2019"
              - generic [ref=e230]: Horror
        - article [ref=e398]:
          - link "Book of Storyteller Secrets — Disponible" [ref=e399] [cursor=pointer]:
            - /url: /ludoteca/rol/book-of-storyteller-secrets
            - generic [ref=e401]:
              - generic [ref=e402]: "6.9"
              - heading "Book of Storyteller Secrets" [level=3] [ref=e403]
              - paragraph [ref=e404]: "Explora las extrañas y maravillosas noches de la Europa medieval oscura. Recorre los solitarios caminos nocturnos al servicio de los príncipes vampiros… o conviértete tú mismo en uno de ellos. Sigue el rastro de un unicornio para obtener su sangre, o adéntrate en las intrigas de las ciudades mercantiles italianas. Lucha contra los asesinos Assamita en Tierra Santa, o ayuda a los incipientes Tremere en su lucha por la supervivencia frente a los antiguos Demnios. «Vampiro: La Edad Media —Libro de los secretos del narrador» incluye: Un atlas de la Europa medieval oscura, con notas sobre las poblaciones de Cainitas. Un mapa desplegable a todo color de Europa. Una gran variedad de antagonistas míticos, incluidas reglas ampliadas para las gárgolas."
              - list [ref=e405]:
                - listitem [ref=e406]: Manual
                - listitem [ref=e410]: "1997"
              - generic [ref=e414]: Horror
        - article [ref=e432]:
          - link "Broken Tales — Disponible" [ref=e433] [cursor=pointer]:
            - /url: /ludoteca/rol/broken-tales
            - generic [ref=e435]:
              - generic [ref=e436]: "8.5"
              - heading "Broken Tales" [level=3] [ref=e437]
              - paragraph [ref=e438]: Érase una vez un niño que salvó el mundo de los cuentos de hadas. Su recompensa fue un deseo. Aquel que trama en las sombras vio la oportunidad de corromper el corazón del niño, susurrándole una idea perversa. El niño le pidió al Rey de los Cuentos de Hadas que a los villanos, malditos durante siglos, se les concediera una nueva vida. Esa iba a ser su oportunidad de redención. Así fue como los villanos se volvieron buenos. Pero toda luz necesita una sombra y, a su vez, los héroes se volvieron malvados. En ese momento, todos los cuentos de hadas se hicieron añicos. Broken Tales es un juego de rol de mesa de historias oscuras, que reinterpreta los cuentos de hadas desde una perspectiva al revés. Los jugadores pasarán a formar parte de la Orden, un grupo secreto que opera en nombre del Papado para investigar sucesos sobrenaturales más allá de la comprensión humana. En una Europa del siglo XVIII impregnada de misticismo y horror, los protagonistas de Broken Tales no son otros que los antiguos antagonistas de los cuentos de hadas, arrojados a un nuevo mundo fruto del deseo del Niño Salvador. [de la página web de la editorial]
              - list [ref=e439]:
                - listitem [ref=e440]: Manual
                - listitem [ref=e444]: "2022"
              - generic [ref=e448]: Fantasía
        - article [ref=e465]:
          - link "Candela Obscura — Disponible" [ref=e466] [cursor=pointer]:
            - /url: /ludoteca/rol/candela-obscura
            - generic [ref=e468]:
              - generic [ref=e469]: "7.4"
              - heading "Candela Obscura" [level=3] [ref=e470]
              - paragraph [ref=e471]: "[Descripción del editor] Candela Obscura es un nuevo juego de rol de mesa que te pone en la piel de unos investigadores que trabajan para una orden esotérica. En este juego de terror investigativo, personas con diversos talentos se unen bajo el paraguas de la organización Candela Obscura. Investigarás sucesos extraños y te enfrentarás a peligrosas formas de magia, luchando contra una misteriosa fuente de corrupción y desangramiento. Candela Obscura es el primer juego en utilizar el sistema Illuminated Worlds, un sistema de nuevo diseño que emplea dados de seis caras y se presta a un juego narrativo y basado en arcos argumentales."
              - list [ref=e472]:
                - listitem [ref=e473]: Manual
                - listitem [ref=e477]: "2023"
