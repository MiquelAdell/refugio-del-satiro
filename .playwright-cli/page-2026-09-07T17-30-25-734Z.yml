              - generic [ref=e146]:
                - paragraph [ref=e147]: Nuestra asociación se funda en 1996 como alternativa lúdica, en Sabadell. Pronto se convertiría en una de las principales asociaciones juveniles en ofrecer una opción de ocio con gran carácter social y cultural.
                - paragraph [ref=e148]: Hoy, El Refugio del Sátiro está formado por grupos de todas las edades. Somos apasionados/as de los juegos de mesa y rol que organizamos eventos para todo el mundo que desee participar sin necesidad de ser socio/a.
                - paragraph [ref=e149]: Además, disponemos de una ludoteca de juegos de mesa accesible de forma pública para disfrutar de ellos solos o con amigos, conociendo personas con las que compartir tus mismos intereses de forma gratuita.
                - paragraph [ref=e150]: ¡No dudes en contactar con nosotros/as por nuestros canales de comunicación!
