        - article [ref=e918]:
          - 'link "Far West: Juego de Rol — Disponible" [ref=e919] [cursor=pointer]':
            - /url: /ludoteca/rol/far-west-juego-de-rol
            - generic [ref=e921]:
              - generic [ref=e922]: "7.0"
              - 'heading "Far West: Juego de Rol" [level=3] [ref=e923]'
              - paragraph [ref=e924]: "From the back of the book: El juego de rol mas buscado del Oeste FAR WEST es más que un juego, es la manera de revivir la epopeya de la Conquista del Oeste utilizando para ello los personajes más arquetípicos que han consolidado el Western. Gracias a un sistema ágil de creación de Personajes, puedes estar listo para jugar en pocos minutos y sus innovadoras reglas te permiten emular cualquier situación. En su interior encontrarás datos de juego de más de cinquenta armas de la época, material adicional (mapas, personajes históricos, cronología, PNJs pregenerados...) que permite a los DJ documentar sus aventuras y un cuadernillo con las Hojas de Personaje para uso de los jugadores. English Translation The most wanted RPG of the West FAR WEST is more than just a game, it is a way to relive the epic Conquest of the West using the most archetypal characters that represent the Wild West. Thanks to a flexible character creation system, you can be ready to play in minutes and its innovative rules allow you to emulate any situation. Inside you will find game data for more than fifty weapons from the period, additional material (maps, historical characters, chronology, pre-generated NPCs ...) that enables GMs to document their adventures and a booklet with character sheets for use of the players."
              - list [ref=e925]:
                - listitem [ref=e926]: Manual
                - listitem [ref=e930]: "1993"
              - generic [ref=e934]: Histórico
        - article [ref=e935]:
          - link "Far West La Leyenda — Disponible" [ref=e936] [cursor=pointer]:
            - /url: /ludoteca/rol/far-west-la-leyenda
            - generic [ref=e938]:
              - generic [ref=e939]: "9.0"
              - heading "Far West La Leyenda" [level=3] [ref=e940]
              - paragraph [ref=e941]: "From publisher blurb: ¡Adéntrate en la apasionante atmósfera del Salvaje Oeste! Ha llegado la hora de ceñirse el revólver y cabalgar por los territorios sin ley de la Frontera, enfrentándote a los más duros desafíos y peligros, protagonizando las más emocionantes aventuras de la Conquista del Oeste y emulando a los héroes legendarios de los mejores wésterns. Far West La Leyenda es el juego de rol con el que puedes interpretar enigmáticos pistoleros, famosos forajidos, temibles guerreros indios, incansables buscadores de oro o habilidosos jugadores de ventaja. Adéntrate en los bulliciosos salones, protege diligencias y correos, asalta trenes, conduce miles de cabezas de ganado por peligrosos territorios o defiende tu hogar de los cuchillos largos. Tú decides qué camino escoger y cómo forjar tu propia leyenda en la Frontera. Vive una experiencia de juego única con un completo y ágil conjunto de reglas diseñado específicamente para recrear cualquier situación posible en el Oeste, acompañado de numerosa y detallada información sobre la ambientación histórica y la vida real de la Frontera. Un auténtico volumen de referencia sobre el Salvaje Oeste. Este manual de reglas básicas incluye: Todo el reglamento y la información necesarios para desarrollar y jugar cualquier aventura que imagines. Un minucioso sistema de creación de personajes que te permite modelar paso a paso a tu héroe fronterizo, pudiendo elegir entre más de 30 tipos de aventureros característicos del Salvaje Oeste. Un sistema de juego mejorado basado en el intuitivo d100, con habilidades exclusivas para la ambientación, categorías de éxito, un novedoso y eficaz sistema de salud y reglas sobre conducción de ganado, doma de caballos, enfermedades o adicciones. Unas reglas de combate ágiles, trepidantes y de gran detalle que cubren desde el uso de armas cuerpo a cuerpo y revólveres, hasta diferentes tipos de explosivos, piezas artilleras y venenos. Con reglas para reproducir fielmente duelos, persecuciones, escaramuzas y batallas campales. La magia india está presente con más de 30 hechizos listos para ser utilizados por los chamanes. Un amplio capítulo de equipo que incluye ilustraciones y datos de juego para más de 100 armas de fuego, acompañadas por centenares de complementos entre munición, fundas, monturas, herramientas, vestuario o servicios. Todo un extenso capítulo dedicado a las principales tribus nativas donde se detallan todos los aspectos de su cultura y costumbres, así como los principales acontecimientos de su historia con el hombre blanco. Numerosos consejos y directrices para que el director de juego pueda planificar y crear sus partidas y personajes no jugadores, incluyendo un sistema rápido e intuitivo de generación de aventuras. Detallados capítulos de ambientación dedicados al rancho, el pueblo, la caballería o el entorno, disponiendo de todo lo necesario para crear el escenario perfecto de tus partidas. Translation courtesy of Google: Enter the exciting atmosphere of the Wild West! The time has come to wrap up the revolver and ride through the lawless territories of the Frontier, facing the toughest challenges and dangers, starring in the most exciting adventures of the Conquest of the West and emulating the legendary heroes of the best westerns. Far West The Legend is the role-playing game with which you can play enigmatic gunmen, famous outlaws, fearsome Indian warriors, tireless gold prospectors or skilled advantage players. Delve into the bustling salons, protect errands and mails, assault trains, drive thousands of cattle heads through dangerous territories or defend your home from long knives. You decide which path to choose and how to forge your own legend on the border. Live a unique gaming experience with a complete and agile set of rules designed specifically to recreate any possible situation in the West, accompanied by numerous and detailed information on the historical setting and the real life of the Frontier. An authentic volume of reference on the Wild West. This basic rules manual includes: All the rules and information necessary to develop and play any adventure you can imagine. A meticulous system of character creation that allows you to model step by step your border hero, being able to choose between more than 30 types of adventurers characteristic of the Wild West. An improved gaming system based on the intuitive d100, with exclusive skills for setting, success categories, a new and effective health system and rules on driving livestock, taming horses, diseases or addictions. An agile, fast-paced and detailed rules of battle that cover everything from the use of melee weapons and revolvers, to different types of explosives, artillery pieces and poisons. With rules to faithfully reproduce duels, persecutions, skirmishes and pitched battles. Indian magic is present with more than 30 spells ready to be used by shamans. An extensive chapter of equipment that includes illustrations and game data for more than 100 firearms, accompanied by hundreds of accessories between ammunition, covers, frames, tools, clothing or services. All an extensive chapter dedicated to the main native tribes where all the aspects of their culture and customs are detailed, as well as the main events of their history with the white man. Numerous tips and guidelines for the game director to plan and create their non-player games and characters, including a quick and intuitive adventure generation system. Detailed chapters of ambience dedicated to the ranch, the town, the cavalry or the environment, having everything necessary to create the perfect scenery of your games."
              - list [ref=e942]:
                - listitem [ref=e943]: Manual
                - listitem [ref=e947]: "2017"
