        - article [ref=e635]:
          - link "Cultos Innombrables — Disponible" [ref=e636] [cursor=pointer]:
            - /url: /ludoteca/rol/cultos-innombrables
            - generic [ref=e638]:
              - generic [ref=e639]: "8.4"
              - heading "Cultos Innombrables" [level=3] [ref=e640]
              - paragraph [ref=e641]: "From the web page of the publisher, in Spanish Contempla los Mitos de Cthulhu desde una perspectiva totalmente nueva y participa en la guerra secreta por el poder y el favor de los dioses que se libra en el mundo actual. Crea tu propia sociedad para el estudio de lo oculto y usa el poder de los Mitos para tus propios fines intentando no caer en una espiral de locura y destrucción: ahora formas parte de los Cultos Innombrables. Cultos Innombrables es un nuevo manual básico de 290 páginas en el que se reinventan los Mitos, trayéndolos a la actualidad. Entre sus páginas podrás encontrar: Reglas completas de creación de personajes y de juego: acción, cordura, degeneración, cultos, magia… Todo lo que necesitas para jugar está en este libro. Detallada ambientación sobre los Mitos de Cthulhu en la actualidad, incluyendo las criaturas y los dioses principales del terrorífico universo de H. P. Lovecraft, así como numerosos ejemplos de cultos. Consejos para dirigir tu campaña y sacarle todo el partido a la ambientación del juego. Dos aventuras completas listas para jugar. No temas, acércate y descubre la verdad de los Mitos de la mano de Cultos Innombrables. In English Watch the Cthulhu Mythos from a brand new perspective and take part in the secret war for the power and favor of the gods which runs nowadays. Create your own society for the study of the occult lore and use the power of the Mythos for your own shake trying to avoid a spiral of madness and destruction: now you belong to the Nameless Cults. Nameless Cults is a new basic manual of 290 pages where the Mythos are reinvented, bringing them to nowadays. Among the book you can find: Complete rules for character creation and game play: action, sanity, degeneration, cults, magic... All you need for play is inside the book. Detailed description of the setting of the Cthulhu Mythos nowadays, including the main gods and creatures form the terrific univers by H. P. Lovecraft, as well as many cults samples. Suggestions to run your own campaigns and squeeze the game settings. Two complete adventures ready for play. Do not be affraid, get close and discover the truth of the Mythos from the hand of the Nameless Cults"
              - list [ref=e642]:
                - listitem [ref=e643]: Manual
                - listitem [ref=e647]: "2014"
              - generic [ref=e651]: Aventura
        - article [ref=e652]:
          - link "Dagorlad and the Dead Marshes — Disponible" [ref=e653] [cursor=pointer]:
            - /url: /ludoteca/rol/dagorlad-and-the-dead-marshes
            - generic [ref=e655]:
              - generic [ref=e656]: "7.1"
              - heading "Dagorlad and the Dead Marshes" [level=3] [ref=e657]
              - paragraph [ref=e658]: "Resumen de la portada: «Dagorlad» describe con detalle las marismas orientales y los oscuros refugios de la hechicera Miruimor. Vive una aventura en las llanuras situadas frente a las Puertas de Mordor, donde los orcos errantes siembran el terror entre los viajeros desprevenidos."
