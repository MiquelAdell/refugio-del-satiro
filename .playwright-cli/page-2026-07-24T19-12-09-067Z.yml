              - heading "Fabula Ultima" [level=3] [ref=e775]
              - paragraph [ref=e776]: "De la contraportada del libro: FABULA ULTIMA es el juego de rol de mesa inspirado en los JRPG, los videojuegos de rol al estilo japonés, en los que se narran historias épicas de aspirantes a héroes y temibles villanos, ambientadas en mundos fantásticos rebosantes de magia, llenos de misterios y lugares maravillosos por descubrir, y habitados por monstruos únicos y extravagantes. Traducción al inglés: FABULA ULTIMA es el juego de rol de mesa inspirado en los JRPG, los videojuegos de rol al estilo japonés, en los que se narran historias épicas de aspirantes a héroes y temibles villanos, ambientadas en mundos fantásticos llenos de magia, misterios y lugares maravillosos por descubrir, y habitados por monstruos únicos y extraños."
