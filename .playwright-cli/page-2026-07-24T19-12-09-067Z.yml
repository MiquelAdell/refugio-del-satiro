        - article [ref=e601]:
          - 'link "Conan: The Roleplaying Game (First Edition) — Disponible" [ref=e602] [cursor=pointer]':
            - /url: /ludoteca/rol/conan-the-roleplaying-game-first-edition
            - generic [ref=e604]:
              - generic [ref=e605]: "7.0"
              - 'heading "Conan: The Roleplaying Game (First Edition)" [level=3] [ref=e606]'
              - paragraph [ref=e607]: "De la contraportada de la primera edición en tapa dura: Sabed, oh príncipe, que entre los años en que los océanos se tragaron la Atlántida y sus resplandecientes ciudades, y los años del auge de los Hijos de Aryas, hubo una era inimaginable, en la que reinos resplandecientes se extendían por el mundo como mantos azules bajo las estrellas: Nemedia, Ofir, Brythunia, Hiperbórea, Zamora, con sus mujeres de cabello oscuro y sus torres envueltas en un misterio poblado de arañas, Zingara, con su caballería, Koth, que limitaba con las tierras pastorales de Shem, Estigia, con sus tumbas custodiadas por las sombras, y Hyrkania, cuyos jinetes vestían acero, seda y oro. Pero el reino más orgulloso del mundo era Aquilonia, que reinaba supremo en el ensueño del oeste. Allí llegó Conan, el cimerio, de cabello negro y mirada hosca, espada en mano, un ladrón, un saqueador, un asesino, con melancolías gigantescas y alegría gigantesca, para pisar con sus pies calzados con sandalias los tronos enjoyados de la Tierra. Sacado de las páginas de la visión original de Howard, «Conan: El juego de rol» es una fiel recreación del vívido mundo del bárbaro cimerio, que te permite seguir sus pasos y crear aventuras, sinvergüenzas y malvados hechiceros de la era hiboria. Con todo lo necesario para explorar las tierras de Hyboria, incluido un completo sistema de creación y desarrollo de personajes, combate y hechicería, «Conan: El juego de rol» detalla exhaustivamente el mundo de Conan, desde las islas desconocidas al oeste de Zingara hasta los reinos semilegendarios más allá de los desiertos y las estepas del este de Shem, desde las tierras heladas de los Aesir y los Vanir hasta las exuberantes selvas de Kush. El mundo de Conan se extiende ante ti. ¿Te atreves a entrar? Descripción de la editorial: Adéntrate en la Era Hiboria. Los reinos civilizados del corazón del mundo se hacen la guerra entre sí con hordas de mercenarios, mientras los nobles ociosos charlan y cotillean en las cortes de Aquilonia y Nemedia. En el norte, los bárbaros de Asgard, Vanaheim y Cimmeria hacen la guerra a cualquiera que esté lo suficientemente cerca como para saquearlo, y en el oeste los pictos rechazan salvajemente la invasión de colonos en sus bosques primitivos. Los piratas infestan tanto el océano abierto del sur como el mar interior de Vilayet, ganándose la ira tanto de los sacerdotes-hechiceros estigios como de los señores de la caballería turanianos. Este mundo de extensas llanuras, selvas humeantes, tumbas antiguas y horrores de otro mundo no da tregua: ¡debes arrebatarle tu destino con la fuerza de tus miembros y el filo de tu espada! El juego de rol de Conan permite a los jugadores meterse en la piel de personajes de este mundo rico y vívido, ya sean hiborianos o cualquiera de las otras innumerables razas que pueblan las historias de Conan. Al igual que hizo el héroe de Howard, pueden aprender las habilidades del ladrón, del soldado mercenario, del nómada del desierto y de otros personajes en su camino hacia la grandeza."
              - list [ref=e608]:
                - listitem [ref=e609]: Manual
                - listitem [ref=e613]: "2003"
              - generic [ref=e617]: Fantasía
        - article [ref=e618]:
          - link "Creature Collection — Disponible" [ref=e619] [cursor=pointer]:
