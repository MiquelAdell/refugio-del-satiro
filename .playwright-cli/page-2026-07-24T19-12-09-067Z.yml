        - article [ref=e2191]:
          - 'link "Winter Court: Kyuden Kakita — Disponible" [ref=e2192] [cursor=pointer]':
            - /url: /ludoteca/rol/winter-court-kyuden-kakita
            - generic [ref=e2194]:
              - generic [ref=e2195]: "7.3"
              - 'heading "Winter Court: Kyuden Kakita" [level=3] [ref=e2196]'
              - paragraph [ref=e2197]: "Segundo volumen de la serie «Winter Court». Sinopsis de la editorial: Los Escorpión han caído, pero el Imperio sigue en pie. «Winter Court: Kyuden Kakita», la segunda entrega de la aclamada serie «Winter Court», contiene información detallada sobre la cultura, la civilización y la política de Rokugani. Además, presenta detalles sobre la historia de los emperadores Hantei del Imperio, incluye ideas para aventuras en escenarios políticos y revela las tan esperadas técnicas de la familia Miya. La «Winter Court» de este año también hace avanzar la historia del juego de rol a través del golpe de Estado del Clan Escorpión y nos adentra en la era de la Guerra de los Clanes, revelando secretos ocultos sobre los Grandes Clanes y sus planes para el Imperio Esmeralda. Contraportada: Una vez más, la nieve cubre los campos del Imperio Esmeralda, y los campos de batalla yacen en letargo bajo la escarcha y el hielo. Incluso la disputa entre el León y la Grulla se ve obligada a la paz, y los Seis Clanes de Rokugan se reúnen en Kyuden Kakita para una temporada de descanso. Pero bajo la espesa nieve del invierno, fríos cuchillos acechan a los incautos y los envían a una muerte helada. Los cortesanos más poderosos se reúnen a los pies del Emperador, con la esperanza de obtener su aprobación para sus negociaciones. Los secretos se susurran bajo abanicos que se agitan, y una sola palabra podría envenenar vidas enteras. Y cuando la Corte de Invierno termine y la estación muera, las guerras que asolan el Imperio volverán a comenzar. Cada movimiento está diseñado para llamar la atención del Emperador, y las maquinaciones se sellan con cuchillos ensangrentados. El trigésimo noveno Hantei descansa en su Trono Esmeralda, con el rostro tan pálido como la nieve del invierno. Su esposa, la emperatriz Kachiko, atiende su enfermedad y sumerge a la corte en intrigas y mentiras... Descubre los entresijos del Imperio, los secretos de la corte y la historia del Imperio Esmeralda. Conoce las escuelas de los Miya y las técnicas secretas de los Magistrados Esmeralda. «La Corte de Invierno» contiene una cronología exhaustiva de la historia del Imperio, un relato detallado de los diez primeros emperadores Hantei e información para dirigir aventuras históricas. Además, contiene todo lo necesario para actualizar tu campaña de acuerdo con la cronología oficial del juego de rol, junto con nuevas ventajas, habilidades, desventajas y el antiguo nemuranai de los Hantei. Baja tu espada, samurái. En este lugar, una sola palabra puede matar."
