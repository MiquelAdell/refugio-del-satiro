        - article [ref=e1259]:
          - 'link "La leyenda de los Cinco Anillos: El juego de rol del Imperio Esmeralda — Disponible" [ref=e1260] [cursor=pointer]':
            - /url: /ludoteca/rol/la-leyenda-de-los-cinco-anillos-el-juego-de-rol-del-imperio-esmeralda
            - generic [ref=e1262]:
              - 'heading "La leyenda de los Cinco Anillos: El juego de rol del Imperio Esmeralda" [level=3] [ref=e1263]'
              - paragraph [ref=e1264]: "Después de más de dos años de desarrollo, ¡llega el Juego de Rol de La Leyenda De Los Cinco Anillos! Dentro de estas páginas escontrarás cuanto necessitas para crear tus propias aventuras en el mundo del popular juego de cartas coleccionables de La Leyenda De Los Cinco Anillos. - Fácil para empezar a jugar: Una aventura introductoria integra, \"La Ceremonia del Samurai\" ayuda, tanto a los jugadores como a los Directores de Juego nuevo, a aprender como usar las reglas, permitiendo a los personajes interactuar con la cultura y sociedad de Rokugan. - Creació de personajes paso a paso: Escoge un Clan y una profesión, gasta unos cuentos puntos ¡e inicia tu camino en las aventuras del Imperio Esmeralda! - Reglas flexibles: L5A JdR utiliza un sistema sencillo con un sistema de mecánica de apuestas único que otortga a los jugadores y Directores de Juego un control sin igual sobre la mecánica del juego. - Consejos para Directores de Juego nuevos y experimentados; Si nunca has dirigido un juego de rol antes, te proporcionamos multitud de ayudas, consejos y trucos duros y sucios para que tu primera vez sea fácil y divertida. Si eres un jugador de la \"vieja escuela\", entonces encontrarás nuchos consejos sobre cómo enseñar a tus jugadores la mejor manera de actuar e interactuar dentro de Rokugan. (From the back of the book)"
              - list [ref=e1265]:
                - listitem [ref=e1266]: Manual
                - listitem [ref=e1270]: "1999"
              - generic [ref=e1274]: Fantasía
        - article [ref=e1275]:
          - link "Legend of the Five Rings Roleplaying Core Rulebook — Disponible" [ref=e1276] [cursor=pointer]:
            - /url: /ludoteca/rol/legend-of-the-five-rings-roleplaying-core-rulebook
            - generic [ref=e1278]:
              - generic [ref=e1279]: "7.5"
              - heading "Legend of the Five Rings Roleplaying Core Rulebook" [level=3] [ref=e1280]
              - paragraph [ref=e1281]: "De la contraportada: El honor es más fuerte que el acero En la tierra de Rokugan, el Imperio Esmeralda lleva mil años en pie. Bajo la guía de los nobles emperadores Hantei, los samuráis de los Grandes Clanes han protegido las tierras de amenazas internas y externas, desde que los Kami descendieron de los cielos y establecieron Rokugan como el más favorecido de los reinos. Pero tras siglos de prosperidad, aparecen grietas en los cimientos del Imperio. Los espíritus de la tierra se han vuelto inquietos y salvajes. Ejércitos de horrores malignos marchan desde las Tierras de las Sombras. Los miembros de los Grandes Clanes han comenzado a preguntarse si la era de los Hantei ha llegado a su fin y si los cielos favorecerían a nuevos gobernantes… Como samurái del Imperio Esmeralda, tu deber consiste en servir a tu señor, a tu clan y a tu Emperador. ¿Te mantendrás fiel a tu deber, sin importar los sacrificios que te exija? ¿O te mantendrás fiel a tu propio código de honor, incluso hasta la muerte? En este libro de reglas encontrarás todo lo que necesitas para forjar tu propia leyenda, incluyendo: Reglas para crear personajes samuráis con historias, personalidades, fortalezas y defectos ricos y detallados. Una innovadora mecánica de dados que da vida a la agitación emocional de tu personaje. Un juego en el que tu reputación, tus convicciones y tu lealtad importan mucho más que la fuerza de tu espada."
              - list [ref=e1282]:
                - listitem [ref=e1283]: Manual
                - listitem [ref=e1287]: "2018"
              - generic [ref=e1291]: Fantasía
        - article [ref=e1292]:
          - link "Legions of Darkness — Disponible" [ref=e1293] [cursor=pointer]:
            - /url: /ludoteca/rol/legions-of-darkness
            - generic [ref=e1295]:
              - generic [ref=e1296]: "7.8"
              - heading "Legions of Darkness" [level=3] [ref=e1297]
              - paragraph [ref=e1298]: "Nos estamos acercando al límite... Todo empezó cuando salíamos del centro comercial. Tom había estado tenso toda la noche y, mientras caminábamos hacia el coche, no dejaba de mirar por encima del hombro. Entonces, mientras cruzábamos en coche el aparcamiento a oscuras, vi a tres hombres con trajes oscuros que corrían hacia otro coche. «¡Vámonos de aquí!», —gritó mientras sacaba una escopeta de su chaqueta y se asomaba por la ventanilla. «¿De dónde has sacado eso?», le pregunté. Pero pronto tuve algo más importante de lo que preocuparme. Uno de los hombres se interpuso en la trayectoria del coche. Pisé el freno a fondo, pero ya era demasiado tarde: el impacto lo lanzó contra el parabrisas. Entonces vi su rostro. Unos ojos ciegos, blancos como la leche, parecían mirarme fijamente desde un rostro que era en parte metal y en parte carne en descomposición. Abrió la boca, dejando al descubierto hileras de relucientes dientes de acero y una larga lengua azul. A continuación, atravesó el parabrisas de un puñetazo y se abalanzó sobre mi garganta. Tome disparó. Legions of Darkness es un suplemento de trasfondo para el juego de rol Kult. Contiene más información sobre la ilusión en la que vivimos, la realidad que a veces podemos vislumbrar y las criaturas y organizaciones oscuras que mantienen cautiva a la humanidad. Se describen con gran detalle los arcontes, los ángeles de la muerte y los lictores, y se presentan varios cultos y criaturas nuevos. Legions of Darkness te ofrece información sobre una veintena de cultos y organizaciones, mapas de sus cuarteles generales y lugares de reunión, y descripciones de más de un centenar de personas, dioses y criaturas monstruosas que habitan el mundo de Kult. Nuestra realidad será destruida y la verdad revelada"
              - list [ref=e1299]:
                - listitem [ref=e1300]: Manual
                - listitem [ref=e1304]: "1993"
              - generic [ref=e1308]: Horror
        - article [ref=e1309]:
          - link "Liminal (2019) — Disponible" [ref=e1310] [cursor=pointer]:
            - /url: /ludoteca/rol/liminal-2019
            - generic [ref=e1312]:
              - generic [ref=e1313]: "7.9"
              - heading "Liminal (2019)" [level=3] [ref=e1314]
              - paragraph [ref=e1315]: "De la contraportada: El mundo es mucho más de lo que la mayoría de nosotros creemos. Magos académicos y magos callejeros, vampiros y hombres lobo, «Hombres de Negro» al servicio de una orden religiosa secreta y una división policial que investiga crímenes forteanos. Las ciudades y el propio paisaje albergan lugares embrujados y burbujas perdidas de la historia, cortes de hadas y lugares de poder. Pero tú lo sabes. Hay verdad en las leyendas y el folclore. Te encuentras al borde del Mundo Oculto. Quizá lo hayas visto y no puedas ignorarlo. Quizá seas del Mundo Oculto, pero tengas vínculos con la humanidad. Acompáñanos en un viaje al Mundo Oculto con Liminal, un juego de rol de fantasía independiente ambientado en el Reino Unido actual."
              - list [ref=e1316]:
                - listitem [ref=e1317]: Manual
                - listitem [ref=e1321]: Aventura
                - listitem [ref=e1325]: "2019"
              - generic [ref=e1329]: Mitología
        - article [ref=e1330]:
          - link "Lord Erbian's Stellar Bestiary — Disponible" [ref=e1331] [cursor=pointer]:
            - /url: /ludoteca/rol/lord-erbian-s-stellar-bestiary
            - generic [ref=e1333]:
              - generic [ref=e1334]: "6.8"
              - heading "Lord Erbian's Stellar Bestiary" [level=3] [ref=e1335]
              - paragraph [ref=e1336]: "Nota del editor: La 23.ª edición del libro original de Lord Erbian, verificada por el Tesoro Público Imperial: no te dejes engañar por imitaciones. Explorando los Mundos Conocidos y más allá desde el año 4732. La guía de referencia sobre zoología, xenología y criptoxenología peligrosas e intrigantes, que incluye bestias y alienígenas reales, imaginarios y diabólicos. ¡No te dejes engañar por ediciones falsas! ¡Deja que el «Lord Erbian’s» original y verificado te guíe en tu compra o en tu safari! El Bestiario Estelar de Lord Erbian es una recopilación de criaturas para los juegos de rol de fantasía espacial Fading Suns y Fading Suns: d20. Presenta estadísticas duales para cada criatura: tanto el sistema de puntos de victoria de HDI como el sistema d20 de Wizards of the Coast. Incluye bestias alienígenas de todos los rincones de los Mundos Conocidos, los mundos bárbaros e incluso el espacio de Vau y Symbiot."
              - list [ref=e1337]:
                - listitem [ref=e1338]: Manual
                - listitem [ref=e1342]: "2002"
              - generic [ref=e1346]: Ciencia Ficción
        - article [ref=e1347]:
          - link "Lord of the Rings — Disponible" [ref=e1348] [cursor=pointer]:
            - /url: /ludoteca/rol/lord-of-the-rings
            - generic [ref=e1350]:
              - generic [ref=e1351]: "6.1"
              - heading "Lord of the Rings" [level=3] [ref=e1352]
              - paragraph [ref=e1353]: "De la página web: «El Señor de los Anillos» es una epopeya en la que se enfrentan el bien y el mal, con héroes extraordinarios, criaturas maravillosas y oscuros ejércitos del terror: todo lo necesario para un increíble juego de rol. El juego de rol «El Señor de los Anillos» lleva esta épica aventura a jugadores y aficionados de todo el mundo. Ahora tú y tus amigos podéis adentraros en la Tierra Media y meteros en la piel de cualquier personaje o héroe que podáis imaginar, desde un hobbit reacio como Frodo hasta un poderoso mago como Gandalf. Este libro a todo color está repleto de imágenes de una de las películas más impresionantes visualmente que se han hecho jamás. Este juego es fácil de aprender, está repleto de información y, lo más importante, ¡es muy divertido! Los jugadores experimentados pueden lanzarse directamente a la acción y a los principiantes les encantará. Todo lo que necesitas saber sobre este juego está en este libro. Se trata de un libro de juego de rol «básico» totalmente nuevo. 304 páginas, tapa dura, a todo color."
              - list [ref=e1354]:
                - listitem [ref=e1355]: Manual
                - listitem [ref=e1359]: "2002"
              - generic [ref=e1363]: Fantasía
        - article [ref=e1364]:
          - link "Lords of the Known Worlds — Disponible" [ref=e1365] [cursor=pointer]:
            - /url: /ludoteca/rol/lords-of-the-known-worlds
            - generic [ref=e1367]:
              - generic [ref=e1368]: "7.6"
              - heading "Lords of the Known Worlds" [level=3] [ref=e1369]
              - paragraph [ref=e1370]: "A continuación se recogen las historias y los aspectos sociológicos detallados de las cinco Casas Reales, las diez casas menores y la nobleza extraterrestre: los miembros del Consejo de Ur-Obun, los jefes de Ur-Ukar y los Señores de Vorox. De la editorial: Los nobles son los gobernantes indiscutibles del universo. Pocos conocen sus estilos de vida y sus secretos, y el pueblo llano comprende muy poco de las ventajas (y los problemas) asociados al poder. Hay que recaudar impuestos, librar guerras y aplastar a los rivales. De hecho, como te diría cualquier noble, los sacrificios que soportan justifican con creces su opulento estilo de vida. No cualquiera puede ser un mártir así; se necesita el privilegio de la sangre. Un privilegio que la nobleza protege a toda costa, aunque ello requiera duelos mortales o declaraciones de guerra."
              - list [ref=e1371]:
                - listitem [ref=e1372]: Manual
                - listitem [ref=e1376]: "1996"
              - generic [ref=e1380]: Ciencia Ficción
        - article [ref=e1381]:
          - 'link "Mage: The Ascension (20th Anniversary Edition) — Disponible" [ref=e1382] [cursor=pointer]':
            - /url: /ludoteca/rol/mage-the-ascension-20th-anniversary-edition
            - generic [ref=e1384]:
              - generic [ref=e1385]: "7.0"
              - 'heading "Mage: The Ascension (20th Anniversary Edition)" [level=3] [ref=e1386]'
              - paragraph [ref=e1387]: "De la contraportada del libro: Os digo esto: somos Divinidad. La realidad está en nuestras manos para moldearla. Para subvertirla. Para dominarla. Tenemos ese poder: todos y todas. No todo el mundo sabe qué hacer con él, ni lo utiliza bien. La mayoría de nosotros nunca nos damos cuenta de lo que somos ni de todo lo que podemos hacer. Los que sí nos damos cuenta… bueno, algunos de nosotros somos monstruos. Manipuladores. Parásitos. Tiranos. Fanáticos. Y el resto de nosotros nunca vemos a ese monstruo en nuestro propio espejo, solo en los reflejos de aquellas personas que no son «nosotros». Pero esta es la verdad: TODOS somos «nosotros». TODOS tenemos un don. TODOS podemos cambiar el mundo. La mayoría de nosotros seguimos dormidos. Unos pocos afortunados despiertan. Y aún menos utilizan ese poder con sabiduría. Y ninguno sin consecuencias. Así pues, la realidad está al alcance de la mano. ¿De qué lado estás? ¿Y caerás… o ascenderás?"
              - list [ref=e1388]:
                - listitem [ref=e1389]: Manual
                - listitem [ref=e1393]: "2015"
              - generic [ref=e1397]: Horror
        - article [ref=e1398]:
          - 'link "Mage: The Awakening — Disponible" [ref=e1399] [cursor=pointer]':
            - /url: /ludoteca/rol/mage-the-awakening
            - generic [ref=e1401]:
              - generic [ref=e1402]: "7.0"
              - 'heading "Mage: The Awakening" [level=3] [ref=e1403]'
              - paragraph [ref=e1404]: "El poder de rehacer el mundo En una época ya lejana, los mortales destronaron a los dioses y se apoderaron de los cielos. Y por ello, fueron arrojados al mundo de arcilla, con sus mentes nubladas por la ignorancia. Solo unos pocos recuerdan su derecho de nacimiento: el poder de la magia. Si no pueden reclamar los cielos, crearán sus propios reinos en la Tierra. Un juego narrativo de hechicería moderna - Ofrece todo lo necesario para contar tus propias historias en el mundo oculto de los Despertados, incluyendo detalles sobre las diversas órdenes y caminos de la magia, así como muchos secretos del Mundo de las Tinieblas. Requiere el libro de reglas de El Mundo de las Tinieblas para jugar. - Presenta el sistema de magia más completo y libre jamás creado en un juego, lo que permite a los personajes lanzar prácticamente cualquier hechizo imaginable. - Incluye Boston como escenario totalmente desarrollado y listo para jugar. - Cuenta con ilustraciones del aclamado Michael Kaluta."
              - list [ref=e1405]:
                - listitem [ref=e1406]: Manual
                - listitem [ref=e1410]: "2005"
              - generic [ref=e1414]: Horror
        - article [ref=e1415]:
          - link "Magic Item Compendium — Disponible" [ref=e1416] [cursor=pointer]:
            - /url: /ludoteca/rol/magic-item-compendium
            - generic [ref=e1418]:
              - generic [ref=e1419]: "7.2"
              - heading "Magic Item Compendium" [level=3] [ref=e1420]
              - paragraph [ref=e1421]: "De la contraportada: Más objetos mágicos de los que caben en una bolsa de contención En este tomo encontrarás más de 1000 de los mejores objetos mágicos creados para el juego Dungeons & Dragons, incluidos nuevos objetos de bajo coste. Además, este suplemento contiene reglas para los cristales potenciadores, que otorgan nuevas habilidades a los objetos mágicos existentes, y para los conjuntos de objetos, que proporcionan ventajas por colección cuando se poseen todos los objetos de un conjunto. ¡Este tomo también presenta reglas nuevas y mejoradas para la creación de objetos, un sistema actualizado de generación de tesoros y mucho más!"
              - list [ref=e1422]:
                - listitem [ref=e1423]: Manual
                - listitem [ref=e1427]: "2007"
              - generic [ref=e1431]: Fantasía
        - article [ref=e1432]:
          - link "Magic of Rokugan — Disponible" [ref=e1433] [cursor=pointer]:
            - /url: /ludoteca/rol/magic-of-rokugan
            - generic [ref=e1435]:
              - generic [ref=e1436]: "5.8"
              - heading "Magic of Rokugan" [level=3] [ref=e1437]
              - paragraph [ref=e1438]: "Un libro de referencia de hechizos para «Oriental Adventures». Cabe destacar que, aunque tiene el mismo aspecto que cualquier otro suplemento de sistema dual para «Oriental Adventures» y «Legend of the Five Rings», solo ofrece mecánicas para el primero, no para el segundo. Descripción del editor: La magia de Rokugan es diferente a la de otros mundos de campaña: cada hechizo y cada objeto mágico tiene vida propia. Cada fragmento de magia contiene un espíritu con voluntad y deseos propios. *Magia de Rokugan* no solo presenta un gran número de nuevos objetos mágicos y hechizos que pueden utilizarse en cualquier campaña del sistema d20, sino que también contiene muchas reglas opcionales nuevas para objetos mágicos «despertados». También se incluyen nuevas dotes para la creación de objetos y clases de prestigio de shugenja. Los aficionados al juego de cartas coleccionables o al juego de rol de La Leyenda de los Cinco Anillos reconocerán sin duda muchos de estos objetos actualizados, pero también hay varias sorpresas nuevas. Contraportada: La magia de Rokugan no es meramente una fuerza que se conjura: cada hechizo, cada artefacto, cada fragmento de magia está vivo y posee voluntad y deseos propios. Estos espíritus llaman a aquellos bendecidos con el poder de los shugenja, otorgándoles la capacidad de controlar los elementos. Este libro aporta mayor profundidad a la magia de la clase shugenja, profundizando en la extraña magia del escenario de campaña de «La Leyenda de los Cinco Anillos». En su interior encontrarás lo siguiente: Nuevas clases de prestigio, entre las que se incluyen el Magistrado de Jade y el Maestro Herrero. Nuevas dotes de shugenja, incluidas las dotes secretas de los Grandes Clanes. Reglas avanzadas para despertar el poder que se esconde en un daisho: las espadas sagradas de los samuráis. Más de ciento cincuenta nuevos hechizos de shugenja. Nuevos objetos mágicos y artefactos, entre los que se incluyen las Espadas Celestiales, las Espadas Sangrientas y los infames Doce Pergaminos Negros. ¡Y mucho más! Este libro está diseñado para funcionar como un suplemento para Rokugan, el complemento d20 para Legend of the Five Rings, o simplemente como un libro de referencia con nuevos y interesantes hechizos y objetos para tu campaña de d20. Para utilizar este complemento, un Dungeon Master también necesita el Manual del Jugador, la Guía del Dungeon Master, Aventuras Orientales y Rokugan. Un jugador solo necesita el Manual del Jugador, Aventuras Orientales y Rokugan."
              - list [ref=e1439]:
                - listitem [ref=e1440]: Manual
                - listitem [ref=e1444]: "2001"
              - generic [ref=e1448]: Fantasía
        - article [ref=e1449]:
          - link "Mausritter (2nd Ed) — Disponible" [ref=e1450] [cursor=pointer]:
            - /url: /ludoteca/rol/mausritter-2nd-ed
            - generic [ref=e1452]:
              - generic [ref=e1453]: "8.4"
              - heading "Mausritter (2nd Ed)" [level=3] [ref=e1454]
              - paragraph [ref=e1455]: "Descripción del editor: Empuña la espada y ponte el bigote de un valiente ratón aventurero en «Mausritter», el juego de rol de aventuras fantásticas con reglas sencillas. Ahí fuera hay un mundo enorme y peligroso, y no ve con buenos ojos a un ratoncito. Pero si eres muy valiente, muy inteligente y tienes un poco de suerte, quizá consigas sobrevivir. Y si sobrevives el tiempo suficiente, quizá incluso te conviertas en un héroe entre los ratones. - La creación de personajes, brutalmente rápida y a la vez llena de matices, te permite empezar a jugar con tu ratón aventurero lo antes posible. - El sistema de inventario físico basado en cartas minimiza el papeleo y maximiza las decisiones difíciles. - Un sistema de magia peligroso y evocador con 15 hechizos que descubrir y lanzar. - Una generosa caja de herramientas de recursos proporciona al director de juego todo el apoyo necesario para crear sus propias aventuras de mundo abierto a escala de ratón."
              - list [ref=e1456]:
                - listitem [ref=e1457]: Manual
                - listitem [ref=e1461]: "2020"
              - generic [ref=e1465]: Fantasía
        - article [ref=e1466]:
          - link "Medina Gharnata — Disponible" [ref=e1467] [cursor=pointer]:
            - /url: /ludoteca/rol/medina-gharnata
            - generic [ref=e1469]:
              - heading "Medina Gharnata" [level=3] [ref=e1470]
              - paragraph [ref=e1471]: "Y dijo Shahrazad: “Sabed, ¡oh príncipe de los creyentes! qué, entre todas las ciudades del Islam brilla con luz propia la de Medina Gharnatha, la joya de Oriente engastada en Occidente. Y a su vez toda la ciudad no es sino la caja dorada que cubre otro bien aún más preciado: la Alhambra, palacio de belleza sin par edificado a mayor gloria de Alláh y de su profeta Mohammed. Valientes corazones, tanto de hombres piadosos como de Djinns creyentes guardan la ciudad y el palacio. ¡Quiera Alláh que nunca caiga en manos infieles, y que nunca sean desvelados todos sus secretos! Pues ello traería sin duda la desgracia para todos...” En este suplemento, dedicado a la ciudad de Granada en tiempos de los musulmanes, el lector encontrará una descripción detallada de la ciudad, barrio a barrio, con numerosas ideas de aventuras, un bestiario autóctono, una galería de personajes históricos (y buen número de otros que no lo son tanto) y una campaña completa lista para jugar: La noche del poder. Incluye: - Más de 100 ideas de partidas - Mapa Completo de la ciudad de Granada - 1 Campaña completa Y muchas cosas más... (From the back of the book)102"
              - list [ref=e1472]:
                - listitem [ref=e1473]: Aventura
                - listitem [ref=e1477]: "2002"
              - generic [ref=e1481]: Mitología
        - article [ref=e1482]:
          - link "Merchants of the Jumpweb — Disponible" [ref=e1483] [cursor=pointer]:
            - /url: /ludoteca/rol/merchants-of-the-jumpweb
            - generic [ref=e1485]:
              - generic [ref=e1486]: "7.8"
              - heading "Merchants of the Jumpweb" [level=3] [ref=e1487]
              - paragraph [ref=e1488]: "Nota de la editorial: Puede que los nobles y la Iglesia compitan por el liderazgo y la influencia sobre los habitantes del Mundo Conocido, pero son los comerciantes quienes dominan las estrellas. Sin sus conocimientos de alta tecnología ni los préstamos de sus arcas, los viajes y el comercio no podrían llevarse a cabo. Este libro detalla las historias y el modus operandi de los gremios de la Liga Mercantil, desde los extraños Ingenieros hasta los majestuosos Reeves."
              - list [ref=e1489]:
                - listitem [ref=e1490]: Manual
                - listitem [ref=e1494]: "1997"
              - generic [ref=e1498]: Ciencia Ficción
        - article [ref=e1499]:
          - link "Midnight (First Edition) — Disponible" [ref=e1500] [cursor=pointer]:
            - /url: /ludoteca/rol/midnight-first-edition
            - generic [ref=e1502]:
              - generic [ref=e1503]: "6.9"
              - heading "Midnight (First Edition)" [level=3] [ref=e1504]
              - paragraph [ref=e1505]: "De la contraportada del libro: Han pasado cien años desde que cayó la sombra. Al llegar a su fin la Tercera Edad, el dios caído Izrador triunfó sobre las naciones libres de Aryth. Los corruptos lugartenientes de la Sombra del Norte, los Reyes de la Noche, gobiernan con mano de hierro sobre ciudades en ruinas y reinos destrozados. Espíritus retorcidos e incorpóreos dan caza a los últimos auténticos maestros de la magia, y el oscuro y misterioso clero del dios caído, los legados de la Orden de la Sombra, persiguen a espías élficos, insurgentes enanos y a los pocos héroes valientes que se rebelan contra la noche. MIDNIGHT es un nuevo y emocionante escenario de campaña diseñado para el sistema d20. Adéntrate en un mundo donde reina el mal y la oscuridad se ha cernido sobre la tierra. Lucha por la esperanza y la justicia en un reino donde la desesperación y la desesperanza se ciernen como un sudario de muerte sobre imperios destrozados. Explora un mundo antiguo donde los dioses guardan silencio y la magia refluye como la marea que se retira de una costa oscura. Embárcate en un viaje épico por una tierra donde los héroes están condenados y las razas antiguas son perseguidas hasta el borde de la extinción. Bienvenido a MIDNIGHT."
              - list [ref=e1506]:
                - listitem [ref=e1507]: Manual
                - listitem [ref=e1511]: "2003"
              - generic [ref=e1515]: Fantasía
        - article [ref=e1516]:
          - link "Monster Manual (D&D 3.5e) — Disponible" [ref=e1517] [cursor=pointer]:
            - /url: /ludoteca/rol/monster-manual-d-d-3-5e
            - generic [ref=e1519]:
              - generic [ref=e1520]: "7.2"
              - heading "Monster Manual (D&D 3.5e)" [level=3] [ref=e1521]
              - paragraph [ref=e1522]: "También conocido como «Monster Manual 3.5» De la página web de la editorial: Descripción del producto En su interior acechan enemigos temibles y formidables. Enfréntate a una horda de monstruos armados y listos para luchar contra tus héroes más intrépidos o para luchar junto a ellos. Las páginas, totalmente ilustradas, de este libro están repletas de todas las criaturas, estadísticas, hechizos y estrategias que necesitas para desafiar a los heroicos personajes de cualquier juego de rol de Dungeons & Dragons. Más de 200 bichos, bichitos y criaturas mantienen a los jugadores en vilo. Desde aboleths hasta zombis, el Manual de Monstruos revisado cuenta con un variado elenco de enemigos y aliados esenciales para cualquier campaña de Dungeons & Dragons. Hay cientos de monstruos listos para la acción, incluidas muchas criaturas nuevas nunca vistas hasta ahora. El Manual de Monstruos revisado cuenta ahora con un diseño adaptado que hace que las estadísticas de los monstruos sean más fáciles de entender y utilizar. Cuenta con 31 nuevas ilustraciones y un nuevo índice, e incluye información ampliada sobre las clases de monstruos y cómo interpretar a los monstruos como héroes, junto con información sobre cómo sacar el máximo partido a la línea de miniaturas de D&D relacionada con el juego, cuyo lanzamiento está previsto para el otoño de 2003 por parte de Wizards of the Coast, Inc. Ampliado por: Puesto avanzado de los hobgoblins"
              - list [ref=e1523]:
                - listitem [ref=e1524]: Manual
                - listitem [ref=e1528]: "2003"
              - generic [ref=e1532]: Fantasía
        - article [ref=e1533]:
          - link "Mouse Guard Roleplaying Game — Disponible" [ref=e1534] [cursor=pointer]:
            - /url: /ludoteca/rol/mouse-guard-roleplaying-game
            - generic [ref=e1536]:
              - generic [ref=e1537]: "8.0"
              - heading "Mouse Guard Roleplaying Game" [level=3] [ref=e1538]
              - paragraph [ref=e1539]: "¡Únete a la Guardia de los Ratones y defiende los Territorios de los Ratones contra los depredadores y los peligros en este juego de rol basado en la serie de cómics «La Guardia de los Ratones»! El juego, creado por el galardonado diseñador Luke Crane, está pensado para todas las edades y niveles de experiencia en juegos de rol, y se basa en una versión simplificada de su sistema de reglas «Burning Wheel». Este sistema está diseñado para ofrecer un enfoque rico a la vez que estructurado a la hora de crear una aventura narrativa compartida. Las sesiones de juego se dividen en dos partes principales: el turno del director de juego y el turno de los jugadores. En ambos turnos, la historia del juego puede cambiar y evolucionar. El sistema está diseñado para fomentar la narración de historias, especialmente la narración compartida, en la que tanto los jugadores como el director de juego se turnan en ocasiones para controlar la narrativa. Aunque las reglas se alejan del patrón tradicional de los juegos de rol de lápiz y papel, son fáciles de seguir y están bien estructuradas. Archaia Studios Press ha creado un libro precioso, con lujosas páginas a todo color profusamente ilustradas con imágenes de los cómics y nuevos dibujos del creador de «Mouse Guard», David Petersen."
              - list [ref=e1540]:
                - listitem [ref=e1541]: Manual
                - listitem [ref=e1545]: "2008"
              - generic [ref=e1549]: Animal (Anthropomorphic)
        - article [ref=e1550]:
          - link "Mutants & Masterminds Second Edition — Disponible" [ref=e1551] [cursor=pointer]:
            - /url: /ludoteca/rol/mutants-masterminds-second-edition
            - generic [ref=e1553]:
              - generic [ref=e1554]: "7.4"
              - heading "Mutants & Masterminds Second Edition" [level=3] [ref=e1555]
              - paragraph [ref=e1556]: "El libro básico, ahora en su 2.ª edición, incluye reglas simplificadas del sistema d20 para que tú y tus amigos os adentréis en el mundo de los superhéroes más poderosos. De la contraportada del libro: ¡Vuelve el mejor juego de rol de superhéroes del mundo! ¡Mutants and Masterminds te transporta a ti y a tus amigos a mundos fantásticos llenos de aventuras con superpoderes! Conviértete en un superhéroe con poderes y habilidades que superan con creces a los de los mortales comunes. ¡Protege la ciudad y el mundo de las fuerzas del mal, frustra los planes de los genios del crimen y lleva a los culpables ante la justicia! «Mutants and Masterminds» te ofrece un sistema completo, innovador y detallado para los juegos de rol de superhéroes, proporcionándote todas las herramientas que necesitas, entre las que se incluyen: ¡Un único sistema básico! El sistema de juego de «Mutants and Masterminds» es sencillo y fácil de usar. ¡Todo lo que necesitas es un único dado de veinte caras para jugar! ¡Poderes ilimitados! Con más de un centenar de poderes entre los que elegir, junto con modificadores de poder y dotes de poder para personalizarlos de docenas de formas diferentes, dispones de una gama prácticamente ilimitada de poderes para crear el personaje que desees. ¡Combates rápidos y trepidantes! Se acabaron las batallas largas y tediosas; ¡Mutants and Masterminds se juega rápido y a toda velocidad! Puedes determinar todos los efectos de un ataque con una sola tirada de dado, y el sistema de puntos de héroe anima a los jugadores a realizar hazañas increíbles e innovadoras. ¡Listo para jugar! Con una docena de arquetipos de héroes ya preparados, aún más arquetipos de villanos, personajes secundarios, monstruos y equipamiento, tienes todo lo que necesitas para empezar a jugar de inmediato. ¡Este libro también incluye dos aventuras introductorias para ayudarte a dar los primeros pasos y aprender a jugar! ¡Nuevo y mejorado! La segunda edición simplifica y actualiza las reglas de la primera edición de «Mutants and Masterminds», ganador de los premios GenCon EN World RPG Awards al mejor juego y del Peer Award al producto más innovador, además de numerosos otros premios y reconocimientos. ¡Hace que el mejor juego de rol de superhéroes del mundo sea aún mejor! ¿A qué esperas? Ponte la máscara. Haz uso de tus poderes. Lucha contra las fuerzas del mal. Salva el mundo."
              - list [ref=e1557]:
                - listitem [ref=e1558]: Manual
                - listitem [ref=e1562]: "2005"
              - generic [ref=e1566]: Aventura
        - article [ref=e1567]:
          - 'link "Orn: El juego de rol — Disponible" [ref=e1568] [cursor=pointer]':
            - /url: /ludoteca/rol/orn-el-juego-de-rol
            - generic [ref=e1570]:
              - 'heading "Orn: El juego de rol" [level=3] [ref=e1571]'
              - paragraph [ref=e1572]: "Basado en los cómics del mismo nombre creados por Quim Bou y publicados por Dolmen y Maqui Edicions, Orn nos presenta un mundo fantástico de espada y brujería habitado por todo tipo de animales antropomórficos. Es aquí donde encontraréis a Orn, un perro pastor convertido en héroe, que durante sus viajes deberá superar todo tipo de obstáculos ayudado de los compañeros que irá conociendo durante el trayecto. Seréis los jugadores los que interpretaréis el papel de estos compañeros y, a la vez que intentáis cumplir vuestros propios objetivos, viviréis grandes momentos con un héroe de la talla de Orn a la vez que os metéis en nuevos líos. (From Verkami page: https://www.verkami.com/projects/20166-orn-el-juego-de-rol)"
              - list [ref=e1573]:
                - listitem [ref=e1574]: Manual
                - listitem [ref=e1578]: "2018"
              - generic [ref=e1582]: Aventura
        - article [ref=e1583]:
          - link "Pathfinder Player Core — Disponible" [ref=e1584] [cursor=pointer]:
            - /url: /ludoteca/rol/pathfinder-player-core
            - generic [ref=e1586]:
              - generic [ref=e1587]: "8.5"
              - heading "Pathfinder Player Core" [level=3] [ref=e1588]
              - paragraph [ref=e1589]: "De la contraportada: ¡Forja tu leyenda! Te espera un mundo de aventuras, ¡pero necesita que seas tú el héroe de la historia! Asume el papel de un intrépido aventurero con Pathfinder Player Core. Este tomo contiene todo lo que necesitas para crear un personaje jugador, equipándolo con armas formidables y hechizos poderosos, y proporcionándote todas las herramientas necesarias para sobrevivir en un mundo lleno de monstruos mortíferos, villanos malvados y tesoros fabulosos. La primera página de tu increíble aventura comienza aquí… De la sinopsis de la editorial: ¡Pathfinder Player Core presenta una nueva puerta de entrada a Pathfinder Segunda Edición, con todo lo que un jugador necesita para aprender a jugar! ¡Elige entre ocho ascendencias, ocho clases de personaje completas y cientos de dotes y hechizos para crear personajes únicos preparados para aventuras mortíferas en un mundo asolado por la magia y el mal! ¡Este tomo de tapa dura de 464 páginas es el recurso definitivo de reglas para todos los jugadores de Pathfinder Segunda Edición! ¡Pathfinder Player Core es el primer libro de reglas básico para el juego de rol Pathfinder Segunda Edición, totalmente remasterizado! Estas reglas son compatibles con los libros de reglas anteriores de Pathfinder Segunda Edición, e incorporan errata exhaustivas, actualizaciones de reglas y algunas de las mejores incorporaciones de libros posteriores en nuevos volúmenes más accesibles, con una nueva presentación inspirada en años de comentarios de los jugadores. Junto con el GM Core, el Monster Core y el Player Core 2, estos libros sientan nuevas bases para el futuro de los juegos de mesa. Pathfinder Player Core incluye: ¡Más fácil de aprender! Hemos tenido en cuenta los comentarios sobre la Caja para Principiantes y el Manual de Reglas Básico y hemos hecho que esta nueva introducción al juego de rol Pathfinder sea más fácil de seguir y te permita sumergirte directamente en la diversión. Reglas completas de creación de personajes, que te guían paso a paso en la creación de tu personaje mediante la selección de tu ascendencia, trasfondo y clase, con especial atención al bardo, el clérigo, el druida, el luchador, el guardabosques, el pícaro, la bruja y el mago. ¡Las opciones de ascendencia básicas incluyen humano, enano, elfo, gnomo, duende, halfling, leshy y orco! ¡Una gran cantidad de opciones que te permiten personalizar tu personaje, incluyendo herencias versátiles, como el changeling y el nefilim, habilidades y dotes, y cientos de hechizos (entre ellos, docenas de nuevos), lo que garantiza que el personaje que crees represente a tu héroe no solo en la historia, sino también en las reglas! Todo lo que necesitas saber para empezar a jugar, desde consejos sobre cómo explorar el mundo hasta sugerencias para sobrevivir a combates mortales contra enemigos aterradores. ¡Una introducción al mundo de Lost Omens para que tu personaje pueda formar parte de un mundo emocionante y diverso! ¡Reglas y herramientas para hacer progresar a tu personaje a lo largo del juego, llevándolo de ser un aventurero novato listo para comerse el mundo a convertirse en un héroe veterano, capaz de esgrimir una magia poderosa que puede remodelar la realidad! ¡Erratas totalmente integradas de los primeros cuatro años de Pathfinder Segunda Edición, incluyendo revisiones de la bruja, opciones ampliadas para todas las clases de personaje, hechizos optimizados, nuevo equipamiento y mucho más! Este es el primer producto de Pathfinder publicado bajo la nueva licencia Open RPG Creative (ORC), que ofrece a los jugadores y a los directores de juego aún más libertad para crear sus propias obras basadas en la segunda edición de Pathfinder."
              - list [ref=e1590]:
                - listitem [ref=e1591]: Manual
                - listitem [ref=e1595]: "2023"
              - generic [ref=e1599]: Fantasía
        - article [ref=e1600]:
          - link "Pathfinder Roleplaying Game Core Rulebook (1st Ed) — Disponible" [ref=e1601] [cursor=pointer]:
            - /url: /ludoteca/rol/pathfinder-roleplaying-game-core-rulebook-1st-ed
            - generic [ref=e1603]:
              - generic [ref=e1604]: "7.9"
              - heading "Pathfinder Roleplaying Game Core Rulebook (1st Ed)" [level=3] [ref=e1605]
              - paragraph [ref=e1606]: "De la contraportada del libro: ¡ADENTRATE EN UN MUNDO FANTÁSTICO DE AVENTURAS! El juego de rol Pathfinder te pone en la piel de un valiente aventurero que lucha por sobrevivir en un mundo asolado por la magia y el mal. ¿Te abrirás paso a través de ruinas repletas de monstruos y ciudades plagadas de intrigas políticas para convertirte en un héroe famoso cargado de fabulosos tesoros, o serás víctima de trampas traicioneras y monstruos diabólicos en una mazmorra olvidada? ¡Tu destino está en tus manos con este gigantesco Libro de Reglas Básicas que ofrece todo lo que un jugador necesita para embarcarse en una vida llena de aventuras y emoción! Este imaginativo juego de mesa se basa en más de 10 años de desarrollo del sistema y en una prueba de juego abierta en la que participaron más de 50 000 jugadores para crear una experiencia de juego de rol de vanguardia que traslada el conjunto de reglas de fantasía más vendido de todos los tiempos al nuevo milenio. El Libro de Reglas Básico del juego de rol Pathfinder incluye: Todas las reglas para jugadores y maestros de juego en un único volumen Reglas completas para fantásticas razas de jugadores como elfos, enanos, gnomos, medianos y semiorcos Nuevas y emocionantes opciones para clases de personajes como luchadores, magos, pícaros, clérigos y mucho más Reglas optimizadas y actualizadas para las dotes y habilidades que amplían las opciones de tu héroe Un sistema de combate sencillo con reglas fáciles para llaves, embestidas y otros ataques especiales Opciones para lanzadores de hechizos en cuanto a dominios mágicos, familiares, objetos vinculados, escuelas de especialización y mucho más Cientos de hechizos y tesoros mágicos revisados, nuevos y actualizados Pautas para la creación rápida de personajes no jugadores Reglas ampliadas para maldiciones, enfermedades y venenos Un sistema de experiencia completamente renovado con opciones de progresión lenta, media y rápida ¡Y MUCHO, MUCHO MÁS!"
              - list [ref=e1607]:
                - listitem [ref=e1608]: Manual
                - listitem [ref=e1612]: "2009"
              - generic [ref=e1616]: Fantasía
        - article [ref=e1617]:
          - link "¡Piratas! — Disponible" [ref=e1618] [cursor=pointer]:
            - /url: /ludoteca/rol/piratas
            - generic [ref=e1620]:
              - generic [ref=e1621]: "7.8"
              - heading "¡Piratas!" [level=3] [ref=e1622]
              - paragraph [ref=e1623]: "From the back fo the book (spanish): \"El clamor de los cañones, las nubes de pólvora quemada, las lluvias de astillas asesinas grandes como lanzas... Todo eso ha cesado y, a bordo del Hidden Predator, el capitán Blackadder prepara una partida de abordaje. El barco francés parece muerto, despojado de todos los signos de vida que apenas media hora antes animaban su cubierta. Cadáveres mutilados, esparcidos a lo largo de la misma, proclaman la derrota de Belle Dame ante su enemigo corsario. Blackadder, colgándose de uno de los cabos sueltos del aparejo de su barco, salta el primero sobre la presa recién tomada. Una docena de individuos, ataviados con fantásticos y sucios ropajes de seda, con dagas en los dientes, pistolas en mano y mirada fiera, siguen sus pasos pocos instantes después.\" translation by Google \"The roar of the guns, gunpowder clouds, rains large as spears killer chips ... All this has ceased, and aboard the Hidden Predator, Captain Blackadder is preparing a boarding party. French boat seems dead stripped of all signs of life than just a half hour before encouraging its cover. mutilated corpses scattered along it, proclaiming the defeat of Belle Dame Cathedral before his enemy privateer. Blackadder, hanging on one of the loose ends rig your boat, jump on the first newly taken prey. A dozen people, dressed in gorgeous robes of silk and dirty, with daggers in their teeth, guns in hand and fierce look, follow suit a few moments later. \""
              - list [ref=e1624]:
                - listitem [ref=e1625]: Manual
                - listitem [ref=e1629]: "1994"
              - generic [ref=e1633]: Aventura
        - article [ref=e1634]:
          - link "Player's Handbook (D&D 3e) — Disponible" [ref=e1635] [cursor=pointer]:
            - /url: /ludoteca/rol/player-s-handbook-d-d-3e
            - generic [ref=e1637]:
              - generic [ref=e1638]: "6.8"
              - heading "Player's Handbook (D&D 3e)" [level=3] [ref=e1639]
              - paragraph [ref=e1640]: "De la portada: MANUAL DE REGLAS BÁSICO I De la contraportada: La clave para una aventura sin fin Este es el manual imprescindible para los juegos de rol de fantasía. El Manual del Jugador incluye todo lo que necesitas para crear y jugar con tu personaje ideal de Dungeons & Dragons. ¡Hazte con este libro y únete a los millones de jugadores que han convertido a D&D en el juego de rol de fantasía más popular del mundo!"
              - list [ref=e1641]:
                - listitem [ref=e1642]: Manual
                - listitem [ref=e1646]: "2000"
              - generic [ref=e1650]: Fantasía
        - article [ref=e1651]:
          - link "Player's Handbook (D&D 5e) — Disponible" [ref=e1652] [cursor=pointer]:
            - /url: /ludoteca/rol/player-s-handbook-d-d-5e
            - generic [ref=e1654]:
              - generic [ref=e1655]: "8.1"
              - heading "Player's Handbook (D&D 5e)" [level=3] [ref=e1656]
              - paragraph [ref=e1657]: "Texto de la contraportada: PREPÁRATE PARA LA AVENTURA El Manual del Jugador es la referencia imprescindible para cualquier jugador de Dungeons & Dragons. Contiene reglas para la creación y el desarrollo de personajes, antecedentes y habilidades, exploración y combate, equipamiento, hechizos y mucho más. Utiliza este libro para crear personajes apasionantes entre las razas y clases más emblemáticas de D&D. Dungeons & Dragons te sumerge en un mundo de aventuras. Explora ruinas antiguas y mazmorras mortíferas. Lucha contra monstruos mientras buscas tesoros legendarios. Gana experiencia y poder mientras recorres tierras inexploradas con tus compañeros. El mundo necesita héroes. ¿Responderás a la llamada?"
              - list [ref=e1658]:
                - listitem [ref=e1659]: Manual
                - listitem [ref=e1663]: "2014"
              - generic [ref=e1667]: Fantasía
        - article [ref=e1668]:
          - link "Priests of the Celestial Sun — Disponible" [ref=e1669] [cursor=pointer]:
            - /url: /ludoteca/rol/priests-of-the-celestial-sun
            - generic [ref=e1671]:
              - generic [ref=e1672]: "7.3"
              - heading "Priests of the Celestial Sun" [level=3] [ref=e1673]
              - paragraph [ref=e1674]: "De la contraportada del libro: Peregrinos por el Camino Luminoso Puede que los nobles gobiernen las vidas seculares de los habitantes del Mundo Conocido, pero la Iglesia vela por sus almas y, al hacerlo, dicta su voluntad a la nobleza. Pocos señores se atreven a desafiar la voluntad del Patriarca y sus obispos. Pero los cimientos de la Iglesia ya no son tan sólidos como antes: tras las Guerras del Emperador han surgido nuevas sectas y órdenes que han alterado las lealtades de la población y reavivado antiguas herejías. Aunque la Iglesia se mantiene unida frente a los nobles y los gremios, sus miembros se enfrentan entre sí dentro de sus catedrales, compitiendo por el dominio sobre los fieles. En este libro se detallan las vidas de los santos, las historias y creencias de las principales sectas de la Iglesia, los heréticos Encarnados y la religión de los Hijos de Zuran.»"
              - list [ref=e1675]:
                - listitem [ref=e1676]: Manual
                - listitem [ref=e1680]: "1997"
              - generic [ref=e1684]: Ciencia Ficción
        - article [ref=e1685]:
          - link "Rats in the Walls — Disponible" [ref=e1686] [cursor=pointer]:
            - /url: /ludoteca/rol/rats-in-the-walls
            - generic [ref=e1688]:
              - generic [ref=e1689]: "8.9"
              - heading "Rats in the Walls" [level=3] [ref=e1690]
              - paragraph [ref=e1691]: "Descripción del editor: «Rats in the Walls» es un juego de rol de terror cósmico, inspirado en las obras de H. P. Lovecraft (sin el Mito). El objetivo era crear un sistema lo suficientemente sencillo como para dirigir aventuras rápidas de una sola sesión y, al mismo tiempo, lo suficientemente rico como para permitir partidas a largo plazo. El escenario predeterminado son los locos años veinte, pero un apéndice te permite crear personajes medievales."
              - list [ref=e1692]:
                - listitem [ref=e1693]: Manual
                - listitem [ref=e1697]: "2018"
              - generic [ref=e1701]: Horror
        - article [ref=e1702]:
          - link "Ravenloft — Disponible" [ref=e1703] [cursor=pointer]:
            - /url: /ludoteca/rol/ravenloft
            - generic [ref=e1705]:
              - generic [ref=e1706]: "7.1"
              - heading "Ravenloft" [level=3] [ref=e1707]
              - paragraph [ref=e1708]: "«Un reino del terror: un mundo de aventuras góticas Una noche de terror eterno. Un mundo gobernado por el miedo y el horror. Vampiros que dominan la noche. Metamorfos que merodean por los bosques. Ghouls sobrenaturales y esqueletos no muertos que acechan a una población aterrorizada. Si hay un mundo que necesita héroes, ese es el de Ravenloft. El escenario de Ravenloft retoma uno de los mundos clásicos de los juegos de rol y lo adapta a la Tercera Edición utilizando el sistema de reglas D20. Los jugadores asumen el papel de valientes aventureros que se enfrentan al mal supremo con la esperanza de salvar el mundo, todo ello en un escenario gótico de grandes aventuras»."
              - list [ref=e1709]:
                - listitem [ref=e1710]: Manual
                - listitem [ref=e1714]: "2001"
              - generic [ref=e1718]: Horror
        - article [ref=e1719]:
          - link "Ravenloft Campaign Setting — Disponible" [ref=e1720] [cursor=pointer]:
            - /url: /ludoteca/rol/ravenloft-campaign-setting
            - generic [ref=e1722]:
              - generic [ref=e1723]: "7.8"
              - heading "Ravenloft Campaign Setting" [level=3] [ref=e1724]
              - paragraph [ref=e1725]: "De la contraportada de la caja: Terror en la Tierra de las Nieblas En el año 351 del calendario baroviano, Stradh von Zarovich selló un pacto con la Muerte, un pacto que selló su destino y creó una tierra de pesadillas conocida como Ravenloft. Otros señores de la oscuridad han hecho suyo el Demiplano del Terror, y ¡ay de los héroes que se adentren en él! Las criaturas de la noche se ceban sin piedad con los vivos en esta tierra, y el día no es más que el preludio de otra noche de horror. Esta nueva edición del juego RAVENLOFT combina la caja original «Reino del Terror» con elementos de «Forbidden Lore» y reglas actualizadas de otros complementos. Se han eliminado los dominios destruidos en la infame Gran Conjunción, se han añadido nuevos dominios y se han detallado personajes clave. Esta caja incluye: - Realms of Terror: un libro de reglas de 160 páginas sobre la remodelación de las clases de personajes; pruebas de miedo, horror, locura y poder; maldiciones; hechizos y objetos mágicos, tanto nuevos como antiguos; psiónicos; técnicas de terror; y mucho más. - «Domains and Denizens»: un libro de 128 páginas que describe las tierras oscuras del Núcleo, las islas del terror y numerosos personajes malvados. - Dos mapas que representan los dominios rediseñados del Núcleo y las islas del terror. - Un póster con una pintura del artista Robh Ruppel. - Una baraja de tarokka con cartas bellamente ilustradas para la adivinación en los juegos de rol. - Un biombo de máster diseñado específicamente para su uso en una campaña de RAVENLOFT."
              - list [ref=e1726]:
                - listitem [ref=e1727]: Manual
                - listitem [ref=e1731]: "1994"
              - generic [ref=e1735]: Horror
        - article [ref=e1736]:
          - link "Return to the Tomb of Horrors — Disponible" [ref=e1737] [cursor=pointer]:
            - /url: /ludoteca/rol/return-to-the-tomb-of-horrors
            - generic [ref=e1739]:
              - generic [ref=e1740]: "7.1"
              - heading "Return to the Tomb of Horrors" [level=3] [ref=e1741]
              - paragraph [ref=e1742]: "De la contraportada de la caja: Imagina un lugar de una maldad indescriptible. Se construyó sobre la desesperanza y estaba lleno de terror y dolor sin fin. Este lugar repugnante destrozó la vida de todos los que se atrevieron a acercarse. Pero, gracias a un enorme sacrificio y heroísmo, a lo largo de muchos años, finalmente fue arrasado y su repugnante creador, destruido. Ahora imagina que ese horror está volviendo a empezar. El siniestro mago Acererak se esforzó al máximo por proteger su tumba. Se necesitaron muchos años, y muchas más vidas, antes de que su maldad fuera finalmente erradicada. Pero, aunque el semidemonio ha desaparecido, no ha caído en el olvido. Otros que aspiran a convertirse en lo que él fue han viajado hasta el lugar donde se encuentra la tumba de Acererak en busca de los secretos para dominar la muerte. Poco a poco, estos peregrinos se fueron reuniendo hasta acabar construyendo, a la sombra de la propia tumba, una comunidad dedicada a las artes oscuras: Skull City. Pero ni siquiera estos retorcidos nigromantes tienen la más mínima idea del verdadero mal que crece y crepita bajo sus pies. Esta caja de aventura contiene: Un libro de aventuras de 160 páginas; Un libro de ilustraciones de 32 páginas para mostrar a los jugadores; Fichas para los jugadores, incluido un diario de aventurero repleto de pistas; Un libro de 16 páginas con mapas y monstruos; Y una reedición facsímil del módulo de aventura original S1: Tomb of Horrors, tal y como se publicó por primera vez en 1978. Return to the Tomb of Horrors es una aventura épica para personajes de niveles 13 a 16."
              - list [ref=e1743]:
                - listitem [ref=e1744]: Aventura
                - listitem [ref=e1748]: "1998"
              - generic [ref=e1752]: Fantasía
        - article [ref=e1753]:
          - link "RyF (Rápido y Fácil) — Disponible" [ref=e1754] [cursor=pointer]:
            - /url: /ludoteca/rol/ryf-rapido-y-facil
            - generic [ref=e1756]:
              - generic [ref=e1757]: "7.0"
              - heading "RyF (Rápido y Fácil)" [level=3] [ref=e1758]
              - paragraph [ref=e1759]: "User description: RyF is a free Spanish roleplaying game which was cooperatively developed on a wiki. The contributing designers are listed only by login names, so are not in the geekdo database. It's a universal system, and many settings have already been created for it: Fantasy, Horror, SF, Science Fantasy, Swashbuckling - all in Spanish. The basic rules have been translated into English and can be found in either a wiki format or in a PDF. The files, both Spanish and English, can be found at: http://www.rapidoyfacil.es/proyectos/ryf-nucleo-3-x/documents/ From the download page: RyF es la respuesta en juegos de rol para todos aquellos que quieren jugar ¡y que sea ya! Olvídate de consultar interminables tomos, bestiarios y manuales para preparar tus partidas. Este libro contiene un reglamento completo, incluyendo magia, superpoderes y naves espaciales, además de secciones de ayuda para el director de juego, sugerencias sobre cómo llevar una campaña, ambientaciones de ejemplo o consejos para crear tus propios mundos de juego. Vive aventuras de todo tipo, en cualquier época, en cualquier lugar... el único límite es tu imaginación. Si alguna vez lo imaginaste, está aquí. No lo pienses más, es lo que querías, es Rápido y Fácil."
              - list [ref=e1760]:
                - listitem [ref=e1761]: Manual
                - listitem [ref=e1765]: "2009"
              - generic [ref=e1769]: Generic / Universal
        - article [ref=e1770]:
          - link "Seasons of Mystery — Disponible" [ref=e1771] [cursor=pointer]:
            - /url: /ludoteca/rol/seasons-of-mystery
            - generic [ref=e1773]:
              - generic [ref=e1774]: "8.6"
              - heading "Seasons of Mystery" [level=3] [ref=e1775]
              - paragraph [ref=e1776]: "De la contraportada del libro: Los bosques, grandes y pequeños, permanecen en silencio, envuelvos en un blanco helado; solo la cascada lejana murmura y zumba en la noche. El nisse escucha y, medio dormido, piensa que es el incesante fluir del tiempo, se pregunta hacia dónde se dirige, y de qué fuente brota. – VIKTOR RYDBERG En estas páginas encontrarás cuatro casos escalofriantes para Vaesen – Juego de rol de terror nórdico. Este libro contiene cuatro misterios independientes, uno para cada estación del año: - Un baile con la muerte – Viaja a los verdes valles de Dalarna en primavera para investigar unos extraños sucesos en un pueblo remoto. - «Corazón de fuego» – Durante la ola de calor del siglo, viaja al sur, a las fundiciones de Häryd, y enfréntate a un temible adversario. - «El diablo en el páramo» – En los páramos otoñales de Dinamarca, te verás envuelto en una lucha entre las costumbres ancestrales y los designios de la modernidad. - Un cuento de invierno: cruza el mar Báltico y enfréntate a los bosques invernales de Ingria, donde un ser desconocido acecha en la noche bajo las estrellas centelleantes."
              - list [ref=e1777]:
                - listitem [ref=e1778]: Aventura
                - listitem [ref=e1782]: "2022"
              - generic [ref=e1786]: Fantasía
        - article [ref=e1787]:
          - link "Seis balas — Disponible" [ref=e1788] [cursor=pointer]:
            - /url: /ludoteca/rol/seis-balas
            - generic [ref=e1790]:
              - heading "Seis balas" [level=3] [ref=e1791]
              - paragraph [ref=e1792]: "From Publisher Blurb: Seis autores, seis aventuras listas para jugar, seis perspectivas, seis descargas de pura adrenalina... ¿demasiado plomo para ti? \"Seis balas\" es el nuevo suplemento del aclamado juego de género negro sLAng: Historias sobre una misma historia y ofrece al Director de Juego seis trepidantes historias autoconclusivas, incluyendo los personajes que las protagonizan, para que tu grupo de juego pueda sumergirse en la vertiginosa acción cinematográfica de sLAng sin ningún esfuerzo. En \"Seis balas\" encontrarás: Dinero Sucio: Solo iba a ser otro viaje de autobús, un viaje largo y aburrido a través de un desolador paisaje desértico... pero cuando algo inesperado sucede, un grupo de desconocidos que no tienen aparecentemente nada en común puede terminar unido por una emoción mucho más fuerte que la amistad, más fuerte que el odio, más fuerte que la curiosidad, más fuerte que el miedo: la codicia. Pequeña Salem: Hace veinte años el barrio de Pequeña Salem era un lugar muy diferente, un lugar en el que la banda del Samaritano lo controlaba todo y, al mismo tiempo, velaba por que nada malo le ocurriera a la gente del barrio. Pequeña Salem era un lugar con sus propias leyes, pero era un lugar seguro. Pero el Samaritano acabó entre rejas y a los que le conocieron en aquella época les costaría reconocer en él al hombre que, con sus creencias, está convulsionando el penal de San Jerónimo. Trapos Sucios: Los problemas existen hasta en las mejores familias. Cuando además los problemas son con tu familia política (en el sentido literal del término “política”) las cosas pueden desmadrarse. Como está a punto de ocurrir en la calle 52. Trapos sucios es una historia sobre lo que ocurre cuando se combina trabajo, sentido del deber y familia, uno de esos cocktails que suele acabar realmente mal… Encrucijada: Hay un lugar en el que las vidas de dos grupos de personas van a juntarse con un resultado fatídico. Hay un lugar en el que una granja aislada va a ser el escenario del milagro de la vida y del de la muerte. Hay un lugar en el que siete personas sin nada que perder van a lanzar una mirada al abismo. Ese lugar es la encrucijada. Las apariencias engañan: Un secuestro, un robo, una joyería, tres criminales, una mujer, su marido… ¿Una historia típica de las que aparecen cada día en las noticias? Puede parecerlo, pero las cosas no siempre son lo que parecen y un plan sencillo puede convertirse en una verdadera pesadilla para todos los involucrados. The End: El funeral de un buen amigo es un lugar perfecto para recordar el pasado, revivir los últimos momentos juntos y decidir sobre las acciones a tomar en el futuro. Pero cuando el funeral es el del líder de una banda de atracadores profesionales que ha sido brutalmente asesinado, los recuerdos no siempre son agradables y las decisiones que hay que tomar no son, precisamente, fáciles. translation by Google Six writers, six lists adventures to play six perspectives six bolts of pure adrenaline ... too much lead to you? \"Six Bullets\" is the new supplement acclaimed game genre black slang: Stories about a common history and provides thrilling Game Director autoconclusivas six stories, including characters that star, so your gaming group can dive into the dizzying Slang action film without any effort. In \"Six Bullets\" you will find: Dirty Money: just going to be another bus trip, a long and tedious journey through a desolate desert landscape ... but when something unexpected happens, a group of strangers who do not have anything in common aparecentemente can end attached by a much stronger emotion than friendship, stronger than hate, stronger than curiosity stronger than fear: greed. Small Salem: Twenty years ago the neighborhood of Little Salem was a very different place, a place where the band Samaritan controlled everything and at the same time, ensured that nothing bad will happen to people in the neighborhood. Small Salem was a place with its own laws, but it was a safe place. But the Samaritan ended up behind bars and those who knew him at that time would cost them to recognize him as the man who, with their beliefs, convulsing the prison of San Jeronimo. Dirty Laundry: Problems exist even in the best families. When problems are also your political family (in the literal sense of the word \"politics\") things can get out of hand. As he is about to happen on the street 52. Dirty Laundry is a story about what happens when you work, sense of duty and family combines one of those cocktails that usually ends really bad ... Crossroads: There is a place in which the lives of two groups of people are going to join a fatal outcome. There is a place in which an isolated farm will be the scene of the miracle of life and death. There is a place in which seven people with nothing to lose going to cast a glance into the abyss. That place is the crossroads. Smoke and Mirrors: A kidnapping, robbery, a jeweler, three criminals, a woman, her husband ... A typical history of appearing every day in the news? It may seem so, but things are not always what they seem and a simple plan can become a nightmare for everyone involved. The End: The funeral of a good friend is a perfect place to reminisce, relive the last moments together and decide on actions to take in the future. But when the funeral is the leader of a gang of professional robbers who has been brutally murdered, the memories are not always pleasant and decisions to be taken are not exactly easy."
              - list [ref=e1793]:
                - listitem [ref=e1794]: Aventura
                - listitem [ref=e1798]: "2006"
