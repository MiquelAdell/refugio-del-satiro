      - generic [ref=e57]:
        - article [ref=e58]:
          - link "7th Sea Game Masters' Guide — Disponible" [ref=e59] [cursor=pointer]:
            - /url: /ludoteca/rol/7th-sea-game-masters-guide
            - generic [ref=e61]:
              - generic [ref=e62]: "7.5"
              - heading "7th Sea Game Masters' Guide" [level=3] [ref=e63]
              - paragraph [ref=e64]: "El segundo de los dos libros básicos del juego de rol 7th Sea. La Guía del Director de Juego incluye información más detallada sobre cada una de las naciones de Théah que la que se ofrece en la Guía del Jugador, y revela detalles exclusivos sobre las sociedades secretas del escenario. También incluye reglas para crear villanos y monstruos, así como mecánicas de juego adicionales y opcionales, y consejos para los nuevos directores de juego. De la contraportada del libro: 7th Sea Villanos malvados Tramas precarias Cliffhangers trepidantes ¡Todo en un día de trabajo! 7th Sea es un juego de acción y grandes aventuras en un mundo de mosqueteros, piratas, sociedades secretas e intrigas políticas. Todo lo que un director de juego necesita está incluido en las páginas de este libro. El libro de referencia de Theah: Ensayos detallados y mapas sobre las naciones, culturas, sociedades secretas y la Iglesia Vaticina de Theah. Reglas flexibles: Una amplia variedad de reglas avanzadas y opcionales, incluyendo combate masivo, abordajes y escaramuzas entre barcos. Cada regla se presenta en un formato modular para que los directores de juego puedan utilizar solo lo que les interese. Consejos: Montones de sugerencias y consejos, docenas de ganchos argumentales, cómo sacar el máximo partido a tus villanos, técnicas de construcción de historias, cómo escribir aventuras, cómo dirigir escenas de acción y mucho más. La guía indispensable para los directores de juego de 7th Sea."
              - list [ref=e65]:
                - listitem [ref=e66]: Manual
                - listitem [ref=e70]: "1999"
              - generic [ref=e74]: Fantasía
        - article [ref=e75]:
          - link "7th Sea Player's Guide — Disponible" [ref=e76] [cursor=pointer]:
            - /url: /ludoteca/rol/7th-sea-player-s-guide
            - generic [ref=e78]:
              - generic [ref=e79]: "7.6"
              - heading "7th Sea Player's Guide" [level=3] [ref=e80]
              - paragraph [ref=e81]: "El primero de los dos manuales básicos del juego de rol 7th Sea. La Guía del Jugador incluye una descripción de las mecánicas básicas del juego, reglas para la creación de personajes y una visión general de las naciones y sociedades secretas que pueblan el escenario. Contraportada: Aventuras de capa y espada y hechicería Piratería y exploración Espionaje e intriga Bienvenidos al Nuevo Mundo 7th Sea es un juego de acción y grandes aventuras en un mundo de mosqueteros, piratas, sociedades secretas e intrigas políticas. Los jugadores asumen el papel de héroes empeñados en frustrar las tramas de sinvergüenzas y villanos, explorar ruinas antiguas y saquear las flotas de tesoros de los tiranos. Todo lo que un jugador necesita está incluido en las páginas de este libro. Fácil de empezar: El libro comienza con una Guía de inicio rápido para que puedas empezar a jugar en cuestión de minutos. Un mundo completamente nuevo: Los jugadores encontrarán casi cien páginas dedicadas a Theah, el mundo de 7th Sea. Reglas flexibles: 7th Sea utiliza un sistema de pujas único, que otorga a los jugadores y a los directores de juego el control sobre la mecánica del juego. Consejos para jugadores novatos y experimentados: Tanto si nunca has jugado a un juego de rol como si eres un veterano de la «vieja escuela», encontrarás montones de pistas y consejos que te ayudarán a actuar e interactuar en el mundo de 7th Sea. La guía indispensable para los jugadores del juego de rol 7th Sea."
              - list [ref=e82]:
                - listitem [ref=e83]: Manual
                - listitem [ref=e87]: "2000"
              - generic [ref=e91]: Fantasía
        - article [ref=e92]:
          - link "A Song of Ice and Fire Roleplaying — Disponible" [ref=e93] [cursor=pointer]:
            - /url: /ludoteca/rol/a-song-of-ice-and-fire-roleplaying
            - generic [ref=e95]:
              - generic [ref=e96]: "7.4"
              - heading "A Song of Ice and Fire Roleplaying" [level=3] [ref=e97]
              - paragraph [ref=e98]: ¡El rey ha muerto! ¡Viva el rey! Liberada del yugo del loco rey Aerys II, Poniente sale de una sangrienta guerra civil mientras Robert Baratheon intenta traer una paz duradera a los Siete Reinos. A pesar de las promesas de justicia y prosperidad para todos, esta época peligrosa está marcada por las maniobras políticas de nobles ambiciosos y por infames complots urdidos en consejos secretos. Los villanos son recompensados por sus actos oscuros y los hombres honrados son humillados por sus antiguas lealtades. Abundan las conspiraciones, el viento trae rumores de guerra y las Grandes Casas luchan por encontrar su lugar en este nuevo régimen. Y, mientras tanto, un antiguo mal se agita en los confines más remotos del norte. Green Ronin Publishing se enorgullece de traer de vuelta los juegos de rol de aventuras a Poniente con «A Song of Ice and Fire Roleplaying». Basado en la epopeya fantástica de George R. R. Martin, *A Song of Ice and Fire Roleplaying* te ofrece todo lo que necesitas para jugar y dirigir partidas en los Siete Reinos utilizando un sistema de juego totalmente nuevo y fácil de aprender, diseñado específicamente para evocar la atmósfera de estas novelas superventas. Tú y tus compañeros de juego asumiréis los papeles de miembros clave de una casa noble. Las oportunidades abundan bajo el nuevo rey y, a medida que las viejas lealtades mueren y nacen otras nuevas, tu casa está lista para reclamar su lugar junto a las Grandes Casas de Poniente. Si tus esfuerzos tienen éxito, podrías encontrarte entre los Stark y los Lannister, ganándote el favor del rey y asegurándote un lugar en la historia. Si fracasas, tus rivales te destruirán en su propia y desesperada carrera hacia la grandeza. ¡Reclama tu derecho de nacimiento en «A Song of Ice and Fire Roleplaying» de Green Ronin!
              - list [ref=e99]:
                - listitem [ref=e100]: Manual
                - listitem [ref=e104]: "2009"
              - generic [ref=e108]: Fantasía
        - article [ref=e109]:
          - link "Against the Shadow — Disponible" [ref=e110] [cursor=pointer]:
            - /url: /ludoteca/rol/against-the-shadow
            - generic [ref=e112]:
              - generic [ref=e113]: "7.0"
              - heading "Against the Shadow" [level=3] [ref=e114]
              - paragraph [ref=e115]: "De la contraportada del libro: Los orcos invaden como una plaga más de la mitad del continente. Los legados cazadores de magos y sus mascotas demoníacas persiguen los últimos vestigios de magia en la tierra. El dios oscuro Izrador medita y observa el mundo a través de sus espejos negros. Las fuerzas son abrumadoras, tus enemigos son oscuros y retorcidos, y sin duda perecerás si te resistes. Pero luchas. Eres el portador ancestral de la espada nacido en el norte. Eres el alma mágica élfica. Eres el caballero sarcosano de sangre pura. Eres el jinete wogren cazador de bestias. Tu magia es poco común pero ancestral; tus aliados, pocos pero incondicionales. AGAINST THE SHADOW es una guía para jugadores y un recurso para el director de juego (DM) del oscuro y épico escenario de campaña MIDNIGHT. Los luchadores desesperados contra la sombra encontrarán nuevas vías heroicas, clases de prestigio, dotes, hechizos y armas que les ayudarán a sobrevivir. Las nuevas reglas de herboristería crean una opción de apoyo al grupo sin magia, diseñada específicamente para la campaña de MIDNIGHT. Por último, incluso los DM encontrarán material valioso en los nuevos nexos de poder y objetos de pacto. El señor oscuro Izrador aún no ha vencido. Son tiempos sombríos, pero todavía hay quienes se enfrentan a LA SOMBRA."
              - list [ref=e116]:
                - listitem [ref=e117]: Manual
                - listitem [ref=e121]: "2003"
              - generic [ref=e125]: Fantasía
        - article [ref=e126]:
          - link "Agent's Handbook — Disponible" [ref=e127] [cursor=pointer]:
            - /url: /ludoteca/rol/agent-s-handbook
            - generic [ref=e129]:
              - generic [ref=e130]: "8.9"
              - heading "Agent's Handbook" [level=3] [ref=e131]
              - paragraph [ref=e132]: "De la contraportada: BIENVENIDOS AL APOCALIPSIS Nacida a raíz de la redada llevada a cabo por el Gobierno de EE. UU. en 1928 en la degenerada localidad costera de Innsmouth, Massachusetts, la agencia secreta conocida como Delta Green pasó cuatro décadas luchando contra las fuerzas de la oscuridad con honor, pero sin gloria. Despojados de su autorización tras una desastrosa operación llevada a cabo en Camboya en 1969, los líderes de Delta Green hicieron un pacto secreto: continuar su labor sin autoridad, sin apoyo y sin miedo. Los agentes de Delta Green se cuelan en el sistema, manipulando la burocracia federal mientras hacen retroceder a la oscuridad un día más, aunque a menudo a un coste personal devastador. En DELTA GREEN: EL JUEGO DE ROL, eres uno de esos agentes. Eres a quien llaman cuando horrores sobrenaturales se cuelan en el mundo. Luchas para evitar que el mal cósmico se cobre vidas humanas y la cordura. Conspiras para encubrirlo todo, para que nadie más tenga que ver lo que tú has visto —ni descubrir las terribles verdades que has desvelado—. El AGENT'S HANDBOOK es un libro de reglas exclusivo para jugadores de DELTA GREEN: THE ROLE-PLAYING GAME. Esta nueva encarnación de la galardonada línea de juegos DELTA GREEN incluye: Reglas para crear agentes de todo tipo. Reglas para investigaciones tensas y dinámicas. Los jugadores que utilicen las habilidades de sus agentes de forma ingeniosa tendrán más posibilidades de triunfar… y de sobrevivir. Reglas de combate que ponen los nervios de punta, en las que los desastres aleatorios pueden echar por tierra la planificación más cuidadosa. Reglas de cordura alucinantes que hacen que los agentes se deterioren gradualmente… y, a veces, pierdan los estribos. Reglas para escenas «caseras» en las que los jugadores ven por qué luchan sus agentes. Reglas rápidas e intuitivas para determinar el equipamiento y los recursos. Expedientes sobre las agencias federales que con mayor probabilidad aparecerán en el juego."
              - list [ref=e133]:
                - listitem [ref=e134]: Manual
                - listitem [ref=e138]: "2016"
              - generic [ref=e142]: Moderno
        - article [ref=e143]:
          - link "Al Andalus — Disponible" [ref=e144] [cursor=pointer]:
            - /url: /ludoteca/rol/al-andalus
            - generic [ref=e146]:
              - heading "Al Andalus" [level=3] [ref=e147]
              - paragraph [ref=e148]: "En el nombre de Alláh, el clemente, el misericordioso... ...Fue en el año 91 de la Hégira, el 711 de las crónicas cristianas, cuando Tarik ibn Ziyad, mawla de Musa ibn Nusayr desembarcó en Djabal Tarik, que los infieles llaman Gibraltar. Tras fundar al-Djazira al Hadra (Algeciras) se enfrentó al rey infiel Rodrigo en la batalla de Wadi Lakka, que ellos llaman Guadalete. Dicen que la batalla duró toda una semana, dicen que las aguas se tiñeron de sangre... ...Dicen que Rodrigo huyó de la batalla, y que los suyos lo enterraron vivo junto a una serpiente de siete cabezas. Sea como fuere, tras esa batalla Al Andalus, la tierra de los vándalos, de los bárbaros infieles del norte, pasó a manos musulmanas, ¡para mayor gloria de Alláh! Desgraciado sea el monarca que la dejó perderse, y maldito sea mil veces mil años ante los ojos del que todo lo ve... Pues la gloria de Al Andalus se apagó en el 852, cuando Abú Abdallah Boabdil rinde a los infieles la hermosa Medina Gharnata, incapaz de ver cómo es destruida en los azares de la guerra... ...Aún brillará brevemente la estrella de Alláh cuando en el 927 Ibn Umayyad sea proclamado rey de Al Andalus y alce las Alpujarras contra el infiel. Pero la soberbia de los hombres es mucha, y la rebelión andalusí apenas durará unos años. Largo sea el lamento del muacín, que llora por la pérdida de los salones de la Al Hambra... Este suplemento de Aquelarre, escrito a petición del aficionado, incluye las tan esperadas reglas para jugar desde la perspectiva del mundo musulmán. Incluye entre otras muchas cosas: La historia Vida cotidiana Costumbres religiosas Costumbres mágicas Nuevas armas 2 nuevos bestiarios, (andaluz cristiano e islámico fantástico), 3 Nuevas clases de personaje 1 aventura completa lista para jugar."
              - list [ref=e149]:
                - listitem [ref=e150]: Aventura
                - listitem [ref=e154]: "2002"
              - generic [ref=e158]: Mitología
        - article [ref=e159]:
          - link "Alegres Forajidos — Disponible" [ref=e160] [cursor=pointer]:
            - /url: /ludoteca/rol/alegres-forajidos
            - generic [ref=e162]:
              - generic [ref=e163]: "9.0"
              - heading "Alegres Forajidos" [level=3] [ref=e164]
              - paragraph [ref=e165]: "From publisher: Robin Hood ha muerto, y aunque parece que, con la muerte del tirano Rey Juan, la paz volverá a Inglaterra, su sucesor Enrique III sigue la estela de su predecesor y la corrupción continúa campando a sus anchas. Como jugadores, interpretáis a forajidos, con su propia banda, que forjan su propio legado como guerreros de la justicia, luchando contra los corruptos y repartiendo la riqueza entre los más necesitados."
              - list [ref=e166]:
                - listitem [ref=e167]: Manual
                - listitem [ref=e171]: "2021"
              - generic [ref=e175]: Aventura
        - article [ref=e176]:
          - link "Alice is Missing — Disponible" [ref=e177] [cursor=pointer]:
            - /url: /ludoteca/rol/alice-is-missing
            - generic [ref=e179]:
              - generic [ref=e180]: "7.6"
              - heading "Alice is Missing" [level=3] [ref=e181]
              - paragraph [ref=e182]: "Según la campaña de Kickstarter: «Alice is Missing» es un juego de rol silencioso sobre la desaparición de Alice Briarwood, una estudiante de tercer curso de secundaria de la pequeña localidad de Silent Falls. ... El juego se desarrolla en directo y sin comunicación verbal. Los jugadores se meten en la piel de su personaje durante toda la sesión de juego, de 90 minutos de duración, y, en lugar de hablar, se envían mensajes de texto entre sí, tanto en un chat grupal como de forma individual, como si no estuvieran juntos en el mismo lugar. Descripción del editor: El juego se desarrolla en directo y sin comunicación verbal. Los jugadores se meten en la piel de su personaje durante toda la sesión de juego, de 90 minutos de duración, y, en lugar de hablar, se envían mensajes de texto entre sí, tanto en un chat grupal como de forma individual, como si no estuvieran juntos en el mismo lugar. De una belleza inquietante, profundamente personal y muy innovador, *Alice is Missing* se centra especialmente en la conexión emocional entre los jugadores, sumergiéndolos en un misterio tenso y dramático que se desarrolla de forma orgánica a través de los mensajes de texto que se envían entre sí. En la misma línea que juegos como *Life Is Strange*, *Gone Home*, *Oxenfree* y *Firewatch*, está diseñado para que se perciba tanto como una experiencia tipo evento como un juego de rol. Hay una microinsignia disponible"
              - list [ref=e183]:
                - listitem [ref=e184]: Manual
                - listitem [ref=e188]: "2020"
              - generic [ref=e192]: Crime (Mystery / Detective / Noir)
        - article [ref=e193]:
          - 'link "Alice is Missing: Silent Falls — Disponible" [ref=e194] [cursor=pointer]':
            - /url: /ludoteca/rol/alice-is-missing-silent-falls
            - generic [ref=e196]:
              - generic [ref=e197]: "7.4"
              - 'heading "Alice is Missing: Silent Falls" [level=3] [ref=e198]'
              - paragraph [ref=e199]: "Descripción del editor: La expansión «Silent Falls» permite a los jugadores redescubrir el juego con cartas adicionales que dan pie a nuevas y evocadoras historias. Con la expansión «Silent Falls», los jugadores tienen la oportunidad de explorar historias totalmente nuevas gracias a las cartas adicionales de «Sospechoso», «Lugar», «Personaje», «Búsqueda» y «Pista», así como a las nuevas cartas de «Relación», que te ayudan a profundizar en tus vínculos con los demás personajes. Los jugadores tienen la oportunidad de explorar lugares inexplorados, como los oscuros y resonantes espacios de las cuevas de Caloma, enfrentarse a nuevos sospechosos, como el distante padre John Briarwood, y descubrir nuevas y emocionantes conclusiones sobre la desaparición de Alice a medida que revelan las nuevas cartas de pista de 10 minutos. La expansión «Silent Falls» introduce un total de 38 cartas nuevas, lo que supone más de la mitad del número de cartas del juego original «Alice is Missing». 4 nuevos personajes jugables, 2 nuevas cartas de «Relación» con un total de 12 indicaciones nuevas, 3 nuevos sospechosos, 3 nuevas localizaciones, 4 nuevas cartas de «Búsqueda» y 22 nuevas cartas de «Pista» (dos cartas de «Pista» adicionales para cada marca de tiempo estándar, así como tres cartas adicionales de 10 minutos y una carta de 90 minutos de sustitución)."
              - list [ref=e200]:
                - listitem [ref=e201]: Manual
                - listitem [ref=e205]: "2023"
              - generic [ref=e209]: Crime (Mystery / Detective / Noir)
        - article [ref=e210]:
          - 'link "ALIEN: The Roleplaying Game — Disponible" [ref=e211] [cursor=pointer]':
            - /url: /ludoteca/rol/alien-the-roleplaying-game
            - generic [ref=e213]:
              - generic [ref=e214]: "8.2"
              - 'heading "ALIEN: The Roleplaying Game" [level=3] [ref=e215]'
              - paragraph [ref=e216]: "De la contraportada: «No puedo mentirte sobre tus posibilidades, pero… tienes toda mi simpatía». El espacio es inmenso, oscuro y no es tu amigo. Los rayos gamma y las ráfagas de neutrinos que brotan de las estrellas moribundas te cocerán vivo, los agujeros negros te harán pedazos y el propio vacío te hará hervir la sangre y te paralizará el cerebro. Intenta gritar y nadie te oirá; aguanta la respiración y te reventarán los pulmones. El espacio tampoco está tan vacío como creerías: sus fronteras no dejan de expandirse. Gobiernos rivales libran una guerra fría de agresión, mientras que corporaciones codiciosas compiten por recursos valiosos. Los colonos alcanzan las estrellas y se juegan la vida: cada nuevo mundo colonizado supone o un festín o una hambruna. Y hay cosas acechando en las sombras de cada asteroide: cosas extrañas, diferentes y mortíferas. Cosas alienígenas. Este es el juego de rol de mesa oficial de ALIEN: un universo de horror corporal y política de riesgo corporativo, donde los seres sintéticos juegan a ser dioses mientras que los camioneros espaciales y los marines acogen a criaturas macabras recién nacidas. Es un universo duro e implacable, y tú no eres más que un elemento prescindible. Mantente con vida si puedes. Este libro de tapa dura, bellamente ilustrado y a todo color, presenta el mundo de ALIEN en el año 2183 y ofrece un conjunto de reglas rápido y eficaz diseñado específicamente para mejorar la experiencia de ALIEN. El juego admite dos modos de juego distintos: El modo «Cinemático» se basa en escenarios predefinidos que emulan el arco dramático de una película de ALIEN. Diseñado para jugarse en una sola sesión, este modo de juego hace hincapié en lo que está en juego y en un desarrollo rápido y brutal. No se espera que todos sobreviváis. El libro de reglas básico contiene un escenario cinematográfico introductorio, «El último día de Hope». El modo de campaña está diseñado para partidas continuadas más largas con el mismo grupo de personajes a lo largo de numerosas sesiones de juego, lo que os permite explorar libremente el universo de ALIEN, al estilo «sandbox». El libro de reglas básico contiene tablas aleatorias y otras potentes herramientas para crear rápidamente sistemas estelares, colonias, misiones, encuentros y PNJ para vuestra campaña. Las reglas del juego se basan en el aclamado motor Year Zero Engine, utilizado en juegos galardonados como «Tales from the Loop», «Forbidden Lands» y «Mutant: Year Zero», pero adaptado y perfeccionado para dar cabida plenamente a los temas centrales de ALIEN: el terror y la acción en la fría oscuridad del espacio."
              - list [ref=e217]:
                - listitem [ref=e218]: Manual
                - listitem [ref=e222]: Aventura
                - listitem [ref=e226]: "2019"
              - generic [ref=e230]: Horror
