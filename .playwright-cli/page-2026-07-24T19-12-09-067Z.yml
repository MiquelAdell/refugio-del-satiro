        - article [ref=e298]:
          - link "Ars Magica (5th edition) — Disponible" [ref=e299] [cursor=pointer]:
            - /url: /ludoteca/rol/ars-magica-5th-edition
            - generic [ref=e301]:
              - generic [ref=e302]: "7.9"
              - heading "Ars Magica (5th edition)" [level=3] [ref=e303]
              - paragraph [ref=e304]: "Sinopsis de la editorial: Imagina una época en la que los mitos son reales y las supersticiones del pueblo llano se hacen realidad: las hadas bailan en los claros del bosque, los ángeles protegen a la Iglesia, los demonios corrompen a los débiles y los magos ejercen una magia que escapa al entendimiento de los demás mortales. Tú encarnas a estos magos, reunidos en pactos con tus aliados y sirvientes, para desbloquear poderes secretos y crear maravillas. Tú y tus amigos también daréis vida a los leales compañeros y grogs que apoyan a los magos, actuando como un amortiguador entre ellos y el mundo mundano, que a menudo malinterpreta su poder y sus motivos. Cuando las aventuras os lleven al mundo medieval de la Europa Mítica, vuestras historias se convertirán en leyenda. La galardonada primera edición de Ars Magica, de Jonathan Tweet y Mark Rein•Hagen, estableció el referente para los sistemas mágicos con lo que se considera ampliamente como las mejores reglas de magia de todos los juegos, y fue pionera tanto en el juego de estilo «truppa» como en la narración de historias en los juegos de rol. Ganó el premio Gamer’s Choice al mejor juego de rol de fantasía. La quinta edición ganó el premio Origins al mejor juego de rol, el ENnie de Oro a las mejores reglas y el premio Out of the Box a la mejor reedición. Existen numerosos suplementos que complementan la quinta edición, y docenas de suplementos de ediciones anteriores, que siguen siendo útiles, abarcan todas las facetas de la Europa Mítica. Los jugadores de Ars Magica también forman parte de una próspera comunidad de aficionados."
              - list [ref=e305]:
                - listitem [ref=e306]: Manual
                - listitem [ref=e310]: "2004"
              - generic [ref=e314]: Fantasía
        - article [ref=e315]:
          - link "Asombrosos Detectives de Monstruos — Disponible" [ref=e316] [cursor=pointer]:
            - /url: /ludoteca/rol/asombrosos-detectives-de-monstruos
            - generic [ref=e318]:
              - heading "Asombrosos Detectives de Monstruos" [level=3] [ref=e319]
              - paragraph [ref=e320]: "¡QUÉ SUSTO! ESTE LIBRO ESTÁ PLAGADO DE MONSTRUOS Y no solo viven entre estas páginas, también están en los rincones de nuestras casas, en el parque, en el gimnasio del cole y en la biblioteca. No son malos por naturaleza, y en realidad suelen ser amistosos y tranquilos, pero a veces se entretienen haciendo travesuras. ¿Dónde van a parar las chuches que se pierden? ¿Por qué siempre está mojada la toalla del baño cuando vas a secarte? ¿Y quién hace temblar tus piernas cuando te toca salir a la pizarra? CLARO, ¡SON ELLOS! Monstruos grandes o pequeños, salidos de la Dimensión Pelusa para hacer trastadas en tu casa, en el barrio o por toda la ciudad. Por suerte, contamos con la ayuda de un grupo de valientes detectives capaces de seguir todas las pistas y atrapar a los monstruos más traviesos. ¿A ti también te gustaría ser detective y resolver casos monstruosos? Este libro contiene todo lo que necesitas para conseguirlo. Con ASOMBROSOS DETECTIVES DE MONSTRUOS podrás resolver misterios y acertijos, pedir ayuda a los gamusinos, encontrar valiosos objetos perdidos y esquivar algunos mordiscos mientras te lo pasas en grande con tus amigos. Demuestra lo valiente que eres, abre tu propia sede en la agencia de Asombrosos Detectives de Monstruos, ¡y que empiece la aventura! En Asombrosos Detectives de Monstruos encontrarás: Una nueva edición del juego: clarifica y añade nuevas reglas, ofreciendo contenido adicional. Mismo estilo cuidado y adorable: aunque se mantiene fiel al estilo monstruosamente adorable de la línea, el interior y la portada ha sido rediseñado para esta edición. Mantén el espíritu de la línea: Asombrosos Detectives de Monstruos es una propuesta ideal para iniciarse en los juegos de rol, pero también ofrece nuevos alicientes para los pequeños detectives que ya han jugado a la primera edición. Juega como quieras y donde quieras: Aunque puedes jugar en mesa como otros juegos de rol, ofrece nuevos consejos para adaptar las partidas al juego en vivo. El juego de rol para niños: Incluye todas las reglas necesarias para jugar, complementando la primera edición con nuevos monstruos, aventuras y consejos. Sé parte de un mundo mágico: descubre algunos secretos sobre la misteriosa Dimensión Pelusa, el lugar del que provienen los monstruos..."
              - list [ref=e321]:
                - listitem [ref=e322]: Manual
                - listitem [ref=e326]: "2022"
              - generic [ref=e330]: Kid-Friendly
        - article [ref=e331]:
          - link "Atlántida — Disponible" [ref=e332] [cursor=pointer]:
            - /url: /ludoteca/rol/atlantida
            - generic [ref=e334]:
              - heading "Atlántida" [level=3] [ref=e335]
              - paragraph [ref=e336]: "From the back of the book: Una nave mercante en la que viajáis desaparece más allá de las Columnas de Herakles a causa de una gran tempestad. Cuando el mar vuelve a la calma descubrís con sorpresa que no hay nadie más en la nave. ¿Acaso alguna fuerza oculta ha protegido vuestras vidas? Una colosal nave de guerra os descubre y remolca hasta una gran isla desconocida. ¡Os encontráis en la ATLÁNTIDA, el continente perdido! Los atlantes os reciben con amabilidad, pero hay algo en el ambiente que no os acaba de gustar... Un mensajero llega al palacio del rey de Atlantis anunciando un gran peligro: los Phrst atacan por tierra y los Sakar y Denen por mar, la ATLÁNTIDA está en peligro y tendréis que tomar partido, pero ¿por quién? Vive una gran aventura completa de ORÁCULO en el reino perdido de la ATLÁNTIDA, el continente protegido de Poseidón, dios del mar y de todas las criaturas marinas. Conoce los enigmas de una civilización superior y misteriosa. Descubre los secretos de una tierra lejana situada más allá del Océano. Cumple los designios de tu ORÁCULO y avanza hacia la inmortalidad destinada sólo a los grandes héroes."
              - list [ref=e337]:
                - listitem [ref=e338]: Aventura
                - listitem [ref=e342]: "1995"
              - generic [ref=e346]: Mitología
        - article [ref=e347]:
          - link "Atomic Robo — Disponible" [ref=e348] [cursor=pointer]:
            - /url: /ludoteca/rol/atomic-robo
            - generic [ref=e350]:
              - generic [ref=e351]: "8.3"
              - heading "Atomic Robo" [level=3] [ref=e352]
              - paragraph [ref=e353]: "De la contraportada del libro: ¡ACCIÓN! ¡CIENCIA! ¡ROBOTS! ¡GOLPES! ¡MÁS CIENCIA! ¿Estás listo para una aventura científica a todo trapo? ¡Pues es hora de jugar al juego de rol Atomic Robo! ¿Alguna vez has querido enfrentarte a una conspiración mundial como un robot atómico inmortal o como Carl Sagan? El juego de rol Atomic Robo lo hace posible. El juego de rol Atomic Robo te ofrece la experiencia más explosiva del sistema Fate Core hasta la fecha. Se trata de ciencia y acción como nunca antes la has visto, directamente sacada de las páginas de los populares cómics de Atomic Robo, de Brian Clevinger y Scott Wegener. Juega como un científico de acción o un robot inmortal, un superespía o un aventurero pulp… ¡o algo aún más extraño procedente de los rincones ocultos de la superciencia! Se trata de un juego que abarca múltiples épocas y que se puede empezar a jugar al instante en su máxima expresión: empieza a jugar en diez minutos o tómate tu tiempo y aprovecha al máximo las reglas de fondo para añadir profundidad. Súbete a tu jet Tesladyne y recorre el mundo en una sola época, o lucha a lo largo de décadas como parte de un grupo de aventureros con talento científico. ¡Enfréntate a dinosaurios enloquecidos, agentes gubernamentales renegados y tecnologías robadas impulsadas por Tesla! ¿Tienes lo que hay que tener para ser un «científico de acción»? ¡Coge tu equipo y prepárate para poner a prueba hipótesis de forma explosiva, a toda velocidad y sin cuartel! MANTÉN LA CALMA. CONFÍA EN LA CIENCIA. ¡YA ESTÁ AQUÍ EL JUEGO DE ROL ATOMIC ROBO!"
              - list [ref=e354]:
                - listitem [ref=e355]: Manual
                - listitem [ref=e359]: "2014"
              - generic [ref=e363]: Ciencia Ficción
        - article [ref=e364]:
          - link "Black Mass — Disponible" [ref=e365] [cursor=pointer]:
            - /url: /ludoteca/rol/black-mass
            - generic [ref=e367]:
              - generic [ref=e368]: "8.5"
              - heading "Black Mass" [level=3] [ref=e369]
              - paragraph [ref=e370]: "De la introducción: «Black Mass» es un juego en el que hay que huir de tu comunidad hacia la oscuridad, encontrar lo que buscas y regresar. Catherine y Lydia huyen de su pueblo durante la crisis de las brujas de la década de 1690. Se enfrentan a sus demonios en el bosque, en un viaje hacia sus propias misas negras. Los jugadores comparten la responsabilidad de Catherine y Lydia a través de facetas de sus personalidades llamadas «personas». [...] Black Mass es un juego sobre el descubrimiento: a través del juego aprendemos sobre Catherine y Lydia, guiados por las «personas» que surgen durante la partida."
              - list [ref=e371]:
                - listitem [ref=e372]: Manual
                - listitem [ref=e376]: "2019"
              - generic [ref=e380]: Occult (Magic)
        - article [ref=e381]:
          - link "Book of Exalted Deeds — Disponible" [ref=e382] [cursor=pointer]:
            - /url: /ludoteca/rol/book-of-exalted-deeds
            - generic [ref=e384]:
              - generic [ref=e385]: "6.4"
              - heading "Book of Exalted Deeds" [level=3] [ref=e386]
              - paragraph [ref=e387]: "De la contraportada: Derrota al mal con la Espada de la Iluminación Este libro de referencia para el juego D&D está destinado a un público adulto y ofrece a los jugadores y a los Dungeon Masters temas inspiradores que ampliarán cualquier campaña. Se incluye un análisis detallado de la naturaleza del bien y de los complejos retos a los que se enfrentan quienes se unen a la lucha eterna del lado de lo moral y lo justo. Además de hazañas exaltadas, clases de prestigio y hechizos, el *Libro de las Hazañas Exaltadas* también ofrece descripciones y estadísticas de una gran variedad de criaturas y paradigmas celestiales con los que los personajes virtuosos pueden aliarse. Ampliado con: Más campeones para los paradigmas celestiales"
              - list [ref=e388]:
                - listitem [ref=e389]: Manual
                - listitem [ref=e393]: "2003"
              - generic [ref=e397]: Fantasía
        - article [ref=e398]:
          - link "Book of Storyteller Secrets — Disponible" [ref=e399] [cursor=pointer]:
            - /url: /ludoteca/rol/book-of-storyteller-secrets
            - generic [ref=e401]:
              - generic [ref=e402]: "6.9"
              - heading "Book of Storyteller Secrets" [level=3] [ref=e403]
              - paragraph [ref=e404]: "Explora las extrañas y maravillosas noches de la Europa medieval oscura. Recorre los solitarios caminos nocturnos al servicio de los príncipes vampiros… o conviértete tú mismo en uno de ellos. Sigue el rastro de un unicornio para obtener su sangre, o adéntrate en las intrigas de las ciudades mercantiles italianas. Lucha contra los asesinos Assamita en Tierra Santa, o ayuda a los incipientes Tremere en su lucha por la supervivencia frente a los antiguos Demnios. «Vampiro: La Edad Media —Libro de los secretos del narrador» incluye: Un atlas de la Europa medieval oscura, con notas sobre las poblaciones de Cainitas. Un mapa desplegable a todo color de Europa. Una gran variedad de antagonistas míticos, incluidas reglas ampliadas para las gárgolas."
              - list [ref=e405]:
                - listitem [ref=e406]: Manual
                - listitem [ref=e410]: "1997"
              - generic [ref=e414]: Horror
        - article [ref=e415]:
          - link "Broken Compass - Adventure Journal — Disponible" [ref=e416] [cursor=pointer]:
            - /url: /ludoteca/rol/broken-compass-adventure-journal
            - generic [ref=e418]:
              - generic [ref=e419]: "8.2"
              - heading "Broken Compass - Adventure Journal" [level=3] [ref=e420]
              - paragraph [ref=e421]: "Descripción de la editorial: «Broken Compass» es un juego de rol de aventuras inspirado en las grandes películas y videojuegos del género, desde «La momia» hasta «Uncharted», pasando por «Indiana Jones» y «Tomb Raider». Los aventureros de Broken Compass son hombres y mujeres de acción que recorren el mundo para enfrentarse a los retos que plantean tanto las grandes ciudades como las tierras salvajes e inhóspitas. Los aventureros arriesgan sus vidas cada día, impulsados por su deseo de descubrir, aprender u obtener algo que para ellos no tiene precio. ¡El libro básico incluye el conjunto completo de reglas del juego, el escenario «1999» y un episodio listo para jugar! ¡Un manual que puedes llevar contigo a cualquier parte para vivir grandes aventuras cuando quieras! ... * Broken Compass se basa en el sistema Fortune, de gran carácter cinematográfico: un conjunto de mecánicas de juego que utilizan pequeños grupos de dados de seis caras para determinar el resultado de cualquier tarea que pueda conllevar riesgos o acabar en accidentes. Para tener éxito, no es necesario obtener sumas elevadas. Tu objetivo es obtener resultados de dos, tres o cuatro del mismo tipo, que se convierten en Éxitos. * Fácil de aprender y fácil de jugar. El «Fortune Master» se encarga de conocer la historia y los escenarios en los que se desarrolla, mientras que los demás jugadores asumen el papel de «Aventureros», ¡personajes de acción que se lanzan en busca de tesoros! * Hay disponibles tres expansiones y un spin-off, que añaden cientos de páginas y un montón de nuevos escenarios, personajes y aventuras al juego."
              - list [ref=e422]:
                - listitem [ref=e423]: Manual
                - listitem [ref=e427]: "2020"
              - generic [ref=e431]: Aventura
        - article [ref=e432]:
          - link "Broken Tales — Disponible" [ref=e433] [cursor=pointer]:
            - /url: /ludoteca/rol/broken-tales
            - generic [ref=e435]:
              - generic [ref=e436]: "8.5"
              - heading "Broken Tales" [level=3] [ref=e437]
              - paragraph [ref=e438]: Érase una vez un niño que salvó el mundo de los cuentos de hadas. Su recompensa fue un deseo. Aquel que trama en las sombras vio la oportunidad de corromper el corazón del niño, susurrándole una idea perversa. El niño le pidió al Rey de los Cuentos de Hadas que a los villanos, malditos durante siglos, se les concediera una nueva vida. Esa iba a ser su oportunidad de redención. Así fue como los villanos se volvieron buenos. Pero toda luz necesita una sombra y, a su vez, los héroes se volvieron malvados. En ese momento, todos los cuentos de hadas se hicieron añicos. Broken Tales es un juego de rol de mesa de historias oscuras, que reinterpreta los cuentos de hadas desde una perspectiva al revés. Los jugadores pasarán a formar parte de la Orden, un grupo secreto que opera en nombre del Papado para investigar sucesos sobrenaturales más allá de la comprensión humana. En una Europa del siglo XVIII impregnada de misticismo y horror, los protagonistas de Broken Tales no son otros que los antiguos antagonistas de los cuentos de hadas, arrojados a un nuevo mundo fruto del deseo del Niño Salvador. [de la página web de la editorial]
              - list [ref=e439]:
                - listitem [ref=e440]: Manual
                - listitem [ref=e444]: "2022"
              - generic [ref=e448]: Fantasía
        - article [ref=e449]:
          - link "Campeones de Verne — Disponible" [ref=e450] [cursor=pointer]:
            - /url: /ludoteca/rol/campeones-de-verne
            - generic [ref=e452]:
              - heading "Campeones de Verne" [level=3] [ref=e453]
              - paragraph [ref=e454]: From the back of the Book (Spanish) Por separado, son magnígficos. Unidos... ¡SON INVENCIBLES! Philleas Fogg. La princesa Aouda. Axel Lidenbrock. El Capitán Nemo. Miguel Strogoff. Impey Barbicane. John Strock. Personajes nacidos de la pluma de de un escritor, Julio Verne, que ahora cobran vida en este juego. El tiránico ingeniero Robur está poniendo en jaque al mundo con sus malévolas máquinas voladoras, y nadie parece capaz de detenerle. Por ello, se forma un grupo de personas excepcionales que han realizado las hazañas más grandes que se puedan imaginar. Deberán viajar a lo largo y ancho del globo para detener los planes del malvado científico y restaurar la paz en el mundo. Nada les detendrá en su empeño, porque ellos son... ¡los Campeones de Verne! Campeones de Verne es un juego de rol de aventuras y ciencia ficción que te permite encarnar tanto a los héroes de las novelas de Julio Verne, como crear a tu propio héroe, todo con la época victoriana como telón de fondo. Viajes, máquinas y peligros se mezclan en este juego, en el que tendrás que luchar contra el malvado Robur y sus secuaces. Acción y emociones te esperan dentro de estas páginas. ¿Estás dispuesto a encarnar a uno de los Campeones de Verne? ¡Adelante, empieza la aventura! English Separately, they are magnificent. United ... ARE INVINCIBLE! Philleas Fogg. Princess Aouda. Axel Lidenbrock. Captain Nemo. Miguel Strogoff. Impey Barbicane. John Strock. Characters born from the pen of a writer, Jules Verne, who now come alive in this game. The tyrannical engineer Robur is putting the world in check with his malicious flying machines, and no one seems able to stop him. For this reason, a group of exceptional people who have performed the greatest feats imaginable are gathered. They must travel across the globe to stop the evil scientist's plans and restore peace in the world. Nothing will stop them in their pursuit, because they are ... Verne's Champions! Verne's Champions is a science-fiction adventure role-playing game that allows you to embody both the heroes of Jules Verne's novels and create your own hero, all with the Victorian era as a background. Travel, machines and dangers are mixed in this game, in which you will have to fight against the evil Robur and his henchmen. Action and emotions await you within these pages. Are you willing to play one of Verne's Champions? Go ahead, start the adventure!
              - list [ref=e455]:
                - listitem [ref=e456]: Manual
                - listitem [ref=e460]: "2016"
              - generic [ref=e464]: Aventura
        - article [ref=e465]:
          - link "Candela Obscura — Disponible" [ref=e466] [cursor=pointer]:
            - /url: /ludoteca/rol/candela-obscura
            - generic [ref=e468]:
              - generic [ref=e469]: "7.4"
              - heading "Candela Obscura" [level=3] [ref=e470]
              - paragraph [ref=e471]: "[Descripción del editor] Candela Obscura es un nuevo juego de rol de mesa que te pone en la piel de unos investigadores que trabajan para una orden esotérica. En este juego de terror investigativo, personas con diversos talentos se unen bajo el paraguas de la organización Candela Obscura. Investigarás sucesos extraños y te enfrentarás a peligrosas formas de magia, luchando contra una misteriosa fuente de corrupción y desangramiento. Candela Obscura es el primer juego en utilizar el sistema Illuminated Worlds, un sistema de nuevo diseño que emplea dados de seis caras y se presta a un juego narrativo y basado en arcos argumentales."
