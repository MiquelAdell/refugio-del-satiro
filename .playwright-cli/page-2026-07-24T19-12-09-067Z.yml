                - listitem [ref=e260]: "2005"
              - generic [ref=e264]: Fantasía
        - article [ref=e265]:
          - 'link "Anima: Pantalla del director — Disponible" [ref=e266] [cursor=pointer]':
            - /url: /ludoteca/rol/anima-pantalla-del-director
            - generic [ref=e268]:
              - 'heading "Anima: Pantalla del director" [level=3] [ref=e269]'
              - paragraph [ref=e270]: "La Pantalla del Director es un suplemento para el juego de rol Ánima en la que se incluyen: Una pantalla de referencia rápida de cuatro paneles, donde se reúnen todas las tablas y reglas necesarias para ayudarte a dirigir cualquiera de tus partidas. Multitud de reglas de juego adicionales, desde nuevos puntos de creación a maniobras de combate. Una gran variedad de reglas opcionales, que te permiten adaptar perfectamente el estilo de juego que prefieras. 20 personajes pregenerados, cada uno perteneciente a una categoría distinta, con su propio trasfondo. La aventura \"Una sombra en los sueños\", una partida de varias sesiones para un grupo de 3 a 5 personajes de primer o segundo nivel. \"Una sombra en los sueños\" está preparada tanto para jugadores con experiencia como para aquellos que se adentran por primera vez en el mundo de Gaïa. (From back of the book)"
              - list [ref=e271]:
