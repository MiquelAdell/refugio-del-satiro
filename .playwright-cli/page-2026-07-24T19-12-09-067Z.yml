        - article [ref=e2225]:
          - link "World of Fantasy — Disponible" [ref=e2226] [cursor=pointer]:
            - /url: /ludoteca/rol/world-of-fantasy
            - generic [ref=e2228]:
              - generic [ref=e2229]: "7.0"
              - heading "World of Fantasy" [level=3] [ref=e2230]
              - paragraph [ref=e2231]: "World of Fantasy es un sistema de juego ligero y versátil que equilibra lo lúdico y lo narrativo, conservando todo el sabor de la fantasía clásica. Saca un suplemento de tu estantería o busca una aventura de libre descarga en Internet y adéntrate en cualquier ambientación de fantasí medieval, épica, oscura o heroica. Emplea un sistema 2d6, tiene elementos PbtA y de vieja escuela. No encotrarás movimientos ni el DJ tiene por qué construir la historia en base a preguntas a los PJ, aunque estos sí decidirán ciertas consecuencias según el éxito de sus actos. No importa tanto la acción como la ficción, aunque sí jugaréis una aventura o campña clásica, y vuestros personajes tendrán atributos y habilidades. La Hoja de personaje és, sin duda, el eje central del juego. Permite crear los personajes sin conocer el sistema. En pocos pasos, sabrás quién eres y en qué destacas. Todo está ahí, claro e intuituvo. Otro punto fuerte es la elección del equipo, dividido entre \"de mochila\" y \"de mano\", lo que decidas llevar contigo marcará tu nivel de carga y te dará ventaja o desventaja en determinados momentos- Gana´ras PX conociendo a tus compañeros, durante los interludios, o por falar, porque de los errores se aprende. Podrás tener éxito en una acción sin tirar, pero asumiendo un coste. Encontrarás, también, capítulos sobre el uso de la magia, bastante libre e inspirador, o las reglas de viaje, asentamientos, puntos de botín, compañero animal... A lo largo de este manual existen numerosos ejemplos de juego, muy útiles para adentrarte en el sistema y como inspiración para tus partidas. En el capítulo final, acompañamos al autor en la creación de una aventura, en base al dibujo de una mazmorra. Y ahora... reúne a un grupo de 2 a 5 jugadores (uno será el DJ), imprime las hojas de personaje, hazte con al menos 3 dados de 6 caras, y disfruta de la fantasía sin grandes manuales. ¡Céntrate en la diversión y en vivir la aventura! (From the back of the book. Publisher: El Refugio de Ryhope)"
              - list [ref=e2232]:
                - listitem [ref=e2233]: Manual
                - listitem [ref=e2237]: "2022"
              - generic [ref=e2241]: Fantasía
        - article [ref=e2242]:
          - link "Xanathar's Guide to Everything — Disponible" [ref=e2243] [cursor=pointer]:
            - /url: /ludoteca/rol/xanathar-s-guide-to-everything
            - generic [ref=e2245]:
              - generic [ref=e2246]: "8.0"
              - heading "Xanathar's Guide to Everything" [level=3] [ref=e2247]
              - paragraph [ref=e2248]: "De la sinopsis de la editorial: Explora un sinfín de nuevas y fantásticas opciones de reglas, tanto para los jugadores como para los Dungeon Masters, en este suplemento para el mejor juego de rol del mundo. Aquí se recopila por primera vez información nueva sobre aventureros de todo tipo. Además, encontrarás valiosos consejos para aquellos con intenciones malvadas que tengan que lidiar con esos entrometidos bienhechores, incluidas las reflexiones personales de Xanathar sobre cómo acabar con cualquiera lo suficientemente tonto como para interferir en sus negocios. Además de sus observaciones sobre los propios «héroes», el beholder llena las páginas de este tomo con sus reflexiones personales sobre trucos, trampas e incluso tesoros, y cómo pueden utilizarse con fines malvados. Reglas completas para más de veinte nuevas subclases de la quinta edición de Dungeons & Dragons, entre las que se incluyen el caballero, el inquisitivo, el caminante del horizonte y muchas más. Docenas de nuevas dotes y hechizos, y un sistema para dotar a tu personaje de una historia de fondo única y aleatoria. Una variedad de sistemas y herramientas que proporcionan a los Dungeon Masters nuevas formas de personalizar sus partidas caseras, al tiempo que amplían las posibilidades de los jugadores para participar en partidas organizadas y campañas de mundo compartido. ¡La belleza está en los ojos del que mira, pero el mal está en su corazón! El Xanathar… El señor del crimen más infame de Waterdeep, y además un beholder… Os sorprendería descubrir todo lo que sabe sobre vosotros… Sí, vosotros… aventureros."
