              - generic [ref=e956]: "7.8"
              - heading "Fate Core System" [level=3] [ref=e957]
              - paragraph [ref=e958]: "Información del editor ¡Coge tus rifles de plasma, tus componentes mágicos y tus mochilas propulsoras! Elige el juego que quieras: Fate Core es la base que lo hará realidad. Fate Core es un sistema flexible capaz de dar vida a cualquier mundo que imagines. ¿Siempre has querido jugar a un western spaghetti postapocalíptico con monstruos con tentáculos? ¿Espadas y hechicería en el espacio? ¿Te gustaría que hubiera un juego basado en tu serie favorita de libros, películas o televisión, pero nunca se ha hecho realidad? Fate Core es la respuesta. Fate Core es un juego de rol de mesa sobre personas proactivas y capaces que llevan vidas dramáticas. El tipo de drama que vivan depende de ti. Pero vayas donde vayas, te espera una divertida experiencia narrativa llena de giros… del destino. Información del juego Número de jugadores: 3-6 Edad de los jugadores: a partir de 12 años Duración: 2-8 horas Tipo de juego: juego de rol Idiomas disponibles: inglés Diseñadores del juego: Leonard Balsera, Brian Engard, Jeremy Keller, Ryan Macklin, Mike Olson"
              - list [ref=e959]:
                - listitem [ref=e960]: Manual
                - listitem [ref=e964]: "2013"
              - generic [ref=e968]: Generic / Universal
        - article [ref=e969]:
          - link "Follow — Disponible" [ref=e970] [cursor=pointer]:
            - /url: /ludoteca/rol/follow
            - generic [ref=e972]:
              - generic [ref=e973]: "8.0"
              - heading "Follow" [level=3] [ref=e974]
              - paragraph [ref=e975]: "De la página web de la editorial «Follow» es un juego en el que te sientas con tus amigos e interpretas a personajes que colaboran para alcanzar un objetivo común: vuestra misión. La misión que elijáis determinará el tipo de juego que jugaréis. Podéis iniciar una rebelión, curar una enfermedad, matar a un dragón (o a un gato) o conseguir que vuestro candidato resulte elegido. Si se trata de algo que la gente pueda lograr trabajando en equipo, podría ser una misión. ¿Se mantendrán unidos vuestros personajes o sus diferencias los separarán? ¿Triunfarán o sus esperanzas se esfumarán?"
              - list [ref=e976]:
                - listitem [ref=e977]: Manual
                - listitem [ref=e981]: "2017"
              - generic [ref=e985]: Generic / Universal
        - article [ref=e986]:
          - 'link "Forbidden Lore: Technology — Disponible" [ref=e987] [cursor=pointer]':
            - /url: /ludoteca/rol/forbidden-lore-technology
            - generic [ref=e989]:
              - generic [ref=e990]: "7.1"
              - 'heading "Forbidden Lore: Technology" [level=3] [ref=e991]'
              - paragraph [ref=e992]: "Incluye información sobre: naves espaciales, artillería y vehículos; el Derecho Eclesiástico; la economía de los Mundos Conocidos; máquinas pensantes; gólems; cibernética; tecnología psíquica; tecnología Vau y artefactos alienígenas."
              - list [ref=e993]:
                - listitem [ref=e994]: Manual
                - listitem [ref=e998]: "1996"
              - generic [ref=e1002]: Ciencia Ficción
        - article [ref=e1003]:
          - link "Fountains of Bright Crimson — Disponible" [ref=e1004] [cursor=pointer]:
            - /url: /ludoteca/rol/fountains-of-bright-crimson
            - generic [ref=e1006]:
              - generic [ref=e1007]: "6.0"
              - heading "Fountains of Bright Crimson" [level=3] [ref=e1008]
              - paragraph [ref=e1009]: "De la contraportada del libro: La Ciudad Santa enloquecida En 1099, los cruzados victoriosos conquistaron Jerusalén y se lanzaron a una épica oleada de matanzas y destrucción. Ahora, un siglo después, las semillas regadas por aquella sangrienta cosecha por fin florecen. Un loco acecha en las noches. Un antiguo vampiro se agita en su letargo. Un manantial sagrado llora lágrimas de sangre. A menos que alguien descubra el secreto más oscuro de Jerusalén, la matanza comenzará de nuevo. La sangre tiñe las aguas «Fuentes de carmesí brillante» es una crónica de aventuras para «Vampiro: La Edad Media». Explora el mayor misterio y la mayor tragedia de la historia caínita de Jerusalén: las Semanas de Sangre. Ahora puede revelarse la espantosa verdad que se esconde tras la matanza de inocentes… si eres lo suficientemente valiente como para conocer las respuestas."
              - list [ref=e1010]:
                - listitem [ref=e1011]: Aventura
                - listitem [ref=e1015]: "1999"
              - generic [ref=e1019]: Horror
        - article [ref=e1020]:
          - link "Freedom City — Disponible" [ref=e1021] [cursor=pointer]:
            - /url: /ludoteca/rol/freedom-city
            - generic [ref=e1023]:
              - generic [ref=e1024]: "7.8"
              - heading "Freedom City" [level=3] [ref=e1025]
              - paragraph [ref=e1026]: "Según la descripción de la editorial: ¡Una ciudad natal que merece la pena salvar del mal! El galardonado juego de rol de superhéroes «Mutants & Masterminds» te da el poder de convertirte en un superhéroe. ¡Freedom City te ofrece un mundo que rescatar de las fuerzas del mal! Considerada «el mejor escenario de superhéroes de la historia», Freedom City es una metrópolis totalmente desarrollada y detallada que puede servir como base de operaciones para tus héroes o simplemente como uno de los muchos lugares que visitan mientras salvan al mundo del desastre. Freedom City incluye una historia detallada, basada en décadas de publicaciones de cómics, mapas de la ciudad y cientos de lugares y personajes que te ayudarán a darle vida. En sus páginas encontrarás: ¡La Ciudad de la Libertad! Todo lo que necesitas saber sobre Freedom City, desde su historia y geografía hasta el color local, las personalidades importantes, el gobierno y la seguridad pública, todo ello repleto de oportunidades de aventura para tus héroes. ¡Héroes! Haz que tus héroes se unan a las filas de la famosa Freedom League, protegiendo el mundo desde su cuartel general satélite. ¡Presenta a los nuevos alumnos de la Academia Claremont, donde los héroes novatos aprenden el oficio de sus predecesores que ya han colgado la capa, o conoce a la Familia Atom, jóvenes mutantes bajo el cuidado del intelecto computarizado de su famoso abuelo científico, el Dr. Atom; o crea equipos de héroes totalmente nuevos que alcancen la fama en Freedom! ¡Villanos! Enfréntate a los peores criminales que Freedom City tiene para ofrecer: diez equipos de supervillanos y unos cien villanos, todos ellos bien desarrollados y listos para que tus héroes luchen contra ellos. Lucha contra las fuerzas vestidas de negro de SHADOW, frustra los planes de Mastermind, resuelve los acertijos de Conundrum y da caza al misterioso Jack-a-Knives entre las sombras del West End. Cuando los hayas derrotado, encárcelalos a todos en la Penitenciaría de Blackstone o en el Manicomio de Providence. ¡Lugares fantásticos! Ve más allá de Freedom City y explora los lugares fantásticos que el mundo tiene para ofrecer, desde la misteriosa Ultima Thule y la nación africana de Dakana, hasta Farside City en la Luna, la Atlántida en las profundidades del océano, o más allá, hasta la alienígena Grue Unity o el Terminus, el reino interdimensional de la entropía que busca consumir la realidad a las órdenes de Lord Omega. ¡Te esperan infinitos mundos de aventura! Aventúrate en una auténtica ciudad de héroes..."
              - list [ref=e1027]:
                - listitem [ref=e1028]: Manual
                - listitem [ref=e1032]: "2006"
              - generic [ref=e1036]: Aventura
        - article [ref=e1037]:
          - link "Glitch — Disponible" [ref=e1038] [cursor=pointer]:
            - /url: /ludoteca/rol/glitch
            - generic [ref=e1040]:
              - heading "Glitch" [level=3] [ref=e1041]
              - paragraph [ref=e1042]: "Publisher Blurb: En la mitad de la noche un cuerpo extraterrestre penetra en la atmósfera. Tras unos instantes se convierte en un bólido, estallando a pocos kilómetros por encima del centro de la ciudad. Su deslumbrante destello hace que, por un momento, el día se adelante al amanecer. Segundos después la onda expansiva golpea la realidad, los cristales de muchos edificios se rompen y las alarmas de los coches y locales empiezan a aullar. Afortunadamente hay pocos heridos. Es un evento extraordinario, pero no un desastre. Sin embargo, marcará el inicio de una extraña aventura. Glitch es una aventura sobre bugs cósmicos y pesadillas virtuales para Cultos Innombrables."
              - list [ref=e1043]:
                - listitem [ref=e1044]: Aventura
                - listitem [ref=e1048]: "2021"
              - generic [ref=e1052]: Aventura
        - article [ref=e1053]:
          - link "Grimorio — Disponible" [ref=e1054] [cursor=pointer]:
            - /url: /ludoteca/rol/grimorio
            - generic [ref=e1056]:
              - heading "Grimorio" [level=3] [ref=e1057]
              - paragraph [ref=e1058]: "Un suplemento para Aquelarre, el juego de rol Demoníaco - Medieval. Nota de la editorial: Con Grimorio Vol.1, comienza una nueva línea para Aquelarre tu juego de rol demoníaco-medieval. Dentro de nuestro proyecto de juegos basados en el sistema de juego 2H, Aquelarre, ocupa el luegar central, y como rasgo característico de él tenemos la lucha de irracionalidad-racionalidad y los peculiares conjuros mágicos. El juego de Aquelarre, encontrará en este Volumen y sucesivos una recopilación de los hechizos publicados en suplementos, revistas, listas de correo y otros muchos expresamente realizados para la edición. Además de nuevas regals, módulos todas esas cosas que hacen de los suplementos de Aquelarre algo especial con personalidad. Para los jugadores de otros juegos en sistema 2H, con o sin magia, encontrarán un suplemento perfecto adaptable para dotar del color de la característica magia de Aquelarre durante las partidas. (From the book)"
              - list [ref=e1059]:
                - listitem [ref=e1060]: Manual
                - listitem [ref=e1064]: "2002"
              - generic [ref=e1068]: Mitología
        - article [ref=e1069]:
          - link "Guía de inicio Nahui Ollin — Disponible" [ref=e1070] [cursor=pointer]:
            - /url: /ludoteca/rol/guia-de-inicio-nahui-ollin
            - generic [ref=e1072]:
              - heading "Guía de inicio Nahui Ollin" [level=3] [ref=e1073]
              - paragraph [ref=e1074]: "Publisher Blurb: Nahui Ollin es un juego de rol sobre la exploración, conquista y colonización de América en el que la historia se mezcla con la leyenda y el mito con la realidad. Esta guía de inicio contiene todo lo necesario para comenzar a vivir aventuras en la América de Nahui Ollin, conocer a sus pobladores, incluso hacer frente a algunas de sus criaturas más legendarias. Con ella podréis crear vuestros propios personajes, aprender las reglas básicas, de combate y de magia e incluso ponerlos a prueba en la aventura introductoria «Palabras de Paz, Vientos de Guerra». Explora el nuevo juego de Ricard Ibáñez, autor del aclamado juego de rol demoníaco medieval Aquelarre, y descubre lo que está por venir en el manual completo de Nahui Ollin."
              - list [ref=e1075]:
                - listitem [ref=e1076]: Manual
                - listitem [ref=e1080]: "2019"
              - generic [ref=e1084]: Aventura
        - article [ref=e1085]:
          - link "GURPS Discworld Roleplaying Game — Disponible" [ref=e1086] [cursor=pointer]:
            - /url: /ludoteca/rol/gurps-discworld-roleplaying-game
            - generic [ref=e1088]:
              - generic [ref=e1089]: "7.3"
              - heading "GURPS Discworld Roleplaying Game" [level=3] [ref=e1090]
              - paragraph [ref=e1091]: "De la contraportada del libro: «¡Un juego de rol completo en un solo volumen! Te ha encantado leer sobre el Mundodisco. Ahora puedes ir allí... Este libro incluye no solo una descripción completa del Mundodisco de Terry Pratchett (y, por supuesto, de sus personajes principales) en términos de juego, sino también las reglas de rol de GURPS Lite. Con solo 32 páginas, estas reglas abarcan todo lo que necesitas para jugar y son compatibles con otros libros de GURPS (Generic Universal Roleplaying System)». Publicado originalmente como GURPS Discworld."
              - list [ref=e1092]:
                - listitem [ref=e1093]: Manual
                - listitem [ref=e1097]: "1998"
              - generic [ref=e1101]: Fantasía
        - article [ref=e1102]:
          - link "Handler's Guide — Disponible" [ref=e1103] [cursor=pointer]:
            - /url: /ludoteca/rol/handler-s-guide
            - generic [ref=e1105]:
              - generic [ref=e1106]: "8.8"
              - heading "Handler's Guide" [level=3] [ref=e1107]
              - paragraph [ref=e1108]: "De la contraportada: TÚ ERES EL APOCALIPSIS Nacida a raíz de la redada que el Gobierno de EE. UU. llevó a cabo en 1928 en la degenerada localidad costera de Innsmouth, Massachusetts, la agencia secreta conocida como Delta Green se enfrenta a las fuerzas de la oscuridad con honor, pero sin gloria. Los agentes de Delta Green luchan para salvar a la humanidad de horrores sobrenaturales, a menudo a un coste personal devastador. En DELTA GREEN: EL JUEGO DE ROL, los jugadores son esos agentes. Luchan para evitar que los terrores más allá del espacio y el tiempo contaminen el mundo y se cobren vidas humanas y la cordura. El «Handler» es el moderador del juego que crea e interpreta su mundo, presenta el horror sobrenatural que investigan y describe las terribles consecuencias de sus sacrificios. La GUÍA DEL HANDLER es un libro de reglas exclusivo para el moderador del juego DELTA GREEN: EL JUEGO DE ROL. Incluye: Una historia del mundo de Delta Green desde la prehistoria hasta la actualidad, con consejos para campañas y ideas para escenarios en cada página. Rituales espeluznantes, entidades sobrenaturales y los Grandes Antiguos que destrozan la realidad. Reglas para crear nuevas amenazas con las que conmocionar y aterrorizar a tus agentes. La misteriosa organización Delta Green, descrita con todo lujo de detalles inquietantes, y la otra conspiración despiadada que afirma ser la verdadera Delta Green. Pautas para crear escenarios y campañas originales utilizando los recursos de este libro. «Operación FULMINATE: Los centinelas del crepúsculo», un escenario de ejemplo listo para jugar."
              - list [ref=e1109]:
                - listitem [ref=e1110]: Manual
                - listitem [ref=e1114]: Aventura
                - listitem [ref=e1118]: "2017"
              - generic [ref=e1122]: Moderno
        - article [ref=e1123]:
          - link "Imperium Maledictum Core Rulebook — Disponible" [ref=e1124] [cursor=pointer]:
            - /url: /ludoteca/rol/imperium-maledictum-core-rulebook
            - generic [ref=e1126]:
              - generic [ref=e1127]: "9.1"
              - heading "Imperium Maledictum Core Rulebook" [level=3] [ref=e1128]
              - paragraph [ref=e1129]: "Descripción del editor: Imperium Maledictum es un nuevo juego de rol de Warhammer 40.000 ambientado en el glorioso Sector Machariano, un sector forjado en sangre y fuego a partir de los mil mundos conquistados por Lord Solar Macharius. Se trata de un sector plagado de peligros y traiciones, Imperium Maledictum utiliza un sistema d100, familiar pero refinado, para sumergir a los jugadores en historias de intriga, traición y conspiración. Los jugadores asumen el papel de adeptos y ciudadanos imperiales reclutados por un poderoso Patrón. Estas figuras influyentes recurren a equipos ajenos a la cadena de mando habitual para llevar a cabo misiones sombrías y peligrosas, promoviendo sus intereses, a menudo inescrutables. Para tener éxito, los jugadores deben abrirse camino a través de la complicada red de facciones rivales que conforman el Imperium. Deben moverse por un reino en el que una acusación susurrada puede ser tan letal como cualquier bolter, adentrándose en las profundidades de las colmenas más mortíferas y sorteando las amenazas, a menudo mucho más insidiosas, que acechan en las cortes de los nobles. ¿Tienes lo que hace falta para sobrevivir a las sombrías y traicioneras aventuras del 41.º Milenio?"
              - list [ref=e1130]:
                - listitem [ref=e1131]: Manual
                - listitem [ref=e1135]: "2023"
              - generic [ref=e1139]: Ciencia Ficción
        - article [ref=e1140]:
          - link "ink — Disponible" [ref=e1141] [cursor=pointer]:
            - /url: /ludoteca/rol/ink
            - generic [ref=e1143]:
              - generic [ref=e1144]: "7.0"
              - heading "ink" [level=3] [ref=e1145]
              - paragraph [ref=e1146]: "De la contraportada del libro: «Reúnete con las almas perdidas de los personajes fallecidos mientras navegas por aguas peligrosas e islas traicioneras en este animado juego de rol»."
              - list [ref=e1147]:
                - listitem [ref=e1148]: Manual
                - listitem [ref=e1152]: "2023"
              - generic [ref=e1156]: Weird / Surreal
        - article [ref=e1157]:
          - link "King Arthur Pendragon (3rd Edition) — Disponible" [ref=e1158] [cursor=pointer]:
            - /url: /ludoteca/rol/king-arthur-pendragon-3rd-edition
            - generic [ref=e1160]:
              - generic [ref=e1161]: "8.0"
              - heading "King Arthur Pendragon (3rd Edition)" [level=3] [ref=e1162]
              - paragraph [ref=e1163]: "De la contraportada del libro: ¡Revive la gloria de la corte del rey Arturo! Defiende los ideales caballerescos de valentía, honestidad, juego limpio y justicia. Emprende peligrosas misiones y enfréntate a amenazas monstruosas en la legendaria Gran Bretaña. Derrota a gigantes sedientos de sangre y aplasta a invasores traicioneros por el rey Arturo y por la gloria. Armado y con tu armadura, tú eres la ley del reino. Vence a enemigos despiadados en luchas a vida o muerte para unirte a la hermandad de la Mesa Redonda. Este libro contiene todo lo que necesitas para explorar los misterios y peligros de la Bretaña de Arturo. Entre sus numerosas características se incluyen un sistema de juego completo; amplia información de trasfondo que abarca la caballería y la vida de los caballeros, tu hogar y tu familia, el mundo feudal y los deberes caballerescos. La información clara y concisa facilita y agiliza la creación de personajes, y se incluyen numerosos ejemplos. Otras secciones te enseñan cómo dirigir una sesión de juego de PENDRAGON y cómo iniciar tu primera campaña. Se describen con detalle monstruos exóticos, criaturas temibles y otros pueblos. Las estadísticas de muchos caballeros y nobles famosos incluyen a Arturo, Gawaine, Lancelot, Ginebra, Mordred, Merlín y Morgana le Fay. ¡Se incluyen numerosas aventuras para que puedas empezar a jugar de inmediato! Características de Pendragon 3.ª edición: Un sistema de juego completo y fácil de usar. Nuevas características de juego únicas. Información de trasfondo completa. Estadísticas de juego para personajes famosos. Numerosas aventuras listas para jugar. Compatible con ediciones anteriores."
              - list [ref=e1164]:
                - listitem [ref=e1165]: Manual
                - listitem [ref=e1169]: "1990"
              - generic [ref=e1173]: Mitología
        - article [ref=e1174]:
          - link "Kingdom of Nothing — Disponible" [ref=e1175] [cursor=pointer]:
            - /url: /ludoteca/rol/kingdom-of-nothing
            - generic [ref=e1177]:
              - generic [ref=e1178]: "7.3"
              - heading "Kingdom of Nothing" [level=3] [ref=e1179]
              - paragraph [ref=e1180]: "Sinopsis de la editorial: Érase una vez, cuando grandes monstruos de cristal gris y granito surgieron a la vida por todo el mundo. Desgarraron, royeron y se abrieron paso a mordiscos a través de la tierra y el lecho rocoso hasta que sus raíces quedaron enterradas en lo más profundo del suelo. Absorbieron la vida de la tierra que los rodeaba. Por sus tendones corría cemento y metal oxidado, y por sus venas bombeaban aguas residuales. Asfixiaban el aire al inhalar con sus pulmones llenos de vapor; y al exhalar, solo escapaban humo y fuego. Con mil extremidades se alzaban y arañaban el cielo. A medida que pasaban los años y estos horrores crecían y crecían más allá de toda razón, partes de ellos morían y se desprendían. La mayoría de las veces, se devoraban sus extremidades muertas y les crecían otras nuevas en su lugar. A veces, sin embargo, esos lugares se dejaban pudrirse. Fue en esos lugares muertos donde los fantasmas vinieron a habitar; en las sombras y los túneles de la pesadilla urbana. En los Lugares Olvidados. Estos fantasmas habitan un mundo que la mayoría nunca ha visto. Existe en desarmonía con la realidad que hemos llegado a conocer, solapándose con ella y contradiciéndola a la vez. Existe en las sombras, los callejones y los túneles del paisaje urbano; en estaciones de tren abandonadas y edificios en ruinas. En estos lugares yacen grandes palacios en descomposición, vastos laberintos dentro de los túneles de la ciudad. Kingdom of Nothing es un juego sobre personas que lo han perdido todo y su lucha por salir a rastras de las grietas por las que se han deslizado. En él, los jugadores asumen el papel de una persona olvidada. Les ocurrió algo tan terriblemente traumático que hizo que sus vidas se derrumbaran y les obligó a acabar en la calle y sin hogar. Una fuerza misteriosa llamada la Nada se ha comido sus recuerdos y ha materializado sus miedos en forma de monstruos retorcidos que amenazan con destruirlos. A lo largo del juego, se enfrentan a aquello que destruyó sus vidas y recuperan sus recuerdos poco a poco. Los jugadores de la mesa colaboran para crear la historia de fondo de tu personaje, al tiempo que tú colaboras para crear la de ellos. A lo largo del juego, los jugadores descubren el intenso drama que llevó a su personaje a perderse en la Nada."
              - list [ref=e1181]:
                - listitem [ref=e1182]: Manual
                - listitem [ref=e1186]: "2010"
              - generic [ref=e1190]: Horror
        - article [ref=e1191]:
          - link "Kingdoms of Kalamar Campaign Setting Sourcebook — Disponible" [ref=e1192] [cursor=pointer]:
            - /url: /ludoteca/rol/kingdoms-of-kalamar-campaign-setting-sourcebook
            - generic [ref=e1194]:
              - generic [ref=e1195]: "7.5"
              - heading "Kingdoms of Kalamar Campaign Setting Sourcebook" [level=3] [ref=e1196]
              - paragraph [ref=e1197]: El libro de referencia «The Kingdoms of Kalamar Campaign Setting» contiene todo lo que tanto los jugadores como los directores de juego necesitan para ambientar su campaña de Dungeons and Dragons 3.0 en el mundo de Tellene. Incluye ilustraciones y mapas a todo color, información detallada sobre todas las regiones del mundo y sus habitantes, notas sobre idiomas, dioses y leyes, así como datos astronómicos y monetarios. Esta entrada corresponde a la 3.ª edición.
              - list [ref=e1198]:
                - listitem [ref=e1199]: Manual
                - listitem [ref=e1203]: "2001"
              - generic [ref=e1207]: Fantasía
        - article [ref=e1208]:
          - link "Knights Adventurous — Disponible" [ref=e1209] [cursor=pointer]:
            - /url: /ludoteca/rol/knights-adventurous
            - generic [ref=e1211]:
              - generic [ref=e1212]: "7.5"
              - heading "Knights Adventurous" [level=3] [ref=e1213]
              - paragraph [ref=e1214]: "De la contraportada: «Knights Adventurous» amplía y profundiza en muchos de los temas introducidos en el libro de reglas básico de Pendragon, y constituye una valiosa ayuda tanto para los jugadores como para el director de juego. La sección «CREACIÓN DE PERSONAJES» amplía considerablemente las opciones de los caballeros jugadores. TIERRAS Y PUEBLOS describe Francia, Irlanda y diversas regiones de Gran Bretaña, revelando gobernantes, vasallos, ejércitos y características interesantes. Abarca a los cymri, franceses, occitanos, irlandeses, pictos, romanos y sajones. «CABALLEROS» presenta nuevas clases y ambiciones nobiliarias. Entre las diversas organizaciones se incluyen los Caballeros de la Reina, los Caballeros del Templo del Grial y la Orden de la Manzana Dorada. «MUJERES» detalla los roles, las ambiciones y la creación de personajes. RELIGIÓN: se describen el cristianismo, el paganismo, el wotanismo y el judaísmo. RIQUEZA: ofrece muchas formas de gastar dinero, incluyendo banquetes, caballerizas, razas de caballos, modas en vestimenta y tipos adicionales de armadura. GRANDES EVENTOS describe las visitas a la corte, la organización de un torneo y la caza. MAGIA Y HADAS aborda el tema de las hadas en Gran Bretaña, analiza la relación entre religión y hadas, el uso de la magia y reflexiona sobre el rey Arturo y la Guerra de las Hadas."
              - list [ref=e1215]:
                - listitem [ref=e1216]: Manual
                - listitem [ref=e1220]: "1990"
              - generic [ref=e1224]: Fantasía
        - article [ref=e1225]:
          - link "Kult (1st Edition) — Disponible" [ref=e1226] [cursor=pointer]:
            - /url: /ludoteca/rol/kult-1st-edition
            - generic [ref=e1228]:
              - generic [ref=e1229]: "7.6"
              - heading "Kult (1st Edition)" [level=3] [ref=e1230]
              - paragraph [ref=e1231]: La muerte es solo el principio... El traqueteo de las cadenas y un hedor nauseabundo me llevaron por más pasillos, todos con paredes de azulejos esmaltados de un gris apagado. Unos tubos de cristal parpadeantes emitían una luz blanco amarillenta. Mis pies descalzos resbalaban sobre el aceite y la sangre del suelo. Las cucarachas se arrastraban por las grietas entre los azulejos de la pared. A lo lejos, alguien gritaba de agonía... Kult es un juego de rol de terror contemporáneo. Se desarrolla aquí y ahora, en la realidad actual. Pero la realidad no es lo que creemos. A nuestro alrededor, el mundo es oscuro y peligroso, y nada es lo que parece. Nuestra realidad es una ilusión, creada para mantenernos cautivos. Llevamos siglos encarcelados por un creador dictatorial. El mundo verdadero, invisible para nosotros, está gobernado por criaturas que dominan tras las falsas fachadas, nuestros carceleros y torturadores. Los personajes de Kult son héroes oscuros, gobernados por el Destino. Cuando las ilusiones se desvanecen, se enfrentan a la verdadera realidad. En las fronteras entre el terror y la locura, los sueños y la muerte...
              - list [ref=e1232]:
                - listitem [ref=e1233]: Manual
                - listitem [ref=e1237]: "1993"
              - generic [ref=e1241]: Horror
        - article [ref=e1242]:
          - link "Kult (1st Edition) — Disponible" [ref=e1243] [cursor=pointer]:
