        - article [ref=e787]:
          - 'link "Fabula Ultima: Game Master''s Toolkit — Disponible" [ref=e788] [cursor=pointer]':
            - /url: /ludoteca/rol/fabula-ultima-game-master-s-toolkit
            - generic [ref=e790]:
              - generic [ref=e791]: "7.5"
              - 'heading "Fabula Ultima: Game Master''s Toolkit" [level=3] [ref=e792]'
              - paragraph [ref=e793]: "En estas páginas encontrarás herramientas en abundancia. Y en cada una de ellas, un alma con muchas ganas de divertirse. Fuertemente inspirado en los JRPG y con unas preciosas ilustraciones de Takashi Konno, este pantalla en PDF de cuatro viñetas proporcionará a los directores de juego de Fabula Ultima herramientas rápidas y referencias a las reglas. El folleto complementario de 36 páginas amplía el capítulo 4: «El director de juego» del libro de reglas básico, ofreciendo ideas y buenas prácticas fruto de los comentarios de la comunidad. Fabula Ultima es un juego de Emanuele Galletto, publicado por NEED GAMES!"
