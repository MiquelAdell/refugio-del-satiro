            - generic [ref=e904]:
              - generic [ref=e905]: "6.0"
              - heading "Fading Suns Universe Book" [level=3] [ref=e906]
              - paragraph [ref=e907]: "De la contraportada del libro: Una pasión en un futuro lejano Estamos en el sexto milenio. La humanidad se extendió por las estrellas y construyó una república de tecnología avanzada y emancipación universal… para luego desperdiciarla, disputársela y perderla. A medida que la luz de las estrellas comenzaba a desvanecerse lentamente, una nueva Edad Oscura se cernió sobre los Mundos Conocidos. Entonces, de entre las cenizas de la guerra y la ruina, el emperador Alexius ascendió al poder y marcó el comienzo de una nueva era de esperanza. Ahora convoca a valientes caballeros, sabios sacerdotes y ingeniosos miembros de gremios para llevar su paz a todos los mundos, conocidos y desconocidos. El Libro del Universo presenta el escenario de Fading Suns: su historia, su sociedad y su astrogeografía. En él te encontrarás con nobles, sacerdotes, miembros de gremios, alienígenas, psíquicos, ciborgs y mucho más."
