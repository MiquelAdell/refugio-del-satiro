        - article [ref=e800]:
          - link "Fading Suns — Disponible" [ref=e801] [cursor=pointer]:
            - /url: /ludoteca/rol/fading-suns
            - generic [ref=e803]:
              - generic [ref=e804]: "7.2"
              - heading "Fading Suns" [level=3] [ref=e805]
              - paragraph [ref=e806]: Estamos en los albores del sexto milenio después de Cristo y los cielos se oscurecen, pues los propios soles se están apagando. Los humanos llegaron a las estrellas hace mucho tiempo, construyendo una República basada en la alta tecnología y la emancipación universal… y luego la desperdiciaron, se disputaron su control y, finalmente, la perdieron. Una nueva Edad Oscura se ha abatido sobre la humanidad, pues la más grande de las civilizaciones ha caído e incluso las estrellas mueren. Ahora, los señores feudales gobiernan los mundos conocidos, compitiendo por el poder con sacerdotes fanáticos y gremios intrigantes.
              - list [ref=e807]:
                - listitem [ref=e808]: Manual
                - listitem [ref=e812]: "1995"
              - generic [ref=e816]: Ciencia Ficción
        - article [ref=e817]:
          - link "Fading Suns Character Book — Disponible" [ref=e818] [cursor=pointer]:
            - /url: /ludoteca/rol/fading-suns-character-book
            - generic [ref=e820]:
              - generic [ref=e821]: "3.0"
              - heading "Fading Suns Character Book" [level=3] [ref=e822]
              - paragraph [ref=e823]: "De la contraportada del libro: Una pasión en un futuro lejano Estamos en el sexto milenio. La humanidad se extendió por las estrellas y construyó una república basada en la tecnología avanzada y la emancipación universal… para luego malgastarla, disputársela y perderla. A medida que la luz de las estrellas comenzaba a desvanecerse lentamente, una Nueva Edad Oscura se cernió sobre los Mundos Conocidos. Entonces, de entre las cenizas de la guerra y la ruina, el emperador Alexius ascendió al poder y marcó el comienzo de una nueva era de esperanza. Ahora hace un llamamiento a valientes caballeros, sabios sacerdotes y ingeniosos miembros de gremios para que lleven su paz a todos los mundos, conocidos y desconocidos. El Libro de Personajes presenta el sistema de juego y los personajes de los jugadores de Fading Suns. En el sistema de puntos de victoria, cada jugador utiliza un único dado de 20 caras y un puñado de fichas de puntos de victoria para llevar a cabo las hazañas dramáticas de su personaje ante los vientos del destino. Este libro incluye reglas de creación de personajes para todas las facciones principales, así como equipamiento tecnológico, naves espaciales, poderes psíquicos y ritos teúrgicos."
              - list [ref=e824]:
                - listitem [ref=e825]: Manual
                - listitem [ref=e829]: "2021"
              - generic [ref=e833]: Ciencia Ficción
        - article [ref=e834]:
          - link "Fading Suns Faction Book — Disponible" [ref=e835] [cursor=pointer]:
            - /url: /ludoteca/rol/fading-suns-faction-book
            - generic [ref=e837]:
              - generic [ref=e838]: "2.0"
              - heading "Fading Suns Faction Book" [level=3] [ref=e839]
              - paragraph [ref=e840]: "De la contraportada del libro: El anhelo de ascender Las Casas Reales, la Iglesia y la Liga Mercantil conspiran para controlar todas las vías del poder. A pesar de siglos de dominio, no logran controlarlo todo. Todavía existen varias casas nobiliarias menores que se aferran a feudos cada vez más reducidos y a títulos en decadencia, resistiéndose a los intentos de otras casas de absorberlas. Las órdenes y sectas más pequeñas se esfuerzan por ganar adeptos entre los desamparados, los olvidados y los herejes. Los gremios menores se ganan la vida a duras penas a la sombra de los gigantes de la Liga, vendiendo mercancías y servicios que los grandes gremios ignoran. Y algunas de estas facciones menores están formadas por alienígenas: los gannok simios, los shantor ungulados, los etyri aviares, los oro'ym anfibios, los ascorbites insectoides y los hironem reptilianos. En la Pax Alexius, cualquiera de ellos podría aún alzarse por encima de sus rivales y reclamar voz y voto en el destino del imperio. El Libro de las Facciones presenta las casas menores (desde Eldrid hasta Xanthippe), las sectas menores (desde los Chorali hasta los Preceptores) y los gremios menores (desde los Boticarios hasta los Wranglers) del universo de Fading Suns. Aquí también se incluyen los paganos (zuranistas y gjartinos), las especies alienígenas sensibles de los Mundos Conocidos (desde los ascorbitas hasta los shantor) y los «Cambiados», los mutantes genéticamente modificados despreciados por la población supersticiosa debido a sus extraordinarias dotes."
              - list [ref=e841]:
                - listitem [ref=e842]: Manual
                - listitem [ref=e846]: "2021"
              - generic [ref=e850]: Ciencia Ficción
        - article [ref=e851]:
          - link "Fading Suns. Feudos de la Iglesia — Disponible" [ref=e852] [cursor=pointer]:
            - /url: /ludoteca/rol/fading-suns-feudos-de-la-iglesia
            - generic [ref=e854]:
              - heading "Fading Suns. Feudos de la Iglesia" [level=3] [ref=e855]
              - paragraph [ref=e856]: "Nadie puede quedarse entre la Luz y la Oscuridad. Vivir es escoger: la Búsqueda de la Luz o ser envuelto por la Oscuridad. El Emperador Alexius ha enviado a sus Caballeros de la Búsqueda a recopilar informació por todos los rincones de los Mundos Conocidos sobre el estado de su Imperio. Este volumen está dedicado a los Feudos de la Iglesia, hogar de los Sacerdotes del Sol Celestial. Aunque la Iglesia se mantiene unida contra los poderes del Emperador, las Casas Reals y la Liga Mercantil, sus miembros rivalizan entre sí en sus catedrales, rivalizando por el dominio sobre los fieles."
              - list [ref=e857]:
                - listitem [ref=e858]: Manual
                - listitem [ref=e862]: "2017"
              - generic [ref=e866]: Fantasía
        - article [ref=e867]:
          - link "Fading Suns Game Master's Guide — Disponible" [ref=e868] [cursor=pointer]:
            - /url: /ludoteca/rol/fading-suns-game-master-s-guide
            - generic [ref=e870]:
              - generic [ref=e871]: "8.0"
              - heading "Fading Suns Game Master's Guide" [level=3] [ref=e872]
              - paragraph [ref=e873]: "De la contraportada del libro: «Adversarios mortales... Mundos llenos de peligro... Oscuridad por doquier...» En los albores del sexto milenio d. C., un emperador ha reclamado el Trono del Fénix y ha unificado los Mundos Conocidos tras tres décadas de guerra civil interestelar. Sin embargo, la paz es precaria y muchas fuerzas amenazan al Imperio: nobles ambiciosos luchan por aumentar su poder; comerciantes codiciosos se aferran a la riqueza; sacerdotes sedientos de poder sueñan con una teocracia; repugnantes antinomistas trafican con poderes oscuros; culturas bárbaras se preparan para invadir; alienígenas resentidos buscan venganza por milenios de opresión humana; y un sinfín de otros. Los propios soles siguen desvaneciéndose, y pocos se atreven a esperar que el Fénix renaciente pueda detener la marea de la oscuridad. La Guía del director de juego revisada de Fading Suns contiene las reglas para adversarios, venenos y peligros, así como descripciones de los Mundos Conocidos, un drama introductorio para poner en marcha una campaña y mucho más."
              - list [ref=e874]:
                - listitem [ref=e875]: Manual
                - listitem [ref=e879]: "2014"
              - generic [ref=e883]: Ciencia Ficción
        - article [ref=e884]:
          - 'link "Fading Suns: Players Companion — Disponible" [ref=e885] [cursor=pointer]':
            - /url: /ludoteca/rol/fading-suns-players-companion
            - generic [ref=e887]:
              - generic [ref=e888]: "7.4"
              - 'heading "Fading Suns: Players Companion" [level=3] [ref=e889]'
              - paragraph [ref=e890]: "De la editorial: Esta extensa obra, una valiosa ampliación de las reglas de Fading Suns, incluye nuevas bendiciones y maldiciones, beneficios y aflicciones, habilidades, poderes ocultos, armas, equipamiento y valiosas ampliaciones de las reglas. Además, hay nuevos roles para los personajes: órdenes de caballería, sectas eclesiásticas, nuevas religiones, gremios, unidades militares, detalles sobre razas alienígenas inteligentes y los «Changed», seres modificados genéticamente. ¡Imprescindible para jugadores y directores de juego!"
              - list [ref=e891]:
                - listitem [ref=e892]: Manual
                - listitem [ref=e896]: "1997"
