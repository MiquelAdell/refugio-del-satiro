        - article [ref=e1803]:
          - link "Shadowrun — Disponible" [ref=e1804] [cursor=pointer]:
            - /url: /ludoteca/rol/shadowrun
            - generic [ref=e1806]:
              - generic [ref=e1807]: "7.2"
              - heading "Shadowrun" [level=3] [ref=e1808]
              - paragraph [ref=e1809]: "Estamos en el año 2060. La magia es tan real como las peligrosas calles de las megaciudades. Las corporaciones llevan la batuta mientras se atacan entre sí mediante agentes encubiertos en una competencia despiadada. La carne y las máquinas se han fusionado: el samurái callejero con sus armas inteligentes y sus reflejos increíblemente rápidos, el decker que puede conectar su propio cerebro a la red informática mundial, el rigger que vincula su mente a su vehículo y toma curvas cerradas a velocidades de vértigo. Y tú formas parte de este mundo conectado, donde los rascacielos corporativos brillan sobre las oscuras sombras que proyectan. Tú vives en esas sombras. Eres un shadowrunner: un agente callejero. Puedes ser humano o troll, enano o elfo. Puedes lanzar bolas de fuego, sacar tu fiel Uzi o burlar la seguridad informática con un programa tan elegante y letal como un estilete. Pase lo que pase, cumples con tu trabajo. Eres un shadowrunner: un profesional. No solo sobrevives en las sombras, sino que prosperas en ellas… por ahora. Shadowrun, Tercera Edición es un libro de reglas completo para directores de juego y jugadores. Contiene todas las reglas necesarias para crear personajes y aventuras continuadas ambientadas en el popular universo de Shadowrun. Shadowrun, Tercera Edición actualiza, revisa, amplía y aclara las reglas de los anteriores manuales de Shadowrun. Es compatible con las versiones anteriores de Shadowrun y con el material de referencia de Shadowrun publicado anteriormente. Shadowrun, Tercera Edición es un manual completo de reglas para directores de juego y jugadores. Contiene todas las reglas necesarias para crear personajes y aventuras continuadas ambientadas en el popular universo de Shadowrun. Shadowrun, tercera edición, actualiza, revisa, amplía y aclara las reglas de los manuales anteriores de Shadowrun. Es compatible con las versiones anteriores de Shadowrun y con el material de referencia de Shadowrun publicado anteriormente."
              - list [ref=e1810]:
                - listitem [ref=e1811]: Manual
                - listitem [ref=e1815]: "1998"
              - generic [ref=e1819]: Fantasía Urbana
        - article [ref=e1820]:
          - link "sLAng — Disponible" [ref=e1821] [cursor=pointer]:
            - /url: /ludoteca/rol/slang
            - generic [ref=e1823]:
              - generic [ref=e1824]: "7.7"
              - heading "sLAng" [level=3] [ref=e1825]
              - paragraph [ref=e1826]: CONTRAPORTADA La ciudad de Los Ángeles es una jungla de asfalto que el crimen organizado ha convertido en su feudo. Las calles son el territorio de guerra de las bandas, enfrentadas a muerte por la defensa de sus colores y el control del tráfico de drogas, mientras los señores del crimen mueven los hilos en las sombras y la policía, impotente y corrupta, observa como el sueño americano se ha convertido en una pesadilla. Desde las peligrosas calles de Compton hasta las lujosas mansiones de Bel Air una difusa línea separa la posibilidad de una vida mejor de la certeza de una muerte horrible. Es la vida y la muerte en Los Ángeles para los que eligieron quedarse al margen de la ley. FROM THE BACK OF THE BOOK The city of Los Angeles is a concrete jungle that organized crime has become his fief. The streets are war territory bands, faced with death for defending their colors and control of the drug trade, while crime lords movers and shakers in the shadows and the police powerless and corrupt, seen as the American dream has become a nightmare. From the mean streets of Compton to the luxurious mansions of Bel Air a fine line separates the possibility of a better life for the certainty of a horrible death. It's life and death in Los Angeles for those who chose to remain outside the law.
              - list [ref=e1827]:
                - listitem [ref=e1828]: Manual
                - listitem [ref=e1832]: "2006"
              - generic [ref=e1836]: Aventura
        - article [ref=e1837]:
          - 'link "Star Wars: Force and Destiny Core Rulebook — Disponible" [ref=e1838] [cursor=pointer]':
            - /url: /ludoteca/rol/star-wars-force-and-destiny-core-rulebook
            - generic [ref=e1840]:
              - generic [ref=e1841]: "8.1"
              - 'heading "Star Wars: Force and Destiny Core Rulebook" [level=3] [ref=e1842]'
              - paragraph [ref=e1843]: "Descripción del editor: ¡Descubre el poder de la Fuerza en el juego de rol Star Wars®: Force and Destiny™! Como marginado sensible a la Fuerza que lucha por sobrevivir bajo el dominio imperial, podrás llevar la justicia a la galaxia, buscar los restos perdidos de la Orden Jedi o caer presa de las tentaciones del lado oscuro. Tanto si eliges el lado luminoso como el oscuro, te espera un destino poderoso en Force and Destiny."
              - list [ref=e1844]:
                - listitem [ref=e1845]: Manual
                - listitem [ref=e1849]: "2015"
              - generic [ref=e1853]: Ciencia Ficción
        - article [ref=e1854]:
          - link "Tabernas en la Frontera — Disponible" [ref=e1855] [cursor=pointer]:
            - /url: /ludoteca/rol/tabernas-en-la-frontera
            - generic [ref=e1857]:
              - heading "Tabernas en la Frontera" [level=3] [ref=e1858]
              - paragraph [ref=e1859]: "El reino de la humanidad se propaga y expande como una mala hierba invasora. La Fortaleza se alzaba antaño en los márgenes de la civilización, pero ahora es un centro de cultura y comercio. Las fronteras están cada vez más lejos, pero la Fortaleza perdura. Hoy comienza una semana de festividades. Sin embargo, la celebración no ofrece ningún consuelo. La Monarca yace moribunda a causa de un veneno mortal, pero de acción lenta. La Monarca ha vaciado las arcas reales para comprar un poderoso antídoto, pero éste nunca ha llegado a sus labios. Los caravaneros dicen que debió de mezclarse en las entregas a los numerosos bares de la Fortaleza. Normalmente, la monarca ordenaría al alguacil y a la guardia de la ciudad que fueran de bar en bar, vaciando todos los barriles de cerveza hasta recuperar el antídoto pero durante los Festejos del Caos la guardia de la ciudad cede por completo los poderes y responsabilidades de hacer cumplir la ley a la Iglesia del Caos. Los carteles de la recompensa cubren la Fortaleza prometiendo que quien encuentre el antídoto y lo devuelva a la Monarca se ganará su peso en tesoro, así como una baronía en el territorio recién adquirido de las tierras fronterizas. Y quien esté detrás de la traición también obtendrá su justa recompensa: la guillotina."
              - list [ref=e1860]:
                - listitem [ref=e1861]: Manual
                - listitem [ref=e1865]: "2021"
              - generic [ref=e1869]: Fantasía
        - article [ref=e1870]:
          - link "Taura. Lands of Alchemy — Disponible" [ref=e1871] [cursor=pointer]:
            - /url: /ludoteca/rol/taura-lands-of-alchemy
            - generic [ref=e1873]:
              - generic [ref=e1874]: "6.0"
              - heading "Taura. Lands of Alchemy" [level=3] [ref=e1875]
              - paragraph [ref=e1876]: "Taura: Lands of alchemy es un juego de rol, de fantasía oscura renacentista, que guarda en su interior una gran cantidad de información sobre las tierras de Këllon. Adéntrate en los dominios de la alquimia, y descubre un mundo que esconde unas sociedades que olvidaron su pasado, y que viven ahogadas en la corrupción, y la decadencia. Un mundo en el que nada es lo que parece, y que se enrosca en torno a un intrincado hilo argumental que te atrapará con sus giros y revelaciones. En el interior de este manual encontrarás un vasto, y absorvente, continente desarrollado con todo lujo de detalles, desde las originales razas que lo pueblan hasta el último rincón de la geografía. Alquimia, escuelas de esgrima, duelos, y cultos con personalidad propia, son sólo la punta del iceberg. Este manual ha sido documentado por la Asociación Española de Esgrima Antigua, y nominado a los Premios Poliedro 2010 como mejor juego español publicado en castellano, mejor ambientación, y mejor arte interior, y ha sido ganador de la mención especial del público, y la librea de plata, en los Premios Armagedón 2010. En cuanto al sistema de juego, el DKROL ADVANCE es un sistema de juego sencillo, ágil, y dinámico, que se adapta automáticamente a todas las mecánicas de juego. Destaca por la enorme libertad de creación de personajes que pone en manos de los jugadores, el gran poder narrativo que se le pueden conferir a los combates, y su revolucionario sistema de lanzamiento de conjuros espontáneos. (From the Back of the book)"
              - list [ref=e1877]:
                - listitem [ref=e1878]: Manual
                - listitem [ref=e1882]: "2010"
              - generic [ref=e1886]: Fantasía
        - article [ref=e1887]:
          - link "Técnicas, consejos y trucos para jugar a rol — Disponible" [ref=e1888] [cursor=pointer]:
            - /url: /ludoteca/rol/tecnicas-consejos-y-trucos-para-jugar-a-rol
            - generic [ref=e1890]:
              - heading "Técnicas, consejos y trucos para jugar a rol" [level=3] [ref=e1891]
              - paragraph [ref=e1892]: "Publisher Blurb: «Jugar a rol es fácil, comencemos desde este punto y convirtámoslo en un pilar». Este libro es para todo el mundo. Para aquellas personas que quieren empezar. Para las que quieren continuar. Para las que quieren vivirlo con intensidad. Para las que prefieren sentarse a jugar. Para las que gustan de la sencillez. Para las que quieren complejidad. Para las que juegan cuando pueden. Para las que juegan todas las semanas. Para las que no han leído manuales. Para las que los han leído todos. Para jugar como quieras. Para rolear como quieras. Para todas. Este libro destila la amplia experiencia de su autor, Sirio Sesenra, para que disfrutéis sin complicaciones. Es para vosotros, jugadores. Y también para vosotros, directores de juego. O incluso por puro placer de reflexión. Y lo hace de una manera cercana, comprensiva, clara, concisa y empática. ¿Cómo lo consigue? LAS TÉCNICAS «La primera norma es: créete esta mierda. La segunda norma es: haz que se lo crean». Las técnicas son maneras de enfrentar diferentes situaciones para conseguir que los demás vean y vivan lo mismo que tú. Poder llevarles de la mano y ayudarles a que te lleven de la suya. LOS CONSEJOS «Este libro no te enseñará a “jugar mejor”, solo te ofrecerá trucos y consejos para enriquecer tu arsenal de recursos roleros». Todo aquello que entra en un plano más subjetivo, y que tiene que ver más con entender la visión del autor que con herramientas concretas para momentos precisos. LOS TRUCOS «Consideremos un truco rolero como un ardid o una habilidad que emplearemos para alcanzar un fin: aumentar la diversión». Sirio Sesenra lleva años utilizando pequeñas perlas que, con poco esfuerzo y preparación, hacen que tus partidas lleguen más, tus descripciones luzcan mejor y los momentos sean más memorables. ¿Te lo vas a perder?"
              - list [ref=e1893]:
                - listitem [ref=e1894]: "2022"
              - generic [ref=e1898]: Generic / Universal
        - article [ref=e1899]:
          - 'link "The End of the World: Wrath of the Gods — Disponible" [ref=e1900] [cursor=pointer]':
            - /url: /ludoteca/rol/the-end-of-the-world-wrath-of-the-gods
            - generic [ref=e1902]:
              - generic [ref=e1903]: "7.3"
              - 'heading "The End of the World: Wrath of the Gods" [level=3] [ref=e1904]'
              - paragraph [ref=e1905]: "Descripción de la editorial: Extrañas criaturas humanoides, que apestan a algas, salen tambaleándose de los océanos de la Tierra mientras un horror insoportable surge de R'lyeh. El gigantesco lobo Fenrir despierta bajo la cordillera de los Escandinavos, mientras Jörmungandr, la serpiente del mundo, se retuerce al salir del Pacífico. Los terremotos sacuden el mundo mientras la propia Tierra intenta erradicar a la humanidad. Lo sobrenatural se ha entrelazado irrevocablemente con lo físico, y necesitarás todas tus habilidades y talentos solo para sobrevivir un día más. ¡El mundo temblará bajo la ira de los dioses! ¡Lo sobrenatural irrumpe en el mundo físico en *La ira de los dioses*, el segundo libro de la línea de juegos de rol *El fin del mundo*! Con los escenarios incluidos en este libro, podrás alzar las armas junto a los héroes de antaño y los dioses nórdicos, o huir del terror alucinante de Cthulhu. Podrás esconderte de los Cuatro Jinetes mientras se desarrollan los acontecimientos del Apocalipsis, hablar con Quetzalcóatl a medida que se desata el apocalipsis maya, o luchar contra bestias salvajes mientras la propia Tierra se vuelve contra nosotros. ¡«La ira de los dioses» te acerca tanto como sea posible (y seguro) a los poderes sobrenaturales que acabarán con la civilización! Este juego de rol te ofrece la oportunidad de jugar como tú mismo en medio del tumulto del apocalipsis, utilizando un elegante sistema de reglas narrativo. «La ira de los dioses» contiene cinco escenarios únicos, cada uno de los cuales ofrece una visión diferente del fin de la humanidad a manos de la ira divina. Cada escenario incluye además una fase de apocalipsis y una fase postapocalíptica, lo que te permite sobrevivir al pánico inicial y labrarte un camino en la vida tras el fin del mundo."
              - list [ref=e1906]:
                - listitem [ref=e1907]: Manual
                - listitem [ref=e1911]: Aventura
                - listitem [ref=e1915]: "2015"
              - generic [ref=e1919]: Horror
        - article [ref=e1920]:
          - link "The Inner Sea World Guide — Disponible" [ref=e1921] [cursor=pointer]:
            - /url: /ludoteca/rol/the-inner-sea-world-guide
            - generic [ref=e1923]:
              - generic [ref=e1924]: "8.1"
              - heading "The Inner Sea World Guide" [level=3] [ref=e1925]
              - paragraph [ref=e1926]: "De la contraportada del libro: El mejor de los mundos posibles ¡Descubre el mundo de Golarion, el escenario oficial de la exitosa campaña del juego de rol Pathfinder! Una época de profecías perdidas se apodera del mundo, trayendo consigo una vorágine interminable, una grieta en el tejido de la realidad, una oleada de diabolismo y la amenaza constante de la guerra. Sin embargo, no todo está perdido, pues estos tiempos oscuros ofrecen amplias oportunidades para la aventura y el heroísmo. En este emocionante e informativo tomo encontrarás: Resúmenes detallados de las razas de personajes de jugador originarias de Golarion, incluidas más de una docena de etnias humanas distintas. Elaborados compendios de más de 40 imperios en decadencia, reinos expansionistas, ciudades-estado independientes y tierras salvajes plagadas de monstruos de la región del Mar Interior de Golarion, repleta de aventuras, con localizaciones perfectas para casi cualquier tipo de campaña de fantasía. Información cultural y reglas del juego de rol Pathfinder que abarcan las 20 deidades principales del Mar Interior, además de entradas sobre otros dioses, semidioses, deidades olvidadas, cultos extraños, filosofías insólitas y mucho más. ¡Una visión general de la historia del Mar Interior, una mirada al tiempo y al espacio, un análisis de los artefactos mágicos y las maravillas tecnológicas, análisis de facciones y organizaciones importantes, y cientos de lugares perfectos para la aventura! ¡Montones de nuevas opciones para los personajes de los jugadores, incluyendo clases de prestigio, dotes, hechizos, equipo de aventura y objetos mágicos inspirados en el Mar Interior! ¡Nueve nuevos monstruos, entre los que se incluyen humanoides exóticos de los cielos y los mares, muertos vivientes y dragones, y un furioso señor demoníaco en el exilio! ¡Un póster gigante con un mapa que revela el extenso paisaje del Mar Interior en todo su traicionero esplendor!"
              - list [ref=e1927]:
                - listitem [ref=e1928]: Manual
                - listitem [ref=e1932]: "2011"
              - generic [ref=e1936]: Fantasía
        - article [ref=e1937]:
          - link "The Lord of the Rings Roleplaying — Disponible" [ref=e1938] [cursor=pointer]:
            - /url: /ludoteca/rol/the-lord-of-the-rings-roleplaying
            - generic [ref=e1940]:
              - generic [ref=e1941]: "7.5"
              - heading "The Lord of the Rings Roleplaying" [level=3] [ref=e1942]
              - paragraph [ref=e1943]: "Descripción de la editorial: Vuelve a la Tierra Media con «El Señor de los Anillos: Juego de rol»... Basado en «El Anillo Único» (2.ª edición), El juego de rol de El Señor de los Anillos contiene todo lo necesario para crear emocionantes aventuras ambientadas en el mundo de fantasía más popular del mundo: seis culturas heroicas originales de la tierra de Eriador, seis nuevas clases, una gran cantidad de adversarios aterradores y reglas exhaustivas para viajes, consejos, artefactos maravillosos y la sutil magia de la Tierra Media."
              - list [ref=e1944]:
                - listitem [ref=e1945]: Manual
                - listitem [ref=e1949]: "2022"
              - generic [ref=e1953]: Fantasía
        - article [ref=e1954]:
          - 'link "The One Ring: Adventures over the Edge of the Wild — Disponible" [ref=e1955] [cursor=pointer]':
            - /url: /ludoteca/rol/the-one-ring-adventures-over-the-edge-of-the-wild
            - generic [ref=e1957]:
              - generic [ref=e1958]: "8.1"
              - 'heading "The One Ring: Adventures over the Edge of the Wild" [level=3] [ref=e1959]'
              - paragraph [ref=e1960]: "Sinopsis de la editorial: «The One Ring: Adventures over the Edge of the Wild» es el nuevo juego de rol basado en «El Señor de los Anillos», la obra más influyente del género fantástico. La historia se desarrolla tras los acontecimientos de *El Hobbit*; la primera edición del juego se centra en la región del norte del Bosque Negro y sus alrededores, y las futuras entregas ampliarán el alcance del escenario para abarcar una mayor parte de la Tierra Media a medida que la era se acerque a la inminente Guerra del Anillo. Repleto de increíbles ilustraciones de los principales artistas tolkienianos, entre ellos John Howe, junto con una información de trasfondo rica y detallada, el sistema de juego de *The One Ring* se centra en los temas y tipos de personajes que otorgan a la Tierra Media su lugar único en los anales de la fantasía. Nunca ha habido un juego de El Señor de los Anillos que evoque mejor la visión única de Tolkien. «The One Ring: Adventures over the Edge of the Wild» sale a la venta en agosto de 2011. La edición básica consta de dos libros principales en una funda de lujo: el «Loremaster’s Book» para los directores de juego y el «Adventurer’s Book» para los jugadores."
              - list [ref=e1961]:
                - listitem [ref=e1962]: Manual
                - listitem [ref=e1966]: "2011"
              - generic [ref=e1970]: Fantasía
        - article [ref=e1971]:
          - link "The Walking Dead Universe Roleplaying Core Rules — Disponible" [ref=e1972] [cursor=pointer]:
            - /url: /ludoteca/rol/the-walking-dead-universe-roleplaying-core-rules
            - generic [ref=e1974]:
              - generic [ref=e1975]: "8.3"
              - heading "The Walking Dead Universe Roleplaying Core Rules" [level=3] [ref=e1976]
              - paragraph [ref=e1977]: "Descripción de la editorial: Cuenta tu propia historia en el universo de «The Walking Dead» con el juego de rol oficial."
              - list [ref=e1978]:
                - listitem [ref=e1979]: Manual
                - listitem [ref=e1983]: "2023"
              - generic [ref=e1987]: Horror
        - article [ref=e1988]:
          - link "The Witcher — Disponible" [ref=e1989] [cursor=pointer]:
            - /url: /ludoteca/rol/the-witcher
            - generic [ref=e1991]:
              - generic [ref=e1992]: "7.1"
              - heading "The Witcher" [level=3] [ref=e1993]
              - paragraph [ref=e1994]: "De la contraportada del libro: ¡En plena Tercera Guerra de Nilfgaard, Geralt de Rivia, el Lobo Blanco, recorre el Continente en busca de rastros de su amor perdido! Pero esta no es la única historia. ¡Hay un millón de historias más que se desarrollan a lo largo y ancho del vasto continente, y tú te encuentras en medio de una de ellas! ¡El juego de rol de papel y lápiz de The Witcher te permite contar tu propia historia en el mundo de The Witcher! ¡Aventúrate por todo el Continente, interactúa con leyendas vivas e influye en la política de la tierra! Lucha en la brutal y espantosa Tercera Guerra de Nilfgaard. ¡O vive tu propia aventura mientras evitas la muerte y la mutilación! Incluye 9 clases únicas: juega como bardos, artesanos, delincuentes, médicos, magos, maestros de armas, comerciantes, sacerdotes y brujos. Un bestiario de monstruos despiadados: recorre la naturaleza salvaje y caza desde el molesto nekker hasta el gigantesco y hipnótico demonio. Numerosos hechizos e invocaciones: recurre a la magia caótica del mundo de The Witcher para invocar tornados, dejar mensajes ocultos y mucho más. Un sistema de combate visceral: la habilidad y la táctica marcan la diferencia, y un movimiento en falso puede suponer la rotura de órganos o algo peor."
              - list [ref=e1995]:
                - listitem [ref=e1996]: Manual
                - listitem [ref=e2000]: "2018"
              - generic [ref=e2004]: Fantasía
        - article [ref=e2005]:
          - link "Usagi Yojimbo Role-Playing Game — Disponible" [ref=e2006] [cursor=pointer]:
            - /url: /ludoteca/rol/usagi-yojimbo-role-playing-game
            - generic [ref=e2008]:
              - generic [ref=e2009]: "7.6"
              - heading "Usagi Yojimbo Role-Playing Game" [level=3] [ref=e2010]
              - paragraph [ref=e2011]: "De la contraportada del libro: Vive la aventura por ti mismo... Inspirado en la aclamada serie de cómics, ganadora del premio Eisner, el juego de rol USAGI YOJIMBO te ofrece el misterio, la maravilla y la gloria del Japón feudal. Aunque los estados beligerantes han alcanzado la paz bajo la atenta mirada del shogún, el peligro sigue acechando en forma de bandidos codiciosos, señores feudales intrigantes e incluso horrores sobrenaturales. Pero una casa que acumula maldad tras maldad no puede perdurar... Más que un simple libro de referencia para los personajes y las historias de Usagi, este juego destaca por ser una combinación de narración y juego de rol. Empieza por lo sencillo y luego ve añadiendo más habilidades, poderes y capacidades; incluso puedes cambiar las antiguas por otras nuevas a medida que tu personaje evoluciona y crece hasta convertirse en el héroe que tú mismo creas. Asume el papel de un valiente guerrero samurái, un astuto ninja, un sabio sacerdote o incluso un simple granjero destinado a la gloria. Lucha contra las fuerzas de la corrupción, la desesperación y el mal. Cruza espadas con docenas de enemigos o enfréntate en duelo a un único adversario digno: unas reglas sencillas se combinan con las habilidades especiales de tu personaje para que todos los encuentros sean rápidos, decisivos y divertidos. Lucha junto a Usagi, Tomoe y Gennosuke mientras frustran los planes del señor Hikiji y sus secuaces… ¡o crea personajes e historias totalmente nuevos a partir de tu propia imaginación! Este juego te ofrece toda la emoción de la fantástica mezcla de historia y leyenda japonesas de Stan Sakai. Para jugar a este juego, necesitarás lápiz y papel, dados poliédricos (de cuatro, seis, ocho, diez, doce y veinte caras) y este libro."
              - list [ref=e2012]:
                - listitem [ref=e2013]: Manual
                - listitem [ref=e2017]: "2005"
              - generic [ref=e2021]: Fantasía
        - article [ref=e2022]:
          - 'link "Vampire: The Dark Ages — Disponible" [ref=e2023] [cursor=pointer]':
            - /url: /ludoteca/rol/vampire-the-dark-ages
            - generic [ref=e2025]:
              - generic [ref=e2026]: "7.4"
              - 'heading "Vampire: The Dark Ages" [level=3] [ref=e2027]'
              - paragraph [ref=e2028]: "Este es el libro básico de «Vampiro: La Edad Media». Este juego se deriva de «Vampiro: La Mascarada» y, a diferencia de otros juegos ambientados en el Mundo de las Tinieblas, no se desarrolla en la época moderna, sino en la Edad Media. En este juego, los jugadores encarnan a vampiros (los Cainitas). Libran sus propias guerras por el poder, al tiempo que intentan no dejarse llevar por la Bestia. Durante la Edad Media, los vampiros siguen siendo menos cautelosos de lo que lo son en épocas posteriores. Y, a menudo, no necesitan serlo. Los humanos están mucho menos organizados; lo que ocurre en una cabaña aislada tiene menos probabilidades de llamar la atención que algo que suceda en un bloque de pisos del siglo XX. No hay enemigos con armas de alta tecnología. Por otro lado, también hay mucho que temer. Hay pocos lugares donde esconderse del sol. La civilización no ha ganado tanto terreno a la naturaleza salvaje, y los hombres lobo abundan en esa naturaleza salvaje. Además, por la noche ocurre muy poco. Hay pocas tiendas que abastezcan a los vampiros, y las actividades nocturnas de los Cainitas tienen muchas más probabilidades de llamar una atención no deseada. Este libro trata principalmente de los diferentes personajes que un jugador puede crear. Las habilidades de un personaje vienen determinadas en gran medida por su clan, que es el mismo que el del vampiro que lo engendró. Para el «abrazo» —la creación de un nuevo vampiro—, un vampiro suele seleccionar a una persona que encaje en su clan. Otro aspecto importante es el Camino que seguirá el personaje: el código mortal al que se adhiere y que le impide ceder a la Bestia y convertirse en un monstruo sin razón."
              - list [ref=e2029]:
                - listitem [ref=e2030]: Manual
                - listitem [ref=e2034]: "1996"
              - generic [ref=e2038]: Horror
        - article [ref=e2039]:
          - 'link "Vampiro: La Mascarada (20 aniversario) — Disponible" [ref=e2040] [cursor=pointer]':
            - /url: /ludoteca/rol/vampiro-la-mascarada-20-aniversario
            - generic [ref=e2042]:
              - generic [ref=e2043]: "8.1"
              - 'heading "Vampiro: La Mascarada (20 aniversario)" [level=3] [ref=e2044]'
              - paragraph [ref=e2045]: "De la página web de la editorial: ¿A quién va dirigido? Este libro está dedicado a todos los seguidores de White Wolf que han vivido, amado y recorrido este largo camino con nosotros durante las últimas dos décadas. A los incondicionales que nunca se rindieron, nunca dejaron de creer y mantuvieron vivo el Mundo de las Tinieblas. Esto va dirigido a todos los santos, pecadores, malhechores, gamberros, poetas y marginados que han estado con nosotros todo este tiempo. Esta es su «Mascarada» original en todo su esplendor, y nuestra forma de darles las gracias y darles la bienvenida a casa. ¿Qué incluye? Los trece clanes originales, variantes de clanes y linajes, con sus Disciplinas características actualizadas a partir de las reglas de juego de mesa de *Vampiro: La Mascarada - Revisada* Reglas para la creación y el desarrollo de personajes, desde Neonato hasta Matusalén Todas las Disciplinas, desde el nivel uno hasta el nueve Escenario actualizado a las noches modernas Nuevas ilustraciones originales a todo color de Tim Bradstreet y otros artistas clásicos de «La Mascarada» Un proceso de desarrollo basado en una «prueba de juego abierta a la comunidad»"
              - list [ref=e2046]:
                - listitem [ref=e2047]: Manual
                - listitem [ref=e2051]: "2011"
              - generic [ref=e2055]: Horror
        - article [ref=e2056]:
          - link "Virtual Realities 2.0 — Disponible" [ref=e2057] [cursor=pointer]:
            - /url: /ludoteca/rol/virtual-realities-2-0
            - generic [ref=e2059]:
              - generic [ref=e2060]: "7.0"
              - heading "Virtual Realities 2.0" [level=3] [ref=e2061]
              - paragraph [ref=e2062]: La segunda edición amplió las reglas de Matrix. Se suman a las reglas del libro básico y añaden numerosas opciones y habilidades (además de equipamiento).
              - list [ref=e2063]:
                - listitem [ref=e2064]: Manual
                - listitem [ref=e2068]: "1995"
              - generic [ref=e2072]: Fantasía Urbana
        - article [ref=e2073]:
          - link "Void in the Heavens — Disponible" [ref=e2074] [cursor=pointer]:
            - /url: /ludoteca/rol/void-in-the-heavens
            - generic [ref=e2076]:
              - generic [ref=e2077]: "6.6"
              - heading "Void in the Heavens" [level=3] [ref=e2078]
              - paragraph [ref=e2079]: "Una aventura ambientada en las tierras del Escorpión. Contraportada: Los Cinco Oráculos se cuentan entre las criaturas más poderosas de Rokugan. Son seres ajenos a este mundo, desprovistos de emociones, por encima de las mezquinas intrigas políticas del Imperio y dotados del corazón de un Dragón Celestial. Cada uno de ellos es elegido por su predecesor para asumir la carga de la inmortalidad. Al recibir una parte del alma del Dragón para cuidar de ella, renuncian a todos los recuerdos y vínculos con su pasado. Los elegidos deben dejar atrás su vida mortal y dedicarse al estudio y la contemplación, para iluminar el alma del Dragón. Olvidan su pasado humano y se funden con el Corazón del Dragón. Ya no sienten los dolores de la ira, el dolor, la venganza… ni el amor. Hasta ahora. El Oráculo del Fuego se ha vuelto loco, gritando a través de los cielos sobre Shiro no Shosuro, haciendo llover muerte y fuego sobre las provincias del Escorpión. Si no se le detiene, las tierras en un radio de mil li quedarán reducidas a cenizas y carbón, ardiendo bajo los cielos como un sacrificio a la locura del Oráculo. Solo los samuráis más valientes se atreven a enfrentarse a un Dragón. Orientada a la acción, llena de intriga y peligro, esta aventura ofrece una visión del misterio y la magia de los Oráculos de Rokugan, así como del impresionante poder de los Dragones Celestiales a los que sirven. Apto para personajes de nivel bajo a medio de todos los clanes. Requiere un ejemplar de las reglas básicas de La Leyenda de los Cinco Anillos. El Camino del Escorpión es opcional, pero recomendable."
              - list [ref=e2080]:
                - listitem [ref=e2081]: Aventura
                - listitem [ref=e2085]: "1999"
              - generic [ref=e2089]: Fantasía
        - article [ref=e2090]:
          - 'link "Walhalla: El Juego de Rol de la Plena Edad Media — Disponible" [ref=e2091] [cursor=pointer]':
            - /url: /ludoteca/rol/walhalla-el-juego-de-rol-de-la-plena-edad-media
            - generic [ref=e2093]:
              - generic [ref=e2094]: "8.3"
              - 'heading "Walhalla: El Juego de Rol de la Plena Edad Media" [level=3] [ref=e2095]'
              - paragraph [ref=e2096]: "From editor web: Walhalla is the RPG of the High Middle Ages. For him marches the melting pot of civilizations who lived and fought in Europe, the Middle East and North Africa between the ninth and twelfth centuries. Of these, the nation of ancient Scandinavian pride of place in our manual. De la web de los productores: Walhalla es el juego de rol de la Plena Edad Media. Por él desfila el crisol de civilizaciones que convivieron y se enfrentaron en Europa, Próximo Oriente y Norte de África entre los siglos IX y XII. De todas ellas, la nación de los antiguos escandinavos ocupa un lugar preferente en nuestro manual."
              - list [ref=e2097]:
                - listitem [ref=e2098]: Manual
                - listitem [ref=e2102]: "2015"
              - generic [ref=e2106]: Histórico
        - article [ref=e2107]:
          - link "Warhammer Fantasy Roleplay — Disponible" [ref=e2108] [cursor=pointer]:
            - /url: /ludoteca/rol/warhammer-fantasy-roleplay
            - generic [ref=e2110]:
              - generic [ref=e2111]: "7.8"
              - heading "Warhammer Fantasy Roleplay" [level=3] [ref=e2112]
              - paragraph [ref=e2113]: "De la contraportada: «El Viejo Mundo. A simple vista, es un lugar civilizado y culto, donde solo alguna que otra conspiración, asesinato, revolución o invasión por parte de orcos, goblins, hombres-bestia o mutantes perturba el orden feudal. Sin embargo, una sombra se cierne sobre el mundo, proyectada por la mano corruptora del Caos. Desde la corte imperial de Altdorf hasta la costa del sur de Tilea, plagada de piratas, unos pocos héroes se esfuerzan por contener las fuerzas del aullante Caos, mientras sus siervos ocultos traman desde dentro para doblegar al mundo ante los Dioses Oscuros»."
              - list [ref=e2114]:
                - listitem [ref=e2115]: Manual
                - listitem [ref=e2119]: "1986"
              - generic [ref=e2123]: Fantasía
        - article [ref=e2124]:
          - link "Warhammer Fantasy Roleplay — Disponible" [ref=e2125] [cursor=pointer]:
            - /url: /ludoteca/rol/warhammer-fantasy-roleplay-2
            - generic [ref=e2127]:
              - generic [ref=e2128]: "8.0"
              - heading "Warhammer Fantasy Roleplay" [level=3] [ref=e2129]
              - paragraph [ref=e2130]: "De la contraportada: «LA AVENTURA TE ESPERA...» «El Viejo Mundo. Un lugar oscuro y sombrío, lleno de peligros y devastado por la guerra. Desde las bulliciosas ciudades del Imperio hasta los bosques habitados por elfos, pasando por los elevados riscos de las montañas del Borde del Mundo, donde los enanos luchan contra los goblins y sus viles parientes, una sombra se cierne sobre el mundo, proyectada por la oscura y corruptora mano del Caos. A lo largo de todas sus fronteras, la mayor nación del Viejo Mundo, el Imperio, intenta contener esta marea oscura. Pero incluso dentro del Imperio hay enemigos. Cultistas retorcidos buscan provocar la caída del Imperio, hombres-bestia despiadados acechan en los bosques y los repugnantes hombres-rata Skaven propagan la peste y la enfermedad desde sus guaridas subterráneas. En Warhammer Fantasy Roleplay, sois héroes improbables en un mundo sombrío de aventuras peligrosas. Os adentráis en los rincones más oscuros del Imperio y os enfrentáis a las amenazas que otros no pueden o no quieren afrontar. Probablemente moriréis solos en algún antro infernal y purulento, pero tal vez, solo tal vez, sobreviváis a los repugnantes mutantes, a las horribles enfermedades, a las tramas insidiosas y a los rituales que destruyen la cordura para cosechar las recompensas del Destino. «Warhammer Fantasy Roleplay es un juego completo. Todo lo que necesitas para jugar es este libro, unos dados y un grupo de amigos. Entre estas tapas encontrarás: • Un sistema rápido para la creación de personajes. Puedes crear un personaje en menos de media hora y lanzarte directamente al juego. • Un conjunto de reglas sencillo pero sólido que te permite gestionar todo, desde la interacción social hasta las mutaciones del Caos. • Un sistema único de progresión de personajes basado en profesiones y más de 100 profesiones, desde Asesino y Recogedor de Huesos hasta Cazador de Trolls y Fanático. • Reglas completas sobre magia, que abarcan tanto las Órdenes Arcanas como las Divinas, y más de 175 hechizos. El poder está a tu alcance, ¡pero ten cuidado con la maldición de Tzeentch! • Detalles sobre el Imperio y el Viejo Mundo, desde el orden social hasta la religión y las creencias. • Una aventura introductoria completa: «A través del Drakwald». • Un nuevo relato corto del reconocido autor de «Gaunt’s Ghosts», Dan Abnett. «BIENVENIDOS AL JUEGO DE ROL DEL MUNDO DE WARHAMMER... ¡LA MUERTE Y LA GLORIA OS ESPERAN!»"
              - list [ref=e2131]:
                - listitem [ref=e2132]: Manual
                - listitem [ref=e2136]: "2005"
              - generic [ref=e2140]: Fantasía
        - article [ref=e2141]:
          - 'link "Werewolf: The Apocalypse (20th Anniversary Edition) — Disponible" [ref=e2142] [cursor=pointer]':
            - /url: /ludoteca/rol/werewolf-the-apocalypse-20th-anniversary-edition
            - generic [ref=e2144]:
              - generic [ref=e2145]: "8.4"
              - 'heading "Werewolf: The Apocalypse (20th Anniversary Edition)" [level=3] [ref=e2146]'
              - paragraph [ref=e2147]: "De la introducción: Quienes tengáis este libro entre las manos probablemente no necesitéis que os presente «Hombre Lobo: El Apocalipsis». Ya conocéis el horror salvaje y la exultación gozosa de la Furia. Conocéis la tragedia de un pueblo guerrero que se volvió contra los suyos, y la última esperanza que aún arde mientras sus corazones conserven la voluntad de luchar. Conocéis la gloria de la lucha contra un dios de la Entropía y la Corrupción, y el triunfo de salvar aunque solo sea un pequeño alma mortal. Conocéis el dolor de un mundo y la belleza del espíritu. Este libro es para vosotros. Hombre Lobo: El Apocalipsis —Edición del 20.º Aniversario—. La profecía del Fénix se cumplirá. La naturaleza de la bestia. Hace veinte años, un juego sobre hombres lobo irrumpió en las estanterías como un martillazo. Nadie sabía muy bien qué esperar. «Vampiro: La Mascarada» había aludido a los hombres lobo: sabíamos que existían, que eran terriblemente fuertes y que odiaban a los vampiros. Y, por supuesto, sabíamos qué esperar de las películas de hombres lobo: criaturas que enloquecían a la luz de la luna llena. Pero tenía que haber algo más que eso, ¿verdad? Y lo había. Había mucho más. Mientras que los vampiros se agrupaban en clanes, los hombres lobo formaban tribus. Nacían de humanos o de lobos, o de ninguno de los dos. Y aunque eran, en todos los sentidos, los monstruos físicamente poderosos y aterradores que esperábamos, también eran increíblemente espirituales. «Hombre Lobo» abrió una faceta completamente nueva del Mundo de las Tinieblas: el mundo espiritual. Seguían odiando a los vampiros, pero se definían por una lucha totalmente nueva, una batalla contra el horror cósmico que incorporaba una reflexión sobre las cosas horribles que los humanos se hacen unos a otros y al mundo en el que vivimos. Incluso aprendimos un nuevo nombre para estas criaturas: los Garou. Han pasado veinte años desde que «Hombre Lobo: El Apocalipsis» se abrió paso a zarpazos en el mundo. A día de hoy, sigue siendo difícil encontrar muchos juegos como este. «Hombre Lobo» es un juego con un enfoque de precisión milimétrica, mezclado con —y casi contradicho por— una notable combinación de componentes. Puede seguir un rumbo estrecho y preciso en la historia de la guerra de una manada o un sept contra el Wyrm, o bien ramificarse hacia historias de política, tragedia, espiritualidad, historia, ecología… la totalidad de la experiencia humana y mucho, mucho más allá. No importa qué te interese como Narrador o como jugador, todo puede ser relevante para la lucha de los Garou. Cómo utilizar este libro: Aunque este libro no incluye todo el material de toda la trayectoria de la línea de juegos, pretende ser lo suficientemente exhaustivo como para abarcar, al menos en parte, todas las áreas del juego. La organización es la siguiente: Capítulo uno: «Un mundo de oscuridad» describe el escenario general, así como los fundamentos de la Nación Garou y su lucha. Capítulo dos: «Los Garou» profundiza en las razas, los auspicios y las tribus que definen lo que significa ser un hombre lobo. Capítulo tres: «Personaje y rasgos» detalla la creación de personajes y los rasgos que definen a un personaje Garou. Capítulo cuatro: «Dones, ritos y fetiches» abarca los numerosos poderes espirituales que otorgan a los Garou una ventaja considerable. Capítulo cinco: «Reglas» proporciona los sistemas básicos de resolución del juego. Capítulo seis: «Sistemas y drama» profundiza en esos fundamentos, ofreciendo subsistemas más detallados para gestionar elementos más complejos del juego, como el combate. Capítulo Siete: «El Mundo de los Espíritus» explora la Umbra, el lado oculto del mundo. Capítulo Ocho: «Narración» es una recopilación de consejos y técnicas para los Narradores, útiles a la hora de preparar y dirigir crónicas apasionantes en el mundo de Hombre Lobo. Capítulo Nueve: Aliados detalla a aquellos que están del mismo bando que los Garou en la guerra, como los espíritus, los Kinfolk y las demás Razas Transformadoras. También ofrece una visión general de las Tribus Perdidas. Por el contrario, el Capítulo Diez: Enemigos es una galería de los peores enemigos a los que se enfrentan los Garou, siervos del Wyrm, del Tejedor y más allá. Por último, el Apéndice añade reglas opcionales diversas y detalles de subfacciones, como los campamentos tribales."
