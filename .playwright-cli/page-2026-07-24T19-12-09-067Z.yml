            - generic [ref=e284]:
              - generic [ref=e285]: "10.0"
              - heading "Aquelarre 2ª ed. rev." [level=3] [ref=e286]
              - paragraph [ref=e287]: "From publisher description: Juego de rol basado en tradiciones legendarias hispanas, ambientado en la Baja Edad Media durante los años 1350/1450. En estos años de están gestando toda una serie de corrientes de pensamiento, que finalmente darán como resultado, mucho más tarde, la aparición del Renacimiento, con nuevos valores y nuevas formas de ver la vida."
              - list [ref=e288]:
