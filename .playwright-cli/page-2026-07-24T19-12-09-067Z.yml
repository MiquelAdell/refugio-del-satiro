                - listitem [ref=e660]: Aventura
                - listitem [ref=e664]: "1984"
              - generic [ref=e668]: Fantasía
        - article [ref=e669]:
          - 'link "Der Eine Ring: Abenteuer am Rande der Wildnis — Disponible" [ref=e670] [cursor=pointer]':
            - /url: /ludoteca/rol/der-eine-ring-abenteuer-am-rande-der-wildnis
            - generic [ref=e672]:
              - generic [ref=e673]: "7.4"
              - 'heading "Der Eine Ring: Abenteuer am Rande der Wildnis" [level=3] [ref=e674]'
              - paragraph [ref=e675]: "Sinopsis de la editorial (en alemán): Smaug ha sido derrotado, se ha ganado la Batalla de los Cinco Ejércitos y Bilbo ha regresado a la Comarca. La Guerra del Anillo aún queda varias generaciones por delante. En estos tiempos relativamente pacíficos, los pueblos libres de las Tierras Salvajes tienen por primera vez la oportunidad de mirar más allá de sus fronteras. Establecen rutas comerciales, renuevan los lazos entre sus culturas y aportan cierta prosperidad a la región situada entre el norte del Bosque Negro, la Montaña Solitaria y las laderas orientales de las Montañas Nubladas. Pero los peligros siguen acechando, y en muchos lugares, desde las cuevas de los orcos en las montañas hasta las profundidades oscuras y siniestras del Bosque Negro, la oscuridad está al acecho, reuniendo sus fuerzas, forjando planes y extendiendo discretamente su sombra... El Anillo Único: Aventuras en los límites de la naturaleza salvaje, el primer libro del sistema, se desarrolla en los alrededores del norte del Bosque Negro; las publicaciones posteriores harán que se pueda jugar en una parte más amplia de la Tierra Media. La trama también se desarrollará (poco a poco) hacia la Guerra del Anillo. Repleto hasta rebosar de increíbles ilustraciones de los principales dibujantes de Tolkien, entre ellos John Howe, y enriquecido con información contextual muy detallada, el sistema de «El Anillo Único» se centra sobre todo en los motivos y personajes que han conferido al mundo de la Tierra Media su lugar único en la literatura fantástica. Nunca ha habido un juego de rol de El Señor de los Anillos que se haya basado con tanta precisión en la visión única de Tolkien. Incluye 2 mapas póster a todo color (aprox. A2) Resumen del usuario: La traducción al alemán de Uhrwerk Verlag se publicó en octubre de 2011 en tapa dura y en una edición limitada de tapa dura con cubierta de imitación de cuero verde y protectores metálicos en las esquinas. De esta última se imprimieron 200 ejemplares numerados."
              - list [ref=e676]:
                - listitem [ref=e677]: Manual
                - listitem [ref=e681]: "2011"
              - generic [ref=e685]: Fantasía
        - article [ref=e686]:
          - link "Drácula vs. Hitler — Disponible" [ref=e687] [cursor=pointer]:
            - /url: /ludoteca/rol/dracula-vs-hitler
            - generic [ref=e689]:
              - heading "Drácula vs. Hitler" [level=3] [ref=e690]
              - paragraph [ref=e691]: "¡Descubre el secreto mejor guardado de la historia! En 1946, nace Helmet Films, una productora de cine cuya verdadera misión es cazar nazis fugitivos. El cine es solo una cortina de humo. En las sombras, monstruos legendarios protagonizan sus películas mientras operan como agentes secretos. ¿Quién sospecharía de Frankenstein, Doctor Jekyll o La cosa del pantano? En Drácula vs. Hitler, te sumergirás en el rol de estos icónicos monstruos del cine clásico. Su verdadera tarea: detener a nazis fugados. Son agentes secretos perfectos, pasando desapercibidos ante los ojos humanos. Drácula vs. Hitler te ofrece reglas para crear escenarios llenos de suspense, una campaña inicial con 3 misiones listas para jugar, 10 monstruos clásicos a los que interpretar y un sinfín de ideas para que diseñes tus propias misiones. ¿Todo preparado para adentrarte en este mundo de espionaje, terror y cine?"
              - list [ref=e692]:
                - listitem [ref=e693]: Manual
                - listitem [ref=e697]: "2024"
              - generic [ref=e701]: Horror
        - article [ref=e702]:
          - link "Dreamraiders — Disponible" [ref=e703] [cursor=pointer]:
            - /url: /ludoteca/rol/dreamraiders
            - generic [ref=e705]:
              - generic [ref=e706]: "6.4"
              - heading "Dreamraiders" [level=3] [ref=e707]
              - paragraph [ref=e708]: "De la web del editor: LA REALIDAD ESTÁ EN JUEGO TUS SUEÑOS SON EL CAMPO DE BATALLA Durante tres largos días, siete mil millones de personas fueron incapaces de dormir. Muchos creen que aquel fenómeno inexplicable fue un incidente aislado; que todo volvió a la normalidad tras acabar aquellas setenta y dos horas de insomnio global. Se equivocan. La Gran Vigilia fue solo el primer disparo en una contienda invisible. Una guerra en la que se decide el destino de nuestra realidad... y en la que tú estás a punto de tomar partido. DREAMRAIDERS es un juego de rol completo que contiene todo lo necesario para embarcar a tus jugadores en un viaje a través de infinidad de mundos oníricos. En él encontrarás... - Un innovador sistema de reglas capaz de plasmar cualquier universo que puedas imaginar, así como los inmensos poderes de creación (y destrucción) al alcance de aquellos que se adentran en el mundo de los sueños. - Una mecánica de juego versátil y completa para los jugadores pero muy ligera de cara al Director de Juego, minimizando su tiempo de cálculos y fórmulas al mínimo, permitiendo que centre toda su creatividad y atención en sus jugadores. - Un sistema de creación (y desarrollo) de personajes que convierte cada sesión de juego en una fuente inagotable de sorpresas. - Una campaña de iniciación donde comienza una guerra invisible que pondrá en jaque la realidad tal y como la conocemos. - Tres modalidades distintas de juego, con reglas adaptadas para cada una de ellas: únete a quienes protegen la realidad del caos (Dreamraiders), toma partido por aquellos que luchan para escapar de ella (Dreamriders) ¡o enfrenta ambas facciones en la modalidad crossover! - Las reglas opcionales Dream&Play que permiten jugar sin Director de Juego de forma prácticamente inmediata y sin apenas preparación previa por parte del grupo de juego. - Soñar Despierto, una aventura introductoria que sienta las bases de lo que, en términos televisivos, sería la “primera temporada” de una serie. From publishers website (Google translated from Spanish to English): REALITY IS AT STAKE YOUR DREAMS ARE THE BATTLEFIELD For three long days, seven billion people were unable to sleep. Many believe that this unexplained phenomenon was an isolated incident; everything returned to normal after finishing those seventy-two hours global insomnia. They are wrong. The Great Vigil was just the first shot in an invisible war. A war in which the fate of our reality ... and decide where you're about to take sides. DREAMRAIDERS is a full RPG containing everything you need for your players embark on a journey through endless dream worlds."
              - list [ref=e709]:
                - listitem [ref=e710]: Manual
                - listitem [ref=e714]: "2013"
              - generic [ref=e718]: Ciencia Ficción
        - article [ref=e719]:
          - link "Dungeon Master's Guide (D&D 3.5e) — Disponible" [ref=e720] [cursor=pointer]:
            - /url: /ludoteca/rol/dungeon-master-s-guide-d-d-3-5e
            - generic [ref=e722]:
              - generic [ref=e723]: "7.2"
              - heading "Dungeon Master's Guide (D&D 3.5e)" [level=3] [ref=e724]
              - paragraph [ref=e725]: "También conocida como «Guía del Dungeon Master 3.5» De la página web de la editorial: Crea emocionantes historias de heroísmo llenas de magia y monstruos. En estas páginas descubrirás las herramientas y opciones que necesitas para crear mundos detallados y aventuras dinámicas que tus jugadores podrán vivir en el juego de rol Dungeons & Dragons. La Guía del Dungeon Master revisada es un libro de reglas imprescindible para los Dungeon Masters del juego D&D. La Guía del Dungeon Master se ha reorganizado para que resulte más fácil de usar. Incluye información sobre cómo dirigir una partida de D&D, arbitrar el juego, escribir aventuras, personajes no jugadores (incluidas las clases de personajes no jugadores), dirigir una campaña, personajes, objetos mágicos (incluidos objetos inteligentes y malditos, y artefactos), y un diccionario de habilidades y condiciones especiales. Se han introducido cambios en las reglas de creación de objetos y en su valoración, y se han incluido clases de prestigio nuevas en la Guía del Dungeon Master (más de 10 clases de prestigio). La revisión incluye consejos ampliados sobre cómo dirigir una campaña e instruye a los jugadores sobre cómo sacar el máximo partido a la línea de miniaturas de D&D relacionada con el juego. Ampliada con: «Building a City»"
              - list [ref=e726]:
                - listitem [ref=e727]: Manual
                - listitem [ref=e731]: "2003"
              - generic [ref=e735]: Fantasía
        - article [ref=e736]:
          - link "Dungeon Master's Guide (D&D 5e) — Disponible" [ref=e737] [cursor=pointer]:
            - /url: /ludoteca/rol/dungeon-master-s-guide-d-d-5e
            - generic [ref=e739]:
              - generic [ref=e740]: "7.9"
              - heading "Dungeon Master's Guide (D&D 5e)" [level=3] [ref=e741]
              - paragraph [ref=e742]: "Descripción de la editorial: Entreten y inspira a tus jugadores «El DMG es el mejor amigo del Dungeon Master. Es el libro que los rige a todos, el conjunto de recursos más completo y potente que se necesita para dirigir una partida de D&D». —Charlie Hall, Polygon En una partida de Dungeons & Dragons, el Dungeon Master (DM) actúa como narrador y crea un mundo lleno de maravillas y retos con los que se enfrentarán los personajes de los jugadores. Tanto si ya diriges una partida de D&D como si estás pensando en probarlo, este libro es para ti. Sumérgete en el juego con D&D Beyond: al comprar una copia digital de este libro, se desbloquea su uso en el compendio y el conjunto de herramientas de D&D BEYOND. D&D BEYOND es el conjunto de herramientas digitales oficial de DUNGEONS & DRAGONS. Crea personajes en cuestión de minutos, juega directamente en tus hojas de personaje con dados digitales y dedica menos tiempo a la preparación y más al juego con herramientas para el Dungeon Master como el «Encounter Builder» y el «Combat Tracker». Juega en Maps, la mesa de juego virtual de D&D BEYOND, sin necesidad de suscripción. Organiza sesiones de juego en docenas de mapas oficiales, o crea los tuyos propios y utiliza nuestras fichas de jugadores y monstruos para llevar tu experiencia de juego al siguiente nivel. Cuenta una historia de aventuras épicas: da comienzo a tu campaña con una introducción emocionante, complica las cosas con dilemas morales y ponle el broche final con un desenlace épico. Este libro te enseñará a crear tramas cautivadoras y a diseñar encuentros de combate equilibrados que sean tan fáciles o letales como tú quieras: desde personajes de nivel 1 recién llegados que se meten en una pelea de bar hasta un grupo de nivel 20 que se enfrenta a un dios-dragón. Crea tu mundo: desde mapas de ciudades hasta sistemas mágicos, la Guía del Dungeon Master está repleta de consejos para la creación de mundos que te ayudarán a dar vida a un mundo rico y cautivador que los aventureros puedan explorar. Crea personajes inolvidables: inventar personajes sobre la marcha es una tarea complicada. Este libro incluye tablas para crear rápidamente personajes no jugadores distintivos con peculiaridades memorables, ideales personales e intrigantes secretos familiares. Crea al villano perfecto: obtén consejos para diseñar al villano perfecto, con ideas para planes oscuros, debilidades clave e incluso opciones de clase especiales. Crea tus propios monstruos: prueba plantillas para crear tus propios monstruos, hechizos, objetos mágicos y mucho más. Descubre tesoros legendarios: algunos aventureros buscan algo más que la gloria. En la Guía del Dungeon Master descubrirás los objetos más codiciados de D&D: armas con conciencia y bolsas de almacenamiento se encuentran entre joyas resplandecientes y anillos mágicos en un tesoro que abarca casi 100 páginas. Herramientas útiles y reglas opcionales: Aunque el Manual del Jugador contiene todas las reglas que necesitas para jugar, la Guía del Dungeon Master ofrece a los DM consejos y herramientas adicionales para dirigir los tres pilares de una partida de D&D: la exploración, la interacción social y el combate. También se incluyen reglas opcionales para los DM que deseen añadir algunos giros a su campaña, con normas para hacer frente a los horrores, utilizar armas de fuego, descifrar tecnología alienígena y mucho más. Nuevas características: Aprende a dirigir una emocionante partida de Dungeons & Dragons (5.ª edición) Objetos mágicos: un tesoro de objetos que tus jugadores podrán descubrir Consejos para crear tu propio mundo, monstruos, hechizos y objetos mágicos Guía para equilibrar los encuentros: haz que el combate sea tan fácil o tan letal como quieras Un recorrido exclusivo para Dungeon Masters por cada plano del multiverso de D&D, desde el Feywild hasta el Shadowfell 1 de los 3 libros de reglas básicos de D&D: el Manual del Jugador (reglas para jugar), la Guía del Dungeon Master (cómo dirigir la partida) y el Manual de Monstruos (criaturas con las que te encontrarás en tu partida)"
