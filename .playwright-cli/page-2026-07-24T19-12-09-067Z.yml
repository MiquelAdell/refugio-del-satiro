              - generic [ref=e235]: "5.5"
              - heading "Altered Carbon - The Roleplaying Game" [level=3] [ref=e236]
              - paragraph [ref=e237]: "Según la sinopsis de la editorial: La mente humana no es más que código digital —«carga humana digital»— guardado y almacenado en una «pila cortical», una tecnología avanzada que te permite «trasladar» toda tu conciencia a un nuevo cuerpo. En el juego de rol oficial de *Altered Carbon*, basado en la exitosa serie de Netflix, ponte cualquier cuerpo que puedas permitirte, transmite tu mente a través del cosmos en un instante y, si dispones de los créditos y el prestigio político necesarios, cambia de cuerpo una y otra vez durante siglos, acumulando a lo largo de los milenios la riqueza y el poder suficientes para convertirte en el equivalente social de un dios inmortal. En el Libro de Reglas Básico encontrarás: Reglas para interpretar arquetipos que van desde la alta sociedad hasta los soldados. Explora la extensa metrópolis de Bay City, tanto en su submundo criminal como en el tan alabado mundo de Aerium, donde viven los meths inmortales. Un sistema de rasgos y tecnología altamente personalizable. Reglas centradas en la narración, que ayudan a crear tensión dramática tanto en el combate como en las intrigas fuera de él. Los medios para transferir la conciencia digital de tus personajes a un nuevo cuerpo en caso de que sufran un final trágico. Enemigos que van desde matones aumentados y desquiciados hasta adversarios políticos astutos y manipuladores. Con el premio de la inmortalidad al alcance de la mano, la pregunta es: ¿qué precio estarás dispuesto a pagar por ella? ¿Qué historias contarás? ¡Te esperan aventuras bañadas en neón!"
              - list [ref=e238]:
                - listitem [ref=e239]: Manual
                - listitem [ref=e243]: "2020"
              - generic [ref=e247]: Ciencia Ficción
        - article [ref=e248]:
          - 'link "Anima: Beyond Fantasy RPG — Disponible" [ref=e249] [cursor=pointer]':
            - /url: /ludoteca/rol/anima-beyond-fantasy-rpg
            - generic [ref=e251]:
              - generic [ref=e252]: "6.9"
              - 'heading "Anima: Beyond Fantasy RPG" [level=3] [ref=e253]'
              - paragraph [ref=e254]: "¡Bienvenidos a las historias sin límites y a los emocionantes juegos de Anima! Diseñado gracias a la colaboración de escritores, diseñadores de juegos y artistas japoneses y europeos, el juego de rol «Anima: Beyond Fantasy» es una fusión de mitos, arte y creencias orientales y occidentales. ¡Todo es posible cuando vas «Más allá de la fantasía»! El juego de rol Anima cuenta con 320 páginas a todo color y magníficamente ilustradas, con reglas, hojas de personaje e información de trasfondo. Incluye todo lo necesario para que los jugadores y los directores de juego puedan empezar a jugar en el mundo de Anima de inmediato: ¡solo tienes que añadir lápices, papel, dados e imaginación!"
              - list [ref=e255]:
