        - article [ref=e2208]:
          - link "World of Darkness — Disponible" [ref=e2209] [cursor=pointer]:
            - /url: /ludoteca/rol/world-of-darkness
            - generic [ref=e2211]:
              - generic [ref=e2212]: "7.3"
              - heading "World of Darkness" [level=3] [ref=e2213]
              - paragraph [ref=e2214]: "Donde las sombras se alargan Vivimos nuestros días sin tener la más mínima idea de los verdaderos terrores que acechan a nuestro alrededor. Solo en contadas ocasiones nuestras experiencias levantan el velo de las sombras y revelan el horror que nos rodea. Estos atisbos de lo sobrenatural pueden llevarnos a refugiarnos en mentiras reconfortantes —«Los monstruos no existen»— o despertar nuestra morbosa curiosidad. Sin embargo, solo unos pocos son capaces de superar su miedo y atreverse a mirar más allá. Abandonad toda esperanza, los que entráis El libro de reglas de World of Darkness presenta una versión de nuestro mundo contemporáneo en la que lo sobrenatural es real. Los jugadores se unen para contar historias de misterio y terror, en las que la temática, la atmósfera y la trama son más importantes para las experiencias de un personaje que sus armas o su equipamiento. En su interior encontrarás reglas para la creación de personajes, la resolución de pruebas, el combate y cualquier actividad que tu personaje intente llevar a cabo mientras se adentra en las sombras. Este es el libro de reglas básico del nuevo juego de rol Mundo de las Tinieblas (WoD) de White Wolf Game Studio, publicado en 2004. Este conjunto de reglas unifica el sistema Storytelling. Para jugar a los nuevos juegos de WoD, necesitas este libro de reglas básico y, si lo deseas, el suplemento correspondiente al escenario en el que quieras jugar, como «Vampiro: El Réquiem», que contiene reglas específicas para ese escenario."
              - list [ref=e2215]:
                - listitem [ref=e2216]: Manual
                - listitem [ref=e2220]: "2004"
