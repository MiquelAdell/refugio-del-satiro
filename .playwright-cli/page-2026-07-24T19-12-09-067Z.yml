            - generic [ref=e1245]:
              - generic [ref=e1246]: "7.6"
              - heading "Kult (1st Edition)" [level=3] [ref=e1247]
              - paragraph [ref=e1248]: La muerte es solo el principio... El traqueteo de las cadenas y un hedor nauseabundo me llevaron por más pasillos, todos con paredes de azulejos esmaltados de un gris apagado. Unos tubos de cristal parpadeantes emitían una luz blanco amarillenta. Mis pies descalzos resbalaban sobre el aceite y la sangre del suelo. Las cucarachas se arrastraban por las grietas entre los azulejos de la pared. A lo lejos, alguien gritaba de agonía... Kult es un juego de rol de terror contemporáneo. Se desarrolla aquí y ahora, en la realidad actual. Pero la realidad no es lo que creemos. A nuestro alrededor, el mundo es oscuro y peligroso, y nada es lo que parece. Nuestra realidad es una ilusión, creada para mantenernos cautivos. Llevamos siglos encarcelados por un creador dictatorial. El mundo verdadero, invisible para nosotros, está gobernado por criaturas que dominan tras las falsas fachadas, nuestros carceleros y torturadores. Los personajes de Kult son héroes oscuros, gobernados por el Destino. Cuando las ilusiones se desvanecen, se enfrentan a la verdadera realidad. En las fronteras entre el terror y la locura, los sueños y la muerte...
