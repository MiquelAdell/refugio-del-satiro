              - heading "Creature Collection" [level=3] [ref=e623]
              - paragraph [ref=e624]: "De la contraportada: Más de 200 nuevos monstruos para las reglas de la 3.ª edición Desde los horribles dragones Wrack hasta los embriagadores gnomos cerveceros, desde el colosal golem de mithril hasta el diminuto duendecillo de la botella, aquí tienes un sinfín de nuevas criaturas para utilizar en tu campaña de la 3.ª edición."
