name: Deploy

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/deploy.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'scraper/**'
      - 'data/**'
      - 'deploy/**'
      - 'Caddyfile'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target (production is only available from main)"
        required: true
        type: choice
        options:
          - production

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'staging' || inputs.target }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy tested development commit to staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          port: ${{ secrets.STAGING_DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGING_DEPLOY_DIR }}"
            git fetch --prune origin development
            release_sha="$(git rev-parse origin/development)"
            test "$release_sha" = "${{ github.sha }}"
            git checkout --detach "$release_sha"
            ./deploy/deploy.sh "$release_sha"

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy pinned main commit to production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          username: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          key: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.PRODUCTION_DEPLOY_DIR }}"
            git fetch --prune origin main
            release_sha="$(git rev-parse origin/main)"
            test "$release_sha" = "${{ github.sha }}"
            git checkout --detach "$release_sha"
            ./deploy/deploy.sh "$release_sha"
